/* Prévia de conteúdo do catálogo (A26/A27). Depois de adicionar, a folha continua aberta e confirma a ação. */
function SubjectPreviewModal({ item, onClose }){
  const { isUserSubject, addUserSubject, openDetalhe, contents, openJornada, isVisitor } = useApp();
  const [summary, setSummary] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const [justAdded, setJustAdded] = useState(false);

  const alreadyAdded = isUserSubject(item.id);
  const userContent = contents.find(c => c.id === item.id);

  useEffect(()=>{
    let cancelled = false;
    setLoading(true); setError(false); setSummary(null);
    /* visitante: sem chamada à IA; a prévia usa a descrição e os módulos do catálogo */
    if(isVisitor){ setSummary({summary: item.desc || '', whatYouLearn: []}); setLoading(false); return; }
    fetchSubjectSummary(item.title).then(res=>{
      if(cancelled) return;
      if(res) setSummary(res); else setError(true);
      setLoading(false);
    });
    return ()=>{ cancelled = true; };
  }, [item.id, reloadKey]);

  const handleAdd = ()=>{ if(alreadyAdded) return; if(addUserSubject(item)) setJustAdded(true); };
  const handleOpen = ()=>{ onClose(); openDetalhe(item.id); };

  const topics = (summary && summary.whatYouLearn && summary.whatYouLearn.length > 0)
    ? summary.whatYouLearn : (item.topics || []).map(t => t.t);
  const nMod = (item.topics || []).length;
  /* Briefing: sem estimativas artificiais (tempo e nº de cartões não são medidos). Só o que é real: os módulos da trilha. */
  const metaLine = nMod ? `${nMod} ${plural(nMod,'módulo','módulos')}` : '';

  return (
    <ModalShell onClose={onClose} labelledBy="preview-title">
      <div className="flex items-center gap-3"><SubjectTile subjectId={item.subjectId}/><span className="text-[14px] text-sf-muted">{subjName(item.subjectId)}</span></div>
      <h2 id="preview-title" className="sf-ed-title text-sf-text mt-4">{item.title}</h2>
      {metaLine && <p className="text-[14px] leading-[20px] text-sf-muted mt-1">{metaLine}</p>}

      {loading && <div className="mt-4 flex flex-col gap-2" role="status" aria-label="Carregando resumo">{[100,92,80].map((w,i)=><span key={i} className="sf-skel h-4" style={{width:w+'%'}}/>)}</div>}
      {error && !loading && (
        <div className="mt-4">
          <p className="text-[14px] leading-[20px] text-sf-muted">O resumo não carregou agora. Você ainda pode adicionar o conteúdo.</p>
          <button type="button" onClick={()=>setReloadKey(k=>k+1)} className="sf-btn sf-btn-ghost h-11 px-3 -ml-3 text-[14px] font-semibold">Tentar de novo</button>
        </div>
      )}
      {!loading && !error && summary && (
        <>
          <p className="sf-ed-lead text-sf-text mt-4">{summary.summary || item.desc || ''}</p>
          <h3 className="text-[16px] leading-[22px] font-semibold text-sf-text mt-5">O que você vai aprender</h3>
          <ul className="mt-2 flex flex-col gap-2 list-none p-0 m-0">
            {topics.slice(0, 8).map((t, i)=>(
              <li key={i} className="flex items-start gap-2.5 text-[14px] leading-[20px] text-sf-text">
                <span className="text-sf-muted inline-flex mt-0.5" aria-hidden="true"><IconCheck size={14}/></span><span>{t}</span>
              </li>
            ))}
          </ul>
        </>
      )}

      <div className="mt-6">
        {alreadyAdded ? (
          <>
            <p role="status" className="text-[14px] font-semibold text-sf-text flex items-center gap-2"><span className="text-sf-success inline-flex"><IconCheck size={16}/></span>{justAdded ? `Adicionado em ${subjName(item.subjectId)}` : `Já está em ${subjName(item.subjectId)}`}</p>
            <button type="button" onClick={handleOpen} disabled={!userContent} className="sf-btn sf-btn-primary w-full mt-3 h-12 text-[14px]">Abrir conteúdo</button>
            <button type="button" onClick={onClose} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Continuar explorando</button>
          </>
        ) : (
          <>
            <button type="button" onClick={handleAdd} className="sf-btn sf-btn-primary w-full h-12 text-[14px] inline-flex items-center justify-center gap-2">{isVisitor && <IconLock size={14}/>}Adicionar em {subjName(item.subjectId)}</button>
            {isVisitor && <p className="text-[14px] leading-[20px] text-sf-muted mt-2 mb-0 text-center">Adicionar conteúdos pede um perfil local ou uma conta Google.</p>}
            <button type="button" onClick={onClose} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Fechar</button>
          </>
        )}
      </div>
    </ModalShell>
  );
}

function fmtMin(total){ const h = Math.floor(total/60), m = total%60; return h>0 ? (m ? `${h} h ${m} min` : `${h} h`) : `${m} min`; }
function plural(n, one, many){ return n === 1 ? one : many; }

/* ============================================================
   MASCOTE (briefing §5) — EM PAUSA (nov/2026): fora da interface; código e dados (sf_mascot) mantidos para retomar depois.
   Companheiro de constância. Função separada do conteúdo:
   mascote = motivação, ofensiva, conquistas e evolução pessoal; matérias/módulos = aprendizagem.
   Aparece só junto ao indicador de ofensiva (Início) e na própria jornada. Nada de moedas, loja ou níveis artificiais.
   Tudo vem de dados reais: dias com sessão registrada (a mesma regra da ofensiva).
   ============================================================ */
const MASCOT_KINDS = {
  lume:{name:'Lume', desc:'Vaga-lume que acende a cada dia de estudo.'},
  nimbo:{name:'Nimbo', desc:'Nuvem curiosa que adora uma pergunta.'},
  pingo:{name:'Pingo', desc:'Gota de tinta que anota tudo.'},
};
const MASCOT_COLORS = [
  {k:'azul', l:'Azul', c:'#60A5FA', d:'#2563EB'},
  {k:'violeta', l:'Violeta', c:'#A581F8', d:'#7C3AED'},
  {k:'agua', l:'Verde-água', c:'#2DD4BF', d:'#0D9488'},
  {k:'ambar', l:'Âmbar', c:'#FBBF24', d:'#D97706'},
];
const MASCOT_ACCS = [{k:'nenhum', l:'Nenhum'}, {k:'oculos', l:'Óculos'}, {k:'cachecol', l:'Cachecol'}];
/* Marcos da ofensiva (dias seguidos) e a evolução visual que cada um libera. */
const STREAK_MILESTONES = [
  {d:1, t:'Primeira chama', ev:'Seu companheiro acorda'},
  {d:3, t:'Três dias', ev:'Ganha brilho ao redor'},
  {d:7, t:'Uma semana', ev:'Aura mais forte'},
  {d:14, t:'Duas semanas', ev:'Estrela no ombro'},
  {d:30, t:'Um mês', ev:'Brilho completo'},
  {d:60, t:'Dois meses', ev:'Marco registrado'},
  {d:100, t:'Cem dias', ev:'Marco registrado'},
];
function mascotStage(best){ return best >= 30 ? 5 : best >= 14 ? 4 : best >= 7 ? 3 : best >= 3 ? 2 : best >= 1 ? 1 : 0; }
function longestStreak(dates){
  if(!dates || !dates.length) return 0;
  const set = new Set(dates); let best = 0;
  set.forEach(ds => { if(set.has(addDaysStr(ds, -1))) return; let n = 0, c = ds; while(set.has(c)){ n++; c = addDaysStr(c, 1); } best = Math.max(best, n); });
  return best;
}
/* Humor = reação ao comportamento real. Sem culpa: quem volta é recebido, não cobrado. */
function mascotMood({streak, studiedToday, everStudied, celebrate}){
  if(celebrate) return 'celebrate';
  if(studiedToday) return 'happy';
  if(streak > 0) return 'waiting';
  if(everStudied) return 'returning';
  return 'new';
}
function mascotLine(mood, name, streak, next, milestone){
  switch(mood){
    case 'celebrate': return `Marco novo: ${milestone ? milestone.t : `${streak} dias`}, ${streak} ${plural(streak,'dia seguido','dias seguidos')}. Que constância bonita!`;
    case 'happy': return next ? `Estudo de hoje feito. ${next.d - streak === 1 ? 'Falta 1 dia' : `Faltam ${next.d - streak} dias`} para "${next.t}".` : 'Estudo de hoje feito. Você já passou por todos os marcos.';
    case 'waiting': return `Sua sequência de ${streak} ${plural(streak,'dia','dias')} continua. Uma sessão curta hoje já conta.`;
    case 'returning': return 'Que bom te ver de novo. Uma sessão curta já recomeça a sequência.';
    default: return `Oi! Eu sou ${name}. Sua primeira sessão de foco acende a nossa trilha.`;
  }
}
function useMascot(){
  const {studyDates, streak, liveSessions} = useApp();
  const [m, setM] = useState(()=> loadLS('sf_mascot', null));
  const save = (next)=>{ setM(next); saveLS('sf_mascot', next); };
  const today = todayStr();
  const best = useMemo(()=> longestStreak(studyDates), [studyDates]);
  const studiedToday = (studyDates || []).includes(today);
  const reached = STREAK_MILESTONES.filter(x => streak >= x.d);
  const top = reached.length ? reached[reached.length - 1] : null;
  const celebrated = (m && m.celebrated) || [];
  const celebrate = !!(m && top && studiedToday && !celebrated.includes(top.d));
  const next = STREAK_MILESTONES.find(x => x.d > streak) || null;
  const mood = mascotMood({streak, studiedToday, everStudied: (studyDates || []).length > 0, celebrate});
  const markCelebrated = ()=>{ if(m && top && !celebrated.includes(top.d)) save({...m, celebrated:[...celebrated, top.d]}); };
  return {m, save, best, streak, studiedToday, next, mood, celebrateMilestone: celebrate ? top : null, markCelebrated, sessionsCount: (liveSessions || []).length,
    totalMin: (liveSessions || []).reduce((a,x)=> a + (x.durationMin || 0), 0)};
}

/* Personagens originais desenhados para o Study (formas simples, paleta do app). Não são mascotes genéricos de IA. */
function MascotSvg({kind='lume', color='azul', acc='nenhum', mood='new', stage=0, size=120, title}){
  const col = MASCOT_COLORS.find(c=>c.k===color) || MASCOT_COLORS[0];
  const ink = '#0B1220';
  const E = {lume:{y:50, l:51, r:69}, nimbo:{y:66, l:51, r:71}, pingo:{y:74, l:51, r:69}}[kind] || {y:56, l:51, r:69};
  const closed = mood === 'happy' || mood === 'celebrate';
  const eyes = closed
    ? <g stroke={ink} strokeWidth="2.6" fill="none" strokeLinecap="round"><path d={`M${E.l-5} ${E.y+1} q5 -6 10 0`}/><path d={`M${E.r-5} ${E.y+1} q5 -6 10 0`}/></g>
    : <g><ellipse cx={E.l} cy={E.y} rx="4.2" ry="5.2" fill={ink}/><ellipse cx={E.r} cy={E.y} rx="4.2" ry="5.2" fill={ink}/><circle cx={E.l+1.5} cy={E.y-2} r="1.4" fill="#fff"/><circle cx={E.r+1.5} cy={E.y-2} r="1.4" fill="#fff"/></g>;
  const mouthY = E.y + 11, mx = (E.l + E.r)/2;
  const mouth = mood === 'celebrate' ? <path d={`M${mx-6} ${mouthY-1} q6 9 12 0 z`} fill={ink}/>
    : (mood === 'returning' || mood === 'waiting') ? <path d={`M${mx-4} ${mouthY} q4 3 8 0`} stroke={ink} strokeWidth="2.4" fill="none" strokeLinecap="round"/>
    : <path d={`M${mx-5} ${mouthY-1} q5 5 10 0`} stroke={ink} strokeWidth="2.4" fill="none" strokeLinecap="round"/>;
  const cheeks = <g fill="#F472B6" opacity=".45"><ellipse cx={E.l-7} cy={E.y+7} rx="4" ry="2.4"/><ellipse cx={E.r+7} cy={E.y+7} rx="4" ry="2.4"/></g>;
  let body;
  if(kind === 'nimbo'){
    body = <g><path d="M28 86 a20 20 0 0 1 6-37 a28 28 0 0 1 52 0 a20 20 0 0 1 6 37 z" fill={col.c}/><path d="M34 52 a26 26 0 0 1 22-18" stroke="#fff" strokeOpacity=".45" strokeWidth="4" fill="none" strokeLinecap="round"/><ellipse cx="60" cy="90" rx="30" ry="4" fill={col.d} opacity=".35"/></g>;
  } else if(kind === 'pingo'){
    body = <g><path d="M60 16 C60 16 94 54 94 78 A34 34 0 0 1 26 78 C26 54 60 16 60 16 Z" fill={col.c}/><path d="M44 62 C46 52 52 42 56 36" stroke="#fff" strokeOpacity=".5" strokeWidth="4" fill="none" strokeLinecap="round"/></g>;
  } else {
    body = <g>
      <g fill="#fff" opacity=".55"><ellipse cx="36" cy="36" rx="16" ry="9" transform="rotate(-30 36 36)"/><ellipse cx="84" cy="36" rx="16" ry="9" transform="rotate(30 84 36)"/></g>
      <path d="M50 30 q-6 -14 -14 -16" stroke={col.d} strokeWidth="2.4" fill="none" strokeLinecap="round"/><path d="M70 30 q6 -14 14 -16" stroke={col.d} strokeWidth="2.4" fill="none" strokeLinecap="round"/>
      <circle cx="36" cy="14" r="3" fill={col.d}/><circle cx="84" cy="14" r="3" fill={col.d}/>
      <circle cx="60" cy="90" r="20" fill="#FDE68A" opacity={stage >= 1 ? 1 : .5}/>
      {stage >= 1 && <circle cx="60" cy="90" r="27" fill="#FDE68A" opacity={.12 + stage*.05}/>}
      <circle cx="60" cy="54" r="27" fill={col.c}/>
      <path d="M42 44 a22 22 0 0 1 14 -14" stroke="#fff" strokeOpacity=".45" strokeWidth="4" fill="none" strokeLinecap="round"/>
    </g>;
  }
  const glasses = acc === 'oculos' && <g stroke={ink} strokeWidth="2.2" fill="#fff" fillOpacity=".18"><circle cx={E.l} cy={E.y} r="8"/><circle cx={E.r} cy={E.y} r="8"/><path d={`M${E.l+8} ${E.y} h${E.r-E.l-16}`} fill="none"/></g>;
  const scarfY = kind === 'lume' ? 76 : (kind === 'nimbo' ? 84 : 98);
  const scarf = acc === 'cachecol' && <g><rect x={kind==='pingo'?36:34} y={scarfY} width={kind==='pingo'?48:52} height="9" rx="4.5" fill="#F36E6E"/><path d={`M${kind==='pingo'?74:76} ${scarfY+6} l4 16 l7 -2 l-3 -14 z`} fill="#F36E6E"/><path d={`M${kind==='pingo'?44:44} ${scarfY+2} v5 M54 ${scarfY+2} v5 M64 ${scarfY+2} v5`} stroke="#fff" strokeOpacity=".5" strokeWidth="2"/></g>;
  const spark = (x,y,s=1)=> <path key={`${x}${y}`} className="sf-mascot-spark" d={`M${x} ${y-6*s} L${x+1.6*s} ${y-1.6*s} L${x+6*s} ${y} L${x+1.6*s} ${y+1.6*s} L${x} ${y+6*s} L${x-1.6*s} ${y+1.6*s} L${x-6*s} ${y} L${x-1.6*s} ${y-1.6*s} Z`} fill="#FDE68A"/>;
  return (
    <svg width={size} height={size} viewBox="0 0 120 120" role={title ? 'img' : undefined} aria-label={title} aria-hidden={title ? undefined : 'true'} style={{overflow:'visible'}}>
      {stage >= 3 && <circle cx="60" cy="62" r="56" fill={col.c} opacity={stage >= 5 ? .16 : .1}/>}
      <g className="sf-mascot-body">{body}{cheeks}{eyes}{mouth}{glasses}{scarf}</g>
      {stage >= 2 && [spark(14,30), spark(104,46,.8)]}
      {stage >= 4 && <path d="M96 84 l3 6 6 1 -4.5 4 1 6 -5.5 -3 -5.5 3 1 -6 -4.5 -4 6 -1z" fill="#FBBF24" stroke={ink} strokeWidth="1"/>}
      {(stage >= 5 || mood === 'celebrate') && [spark(22,96,.7), spark(100,18,.9)]}
    </svg>
  );
}
function Mascot({m, mood, stage, size, title}){
  return <span className="sf-mascot inline-flex" data-mood={mood}><MascotSvg kind={m.kind} color={m.color} acc={m.acc} mood={mood} stage={stage} size={size} title={title}/></span>;

/* ---------- Semana de foco (segunda a domingo), usada na home e em Progresso ---------- */
const WEEK_LABELS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const WEEK_INITIALS = ['S','T','Q','Q','S','S','D'];
const WEEK_LONG = ['segunda','terça','quarta','quinta','sexta','sábado','domingo'];
function sessionDay(x){ const ts = x.startedAt || x.dateTs; return ts ? toDateStr(new Date(ts)) : null; }
function weekStats(liveSessions){
  const today = todayStr();
  const offset = (parseDateStr(today).getDay() + 6) % 7;
  const start = addDaysStr(today, -offset);
  const prevStart = addDaysStr(start, -7);
  const byDay = {};
  (liveSessions || []).forEach(x => { const ds = sessionDay(x); if(ds) byDay[ds] = (byDay[ds] || 0) + (x.durationMin || 0); });
  const days = Array.from({length:7}, (_, i) => { const ds = addDaysStr(start, i); return {ds, min: byDay[ds] || 0, label: WEEK_LABELS[i], initial: WEEK_INITIALS[i], isToday: ds === today, isFuture: i > offset}; });
  let prevWeekMin = 0;
  for(let i = 0; i < 7; i++) prevWeekMin += byDay[addDaysStr(prevStart, i)] || 0;
  return {days, todayIdx: offset, weekMin: days.reduce((a, d)=> a + d.min, 0), prevWeekMin, maxMin: Math.max(1, ...days.map(d => d.min))};
}
function weekCompareLine(w){
  if(!w.prevWeekMin) return w.weekMin ? 'Primeira semana com foco registrado' : '';
  const diff = w.weekMin - w.prevWeekMin;
  if(diff === 0) return 'Igual à semana passada';
  return `${fmtMin(Math.abs(diff))} ${diff > 0 ? 'a mais' : 'a menos'} que na semana passada`;
}

/* Faixa da semana na home: 7 barras pequenas, hoje em destaque. Toda a faixa leva a Progresso. */
function WeekStrip({liveSessions, onOpen}){
  const w = useMemo(()=> weekStats(liveSessions), [liveSessions]);
  const compare = weekCompareLine(w);
  const summary = w.days.map(d => `${d.label}: ${d.min} min`).join(', ');
  return (
    <button type="button" onClick={onOpen} className="sf-weekstrip w-full text-left bg-transparent border-0 p-0 cursor-pointer rounded-xl"
      aria-label={`Esta semana: ${fmtMin(w.weekMin)} de foco. ${compare ? compare + '. ' : ''}${summary}. Abrir Progresso`}>
      <span className="flex items-end justify-between gap-3" aria-hidden="true">
        <span className="min-w-0">
          <span className="sf-ed-stat text-sf-text block">{fmtMin(w.weekMin)}</span>
          <span className="text-[14px] leading-[20px] text-sf-muted block">{w.weekMin ? (compare || 'de foco nesta semana') : 'Sua primeira sessão de foco da semana aparece aqui'}</span>
        </span>
        <span className="text-sf-muted inline-flex shrink-0 mb-1"><IconChevronR/></span>
      </span>
      <span className="mt-4 grid grid-cols-7 gap-2" aria-hidden="true">
        {w.days.map(d => (
          <span key={d.ds} className="flex flex-col items-center gap-1.5">
            <span className="w-full flex items-end justify-center" style={{height: w.weekMin ? 40 : 8}}>
              <span className="w-full max-w-[28px] rounded-[4px]" style={{
                height: d.min > 0 ? `${Math.max(14, d.min / w.maxMin * 100)}%` : 3,
                background: d.min > 0 ? (d.isToday ? 'var(--chart-bar-hl)' : 'var(--chart-bar)') : 'var(--chart-empty)',
                opacity: d.isFuture ? .5 : 1}}/>
            </span>
            <span className={`text-[13px] leading-[16px] ${d.isToday ? 'font-bold text-sf-text' : 'font-medium text-sf-muted'}`}>{d.initial}</span>
          </span>
        ))}
      </span>
    </button>
  );
}

/* Conteúdo para retomar: o último aberto (se ainda tem módulo pendente); senão, o de maior progresso. */
function pickResumeContent(contents, lastContentId){
  const last = lastContentId ? contents.find(c => c.id === lastContentId) : null;
  if(last && getNextPendingTopic(last)) return last;
  return pickPriorityContent(contents);
}

  if(pc){
    const prog = getContentProgress(pc);
    const nextIdx = prog.nextIndex;
    const nextTopic = nextIdx >= 0 ? pc.topics[nextIdx] : null;
    const nextType = nextTopic ? getTopicType(pc, nextIdx) : null;
    const NextIcon = nextTopic ? MODULE_META[nextType].Icon : null;
    const started = prog.completed > 0;
    const videoPending = !!(nextTopic && lastWatchedVideo && lastWatchedVideo.contentId === pc.id && lastWatchedVideo.topicIndex === nextIdx);
    const cta = nextTopic ? (videoPending ? 'Retomar videoaula' : (started ? 'Continuar' : 'Começar')) : (prog.total ? 'Revisar' : 'Abrir conteúdo');
    const go = ()=> (nextTopic ? openModule(pc.id, nextIdx) : openDetalhe(pc.id));
    resumeBlock = (
      <section aria-labelledby="h-retomar" className="rounded-[20px] p-4" style={{background:'var(--bg-surface)'}}>
        <h2 id="h-retomar" className="sr-only-live">{started ? 'Continue de onde parou' : 'Comece por aqui'}</h2>
        <div className="flex items-center gap-3">
          <SubjectTile subjectId={pc.subjectId}/>
          <span className="flex-1 min-w-0">
            <span className="sf-ed-content text-sf-text block" style={{display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden'}}>{pc.title}</span>
            <span className="text-[14px] leading-[20px] text-sf-muted block">{modulesLabel(pc)}</span>
          </span>
          <button type="button" onClick={()=>openDetalhe(pc.id)} className="sf-btn sf-btn-ghost h-11 px-3 -mr-2 text-[14px] font-semibold shrink-0" aria-label={`Ver trilha de ${pc.title}`}>Ver trilha</button>
        </div>
        {prog.total > 0 && <SegmentedTrail className="mt-4" states={trailStates(pc)} label={`Trilha de ${pc.title}`}/>}
        {nextTopic ? (
          <div className="mt-4">
            <p className="text-[14px] leading-[20px] text-sf-muted m-0 flex items-center gap-1.5">
              <span className="inline-flex" aria-hidden="true"><NextIcon size={15}/></span>
              {started ? 'A seguir' : 'Primeiro módulo'} · {MODULE_META[nextType].label}
            </p>
            <p className="sf-ed-content text-sf-text mt-1 mb-0">{nextTopic.t}</p>
          </div>
        ) : (
          <p className="text-[14px] leading-[20px] text-sf-muted mt-4 mb-0">
            {prog.total ? 'Conteúdo concluído. Uma revisão com os flashcards ajuda a fixar.' : (pc.journeyStatus === 'loading' ? 'Montando a trilha. Pode levar até 30 segundos.' : 'Trilha ainda não disponível. Abra o conteúdo para tentar de novo.')}
          </p>
        )}
        <button type="button" onClick={go} className="sf-btn sf-btn-primary w-full mt-4 h-12 text-[15px]"
          aria-label={nextTopic ? `${cta}: ${nextTopic.t}` : `${cta}: ${pc.title}`}>{cta}</button>
      </section>
    );
  } else {
    resumeBlock = (
      <section aria-labelledby="h-comece" className="rounded-[20px] p-4" style={{background:'var(--bg-surface)'}}>
        <h2 id="h-comece" className="text-[17px] leading-[23px] font-semibold text-sf-text m-0">Comece pelo primeiro conteúdo</h2>
        <p className="text-[15px] leading-[21px] text-sf-muted mt-1.5 mb-0">Escolha um tema e o Study monta uma trilha com videoaulas, leitura, flashcards e uma avaliação no fim.</p>
        <button type="button" onClick={()=>goTab('estudar')} className="sf-btn sf-btn-primary w-full mt-4 h-12 text-[15px]">Explorar conteúdos</button>
      </section>
    );
  }

  /* ---------- Esta semana ---------- */
  const hasEverStudied = liveSessions.length > 0;
  const weekBlock = contents.length > 0 && (
    <section aria-labelledby="h-semana">
      <SectionTitle id="h-semana">Esta semana</SectionTitle>
      <div className="mt-3"><WeekStrip liveSessions={liveSessions} onOpen={()=>goTab('progresso')}/></div>
      {!todayPlan.length && (
        <button type="button" onClick={()=>goTab('plano')} className="sf-btn sf-btn-ghost h-11 px-3 -ml-3 mt-1 text-[14px] font-semibold inline-flex items-center gap-1.5">
          <IconCalendar size={16}/> {hasEverStudied ? 'Planejar a semana' : 'Planejar quando estudar'}
        </button>
      )}
    </section>
  );

  /* ---------- Plano de hoje (só quando existe) ---------- */
  const planBlock = todayPlan.length > 0 && (
    <section aria-labelledby="h-plano">
      <div className="flex items-center gap-2">
        <SectionTitle id="h-plano" className="flex-1">Plano de hoje</SectionTitle>
        <button type="button" onClick={()=>goTab('plano')} className="sf-btn sf-btn-ghost h-11 px-3 -mr-3 text-[14px] font-semibold">Ver plano</button>
      </div>
      {todayPending.length ? (
        <div className="mt-1">
          {todayPending.slice(0,3).map(it => (
            <PlanItemRow key={it.id} it={it} isActive={!!session && session.plannerId===it.id} otherActive={!!session && session.plannerId!==it.id}
              onOpen={()=>goTab('plano')} onToggle={()=>togglePlannerDone(it.id)} onStart={()=>startPlannerSession(it.id)} onOpenTimer={()=>setTimerExpanded(true)}/>
          ))}
          {todayPending.length > 3 && <p className="text-[14px] text-sf-muted mt-2 mb-0">Mais {todayPending.length - 3} no Plano</p>}
        </div>
      ) : (
        <p className="text-[14px] leading-[20px] text-sf-muted mt-2 mb-0 flex items-center gap-2"><span className="text-sf-success inline-flex" aria-hidden="true"><IconCheck size={16}/></span>Plano de hoje concluído</p>
      )}
    </section>
  );

  /* ---------- Seus conteúdos ---------- */
  const othersBlock = others.length > 0 && (
    <section aria-labelledby="h-conteudos">
      <div className="flex items-center gap-2">
        <SectionTitle id="h-conteudos" className="flex-1">Seus conteúdos</SectionTitle>
        {others.length > 3 && <button type="button" onClick={()=>goTab('estudar')} className="sf-btn sf-btn-ghost h-11 px-3 -mr-3 text-[14px] font-semibold">Ver todos</button>}
      </div>
      <div className="mt-1">{others.slice(0,3).map(c => <ContentRow key={c.id} c={c} trail onClick={()=>openDetalhe(c.id)}/>)}</div>
    </section>
  );

  if(desk){
    return (
      <div className="sf-wide pb-8">
        {header}
        <div className="sf-cols mt-8">
          <div className="sf-col-main flex flex-col gap-10">{resumeBlock}{othersBlock}</div>
          <aside className="sf-col-panel flex flex-col gap-10" aria-label="Sua semana">{weekBlock}{planBlock}</aside>
        </div>
      </div>
    );
  }
  return (
    <div className="pt-16 pb-8 px-5 flex flex-col gap-10">
      <div>
        {header}
        <div className="mt-6">{resumeBlock}</div>
      </div>
      {weekBlock}
      {planBlock}
      {othersBlock}
    </div>
  );
}

/* Explorar (Fase 4): matérias como gavetas recolhíveis; os conteúdos ficam dentro da matéria (Matéria → Conteúdos).
   - Resumo da matéria: nº de conteúdos e de conteúdos concluídos; a barra mostra os MÓDULOS concluídos da matéria.
   - Tocar num conteúdo abre direto a lista de módulos (sem prévia intermediária).
   - Sugestões do catálogo ficam dentro da matéria a que pertencem, depois dos seus conteúdos.
   - Busca: mostra só as matérias com resultado, já abertas. As gavetas lembram o estado durante a sessão. */
const ORPHAN_SUBJECT = '__sem-materia';
function subjectSummary(items){
  const n = items.length;
  let doneN = 0, modDone = 0, modTotal = 0;
  items.forEach(c => { const p = getContentProgress(c); modDone += p.completed; modTotal += p.total; if(p.total > 0 && p.completed === p.total) doneN++; });
  return {n, doneN, modDone, modTotal, pct: modTotal ? Math.round(modDone / modTotal * 100) : 0};
}
function contentStateLabel(c){
  const p = getContentProgress(c);
  if(p.total > 0 && p.completed === p.total) return isDemoContent(c) ? 'Exemplo · Concluído' : 'Concluído';
  return modulesLabel(c);
}
function SubjectDrawer({sid, items, suggestions, searching, onOpenContent, onAdd, onPreview}){
  const [stored, setStored] = useDrawerState(`materia:${sid}`);
  const open = searching ? true : stored;
  const sum = subjectSummary(items);
  const listId = `gaveta-${sid}`;
  const orphan = sid === ORPHAN_SUBJECT;
  const name = orphan ? 'Sem matéria' : subjName(sid);
  const line = sum.n === 0
    ? 'Nenhum conteúdo ainda.'
    : `${sum.n} ${plural(sum.n, 'conteúdo', 'conteúdos')} · ${sum.doneN} ${plural(sum.doneN, 'concluído', 'concluídos')}`;
  return (
    <li className="sf-row-div">
      <h3 className="m-0">
        <button type="button" onClick={()=> !searching && setStored(o => !o)} aria-expanded={open} aria-controls={listId}
          className="w-full flex items-center gap-3 py-3 min-h-[64px] bg-transparent border-0 text-left cursor-pointer"
          aria-label={`${name}: ${line}${sum.modTotal ? ` Módulos concluídos: ${sum.pct}%.` : ''}`}>
          {orphan ? <span className="sf-subj" aria-hidden="true" style={{width:44, height:44, borderRadius:12}}><IconBook size={20}/></span> : <SubjectTile subjectId={sid}/>}
          <span className="flex-1 min-w-0" aria-hidden="true">
            <span className="block text-[17px] leading-[22px] font-semibold text-sf-text truncate">{name}</span>
            <span className="block text-[14px] leading-[18px] text-sf-muted mt-0.5 tnum">{line}</span>
            {sum.modTotal > 0 && (
              <span className="block mt-2 max-w-[220px]">
                <span className="block rounded-full bg-sf-overlay" style={{height:3}}>
                  <span className="block rounded-full" style={{height:3, width:`${sum.pct}%`, background: sum.pct >= 100 ? 'var(--success)' : 'var(--blue-400)'}}/>
                </span>
              </span>
            )}
          </span>
          <span className="text-sf-muted shrink-0 inline-flex" aria-hidden="true" style={{transform:`rotate(${open ? 90 : 0}deg)`, transition:'transform var(--dur-base) var(--ease-out)'}}><IconChevronR/></span>
        </button>
      </h3>
      <div className="sf-drawer" data-open={open ? 'true' : 'false'}>
        <div className="sf-drawer-inner">
          <div id={listId} hidden={!open} className="pl-[56px] pb-3">
            {items.length > 0 && (
              <ul className="list-none p-0 m-0" aria-label={`Conteúdos de ${name}`}>
                {items.map(c => {
                  const p = getContentProgress(c);
                  const complete = p.total > 0 && p.completed === p.total;
                  return (
                    <li key={c.id}>
                      <button type="button" onClick={()=>onOpenContent(c.id)}
                        className="w-full text-left py-2.5 flex items-center gap-3 bg-transparent border-0 cursor-pointer min-h-[52px]"
                        aria-label={`${c.title}. ${contentStateLabel(c)}. Abrir módulos`}>
                        <span className="flex-1 min-w-0" aria-hidden="true">
                          <span className="sf-ed-content text-sf-text block truncate">{c.title}</span>
                          <span className="text-[14px] leading-[18px] block truncate mt-0.5" style={{color: complete ? 'var(--success)' : 'var(--text-secondary)'}}>
                            {complete && <span className="inline-flex align-[-2px] mr-1"><IconCheck size={14}/></span>}{contentStateLabel(c)}
                          </span>
                        </span>
                        <span className="text-sf-muted shrink-0" aria-hidden="true"><IconChevronR/></span>
                      </button>
                    </li>
                  );
                })}
              </ul>
            )}
            {!orphan && (
              <button type="button" onClick={()=>onAdd(sid)} aria-label={`Adicionar conteúdo em ${name}`}
                className="sf-btn sf-btn-ghost h-11 px-3 -ml-3 text-[14px] font-semibold inline-flex items-center gap-1.5">
                <IconPlus size={16}/> Adicionar conteúdo
              </button>
            )}
            {suggestions.length > 0 && (
              <div className="mt-2">
                <p className="text-[13px] leading-[18px] font-semibold text-sf-muted">Sugestões do Study</p>
                <ul className="list-none p-0 m-0 mt-1">
                  {suggestions.map(d => (
                    <li key={d.id}>
                      <button type="button" onClick={()=>onPreview(d)} aria-label={`Ver prévia de ${d.title}`}
                        className="w-full text-left py-2 flex items-center gap-3 bg-transparent border-0 cursor-pointer min-h-[44px]">
                        <span className="flex-1 min-w-0 text-[15px] leading-[20px] text-sf-muted truncate">{d.title}</span>
                        <span className="text-[13px] font-semibold text-sf-muted shrink-0">Ver prévia</span>
                      </button>
                    </li>
                  ))}
                </ul>
              </div>
            )}
          </div>
        </div>
      </div>
    </li>
  );
}

function ExplorarScreen(){
  const {contents, openCriarConteudo, openJornada, isUserSubject, discoverableSubjects, openDetalhe, openSubjectSheet, subjectsStore, isVisitor} = useApp();
  const [query,setQuery] = useState('');
  const lock = isVisitor ? <span className="inline-flex text-sf-muted" aria-hidden="true"><IconLock size={13}/></span> : null;
  const [previewItem, setPreviewItem] = useState(null);

  const words = useMemo(()=> queryWords(query), [query]);
  const searching = words.length > 0;
  const groups = useMemo(()=>{
    const ids = Object.keys(SUBJECTS);
    const map = {}; ids.forEach(id => { map[id] = {items:[], suggestions:[]}; });
    const orphans = [];
    contents.forEach(c => {
      if(searching && !contentMatchesQuery(c, words)) return;
      if(map[c.subjectId]) map[c.subjectId].items.push(c); else orphans.push(c);
    });
    discoverableSubjects.forEach(d => {
      if(isUserSubject(d.id) || !map[d.subjectId]) return;
      if(searching && !contentMatchesQuery(d, words)) return;
      map[d.subjectId].suggestions.push(d);
    });
    const list = ids.map(id => ({id, ...map[id]}));
    if(orphans.length) list.push({id: ORPHAN_SUBJECT, items: orphans, suggestions: []});
    return searching ? list.filter(g => g.items.length || g.suggestions.length) : list;
  }, [contents, words, discoverableSubjects, subjectsStore]);
  const openPreviewItem = (item)=> setPreviewItem({
    id: item.id, title: item.title, subjectId: item.subjectId, unitLabel: item.unitLabel, estMinutes: item.estMinutes, desc: item.desc,
    topics: (item.topics || []).map(t => ({ t: t.t || t, done: false })),
  });

  return (
    <div className="sf-wide pt-16 px-5 pb-8">
      <div className="flex items-start justify-between gap-3">
        <ScreenTitle>Explorar</ScreenTitle>
        <button type="button" onClick={()=>openCriarConteudo()} className="sf-btn sf-btn-secondary h-11 px-4 text-[14px] shrink-0 inline-flex items-center gap-1.5"
          aria-label={isVisitor ? 'Criar conteúdo (pede um perfil)' : undefined}>{lock}Criar conteúdo</button>
      </div>

      <label className="sf-fieldbox sf-subj-search mt-5 h-12 rounded-xl flex items-center px-3.5 gap-2.5 cursor-text">
        <span className="text-sf-muted inline-flex" aria-hidden="true"><IconSearch size={20}/></span>
        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Buscar conteúdos ou matérias"
          aria-label="Buscar conteúdos ou matérias" enterKeyHint="search" autoComplete="off"
          className="bg-transparent border-0 outline-none text-[16px] text-sf-text flex-1 min-w-0 h-11" style={{fontFamily:'inherit'}}/>
        {query && <button type="button" onClick={()=>setQuery('')} aria-label="Limpar busca" className="sf-btn sf-btn-ghost h-11 px-3 -mr-2 text-[14px]">Limpar</button>}
      </label>

      {searching && groups.length === 0 ? (
        <div className="mt-8" role="status">
          <p className="text-[16px] leading-[22px] font-semibold text-sf-text">Nada encontrado para “{query.trim()}”</p>
          <p className="text-[14px] leading-[20px] text-sf-muted mt-1">Tente outro termo ou crie um conteúdo com esse tema.</p>
          <button type="button" onClick={()=>openCriarConteudo()} className="sf-btn sf-btn-secondary w-full mt-4 h-12 text-[14px] inline-flex items-center justify-center gap-1.5">{lock}Criar conteúdo</button>
        </div>
      ) : (
        <section className="mt-6" aria-labelledby="h-materias">
          <div className="flex items-center justify-between">
            <SectionTitle id="h-materias">{searching ? 'Resultados por matéria' : 'Matérias'}</SectionTitle>
            {contents.length > 0 && <button type="button" onClick={()=>openJornada()} className="sf-btn sf-btn-ghost h-11 px-3 -mr-3 text-[14px] font-semibold">Ver trilhas</button>}
          </div>
          <ul className="sf-subj-grid list-none p-0 m-0 mt-1">
            {groups.map(g => (
              <SubjectDrawer key={g.id} sid={g.id} items={g.items} suggestions={g.suggestions} searching={searching}
                onOpenContent={openDetalhe} onAdd={(sid)=>openCriarConteudo(sid)} onPreview={openPreviewItem}/>
            ))}
          </ul>
          {!searching && (
            <button type="button" onClick={()=>openSubjectSheet({})} className="sf-btn sf-btn-ghost h-11 px-3 -ml-3 mt-2 text-[14px] font-semibold inline-flex items-center gap-1.5">
              <IconPlus size={16}/> Nova matéria {lock}
            </button>
          )}
        </section>
      )}

      {previewItem && <SubjectPreviewModal item={previewItem} onClose={()=>setPreviewItem(null)}/>}
    </div>
  );
}

function DetalheScreen({contentId}){
  const {contents, closeView, openPreSessao, openModule, regenerateJourney} = useApp();
  const c = contents.find(x=>x.id===contentId);
  if(!c) return <MissingContent onBack={closeView}/>;

  const journey = c.journey;
  const topics = c.topics || [];
  const prog = getContentProgress(c);
  const nextTopicIdx = prog.nextIndex;
  const lead = (journey && journey.summary) || c.desc || '';

  const header = (
    <>
      <BackButton onClick={closeView}/>
      <div className="mt-4 flex items-center gap-3">
        <SubjectTile subjectId={c.subjectId}/>
        <span className="text-[14px] text-sf-muted">{subjName(c.subjectId)}</span>
        {isDemoContent(c) && <DemoTag/>}
      </div>
      <SubTitle className="mt-4">{c.title}</SubTitle>
      {isDemoContent(c) && <p className="text-[14px] leading-[20px] text-sf-muted mt-2 mb-0">Trilha de exemplo, escrita pela equipe do Study. O que você fizer aqui conta de verdade.</p>}
    </>
  );

  if(c.journeyStatus === 'loading'){
    return (
      <div className="pt-12 px-5 pb-8">
        {header}
        <div className="mt-8" role="status" aria-live="polite">
          <SectionTitle>Montando a trilha</SectionTitle>
          <p className="text-[14px] leading-[20px] text-sf-muted mt-1.5">Na primeira vez pode levar até 30 segundos. Você pode sair desta tela; a trilha continua sendo montada.</p>
          <div className="mt-5 flex flex-col gap-3" aria-hidden="true">
            {[0,1,2,3].map(i => <span key={i} className="sf-skel h-12 w-full"/>)}
          </div>
        </div>
      </div>
    );
  }

  if(c.journeyStatus === 'error' || topics.length === 0){
    return (
      <div className="pt-12 px-5 pb-8">
        {header}
        <InlineError title="Não foi possível montar a trilha"
          hint="Confira sua conexão e tente de novo. A primeira vez pode demorar até 30 segundos."
          onRetry={()=>regenerateJourney(c.id)}/>
      </div>
    );
  }

  const doneCount = topics.filter(t=>t.done).length;
  const nextMeta = nextTopicIdx >= 0 ? MODULE_META[getTopicType(c, nextTopicIdx)] : null;
  return (
    <div className="pt-12 px-5 pb-8">
      {header}
      {lead && <p className="sf-ed-lead text-sf-muted mt-2">{lead}</p>}
      <div className="mt-5 flex items-center justify-between">
        <span className="text-[14px] text-sf-muted">{prog.completed} de {prog.total} módulos</span>
        <span className="text-[14px] font-semibold text-sf-text tnum">{prog.pct}%</span>
      </div>
      <SegmentedTrail className="mt-2" states={trailStates(c)} label={`Trilha de ${c.title}`}/>

      {/* Briefing: um caminho só. A ação principal leva ao próximo módulo; a lista completa fica na gaveta. */}
      <div className="mt-6">
        {nextTopicIdx >= 0 ? (
          <button type="button" onClick={()=>openModule(c.id, nextTopicIdx)} className="sf-btn sf-btn-primary w-full h-12 text-[15px]"
            aria-label={`${prog.completed > 0 ? `Continuar módulo ${nextTopicIdx + 1}` : 'Começar módulo 1'}: ${topics[nextTopicIdx].t}`}>
            {prog.completed > 0 ? `Continuar módulo ${nextTopicIdx + 1}` : 'Começar módulo 1'}
          </button>
        ) : (
          <button type="button" onClick={()=>openModule(c.id, 0)} className="sf-btn sf-btn-primary w-full h-12 text-[15px]">Revisar do início</button>
        )}
      </div>

      <ModuleDrawer c={c} topics={topics} nextTopicIdx={nextTopicIdx} doneCount={doneCount} nextMeta={nextMeta} onOpen={(i)=>openModule(c.id, i)}/>
    </div>
  );
}

/* Gaveta de módulos (briefing): fechada por padrão. O cabeçalho já informa progresso e o próximo módulo;
   aberta, mostra todos os módulos com tipo, estado e número. Botão com aria-expanded/aria-controls; Enter/Espaço alternam. */
/* Estado aberto/fechado das gavetas, por sessão do navegador: ao voltar de um módulo, a lista continua como estava
   (e a rolagem restaurada cai no mesmo lugar). É só conveniência local: se o armazenamento falhar, a gaveta abre fechada. */
const drawerMemory = {
  _key: 'sf_drawers_open',
  _get(){ try{ const v = JSON.parse(sessionStorage.getItem(this._key) || '{}'); return v && typeof v === 'object' ? v : {}; }catch(e){ return {}; } },
  get(id, fallback=false){ const v = this._get()[id]; return typeof v === 'boolean' ? v : fallback; },
  set(id, open){ try{ const v = this._get(); v[id] = !!open; sessionStorage.setItem(this._key, JSON.stringify(v)); }catch(e){} },
};
function useDrawerState(id, fallback=false){
  const [open, setOpenRaw] = useState(()=> drawerMemory.get(id, fallback));
  const setOpen = (fn)=> setOpenRaw(o => { const n = typeof fn === 'function' ? fn(o) : fn; drawerMemory.set(id, n); return n; });
  return [open, setOpen];
}
function ModuleDrawer({c, topics, nextTopicIdx, doneCount, nextMeta, onOpen}){
  const [open, setOpen] = useDrawerState(`modulos:${c.id}`);
  const listId = `modulos-${c.id}`;
  const summary = nextTopicIdx >= 0
    ? `${doneCount} de ${topics.length} concluídos · a seguir: ${nextMeta ? nextMeta.label.toLowerCase() : `módulo ${nextTopicIdx + 1}`}`
    : `Todos os ${topics.length} módulos concluídos`;
  return (
    <section className="mt-6 rounded-2xl" style={{border:'1px solid var(--border)', background:'var(--bg-surface)'}}>
      <h2 className="m-0">
        <button type="button" onClick={()=>setOpen(o=>!o)} aria-expanded={open} aria-controls={listId}
          className="w-full flex items-center gap-3 px-4 py-3 min-h-[64px] bg-transparent border-0 text-left cursor-pointer rounded-2xl">

      <div className="py-4 flex items-center justify-between" style={{borderBottom:'1px solid var(--border)'}}>
        <div>
          <p className="text-[14px] leading-[20px] text-sf-muted">Meta da sessão</p>

          <button type="button" className="sf-roundbtn" onClick={()=>setFocusMin(dur+5)} disabled={dur>=120} aria-label="Aumentar 5 minutos"><IconPlus size={18}/></button>

const TIMER_DEFAULT_POS = {r:16, t:10};
const TIMER_MARGIN = 6;
const TIMER_BOTTOM_RESERVED = 75 + 6;
const DRAG_THRESHOLD = 6;

function fmtMinSec(sec){ const m = Math.floor(sec/60), s = Math.floor(sec%60); return m ? `${m} min${s ? ` ${s} s` : ''}` : `${s} s`; }
/* Contexto de módulo da sessão: o módulo aberto (se for do mesmo conteúdo) ou o próximo pendente. */
function useSessionContext(){
  const {session, contents, view} = useApp();
  const contentId = session ? session.contentId : (view && view.name === 'module' ? view.contentId : null);
  const c = contentId ? contents.find(x => x.id === contentId) : null;
  const inModule = !!(view && view.name === 'module' && c && view.contentId === c.id);
  const topicIdx = c ? (inModule ? view.topicIndex : getNextPendingTopicIndex(c)) : -1;
  const topic = c && topicIdx >= 0 ? c.topics[topicIdx] : null;
  const typeLabel = topic ? MODULE_META[getTopicType(c, topicIdx)].label : null;
  return {c, topicIdx, topic, typeLabel, inModule};
}

/* Barra de sessão (DS v2, A05–A09, A18). Sem sessão, aparece só dentro de um módulo, no estado "Pronta":
   abrir conteúdo não conta tempo (D2). Com sessão: Rodando → Meta próxima (último minuto, só texto, D3) → Pausada. */
/* Estado da sessão compartilhado pela barra (celular/tablet) e pela navegação lateral (desktop). */
function useSessionState(){
  const app = useApp();
  const {session, elapsedSec, settings, view} = app;
  const {c} = useSessionContext();
  const inModule = !!(view && view.name === 'module' && c);
  const present = !!(session || inModule);
  if(!present) return {present:false};
  const subjectId = session ? (session.subjectId || (c && c.subjectId)) : c.subjectId;
  const title = session ? (session.title || (c && c.title) || subjName(subjectId)) : c.title;
  let state = 'ready', ctx = 'Foco não iniciado', time = `Meta de ${settings.focusMin} min`, short = `Meta ${settings.focusMin} min`;
  if(session){
    const remain = Math.max(0, session.plannedMin*60 - elapsedSec);
    const remainMin = Math.max(1, Math.ceil(remain/60));
    time = `${remainMin} min para a meta`; short = `${remainMin} min`;
    if(session.status === 'paused'){
      state = 'paused';
      ctx = session.pauseReason === 'away' ? 'Pausada enquanto você estava fora' : `Pausada · ${title}`;
    } else if(remain <= 60){
      state = 'near'; ctx = 'A sessão encerra ao atingir a meta';
    } else { state = 'running'; ctx = `Foco · ${title}`; }
  }
  return {present, session, c, subjectId, title, state, ctx, time, short};
}

function SessionBar(){
  const {session, startSession, pauseSession, resumeSession, setTimerExpanded, timerExpanded, fullScreenFocus, view} = useApp();
  const st = useSessionState();
  const visible = !(timerExpanded || fullScreenFocus) && st.present;
  useEffect(()=>{ document.documentElement.style.setProperty('--sessionbar-h', visible ? (session ? '73px' : '65px') : '0px'); }, [visible, !!session]);
  if(!visible) return null;
  const {c, subjectId, ctx, time} = st;
  const open = ()=> session && setTimerExpanded(true);
  return (
    <>
      <div aria-hidden="true" style={{height: session ? 81 : 73}}/>
      <section className="sf-sessionbar" aria-label="Sessão de foco"
        style={{bottom: view && view.name === 'concluida' ? 0 : 'calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px))'}}>
        <div className="flex items-center gap-3 pl-4 pr-3 py-2.5">
          <div role={session ? 'button' : undefined} tabIndex={session ? 0 : undefined} onClick={open}
            onKeyDown={(e)=>{ if(session && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); open(); } }}
            aria-label={session ? `Abrir modo foco. ${ctx}. ${time}` : undefined}
            className={`flex-1 min-w-0 flex items-center gap-3 ${session ? 'cursor-pointer' : ''}`}>
            <SubjectTile subjectId={subjectId} size="sm"/>

              <p key={ctx} className="sf-swap text-[13px] leading-[18px] text-sf-muted truncate" aria-live="polite">{ctx}</p>
              <p className="text-[14px] leading-[20px] font-semibold text-sf-text tnum truncate">{time}</p>
              {session && c && (c.topics || []).length > 0 && <SegmentedTrail size="sm" className="mt-1" states={trailStates(c)} label={`Trilha de ${c.title}`}/>}
            </div>
          </div>
          {!session && (
            <button type="button" className="sf-pillbtn" onClick={()=>startSession(c.id, {stay:true})}>
              <IconPlay size={12}/> Começar foco
            </button>
          )}
          {session && session.status === 'paused' && (
            <button type="button" className="sf-roundbtn" onClick={resumeSession} aria-label="Retomar foco"><IconPlay size={14}/></button>
          )}

            <button type="button" className="sf-roundbtn" onClick={()=>pauseSession()} aria-label="Pausar foco"><IconPause size={18}/></button>
          )}
        </div>
      </section>
    </>
  );
}

/* Sessão na navegação (Figma: "Sessão na navegação"). Expandida: contexto, tempo, trilha e pausa. Compacta: botão + minutos. */

  const {c, subjectId, ctx, time, short} = st;
  const open = ()=> session && setTimerExpanded(true);
  const paused = session && session.status === 'paused';
  const action = !session
    ? {label:'Começar foco', Icon:IconPlay, size:14, on:()=>startSession(c.id, {stay:true}), primary:true}
    : (paused ? {label:'Retomar foco', Icon:IconPlay, size:14, on:resumeSession} : {label:'Pausar foco', Icon:IconPause, size:18, on:()=>pauseSession()});

    return (
      <section className="sf-sidenav-session" aria-label={`Sessão de foco. ${ctx}. ${time}`}>
        <button type="button" onClick={action.on} aria-label={action.label} title={action.label}

          <action.Icon size={action.size}/>
        </button>
        {session
          ? <button type="button" onClick={open} className="text-[13px] leading-[16px] font-medium text-sf-muted tnum bg-transparent border-0 cursor-pointer px-1 py-1 rounded-lg" aria-label={`Abrir modo foco. ${time}`}>{short}</button>
          : <span className="text-[13px] leading-[16px] font-medium text-sf-muted">Foco</span>}
      </section>
    );
  }
  return (
    <section className="sf-sidenav-session" aria-label="Sessão de foco">
      <div role={session ? 'button' : undefined} tabIndex={session ? 0 : undefined} onClick={open}
        onKeyDown={(e)=>{ if(session && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); open(); } }}
        aria-label={session ? `Abrir modo foco. ${ctx}. ${time}` : undefined}
        className={`flex items-center gap-2 min-w-0 ${session ? 'cursor-pointer' : ''}`}>
        <SubjectTile subjectId={subjectId} size="xs"/>

      </div>
      <div className="flex items-center gap-2 mt-3">
        <p className="flex-1 min-w-0 text-[14px] leading-[20px] font-semibold text-sf-text tnum whitespace-nowrap">{session ? time : short}</p>

          : <button type="button" className="sf-roundbtn" onClick={action.on} aria-label={action.label} title={action.label}><action.Icon size={action.size}/></button>}
      </div>
      {session && c && (c.topics || []).length > 0 && <SegmentedTrail size="sm" className="mt-3" states={trailStates(c)} label={`Trilha de ${c.title}`}/>}
    </section>
  );
}

/* Navegação lateral (Figma: "Navegação lateral"): expandida a partir de 1280 px, compacta (trilho) entre 1024 e 1279. */

/* Faixas da arquitetura responsiva. */
function bandFor(w){ return w >= 1280 ? 'wide' : (w >= 1024 ? 'rail' : (w >= 600 ? 'tablet' : 'mobile')); }
function useBand(){
  const [band, setBand] = useState(()=> bandFor(typeof window !== 'undefined' ? window.innerWidth : 390));
  useEffect(()=>{
    const on = ()=> setBand(bandFor(window.innerWidth));
    window.addEventListener('resize', on);
    return ()=> window.removeEventListener('resize', on);
  }, []);
  return band;
}
const isDeskBand = (b)=> b === 'rail' || b === 'wide';

function ConfirmEndModal(){

    <ModalShell variant="dialog" z={60} onClose={()=>setConfirmEnd(false)} labelledBy="confirm-end-title">

    </ModalShell>

/* Modo foco (A13/A14): cronômetro em SF/Display (Source Sans 3), contagem regressiva até a meta. */
function FocusScreen(){
  const {session, elapsedSec, timerExpanded, setTimerExpanded, fullScreenFocus, setFullScreenFocus, pauseSession, resumeSession, setConfirmEnd} = useApp();
  const {c, topic, typeLabel} = useSessionContext();
  if(!(timerExpanded || fullScreenFocus) || !session) return null;
  const close = ()=>{ setTimerExpanded(false); setFullScreenFocus(false); };
  const paused = session.status === 'paused';
  const remain = Math.max(0, session.plannedMin*60 - elapsedSec);
  const remainMin = Math.max(1, Math.ceil(remain/60));
  const subjectId = session.subjectId || (c && c.subjectId);
  const prog = c ? getContentProgress(c) : null;
  return (
    <ModalShell variant="full" z={50} onClose={close} labelledBy="focus-title">
      <div className="sf-focus-inner pt-6 px-5 pb-8 min-h-[100dvh] flex flex-col">
        <div className="relative flex items-center justify-center min-h-[44px]">
          <button type="button" onClick={close} aria-label="Recolher modo foco" className="sf-roundbtn absolute left-0"><span className="inline-flex" style={{transform:'rotate(180deg)'}}><IconChevronUp size={18}/></span></button>
          <p key={paused ? 'p' : 'r'} className="sf-swap text-[14px] font-semibold text-sf-muted">{paused ? 'Sessão pausada' : 'Sessão de foco'}</p>
        </div>
        <div className="flex-1 flex flex-col justify-center py-8">
          <p className="flex items-center gap-2">
            <SubjectTile subjectId={subjectId} size="sm"/>
            <span className="sf-ed-content text-sf-muted truncate">{(c && c.title) || session.title || subjName(subjectId)}{typeLabel ? ` · ${typeLabel}` : ''}</span>
          </p>
          <h2 id="focus-title" className="sf-ed-title text-sf-text mt-3">{topic ? topic.t : (session.title || 'Sessão de foco')}</h2>
          <p className="text-[64px] leading-[72px] font-bold text-sf-text tnum mt-6" style={{letterSpacing:'-.02em'}} role="timer" aria-label={`${remainMin} minutos para a meta`}>{fmtMMSS(remain)}</p>
          <p key={paused ? 'p' : 'r'} className="sf-swap text-[14px] leading-[20px] text-sf-muted mt-1">
            {paused ? `Pausado. Faltam ${remainMin} min para a meta de ${session.plannedMin} min.` : `para a meta de ${session.plannedMin} min`}
          </p>
          <p className="text-[14px] leading-[20px] text-sf-muted mt-1 tnum">{fmtMMSS(elapsedSec)} de foco nesta sessão</p>
          {prog && prog.total > 0 && (
            <>
              <SegmentedTrail className="mt-10" states={trailStates(c)} label={`Trilha de ${c.title}`}/>
              <p className="text-[14px] leading-[20px] text-sf-muted mt-2">Trilha: {prog.completed} de {prog.total} módulos concluídos</p>
            </>
          )}
        </div>
        <div className="flex flex-col gap-2">
          {paused
            ? <button type="button" onClick={resumeSession} className="sf-btn sf-btn-primary w-full h-12 text-[14px]">Retomar</button>
            : <button type="button" onClick={()=>pauseSession()} className="sf-btn sf-btn-secondary w-full h-12 text-[14px]">Pausar</button>}
          <button type="button" onClick={()=>setConfirmEnd(true)} className="sf-btn sf-btn-ghost w-full h-11 text-[14px] font-semibold">Encerrar sessão</button>
        </div>
      </div>
    </ModalShell>
  );
}

function ConcluidaScreen(){

      </div>
    );
  }
  const cs = completedSession;
  const pi = cs.plannerInfo;
  const plannerItem = pi ? planner.find(p=>p.id===pi.id) : null;
  const plannerDone = plannerItem ? plannerItem.done : (pi ? pi.done : false);
  const reached = cs.realSec >= cs.plannedMin * 60;
  const c = cs.contentId ? contents.find(x => x.id === cs.contentId) : null;
  const prog = c ? getContentProgress(c) : null;
  const nextIdx = prog ? prog.nextIndex : -1;

  const NextIcon = nextTopic ? MODULE_META[getTopicType(c, nextIdx)].Icon : null;
  const stats = [
    {v: fmtMin(cs.realMin), l: 'de foco'},

  return (
    <div className="pt-16 px-5 pb-8 min-h-[100dvh] flex flex-col">
      <h1 className="sf-ed-title text-sf-text flex items-center gap-2.5 mt-6">
        <span className="text-sf-success inline-flex" aria-hidden="true"><IconCheck size={22}/></span>
        {reached ? `Meta de ${cs.plannedMin} min atingida` : 'Sessão registrada'}
      </h1>
      <p className="text-[14px] leading-[20px] text-sf-muted mt-2">
        {cs.contentTitle ? `A sessão de ${cs.contentTitle} foi registrada.` : 'A sessão foi registrada.'}

      <dl className="grid grid-cols-3 gap-3 m-0 mt-6">
        {stats.map((it,i)=>(
          <div key={i} className="min-w-0 flex flex-col-reverse">
            <dt className="text-[14px] leading-[20px] text-sf-muted">{it.l}</dt>
            <dd className="m-0 sf-ed-stat text-sf-text flex items-center gap-1.5 tnum">{it.v}{it.flame && <span className="text-sf-muted inline-flex" aria-hidden="true"><IconFlame size={13}/></span>}</dd>
          </div>
        ))}
      </dl>
      {cs.capped && (
        <p className="text-[14px] leading-[20px] text-sf-muted mt-3">A sessão passou da meta enquanto o app estava fechado. Registramos {cs.realMin} min, o tempo da meta.</p>
      )}

      {(nextTopic || pi) && <div className="mt-6" style={{borderTop:'1px solid var(--border)'}}/>}
      {nextTopic && (
        <div className="mt-6">
          <p className="text-[14px] leading-[20px] text-sf-muted">Próximo na trilha</p>
          <p className="mt-1 flex items-start gap-2">
            <span className="text-sf-muted inline-flex mt-1" aria-hidden="true"><NextIcon size={16}/></span>
            <span className="sf-ed-content text-sf-text">{nextTopic.t}</span>
          </p>
          <SegmentedTrail className="mt-3" states={trailStates(c)} label={`Trilha de ${c.title}`}/>
        </div>
      )}
      {pi && (
        <div className="mt-6 flex items-center justify-between gap-3">
          <p className="text-[14px] leading-[20px] text-sf-muted min-w-0">{plannerDone ? 'Atividade do Plano concluída' : 'Atividade do Plano ainda pendente'}</p>
          <button type="button" onClick={()=>togglePlannerDone(pi.id)} className="sf-btn sf-btn-secondary h-11 px-3 text-[14px] shrink-0">
            {plannerDone ? 'Reabrir' : 'Marcar como feita'}
          </button>
        </div>
      )}

      <div className="flex-1 min-h-8"/>
      {nextTopic ? (
        <button type="button" onClick={()=>{ dismissCompletedSession(); openModule(c.id, nextIdx); }} className="sf-btn sf-btn-primary w-full h-12 text-[14px]">Continuar módulo {nextIdx + 1}</button>
      ) : (!cs.contentId && (
        <button type="button" onClick={()=>{ dismissCompletedSession(); goTab('plano'); }} className="sf-btn sf-btn-primary w-full h-12 text-[14px]">Voltar ao Plano</button>
      ))}
      {cs.contentId && (
        <button type="button" onClick={()=>{ dismissCompletedSession(); openPreSessao(cs.contentId); }} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Começar outro foco</button>
      )}
      <button type="button" onClick={dismissCompletedSession} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Ir para o início</button>
    </div>
  );
}

/* Progresso (A21). Semana de segunda a domingo, a mesma do Plano. Média = averageStartedPct (regra única, também usada no Início). */
/* Ofensiva e conquistas (antes na tela do mascote). Tudo vem de sessões registradas: abrir o app não conta. */
const STREAK_MARKS = [1, 3, 7, 14, 30, 60, 100];
function StreakSection({streak, studyDates, liveSessions}){
  const best = useMemo(()=> longestStreak(studyDates), [studyDates]);
  const totalMin = liveSessions.reduce((a, x)=> a + (x.durationMin || 0), 0);
  const next = STREAK_MARKS.find(d => d > streak);
  const ach = [
    {k:'s1', t:'Primeira sessão', h:'Registre uma sessão de foco', ok: liveSessions.length >= 1},
    {k:'s10', t:'Dez sessões', h:'Registre 10 sessões de foco', ok: liveSessions.length >= 10},
    {k:'h5', t:'Cinco horas de foco', h:'Some 5 horas de foco', ok: totalMin >= 300},
    {k:'d7', t:'Uma semana seguida', h:'Estude 7 dias seguidos', ok: best >= 7},
    {k:'d30', t:'Um mês seguido', h:'Estude 30 dias seguidos', ok: best >= 30},
  ];
  const got = ach.filter(a => a.ok).length;
  return (
    <section className="mt-10" aria-labelledby="h-ofensiva">
      <SectionTitle id="h-ofensiva">Ofensiva</SectionTitle>
      <dl className="grid grid-cols-2 gap-6 mt-3 m-0">
        <div className="flex flex-col-reverse"><dt className="text-[14px] leading-[20px] text-sf-muted">{plural(streak,'dia seguido','dias seguidos')}</dt><dd className="m-0 sf-ed-stat text-sf-text flex items-center gap-1.5">{streak}{streak > 0 && <span className="inline-flex text-sf-accent" aria-hidden="true"><IconFlame size={18}/></span>}</dd></div>
        <div className="flex flex-col-reverse"><dt className="text-[14px] leading-[20px] text-sf-muted">melhor sequência</dt><dd className="m-0 sf-ed-stat text-sf-text">{best}</dd></div>
      </dl>
      {next && (
        <div className="mt-4">
          <p className="text-[14px] leading-[20px] text-sf-muted m-0 mb-2">{streak > 0 ? `Próximo marco: ${next} dias (${next - streak === 1 ? 'falta 1 dia' : `faltam ${next - streak} dias`})` : 'Primeiro marco: um dia com sessão de foco'}</p>
          <ProgressBar value={(streak / next) * 100} height={4} color="var(--progress-fill)" label={`${streak} de ${next} dias`}/>
        </div>
      )}
      <p className="text-[14px] leading-[20px] text-sf-muted mt-3 mb-0">Cada dia com pelo menos uma sessão de foco conta para a ofensiva.</p>
      <h3 className="text-[16px] leading-[22px] font-semibold text-sf-text mt-6 mb-0">Conquistas <span className="text-sf-muted font-normal tnum">{got} de {ach.length}</span></h3>
      <ul className="list-none p-0 m-0 mt-1">
        {ach.map(a=>(
          <li key={a.k} className="sf-row-div py-2.5 flex items-center gap-3">
            <span className="w-8 h-8 rounded-full flex items-center justify-center shrink-0" aria-hidden="true"
              style={{background: a.ok ? 'var(--success-tint)' : 'var(--bg-elevated)', color: a.ok ? 'var(--success)' : 'var(--text-tertiary)'}}>{a.ok ? <IconCheck size={15}/> : <IconLock size={13}/>}</span>
            <span className="min-w-0">
              <span className="block text-[15px] leading-[20px] font-semibold" style={{color: a.ok ? 'var(--text-primary)' : 'var(--text-secondary)'}}>{a.t}</span>
              <span className="block text-[13px] leading-[16px] font-medium text-sf-muted">{a.ok ? 'Conquistada' : a.h}</span>
            </span>
          </li>
        ))}
      </ul>
    </section>
  );
}

/* Semana de exemplo (só enquanto não há nenhuma sessão): ensina a ler o gráfico, sem fingir que é da pessoa. */
const EXAMPLE_WEEK = [25, 0, 40, 15, 30, 0, 50];

function ProgressoScreen(){
  const {contents, liveSessions, openDetalhe, goTab, streak, studyDates} = useApp();
  const stats = useMemo(()=>{
    const today = todayStr();
    const offset = (parseDateStr(today).getDay() + 6) % 7;
    const start = addDaysStr(today, -offset);
    const days = Array.from({length:7}, (_, i) => {
      const ds = addDaysStr(start, i);
      const min = liveSessions.filter(x => { const ts = x.startedAt || x.dateTs; return ts && toDateStr(new Date(ts)) === ds; })
        .reduce((a, x) => a + (x.durationMin || 0), 0);
      return {ds, min, label: WEEK_LABELS[i], isToday: ds === today};
    });
    const totalMin = liveSessions.reduce((a,x)=> a + (x.durationMin||0), 0);
    return {days, todayIdx: offset, weekMin: days.reduce((a,d)=>a+d.min,0), maxMin: Math.max(1, ...days.map(d=>d.min)), totalMin, sessionsCount: liveSessions.length};
  }, [liveSessions]);
  const avg = averageStartedPct(contents);
  const started = orderContentsByActivity(contents).filter(isContentStarted);
  const example = stats.sessionsCount === 0;
  const exMax = Math.max(...EXAMPLE_WEEK);
  const chartSummary = example ? 'Gráfico de exemplo, sem dados seus' : stats.days.map(d => `${d.label}: ${d.min} min`).join(', ');

  const band = useBand();
  const desk = isDeskBand(band);
  /* Semanas anteriores (Figma: Progresso): só sessões registradas, agrupadas de segunda a domingo. Nada é estimado. */
  const history = useMemo(()=>{
    const today = todayStr();
    const curStart = addDaysStr(today, -((parseDateStr(today).getDay() + 6) % 7));
    const weeks = {};
    liveSessions.forEach(x => {
      const ts = x.startedAt || x.dateTs; if(!ts) return;
      const ds = toDateStr(new Date(ts));
      const ws = addDaysStr(ds, -((parseDateStr(ds).getDay() + 6) % 7));
      if(ws >= curStart) return;
      const w = weeks[ws] || (weeks[ws] = {start: ws, days: Array(7).fill(0)});
      const di = (parseDateStr(ds).getDay() + 6) % 7;
      w.days[di] += (x.durationMin || 0);
    });
    return Object.values(weeks).sort((a,b)=> b.start.localeCompare(a.start)).slice(0, 8).map(w => ({...w, total: w.days.reduce((a,v)=>a+v,0), active: w.days.filter(v=>v>0).length}));
  }, [liveSessions]);
  const chartH = desk ? 200 : 120;
  const weekSection = (
    <section className="mt-6" aria-labelledby="h-semana-prog">
      <SectionTitle id="h-semana-prog">Esta semana</SectionTitle>
      <p className="mt-2 flex items-baseline gap-2 flex-wrap">
        <span className="sf-ed-number text-sf-text">{fmtMin(stats.weekMin)}</span>
        <span className="text-[14px] text-sf-muted">de foco nesta semana</span>
      </p>
      {example && <p className="mt-4 mb-0 inline-flex items-center gap-2"><DemoTag/><span className="text-[14px] leading-[20px] text-sf-muted">Exemplo de como sua semana vai aparecer. Seus números entram depois da primeira sessão de foco.</span></p>}
      <div className="mt-6 flex items-end gap-2" style={{height: chartH, gap: desk ? 20 : 8, opacity: example ? .45 : 1}} role="img" aria-label={`Minutos de foco por dia nesta semana. ${chartSummary}`}>
        {stats.days.map((d, i) => { const m = example ? EXAMPLE_WEEK[i] : d.min, max = example ? exMax : stats.maxMin; return (
          <div key={d.ds} className="flex-1 h-full flex flex-col items-center justify-end gap-1" aria-hidden="true">
            <span className="text-[13px] font-medium text-sf-muted tnum whitespace-nowrap">{m > 0 && !example ? `${m} min` : ''}</span>
            <span className="w-full rounded-t-[6px]" style={{height: m > 0 ? `${Math.max(6, (m / max) * 82)}%` : 3, background: m > 0 ? (example ? 'var(--text-tertiary)' : 'var(--chart-bar)') : 'var(--chart-empty)', borderRadius: m > 0 ? undefined : 2}}/>
          </div>
        ); })}
      </div>
      <div className="flex mt-0 pt-2" style={{borderTop:'1px solid var(--border)', gap: desk ? 20 : 8}} aria-hidden="true">
        {stats.days.map(d => <span key={d.ds} className={`flex-1 text-center ${d.isToday ? 'text-[15px] font-semibold' : 'text-[13px] font-medium'}`} style={{color: d.isToday ? 'var(--text-primary)' : 'var(--text-secondary)'}}>{d.label}</span>)}
      </div>
      <p className="text-[14px] leading-[20px] text-sf-muted mt-3">Hoje é {WEEK_LONG[stats.todayIdx]}.</p>
      {stats.sessionsCount > 0 && <p className="text-[14px] leading-[20px] text-sf-muted mt-1 tnum">No total: {fmtMin(stats.totalMin)} em {stats.sessionsCount} {plural(stats.sessionsCount, 'sessão', 'sessões')}.</p>}
    </section>
  );
  const fmtRange = (ws)=>{ const a = parseDateStr(ws), b = parseDateStr(addDaysStr(ws, 6));
    return a.getMonth() === b.getMonth() ? `${a.getDate()} a ${b.getDate()} de ${MONTHS_LONG[b.getMonth()].toLowerCase()}` : `${a.getDate()} de ${MONTHS_LONG[a.getMonth()].toLowerCase()} a ${b.getDate()} de ${MONTHS_LONG[b.getMonth()].toLowerCase()}`; };
  const historySection = (
    <section className="mt-10" aria-labelledby="h-hist">
      <SectionTitle id="h-hist">Semanas anteriores</SectionTitle>
      {history.length === 0 ? (
        <div className="mt-3 rounded-xl p-5" style={{border:'1px dashed var(--border)'}}>
          <p className="text-[17px] leading-[22px] font-semibold text-sf-text m-0">Ainda não há semanas anteriores.</p>
          <p className="text-[14px] leading-[18px] text-sf-muted mt-1.5 mb-0">Quando a semana terminar, ela aparece aqui com seus minutos de foco de cada dia.</p>
        </div>
      ) : (
        <ul className="list-none p-0 m-0 mt-2">
          {history.map(w=>{
            const max = Math.max(1, ...w.days);
            return (
              <li key={w.start} className="sf-row-div py-3 flex items-center gap-4">
                <span className="flex-1 min-w-0">
                  <span className="block text-[15px] leading-[20px] font-semibold text-sf-text">{fmtRange(w.start)}</span>
                  <span className="block text-[14px] leading-[18px] text-sf-muted">{w.active} {plural(w.active,'dia','dias')} com foco</span>
                </span>
                <span className="flex items-end gap-1 h-6" aria-hidden="true">
                  {w.days.map((v,i)=><span key={i} className="w-2 rounded-sm" style={{height: v ? `${Math.max(20, v/max*100)}%` : 3, background: v ? 'var(--chart-bar)' : 'var(--chart-empty)'}}/>)}
                </span>
                <span className="text-[15px] font-semibold text-sf-text tnum w-[72px] text-right shrink-0">{fmtMin(w.total)}</span>
                <span className="sr-only-live">{w.days.map((v,i)=>`${WEEK_LABELS[i]}: ${v} min`).join(', ')}</span>
              </li>
            );
          })}
        </ul>
      )}
    </section>
  );
  const contentsSection = (

      <section className="mt-10" aria-labelledby="h-conteudos-prog">
        <div className="flex items-baseline gap-x-2 flex-wrap">
          <SectionTitle id="h-conteudos-prog">Conteúdos</SectionTitle>
          {avg.count > 0 && <span className="text-[14px] text-sf-muted tnum">média de {avg.pct}% {avg.count === 1 ? 'no conteúdo iniciado' : `nos ${avg.count} conteúdos iniciados`}</span>}
        </div>
        {contents.length === 0 ? (
          <div className="mt-3">
            <p className="text-[14px] leading-[20px] text-sf-muted">Adicione um conteúdo em Explorar para acompanhar o progresso aqui.</p>
            <button type="button" onClick={()=>goTab('estudar')} className="sf-btn sf-btn-primary w-full mt-4 h-12 text-[14px]">Explorar conteúdos</button>
          </div>
        ) : started.length === 0 ? (
          <p className="text-[14px] leading-[20px] text-sf-muted mt-2">Conclua o primeiro módulo de um conteúdo para ele aparecer aqui.</p>
        ) : (
          <div className="mt-2">
            {started.map(c => {
              const {pct} = getContentProgress(c);
              return (
                <button type="button" key={c.id} onClick={()=>openDetalhe(c.id)} className="sf-row-div w-full text-left py-3 flex items-center gap-3 bg-transparent border-0 cursor-pointer">
                  <SubjectTile subjectId={c.subjectId}/>
                  <span className="flex-1 min-w-0">
                    <span className="flex items-baseline justify-between gap-2">
                      <span className="sf-ed-content text-sf-text truncate">{c.title}</span>
                      <span className="text-[14px] font-semibold text-sf-text tnum shrink-0">{pct}%</span>
                    </span>
                    <SegmentedTrail size="sm" className="mt-2" states={trailStates(c)} label={`Trilha de ${c.title}`}/>
                  </span>
                </button>
              );
            })}
          </div>
        )}
      </section>
  );

  if(desk){
    return (
      <div className="sf-wide pb-8">
        <ScreenTitle>Progresso</ScreenTitle>
        <div className="sf-cols mt-2" style={{'--cols-gap':'64px'}}>
          <div className="sf-col-main">{weekSection}{historySection}</div>
          <aside className="sf-col-panel [&>section]:mt-6" style={{width:360, flexBasis:360}} aria-label="Ofensiva e conteúdos"><StreakSection streak={streak} studyDates={studyDates} liveSessions={liveSessions}/>{contentsSection}</aside>
        </div>
      </div>
    );
  }
  return (
    <div className="pt-16 px-5 pb-8">
      <ScreenTitle>Progresso</ScreenTitle>
      {weekSection}
      <StreakSection streak={streak} studyDates={studyDates} liveSessions={liveSessions}/>
      {contentsSection}
      {historySection}
    </div>
  );
}

function PlannerRow({it, isActive, otherActive, onOpen, onToggle, onStart, onOpenTimer}){

  const typeLabel = (PLANNER_TYPES.find(t=>t.k===it.type) || {}).l || 'Atividade';
  const meta = [plannerTimeLabel(it), it.duration ? `${it.duration} min` : null, typeLabel].filter(Boolean).join(' · ');
  return (
    <div className="sf-card rounded-2xl p-3.5 mb-2.5" style={{borderLeft:`3px solid ${accent}`}}>
      <div className="flex items-start gap-1">
        <button type="button" role="checkbox" aria-checked={!!it.done} aria-label={it.title} onClick={onToggle}
          className="w-11 h-11 -ml-[11px] -mt-[9px] shrink-0 flex items-center justify-center bg-transparent border-0">
          <span className="w-[22px] h-[22px] rounded-full flex items-center justify-center"
            style={{background: it.done ? accent : 'transparent', border: it.done ? 'none' : '1.5px solid var(--field-border)', color: inkOn(accent)}}>
            {it.done && <IconCheck size={12}/>}
          </span>
        </button>
        <button type="button" onClick={onOpen} aria-label={`Editar atividade: ${it.title}`}
          className="flex-1 min-w-0 text-left bg-transparent border-0 p-0">

            <span className="inline-flex" aria-hidden="true"><SubjectGlyph subjectId={it.subjectId} size={16}/></span>
            <span className="text-[13px] font-semibold truncate"
              style={{color: it.done ? 'var(--text-secondary)' : 'var(--text-primary)', textDecoration: it.done ? 'line-through' : 'none'}}>{it.title}</span>
          </span>
          <span className="block text-[11px] text-sf-muted mt-1">{meta}</span>
          {it.studiedMin>0 && (
            <span className="block text-[11px] mt-1" style={{color:'var(--blue-300)'}}>
              {it.duration ? `Planejado: ${it.duration} min · ` : ''}Estudado: {it.studiedMin} min

          {it.note && <span className="block text-[11px] text-sf-faint mt-1 truncate">{it.note}</span>}

      </div>
      {isActive ? (
        <button type="button" onClick={onOpenTimer}
          className="w-full mt-3 h-11 rounded-xl border-0 text-[12px] font-semibold flex items-center justify-center gap-2"
          style={{background:'var(--brand-tint-2)', color:'var(--blue-300)'}}>
          <IconTimer size={14}/> Em andamento · abrir timer
        </button>
      ) : canStart && (
        <button type="button" onClick={onStart} disabled={otherActive}
          className="w-full mt-3 h-11 rounded-xl border-0 text-[12px] font-semibold flex items-center justify-center gap-2"
          style={{background: otherActive ? 'var(--bg-elevated)' : 'var(--blue-500)', color: otherActive ? 'var(--text-secondary)' : '#fff'}}>
          <IconPlay size={11}/> {otherActive ? 'Outra sessão em andamento' : 'Começar sessão'}
        </button>
      )}
    </div>
  );
}

/* Nova atividade (A20). "Quando": Hoje, Amanhã, Escolher data ou Sem data.
   Sem data = item da lista "Sem data" (os mesmos dados de sf_tasks: título e matéria). Com data = item do Plano (sf_planner). */
function Group({id, label, children}){
  return (
    <div role="group" aria-labelledby={id} className="mt-5">
      <p id={id} className="text-[14px] leading-[20px] font-semibold text-sf-text mb-2">{label}</p>
      {children}
    </div>
  );
}
function PlannerItemSheet({item, date, onClose, onSave, onSaveTask, onDelete, allowNoDate}){
  const {openSubjectSheet} = useApp();
  const today = todayStr(), tomorrow = addDaysStr(todayStr(), 1);
  const [title, setTitle] = useState(item ? item.title : '');
  const [dateStr, setDateStr] = useState(item ? item.date : (date || today));
  const [when, setWhen] = useState(()=>{ const d = item ? item.date : (date || today); return d === today ? 'hoje' : (d === tomorrow ? 'amanha' : 'data'); });
  const [time, setTime] = useState(item ? (item.time || '') : '');
  const [subjectId, setSubjectId] = useState(item ? item.subjectId : Object.keys(SUBJECTS)[0]);
  const [type, setType] = useState(item ? item.type : 'estudo');
  const [duration, setDuration] = useState(item && item.duration ? String(item.duration) : '');
  const [note, setNote] = useState(item ? (item.note || '') : '');
  const [done, setDone] = useState(item ? !!item.done : false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [showErr, setShowErr] = useState(false);
  const titleRef = useRef(null);
  const noDate = when === 'sem';
  const effDate = when === 'hoje' ? today : (when === 'amanha' ? tomorrow : dateStr);
  const valid = title.trim().length>0 && (noDate || !!effDate);

  const save = ()=>{
    if(!valid){ setShowErr(true); if(!title.trim() && titleRef.current) titleRef.current.focus(); return; }
    if(noDate){ onSaveTask(title.trim(), subjectId); return; }
    const dur = parseInt(duration, 10);
    onSave({id: item ? item.id : undefined, title: title.trim(), date: effDate, time, subjectId, type,
      duration: dur>0 ? Math.min(dur, 600) : null, note: note.trim(), done});
  };
  const WHEN = [{k:'hoje', l:'Hoje'}, {k:'amanha', l:'Amanhã'}, {k:'data', l:'Escolher data'}].concat(allowNoDate && !item ? [{k:'sem', l:'Sem data'}] : []);

  return (
    <ModalShell onClose={onClose} labelledBy="planner-sheet-title">
      <h2 id="planner-sheet-title" className="sf-ed-title text-sf-text">{item ? 'Editar atividade' : 'Nova atividade'}</h2>

      <label htmlFor="pl-title" className="block text-[14px] leading-[20px] font-semibold text-sf-text mt-5 mb-2">O que fazer</label>
      <input id="pl-title" ref={titleRef} value={title} onChange={e=>setTitle(e.target.value)} maxLength={80}
        placeholder="Ex.: Revisar derivadas" className={INPUT_CLS}
        aria-invalid={showErr && !title.trim() ? 'true' : undefined} aria-describedby={showErr && !valid ? 'pl-err' : undefined}/>

      <Group id="pl-when-label" label="Quando">
        <div className="flex gap-2 flex-wrap">
          {WHEN.map(w => (
            <button type="button" key={w.k} onClick={()=>setWhen(w.k)} aria-pressed={when===w.k}
              className="sf-chip sf-chip-check px-3.5 h-11 rounded-xl text-[14px]">{w.l}</button>
          ))}
        </div>
        {noDate && <p className="text-[14px] leading-[20px] text-sf-muted mt-2">Sem data, a atividade vai para a lista "Sem data" do Plano. Tipo, horário e duração aparecem quando você escolhe uma data.</p>}
        {!noDate && (
          <div className="grid grid-cols-2 gap-3 mt-3">
            {when === 'data' ? (
              <div className="min-w-0">
                <FieldLabel htmlFor="pl-date">Data</FieldLabel>
                <input id="pl-date" type="date" value={dateStr} onChange={e=>setDateStr(e.target.value)} className={INPUT_CLS}/>
              </div>
            ) : <span/>}
            <div className="min-w-0">
              <FieldLabel htmlFor="pl-time" optional>Horário</FieldLabel>
