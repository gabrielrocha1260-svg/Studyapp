function ReadingModule({content, topic, onComplete}){
  const [readingContent, setReadingContent] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);

  useEffect(()=>{
    let cancelled = false;
    setLoading(true); setError(false); setReadingContent(null);
    fetchReading({
      contentId: content.id,
      title: content.title,
      subject: subjName(content.subjectId),
      moduleTitle: topic.t,
      learningObjective: topic.objective || '',
      topics: topic.subtopics || [],
    }).then(res=>{
      if(cancelled) return;
      if(!res){ setError(true); setLoading(false); return; }
      setReadingContent(res);
      setLoading(false);
    });
    return ()=>{ cancelled = true; };
  }, [content.id, topic.t, reloadKey]);

  if(loading){
    return (
      <div>
        <ModuleHeader kicker="LEITURA" topic={topic}/>
        <LoadingCard><IconSparkle/> Preparando a leitura...</LoadingCard>
      </div>
    );
  }

  if(error || !readingContent){
    return (
      <div>
        <ModuleHeader kicker="LEITURA" topic={topic}/>
        <InlineError title="Não foi possível carregar a leitura."
          hint="Confira sua conexão e se o servidor do STUDY está em execução." onRetry={()=>setReloadKey(k=>k+1)}/>
      </div>
    );
  }

  const paragraphs = readingContent.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);

  return (
    <div>
      <ModuleHeader kicker="LEITURA" topic={topic} showObjective/>

      <div className="mt-4 rounded-2xl p-4" style={{background:'var(--card-bg)'}}>
        {paragraphs.map((p, i) => {
          const isHeading = p.length < 60 && !/[.!?:;]$/.test(p) && !p.includes('\n');
          if(isHeading){
            return <h2 key={i} className="text-[13px] font-bold text-sf-accent mt-4 first:mt-0 mb-1">{p}</h2>;
          }
          return <p key={i} className="text-[13px] text-sf-text leading-relaxed mt-3 first:mt-0 break-words">{p}</p>;
        })}
      </div>

      <CompleteButton onClick={onComplete}>Marcar como lido e concluir</CompleteButton>
    </div>
  );
}

function FlashcardsModule({content, topic, onComplete}){
  const [cards, setCards] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const [current, setCurrent] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [seenLast, setSeenLast] = useState(false);

  useEffect(()=>{
    let cancelled = false;
    setLoading(true); setError(false); setCards(null);
    fetchFlashcards({
      contentId: content.id,
      title: content.title,
      subject: subjName(content.subjectId),
      moduleTitle: topic.t,
    }).then(res=>{
      if(cancelled) return;
      if(!res){ setError(true); setLoading(false); return; }
      setCards(res);
      setCurrent(0); setFlipped(false); setSeenLast(false);
      setLoading(false);
    });
    return ()=>{ cancelled = true; };
  }, [content.id, topic.t, reloadKey]);

  const next = ()=>{
    if(!cards) return;
    if(current < cards.length - 1){ setCurrent(c => c + 1); setFlipped(false); }
    else { setSeenLast(true); }
  };
  const prev = ()=>{
    if(!cards || current === 0) return;
    setCurrent(c => c - 1); setFlipped(false);
  };

  if(loading){
    return (
      <div>
        <ModuleHeader kicker="PRÁTICA" topic={topic}/>
        <LoadingCard><IconSparkle/> Gerando flashcards...</LoadingCard>
      </div>
    );
  }

  if(error || !cards){
    return (
      <div>
        <ModuleHeader kicker="PRÁTICA" topic={topic}/>
        <InlineError title="Não foi possível carregar os flashcards."
          hint="Confira sua conexão e se o servidor do STUDY está em execução." onRetry={()=>setReloadKey(k=>k+1)}/>
      </div>
    );
  }

  const card = cards[current];
  const faceText = flipped ? card.back : card.front;

  return (
    <div>
      <ModuleHeader kicker="PRÁTICA" topic={topic} showObjective/>

      <div className="flex items-center justify-between mt-4 text-[12px] text-sf-muted">
        <span className="tnum">Cartão {current + 1} de {cards.length}</span>
        <span>{flipped ? 'Resposta' : 'Pergunta'}</span>
      </div>
      <ProgressBar value={((current + 1) / cards.length) * 100} height={4} className="mt-2" label={`Cartão ${current + 1} de ${cards.length}`}/>

      <button type="button" onClick={()=>setFlipped(f=>!f)}
        className="w-full mt-3 rounded-2xl p-6 flex items-center justify-center text-center transition-colors"
        style={{
          minHeight: 200,
          background: flipped ? 'var(--brand-tint-soft)' : 'var(--bg-surface)',
          border: flipped ? '1px solid var(--brand-border-strong)' : '1px solid var(--border)',
        }}>
        <span className="block">
          <span className="block text-[11px] font-bold tracking-[0.5px] mb-3" style={{color: flipped ? 'var(--blue-300)' : 'var(--warning)'}}>
            {flipped ? 'RESPOSTA' : 'PERGUNTA'}
          </span>
          <span className="block text-[16px] text-sf-text leading-relaxed break-words">{faceText}</span>
          <span className="block text-[11px] text-sf-faint mt-4">Toque para virar</span>
        </span>
      </button>
      <p role="status" className="sr-only-live">{`Cartão ${current + 1} de ${cards.length}, ${flipped ? 'resposta' : 'pergunta'}: ${faceText}`}</p>

      <div className="flex gap-2 mt-4">
        <button type="button" onClick={prev} disabled={current === 0}
          className="sf-btn sf-btn-secondary flex-1 h-12 text-[13px] font-semibold"
          style={{opacity: current === 0 ? 0.4 : 1}}>
          Anterior
        </button>
        <button type="button" onClick={next}
          className="sf-btn sf-btn-primary flex-1 h-12 text-[13px] font-semibold">
          {current < cards.length - 1 ? 'Próximo' : 'Finalizar'}
        </button>
      </div>

      {seenLast && <CompleteButton onClick={onComplete}>Concluir módulo</CompleteButton>}
    </div>
  );
}

function QuizModule({content, topic, topicIndex, onSubmit, existingProgress, onFinish}){
  const [questions, setQuestions] = useState(null);
  const [answers, setAnswers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [score, setScore] = useState(0);
  const [passed, setPassed] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const resultRef = useRef(null);
  const isLastModule = topicIndex === (content.topics || []).length - 1;

  useEffect(()=>{
    let cancelled = false;
    setLoading(true); setLoadError(false); setQuestions(null);
    fetchQuiz({
      contentId: content.id,
      title: content.title,
      subject: subjName(content.subjectId),
      moduleTitle: topic.t,
      learningObjective: topic.objective || '',
    }).then(res=>{
      if(cancelled) return;
      if(!res){ setLoadError(true); setLoading(false); return; }
      setQuestions(res);
      setAnswers(Array(res.length).fill(null));
      setLoading(false);
    });
    return ()=>{ cancelled = true; };
  }, [content.id, topic.t, reloadKey]);

  useEffect(()=>{
    if(submitted){
      window.scrollTo(0, 0);
      if(resultRef.current) resultRef.current.focus({preventScroll:true});
    }
  }, [submitted]);

  const answeredCount = answers.filter(a => a !== null).length;
  const answered = questions ? answeredCount === questions.length : false;

  const submit = ()=>{
    if(!answered || !questions) return;
    const correct = questions.reduce((acc, q, i)=> acc + (q.options[answers[i]]?.correct ? 1 : 0), 0);
    const s = Math.round((correct / questions.length) * 10);
    const ok = onSubmit(s);
    setScore(s); setPassed(ok); setSubmitted(true);
  };

  const retry = ()=>{
    if(!questions) return;
    setAnswers(Array(questions.length).fill(null));
    setSubmitted(false); setScore(0); setPassed(false);
    window.scrollTo(0, 0);
  };

  if(loading){
    return (
      <div>
        <ModuleHeader kicker="AVALIAÇÃO FINAL" topic={topic}/>
        <LoadingCard><IconSparkle/> Gerando questões da avaliação...</LoadingCard>
      </div>
    );
  }

  if(loadError || !questions){
    return (
      <div>
        <ModuleHeader kicker="AVALIAÇÃO FINAL" topic={topic}/>
        <InlineError title="Não foi possível carregar a avaliação."
          hint="Confira sua conexão e se o servidor do STUDY está em execução." onRetry={()=>setReloadKey(k=>k+1)}/>
      </div>
    );
  }

  if(submitted){
    const tone = passed ? 'var(--success)' : 'var(--error)';
    return (
      <div>
        <ModuleHeader kicker="AVALIAÇÃO FINAL" topic={topic}/>

        <div ref={resultRef} tabIndex={-1} role="status" className="mt-4 rounded-2xl p-5 text-center"
          style={{
            background: passed ? 'var(--success-tint)' : 'var(--error-tint)',
            border: passed ? '1px solid var(--success-border)' : '1px solid var(--error-border)',
            outline: 'none',
          }}>
          <p className="text-[32px] font-bold tnum" style={{color: tone}}>{fmtScore(score)}</p>
          <p className="text-[13px] font-semibold mt-1 flex items-center justify-center gap-1.5" style={{color: tone}}>
            {passed ? <IconCheck size={14}/> : <IconAlert size={14}/>}
            {passed ? `Aprovado! ${isLastModule ? 'Jornada concluída.' : 'Módulo concluído.'}` : 'Você precisa de pelo menos 7,0 para avançar.'}
          </p>
          <p className="text-[12px] text-sf-muted mt-2">
            {passed ? 'Parabéns! Você dominou este conteúdo.' : 'Revise o conteúdo e tente novamente.'}
          </p>
        </div>

        {passed ? (
          <>
            <button type="button" onClick={onFinish}
              className="sf-btn sf-btn-primary w-full mt-5 h-12 text-[14px] font-semibold flex items-center justify-center gap-2">
              <IconCheck size={16}/> Voltar para a matéria
            </button>
            <button type="button" onClick={retry}
              className="sf-btn sf-btn-secondary w-full mt-2.5 h-11 text-[13px] font-semibold flex items-center justify-center gap-2">
              <IconRefresh size={14}/> Refazer avaliação
            </button>
          </>
        ) : (
          <>
            <button type="button" onClick={retry}
              className="sf-btn sf-btn-primary w-full mt-5 h-12 text-[14px] font-semibold flex items-center justify-center gap-2">
              <IconRefresh size={15}/> Tentar novamente
            </button>
            <button type="button" onClick={onFinish}
              className="sf-btn sf-btn-ghost w-full mt-2.5 h-11 text-[13px]"
              style={{border:'1px solid var(--border)'}}>
              Voltar para a matéria
            </button>
          </>
        )}

        {existingProgress && existingProgress.attempts > 0 && (
          <p className="text-[12px] text-sf-muted text-center mt-4 tnum">
            Tentativas: {existingProgress.attempts} · Melhor nota: {fmtScore(existingProgress.bestScore)}
          </p>
        )}
      </div>
    );
  }

  return (
    <div>
      <ModuleHeader kicker="AVALIAÇÃO FINAL" topic={topic}/>
      <p className="text-[12px] text-sf-muted mt-1">Responda as {questions.length} questões. Nota mínima: 7,0.</p>

      {questions.map((q, qi)=>(
        <fieldset key={qi} className="mt-4 rounded-2xl p-3.5 border-0 m-0 min-w-0" style={{background:'var(--card-bg)'}}>
          <legend className="text-[13px] font-semibold text-sf-text float-left w-full mb-3 p-0">{qi+1}. {q.q}</legend>
          <div className="flex flex-col gap-2 clear-both">
            {q.options.map((o, oi)=>{
              const on = answers[qi] === oi;
              return (
                <label key={oi} className="sf-radio relative w-full cursor-pointer rounded-xl px-3 py-3 min-h-[44px] text-[13px] flex items-center gap-2.5"
                  style={{
                    background: on ? 'var(--brand-tint-2)' : 'var(--bg-surface)',
                    color: on ? 'var(--blue-200)' : 'var(--text-primary)',
                    border: on ? '1px solid var(--blue-500)' : '1px solid var(--border)',
                    fontWeight: on ? 600 : 400,
                  }}>
                  <input type="radio" name={`quiz-q${qi}`} checked={on}
                    onChange={()=>setAnswers(prev => prev.map((v, i)=> i===qi ? oi : v))}/>
                  <span aria-hidden="true" className="w-[18px] h-[18px] rounded-full shrink-0 flex items-center justify-center"
                    style={{border: on ? '1.5px solid var(--blue-300)' : '1.5px solid var(--field-border)', background: on ? 'var(--blue-500)' : 'transparent', color:'#fff'}}>
                    {on && <IconCheck size={11}/>}
                  </span>
                  <span className="flex-1 min-w-0 break-words">{o.l}</span>
                </label>
              );
            })}
          </div>
        </fieldset>
      ))}

      <p role="status" className="text-[12px] text-sf-muted text-center mt-5 tnum">
        {answered ? 'Tudo respondido. Pode enviar.' : `${answeredCount} de ${questions.length} respondidas`}
      </p>
      <button type="button" onClick={submit} disabled={!answered}
        className="sf-btn sf-btn-primary w-full mt-2 h-12 text-[14px] font-semibold flex items-center justify-center gap-2"
        style={{opacity: answered ? 1 : 0.5}}>
        <IconCheck size={16}/> Enviar respostas
      </button>
    </div>
  );
}

function ModuleScreen({contentId, topicIndex}){
  const {contents, closeView, openDetalhe, completeModule, submitModuleQuiz, getModuleProgress, openYouTubeVideo} = useApp();
  const c = contents.find(x=>x.id===contentId);
  const topic = c && c.topics ? c.topics[topicIndex] : null;
  if(!c || !topic) return <MissingContent onBack={closeView}/>;
  const ttype = getTopicType(c, topicIndex);
  const meta = MODULE_META[ttype];
  const progress = getModuleProgress(contentId, topicIndex);

  const status = getTopicStatus(c, topicIndex);
  const isLocked = status === TOPIC_STATUS.LOCKED;
  const isDone = status === TOPIC_STATUS.COMPLETED;

  const handleComplete = ()=>{
    if(isDone || completeModule(contentId, topicIndex)){
      openDetalhe(contentId);
    }
  };

  const handleQuizSubmit = (score)=> submitModuleQuiz(contentId, topicIndex, score);

  const handleOpenVideo = (v)=>{
    openYouTubeVideo(v, null, { subjectId: c.subjectId, topic: topic.t, contentTitle: c.title });
  };

  if(isLocked){
    return (
      <div className="pt-16 px-5 pb-8">
        <BackButton onClick={closeView}/>
        <div className="mt-6">
          <EmptyState title="Este módulo está bloqueado." hint="Conclua o módulo anterior para liberá-lo.">
            <div className="mt-3 flex justify-center text-sf-muted"><IconLock size={22}/></div>
          </EmptyState>
        </div>
      </div>
    );
  }

  return (
    <div className="pt-16 px-5 pb-8">
      <BackButton onClick={closeView}/>

      <div className="mt-2 flex items-center gap-2 flex-wrap">
        <SubjectTag subjectId={c.subjectId}/>
        <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-[11px] text-[11px] font-semibold"
          style={{background:'var(--tag-bg)', color: meta.color}}>
          <meta.Icon size={11}/> {meta.label}
        </span>
        {isDone && <span className="text-[11px] font-bold text-sf-success inline-flex items-center gap-1"><IconCheck size={11}/> Concluído</span>}
      </div>

      <p className="text-[12px] text-sf-muted mt-3">{c.title} · Módulo {topicIndex+1} de {c.topics.length}</p>

      <div className="mt-4">
        {ttype === MODULE_TYPES.VIDEO && (
          <VideoModule content={c} topic={topic} onComplete={handleComplete} onOpenVideo={handleOpenVideo}/>
        )}
        {ttype === MODULE_TYPES.READING && (
          <ReadingModule content={c} topic={topic} onComplete={handleComplete}/>
        )}
        {ttype === MODULE_TYPES.FLASHCARDS && (
          <FlashcardsModule content={c} topic={topic} onComplete={handleComplete}/>
        )}
        {ttype === MODULE_TYPES.QUIZ && (
          <QuizModule content={c} topic={topic} topicIndex={topicIndex}
            onSubmit={handleQuizSubmit} existingProgress={progress}
            onFinish={()=>openDetalhe(contentId)}/>
        )}
      </div>

      {progress && progress.attempts > 0 && ttype === MODULE_TYPES.QUIZ && (
        <div className="mt-6 rounded-2xl p-3.5" style={{background:'var(--card-bg)'}}>
          <h2 className="text-[11px] font-bold text-sf-muted tracking-[0.5px]">HISTÓRICO</h2>
          <p className="text-[12px] text-sf-text mt-1.5 tnum">
            {progress.attempts} {progress.attempts === 1 ? 'tentativa' : 'tentativas'} · Última nota: {fmtScore(progress.lastScore)} · Melhor: {fmtScore(progress.bestScore)}
          </p>
        </div>
      )}
    </div>
  );
}

function Screen(){
  const {tab, view} = useApp();
  if(view){
    switch(view.name){
      case 'detalhe': return <DetalheScreen key={view.contentId} contentId={view.contentId}/>;
      case 'presessao': return <PreSessaoScreen contentId={view.contentId}/>;
      case 'concluida': return <ConcluidaScreen/>;
      case 'youtube-video': return <YouTubeVideoScreen key={view.video && view.video.id} video={view.video} context={view.context}/>;
      case 'module': return <ModuleScreen key={`${view.contentId}:${view.topicIndex}`} contentId={view.contentId} topicIndex={view.topicIndex}/>;
      case 'calendario': return <PlannerScreen key={view.date||'hoje'} initialDate={view.date||undefined}/>;
      case 'materias': return <MateriasScreen/>;
      case 'jornada': return <JornadaScreen key={view.contentId || 'atual'} contentId={view.contentId}/>;
      case 'configuracoes': return <ConfiguracoesScreen/>;
      case 'tarefas': return <TarefasScreen/>;
      case 'criar-conteudo': return <CriarConteudoScreen/>;
    }
  }
  if(tab==='home') return <HomeScreen/>;
  if(tab==='estudar') return <ExplorarScreen/>;
  if(tab==='progresso') return <ProgressoScreen/>;
  if(tab==='perfil') return <PerfilScreen/>;
  return null;
}
function showsTabBar(view){
  if(!view) return true;
  if(['detalhe','presessao','concluida','module'].includes(view.name)) return false;
  return true;
}

function SessionDoneBanner(){
  const {completedSession, setCompletedSession, showCompletedSummary, view} = useApp();
  if(!completedSession || (view && view.name === 'concluida')) return null;
  return (
    <div role="status" className="fixed left-1/2 -translate-x-1/2 top-3 w-[calc(100%-24px)] max-w-[378px] z-40 rounded-2xl p-3 flex items-center gap-3 bg-sf-surface"
      style={{border:'1px solid var(--success-border)', boxShadow:'var(--shadow-modal)', marginTop:'env(safe-area-inset-top,0px)'}}>
      <span className="text-sf-success shrink-0"><IconCheck size={18}/></span>
      <p className="flex-1 min-w-0 text-[12px] text-sf-text leading-snug">
        <span className="font-semibold">Sessão concluída.</span> {completedSession.realMin} min registrados.
      </p>
      <button type="button" onClick={showCompletedSummary} className="sf-btn sf-btn-primary h-11 px-3 text-[12px] font-semibold shrink-0">Ver resumo</button>
      <button type="button" onClick={()=>setCompletedSession(null)} aria-label="Dispensar aviso"
        className="sf-btn sf-btn-ghost w-11 h-11 -mr-1 flex items-center justify-center shrink-0"><IconClose size={16}/></button>
    </div>
  );
}

function AppShell(){
  const { view, tab, user, handleAuth, goTab } = useApp();
  useTheme();   // assina o tema: a troca re-renderiza a árvore para recalcular cores derivadas em JS (sem remontar nada)
  const mainRef = useRef(null);
  const firstNav = useRef(true);
  const navKey = `${tab}|${view ? view.name + ':' + (view.contentId || '') + ':' + (view.topicIndex != null ? view.topicIndex : '') + ':' + (view.video ? view.video.id : '') : ''}`;

  // Ao trocar de tela: volta ao topo e move o foco para a área principal (leitores de tela anunciam a nova tela).
  useEffect(()=>{
    if(firstNav.current){ firstNav.current = false; return; }
    window.scrollTo(0, 0);
    if(mainRef.current) mainRef.current.focus({preventScroll:true});
  }, [navKey]);

  if(!user){
    return <LoginScreen onAuth={handleAuth}/>;
  }
  return (
    <div className="device-wrap">
      <div className="device">
        <a href="#main-content" className="sf-skip" onClick={(e)=>{ e.preventDefault(); if(mainRef.current) mainRef.current.focus(); }}>Pular para o conteúdo</a>
        <main id="main-content" ref={mainRef} tabIndex={-1}>
          <ErrorBoundary key={navKey} onReset={()=>goTab('home')}>
            <div className="sf-screen-in"><Screen/></div>
          </ErrorBoundary>
        </main>
        {showsTabBar(view) && <TabBar/>}
        <SessionDoneBanner/>
        <FloatingTimer/>
        <ConfirmEndModal/>
        <FullScreenFocus/>
        <SubjectSheet/>
      </div>
    </div>
  );
}
function App(){ return <ThemeProvider><AppProvider><AppShell/></AppProvider></ThemeProvider>; }

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
