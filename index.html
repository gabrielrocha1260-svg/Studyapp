<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="STUDY: organize matérias, siga trilhas de estudo e registre sessões de foco." />
<meta name="theme-color" content="#09090B" />
<meta name="color-scheme" content="dark light" />
<script>
  /* Tema aplicado ANTES da primeira pintura (sem flash). Preferência salva em localStorage 'sf_theme' ('light' | 'dark' | 'system');
     sem escolha explícita, segue prefers-color-scheme do sistema (padrão: escuro). */
  (function(){
    var pref = 'system';
    try { var v = localStorage.getItem('sf_theme'); if (v === 'light' || v === 'dark' || v === 'system') pref = v; } catch (e) {}
    var t = 'dark';
    try { t = pref === 'system' ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref; } catch (e) {}
    var r = document.documentElement;
    r.setAttribute('data-theme', t); r.setAttribute('data-theme-pref', pref); r.style.colorScheme = t;
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'light' ? '#F4F7FC' : '#09090B');
  })();
</script>
<title>STUDY</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  /* Design tokens → Tailwind. Use `text-sf-text`, `bg-sf-surface`, `border-sf-border`... em vez de hex.
     Os valores vivem em variáveis CSS (:root e :root[data-theme="light"]), então um tema novo muda só esses blocos. */
  tailwind.config = {
    theme: { extend: {
      colors: { sf: {
        base:'var(--bg-base)', inset:'var(--bg-inset)', card:'var(--card-bg)', surface:'var(--bg-surface)',
        elevated:'var(--bg-elevated)', overlay:'var(--bg-overlay)', handle:'var(--handle)',
        brand:'var(--blue-500)', 'brand-400':'var(--blue-400)', 'brand-900':'var(--blue-900)', accent:'var(--blue-300)',
        text:'var(--text-primary)', muted:'var(--text-secondary)', faint:'var(--text-tertiary)',
        border:'var(--border)', success:'var(--success)', warning:'var(--warning)', error:'var(--error)', danger:'var(--error-solid)',
        scrim:'var(--scrim)', bar:'var(--bar-bg)',
      } },
      screens: { xs:'380px' },   /* breakpoint extra para telas muito estreitas (320–379px usam o layout base) */
    } }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  /* =====================================================================
     STUDY — Design tokens e componentes
     Camadas:  1) tokens (cores por tema, tipografia, espaço, raios, sombras, movimento)
               2) base  3) componentes reutilizáveis (.sf-*)  4) animações  5) movimento reduzido
     Raios: 8 chips/ícones · 12 controles · 16 cards · 20 cards de destaque · 24 sheets
     Espaçamento: escala de 4px do Tailwind
     Tipografia (px): 11 legenda · 12 apoio · 13 corpo-sm · 14 corpo · 16 destaque · 18 título · 20/22/24 telas · 28/36/40 números
     Tema: <html data-theme="dark|light"> (definido por script antes da primeira pintura).
           Os componentes só usam variáveis; um tema novo muda apenas os blocos :root.
     ===================================================================== */
  :root{
    /* ---------- Tema ESCURO (identidade original, valores preservados) ---------- */
    color-scheme:dark;
    /* Superfícies */
    --bg-base:#09090B;      /* fundo do app */
    --bg-inset:#0A0D14;     /* campos de formulário */
    --card-bg:#071427;      /* card embutido (sem borda) */
    --bg-surface:#111827;   /* card padrão (com borda), sheets e diálogos */
    --bg-elevated:#202736;  /* botões secundários */
    --bg-overlay:#242B3D;   /* trilhas de progresso e chips inativos */
    --bg-outer:#060608;     /* área ao redor da coluna do app em telas largas */
    --bar-bg:#0A0D14;       /* barra de abas */
    --tag-bg:#242B3D;       /* etiqueta de matéria */
    --timer-bg:#0F1620;     /* timer expandido */
    /* Marca */
    --blue-900:#0D1B38; --blue-700:#1A3A72; --blue-500:#2563EB; --blue-400:#3B82F6; --blue-300:#60A5FA; --blue-200:#93C5FD; --on-tint:#60A5FA;
    --violet:#8B5CF6;
    --on-brand:#FFFFFF; --on-success:#0A0D14; --btn-primary-hover:#1D4ED8; --btn-primary-active:#1E40AF;
    /* Texto — contraste mínimo de 4,5:1 sobre as superfícies */
    --text-primary:#E8EEFF; --text-secondary:#8B9CC8; --text-tertiary:#7A8BB8; --text-disabled:#2D3555;
    /* Bordas */
    --border:#242B3D; --border-strong:#3A4466; --handle:#2D3555;
    --field-border:#56648F; --field-border-hover:#6B7BA8;   /* contorno de campos e caixas de seleção: ≥3:1 (WCAG 1.4.11) */
    /* Feedback: cores semânticas (nunca usadas como cor de identificação de matéria) */
    --success:#10B981; --warning:#F59E0B; --error:#EF4444; --error-solid:#DC2626; --focus:#818CF8; --flame:#F59E0B;
    /* Tipos de módulo */
    --mod-video:#60A5FA; --mod-reading:#10B981; --mod-practice:#F59E0B; --mod-quiz:#A78BFA;
    /* Tints translúcidos */
    --brand-tint-soft:rgba(37,99,235,.10); --brand-tint:rgba(37,99,235,.15); --brand-tint-2:rgba(37,99,235,.20); --brand-tint-strong:rgba(37,99,235,.35);
    --brand-border:rgba(37,99,235,.35); --brand-border-strong:rgba(37,99,235,.5);
    --success-tint:rgba(16,185,129,.15); --success-border:rgba(16,185,129,.4);
    --warning-tint:rgba(245,158,11,.15); --warning-border:rgba(245,158,11,.35); --warning-outline:rgba(245,158,11,.5);
    --error-tint:rgba(239,68,68,.15); --error-border:rgba(239,68,68,.35); --error-outline:rgba(239,68,68,.55);
    --scrim:rgba(0,0,0,.70);
    /* Mídia (miniaturas e players ficam escuros nos dois temas) */
    --media-a:#1A3A72; --media-b:#0A0D14;
    /* Gráficos e anel de foco */
    --chart-bar:#2563EB; --chart-bar-hl:#60A5FA; --chart-empty:#242B3D;
    --ring-track:#1A3A72; --ring-fill:#3B82F6; --ring-dot:#60A5FA;
    --progress-fill:#3B82F6; --progress-track:#242B3D;   /* trilha segmentada (DS v2: progress/fill, progress/track) */
    /* Brilho decorativo do login */
    --glow-1:rgba(37,99,235,.24); --glow-2:rgba(139,92,246,.12);
    /* Elevação */
    --shadow-card:none; --shadow-card-hover:0 8px 22px -10px rgba(0,0,0,.6);
    --shadow-float:0 4px 12px rgba(0,0,0,.35); --shadow-modal:0 10px 30px rgba(0,0,0,.45);
    --shadow-btn:none; --shadow-btn-hover:none;   /* D6: botão primário sem brilho */
    --shadow-column:0 0 90px -30px rgba(37,99,235,.18);

    /* ---------- Tokens independentes de tema ---------- */
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    /* E1: segunda voz tipográfica — só em experiências editoriais e de leitura (nunca em controles, rótulos ou timer) */
    --font-editorial:'Literata',Georgia,'Times New Roman',serif;
    --dur-track:250ms;   /* E4: preenchimento do segmento da trilha */
    --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:20px; --radius-2xl:24px; --radius-pill:9999px;
    --ease-out:cubic-bezier(.22,1,.36,1); --ease-in-out:cubic-bezier(.65,0,.35,1); --ease-spring:cubic-bezier(.34,1.45,.64,1);
    --dur-fast:140ms; --dur-base:220ms; --dur-slow:420ms;
    --app-width:402px; --tabbar-h:75px; --form-width:320px;
  }
  :root[data-theme="light"]{
    /* ---------- Tema CLARO: mesma família de azul-marinho, derivado do escuro (não é inversão automática) ---------- */
    color-scheme:light;
    --bg-base:#F4F7FC; --bg-inset:#EEF2F9; --card-bg:#E8EFFB; --bg-surface:#FFFFFF; --bg-elevated:#E1E8F5; --bg-overlay:#D6DFEF;
    --bg-outer:#E6ECF7; --bar-bg:#FFFFFF; --tag-bg:#E1E8F5; --timer-bg:#FFFFFF;
    --blue-900:#D3DFF7; --blue-700:#C3D3F3; --blue-500:#2563EB; --blue-400:#3B82F6; --blue-300:#1D4ED8; --blue-200:#1E40AF; --on-tint:#1E40AF;
    --violet:#7C3AED;
    --on-brand:#FFFFFF; --on-success:#FFFFFF; --btn-primary-hover:#1D4ED8; --btn-primary-active:#1E40AF;
    --text-primary:#0D1B38; --text-secondary:#3D4E78; --text-tertiary:#4B5C86; --text-disabled:#9AA7C4;
    --border:#D3DCEC; --border-strong:#B6C3DE; --handle:#C3CFE6;
    --field-border:#7383AA; --field-border-hover:#5A6B94;
    --success:#065F46; --warning:#92400E; --error:#B91C1C; --error-solid:#DC2626; --focus:#4338CA; --flame:#D97706;
    --mod-video:#1D4ED8; --mod-reading:#065F46; --mod-practice:#92400E; --mod-quiz:#6D28D9;
    --brand-tint-soft:rgba(37,99,235,.07); --brand-tint:rgba(37,99,235,.10); --brand-tint-2:rgba(37,99,235,.14); --brand-tint-strong:rgba(37,99,235,.22);
    --brand-border:rgba(37,99,235,.35); --brand-border-strong:rgba(37,99,235,.55);
    --success-tint:rgba(5,150,105,.12); --success-border:rgba(5,150,105,.42);
    --warning-tint:rgba(217,119,6,.12); --warning-border:rgba(217,119,6,.42); --warning-outline:rgba(180,83,9,.55);
    --error-tint:rgba(220,38,38,.09); --error-border:rgba(220,38,38,.38); --error-outline:rgba(185,28,28,.55);
    --scrim:rgba(13,27,56,.50);
    --chart-bar:#3B82F6; --chart-bar-hl:#1D4ED8; --chart-empty:#D6DFEF;
    --ring-track:#D3DFF7; --ring-fill:#2563EB; --ring-dot:#1D4ED8;
    --progress-fill:#2563EB; --progress-track:#D6DFEF;
    --glow-1:rgba(37,99,235,.16); --glow-2:rgba(124,58,237,.08);
    --shadow-card:0 1px 2px rgba(13,27,56,.05), 0 6px 16px -8px rgba(13,27,56,.12);
    --shadow-card-hover:0 10px 26px -10px rgba(13,27,56,.22);
    --shadow-float:0 4px 14px rgba(13,27,56,.20); --shadow-modal:0 14px 40px rgba(13,27,56,.28);
    --shadow-btn:none; --shadow-btn-hover:none;
    --shadow-column:0 0 70px -30px rgba(13,27,56,.35);
  }

  /* ---------- Base ---------- */
  *{box-sizing:border-box}
  html,body{height:100%;}
  body{margin:0; background:var(--bg-base); font-family:var(--font); color:var(--text-primary); overscroll-behavior:none; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;}
  #root{min-height:100%;}
  h1,h2{ text-wrap:balance; }
  h1{ letter-spacing:-.015em; }
  .device-wrap{width:100%; min-height:100dvh; background:var(--bg-base); display:flex; justify-content:center;}
  .device{position:relative; width:var(--app-width); max-width:100%; min-height:100dvh; background:var(--bg-base); overflow-x:hidden; overflow-x:clip;   /* clip não cria contêiner de rolagem: mantém position:sticky funcionando */ padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));}
  @media (max-width:430px){
    .device-wrap{ padding-top:env(safe-area-inset-top,0px); }
  }
  @media (min-width:431px){
    .device-wrap{ background:var(--bg-outer); }
    .device{ border-left:1px solid var(--border); border-right:1px solid var(--border); box-shadow:var(--shadow-column); }
  }
  ::-webkit-scrollbar{width:0;height:0;}
  .carousel-x{ -webkit-overflow-scrolling:touch; scrollbar-width:none; -ms-overflow-style:none; }
  .carousel-x::-webkit-scrollbar{ display:none; height:0; }
  .tnum{ font-variant-numeric:tabular-nums; }
  /* ---------- Tipografia v2 (estilos do DS no Figma) ----------
     Inter = interface e elementos funcionais · Literata = experiências editoriais e de leitura (E1). O timer fica em Inter (E2). */
  .sf-h-large{ font-size:28px; line-height:34px; font-weight:700; letter-spacing:-.015em; }
  .sf-h-screen{ font-size:22px; line-height:28px; font-weight:700; letter-spacing:-.01em; }
  .sf-ed{ font-family:var(--font-editorial); font-optical-sizing:auto; }
  .sf-ed-display{ font-family:var(--font-editorial); font-size:30px; line-height:36px; font-weight:600; letter-spacing:-.005em; }
  .sf-ed-title{ font-family:var(--font-editorial); font-size:24px; line-height:30px; font-weight:600; }
  .sf-ed-content{ font-family:var(--font-editorial); font-size:17px; line-height:24px; font-weight:500; }
  .sf-ed-reading{ font-family:var(--font-editorial); font-size:17px; line-height:28px; font-weight:400; max-width:68ch; }
  .sf-ed-lead{ font-family:var(--font-editorial); font-size:17px; line-height:26px; font-weight:400; font-style:italic; }
  .sf-ed-question{ font-family:var(--font-editorial); font-size:20px; line-height:28px; font-weight:500; }
  .sf-ed-stat{ font-family:var(--font-editorial); font-size:26px; line-height:30px; font-weight:600; font-variant-numeric:lining-nums tabular-nums; }
  .sf-ed-number{ font-family:var(--font-editorial); font-size:44px; line-height:48px; font-weight:600; font-variant-numeric:lining-nums tabular-nums; }
  @media (max-width:359px){ .sf-ed-display{ font-size:26px; line-height:32px; } .sf-ed-number{ font-size:38px; line-height:42px; } }
  button:disabled{ cursor:not-allowed; }

  /* Acessibilidade: foco visível em qualquer controle (inclusive os que removem o outline padrão) */
  :focus-visible{ outline:2px solid var(--focus) !important; outline-offset:2px; }
  input:focus-visible, textarea:focus-visible{ outline-offset:0; }
  .sr-only-live{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .sf-skip{ position:absolute; left:12px; top:-60px; z-index:100; background:var(--blue-500); color:#fff; padding:10px 14px; border-radius:12px; font-size:14px; font-weight:600; text-decoration:none; }
  .sf-skip:focus{ top:12px; }
  /* Alternativas de múltipla escolha: o rádio nativo fica oculto; o foco aparece no rótulo */
  .sf-radio input{ position:absolute; opacity:0; width:1px; height:1px; margin:0; }
  .sf-radio:has(input:focus-visible){ outline:2px solid var(--focus); outline-offset:2px; }
  main:focus{ outline:none; }

  /* Troca de tema: transição discreta, só enquanto a classe existe (nunca no carregamento) */
  .sf-theme-anim, .sf-theme-anim *:not(.sf-brand-letter):not(.sf-reveal):not(.sf-brand-rule), .sf-theme-anim *:not(.sf-brand-letter):not(.sf-reveal):not(.sf-brand-rule)::before, .sf-theme-anim *:not(.sf-brand-letter):not(.sf-reveal):not(.sf-brand-rule)::after{
    transition:background-color .3s var(--ease-in-out), border-color .3s var(--ease-in-out), color .3s var(--ease-in-out),
               fill .3s var(--ease-in-out), stroke .3s var(--ease-in-out), box-shadow .3s var(--ease-in-out) !important; }

  /* ---------- Botão flutuante de ação (acima da barra de abas, alinhado à coluna do app) ---------- */
  .sf-fab{ position:fixed; z-index:20; width:48px; height:48px; border-radius:9999px; border:0; color:#fff;
    background:var(--blue-500); box-shadow:var(--shadow-float), var(--shadow-btn); display:flex; align-items:center; justify-content:center;
    bottom:calc(var(--tabbar-h) + 20px + env(safe-area-inset-bottom,0px));
    right:max(16px, calc(50% - (var(--app-width) / 2) + 20px));
    transition:transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); }
  @media (hover:hover){ .sf-fab:hover{ background:var(--btn-primary-hover); transform:translateY(-2px); } }
  .sf-fab:active{ background:var(--btn-primary-active); transform:scale(.94); }

  /* ---------- Botões ---------- */
  .sf-btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; position:relative;
    border:1px solid transparent; border-radius:var(--radius-md); font-family:inherit; font-weight:600; line-height:1.2; letter-spacing:-.005em;
    cursor:pointer; text-decoration:none; -webkit-user-select:none; user-select:none; touch-action:manipulation;
    transition:background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out),
               box-shadow var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out); }
  .sf-btn:active:not(:disabled){ transform:scale(.985); }
  .sf-btn:disabled, .sf-btn[aria-disabled="true"]{ opacity:.5; cursor:not-allowed; box-shadow:none; }
  .sf-btn-primary{ background:var(--blue-500); color:var(--on-brand); box-shadow:var(--shadow-btn); }
  .sf-btn-primary:active:not(:disabled){ background:var(--btn-primary-active); box-shadow:none; }
  .sf-btn-secondary{ background:var(--bg-elevated); color:var(--text-primary); border-color:var(--border); }
  .sf-btn-secondary:active:not(:disabled){ background:var(--bg-overlay); }
  .sf-btn-tonal{ background:var(--brand-tint); color:var(--blue-300); border-color:var(--brand-border); }
  .sf-btn-tonal:active:not(:disabled){ background:var(--brand-tint-strong); }
  .sf-btn-ghost{ background:transparent; color:var(--text-primary); font-weight:500; }
  .sf-btn-ghost:active:not(:disabled){ background:var(--bg-elevated); }
  .sf-btn-outline-danger{ background:transparent; color:var(--error); border-color:var(--error-outline); }
  .sf-btn-outline-danger:active:not(:disabled){ background:var(--error-tint); }
  .sf-btn-danger{ background:var(--error-solid); color:#fff; }
  .sf-btn-danger:active:not(:disabled){ background:#B91C1C; }
  @media (hover:hover){
    .sf-btn-primary:hover:not(:disabled){ background:var(--btn-primary-hover); box-shadow:var(--shadow-btn-hover); transform:translateY(-1px); }
    .sf-btn-primary:hover:not(:disabled):active{ transform:scale(.985); }
    .sf-btn-secondary:hover:not(:disabled){ background:var(--bg-overlay); border-color:var(--border-strong); }
    .sf-btn-tonal:hover:not(:disabled){ background:var(--brand-tint-2); border-color:var(--brand-border-strong); }
    .sf-btn-ghost:hover:not(:disabled){ background:var(--bg-elevated); color:var(--text-primary); }
    .sf-btn-outline-danger:hover:not(:disabled){ background:var(--error-tint); }
    .sf-btn-danger:hover:not(:disabled){ background:#B91C1C; }
  }
  /* carregando: o rótulo some, um spinner aparece e o clique é ignorado */
  .sf-btn.is-loading{ color:transparent !important; pointer-events:none; }
  .sf-btn.is-loading::after{ content:''; position:absolute; width:16px; height:16px; border-radius:50%; border:2px solid var(--on-brand); border-top-color:transparent; animation:sfspin .8s linear infinite; }
  .sf-icon-btn{ display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; flex:none; border-radius:var(--radius-pill);
    background:var(--bg-surface); border:1px solid var(--field-border); color:var(--text-secondary); cursor:pointer; touch-action:manipulation;
    transition:background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out); }
  @media (hover:hover){ .sf-icon-btn:hover{ color:var(--text-primary); border-color:var(--border-strong); background:var(--bg-elevated); } }
  .sf-icon-btn:active{ transform:scale(.93); }

  /* ---------- Campos ---------- */
  .sf-input{ background:var(--bg-inset); color:var(--text-primary); border:1px solid var(--field-border); border-radius:var(--radius-md); outline:none; font-family:inherit;
    transition:border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-base) var(--ease-out), background-color var(--dur-fast) var(--ease-out); }
  .sf-input::placeholder{ color:var(--text-tertiary); opacity:1; }
  @media (hover:hover){ .sf-input:hover:not(:focus):not(:disabled):not([aria-invalid="true"]){ border-color:var(--field-border-hover); } }
  .sf-input:focus{ border-color:var(--blue-500); box-shadow:0 0 0 3px var(--brand-tint); }
  .sf-input[aria-invalid="true"]{ border-color:var(--error); box-shadow:0 0 0 3px var(--error-tint); }
  .sf-input:disabled, .sf-input[readonly]{ opacity:.75; }

  /* campo composto (ícone + input): o contorno acompanha o foco do input interno */
  .sf-fieldbox{ background:var(--bg-surface); border:1px solid var(--field-border); transition:border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-base) var(--ease-out); }
  @media (hover:hover){ .sf-fieldbox:hover:not(:focus-within){ border-color:var(--field-border-hover); } }
  .sf-fieldbox:focus-within{ border-color:var(--blue-500); box-shadow:0 0 0 3px var(--brand-tint); }

  /* ---------- Cards e listas ---------- */
  .sf-card{ background:var(--bg-surface); border:1px solid var(--border); box-shadow:var(--shadow-card); }
  .sf-card-hl{ background:var(--card-bg); border:1px solid var(--brand-border); box-shadow:var(--shadow-card); }

  try{
    const base64Url = token.split('.')[1];

   `sf_theme` guarda a escolha ('light' | 'dark' | 'system'). O script do <head> aplica o tema antes da primeira

  try{ return window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
  catch(e){ return 'dark'; }

  const resolved = pref === 'system' ? systemTheme() : pref;

    root.classList.add('sf-theme-anim');

function applySubjectsStore(store){
  const emojis = (store && store.emojis) || {};
  const custom = (store && store.custom) || {};
  Object.keys(SUBJECTS).forEach(k=>{ if(!(k in BUILTIN_SUBJECTS)) delete SUBJECTS[k]; });
  Object.keys(BUILTIN_SUBJECTS).forEach(k=>{ SUBJECTS[k].emoji = emojis[k] || BUILTIN_SUBJECTS[k]; });
  Object.keys(custom).forEach(id=>{
    const c = custom[id];
    SUBJECTS[id] = {name:String(c.name||'').toUpperCase(), accent:c.accent, border:`${c.accent}66`, tagBg:'var(--tag-bg)', emoji: emojis[id] || DEFAULT_EMOJI};
  });
}
function subjectEmoji(id){ return (SUBJECTS[id] && SUBJECTS[id].emoji) || DEFAULT_EMOJI; }
/* Lê um token de cor (#RRGGBB) do tema ativo; usado onde é preciso calcular contraste em JS. */
const __tokCache = {};
function tokenColor(name, fallback){
  const key = (document.documentElement.getAttribute('data-theme') || 'dark') + name;
  if(!(key in __tokCache)){
    let v = '';
    try{ v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }catch(e){}
    __tokCache[key] = /^#[0-9a-f]{6}$/i.test(v) ? v : fallback;
  }
  return __tokCache[key];
}
/* Cor de destaque da matéria; ajustada (clareada no escuro, escurecida no claro) para ter ≥3:1 sobre os cards do tema atual. */
function subjectAccent(id){
  const a = SUBJECTS[id] && SUBJECTS[id].accent;
  if(!/^#[0-9a-f]{6}$/i.test(a || '')) return tokenColor('--blue-300', 'var(--blue-300)');
  return readableOn(a, tokenColor('--bg-surface', 'var(--bg-surface)'), 3);
}
function hexLum(h){
  const c = [1,3,5].map(i => parseInt(h.slice(i, i+2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function contrastRatio(a, b){ const la = hexLum(a), lb = hexLum(b); return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05); }
function mixHex(a, b, t){
  const pa = [1,3,5].map(k => parseInt(a.slice(k, k+2), 16)), pb = [1,3,5].map(k => parseInt(b.slice(k, k+2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
/* Clareia (fundo escuro) ou escurece (fundo claro) a cor até atingir o contraste mínimo sobre o fundo. */
function readableOn(hex, bg, min = 4.5){
  if(!/^#[0-9a-f]{6}$/i.test(hex || '')) return tokenColor('--blue-300', 'var(--blue-300)');
  const base = bg || tokenColor('--tag-bg', 'var(--bg-overlay)');
  const toward = hexLum(base) > 0.4 ? '#000000' : '#FFFFFF';
  let c = hex;
  for(let i = 0; i < 12 && contrastRatio(c, base) < min; i++) c = mixHex(c, toward, 0.12);
  return c;
}
/* Cor de texto (quase preto ou branco) com mais contraste sobre um preenchimento de cor livre. */
function inkOn(hex){ return contrastRatio('#0A0D14', hex) >= contrastRatio('#FFFFFF', hex) ? '#0A0D14' : '#FFFFFF'; }
function subjName(id){ const n = SUBJECTS[id] && SUBJECTS[id].name; return n ? n.charAt(0)+n.slice(1).toLowerCase() : 'Geral'; }

const MONTHS_LONG = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MONTHS_SHORT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const WEEKDAYS_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const pad2 = n => String(n).padStart(2,'0');
function toDateStr(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function parseDateStr(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function todayStr(){ return toDateStr(new Date()); }
function addDaysStr(s, n){ const d = parseDateStr(s); d.setDate(d.getDate()+n); return toDateStr(d); }
function startOfTodayTs(){ const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); }
function startOfWeekTs(){
  const d = new Date(); d.setHours(0,0,0,0);
  const day = d.getDay();
  const diff = (day + 6) % 7;
  d.setDate(d.getDate() - diff);
  return d.getTime();
}
function fmtShortDay(ds){ const d = parseDateStr(ds); return `${WEEKDAYS_SHORT[d.getDay()]}, ${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`; }
function capitalize(str){ return str ? str.charAt(0).toUpperCase()+str.slice(1) : str; }
function sessionWhen(s){
  const ts = s.endedAt || s.startedAt || s.dateTs;
  if(!ts) return s.when || '';
  const d = new Date(ts); d.setHours(0,0,0,0);
  const days = Math.round((startOfTodayTs() - d.getTime())/86400000);
  return days<=0 ? 'hoje' : (days===1 ? 'ontem' : `há ${days} dias`);
}

/* ---------- Ofensiva ---------- */
function computeStreak(activeDates){
  if(!Array.isArray(activeDates) || activeDates.length === 0) return 0;
  const today = todayStr();
  const yesterday = addDaysStr(today, -1);
  const set = new Set(activeDates);
  if(!set.has(today) && !set.has(yesterday)) return 0;
  let cursor = set.has(today) ? today : yesterday;
  let streak = 0;
  while(set.has(cursor)){
    streak++;
    cursor = addDaysStr(cursor, -1);
  }
  return streak;
}

const API_BASE_URL = (typeof window !== 'undefined' && (window.STUDY_API_URL || window.STUDYFLOW_API_URL)) || 'https://studyapp-kyi5.onrender.com';
const API_TIMEOUT_MS = { search: 12000, ai: 45000 };

class ApiError extends Error{
  constructor(kind, message){ super(message); this.name = 'ApiError'; this.kind = kind; } // network | timeout | http | parse
}

/* Requisição JSON com tempo limite: nenhuma tela fica "carregando" para sempre se o servidor travar. */
async function apiRequest(url, { method='GET', params, body, timeoutMs=API_TIMEOUT_MS.search } = {}){
  const qs = params ? '?' + new URLSearchParams(params).toString() : '';
  const ctrl = new AbortController();
  let timedOut = false;
  const timer = setTimeout(()=>{ timedOut = true; ctrl.abort(); }, timeoutMs);
  try{
    const init = { method, signal: ctrl.signal, headers: { 'Accept': 'application/json' } };
    if(body !== undefined){ init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
    let res;
    try{ res = await fetch(url + qs, init); }
    catch(e){ throw new ApiError(timedOut ? 'timeout' : 'network', timedOut ? 'Tempo esgotado' : 'Sem conexão com o servidor'); }
    if(!res.ok) throw new ApiError('http', `HTTP ${res.status}`);
    try{ return await res.json(); }
    catch(e){ throw new ApiError(timedOut ? 'timeout' : 'parse', 'Resposta inválida do servidor'); }
  } finally { clearTimeout(timer); }
}

/* status: ok | empty (busca válida sem resultados) | error (falha de conexão/servidor) */
async function searchYouTubeVideosDetailed(query){
  if(!YOUTUBE_CONFIG.enabled || !YOUTUBE_CONFIG.proxyUrl) return { status:'error', videos:[], reason:'disabled' };
  const q = String(query || '').trim();
  if(q.length < YOUTUBE_CONFIG.minQueryLength) return { status:'empty', videos:[] };
  try{
    const data = await apiRequest(YOUTUBE_CONFIG.proxyUrl, { params: { q } });
    const items = Array.isArray(data && data.videos) ? data.videos : [];
    const videos = items.map(normalizeYouTubeItem).filter(Boolean);
    return { status: videos.length ? 'ok' : 'empty', videos };
  }catch(error){
    console.warn('[YouTube] Erro ao buscar vídeos:', error);
    return { status:'error', videos:[], reason: error.kind || 'network' };
  }
}

function mapJourneyTypeToFrontend(apiType){
  if(apiType === 'assessment') return MODULE_TYPES.QUIZ;
  if(apiType === 'practice')   return MODULE_TYPES.FLASHCARDS;
  if(apiType === 'flashcards') return MODULE_TYPES.FLASHCARDS;
  if(apiType === 'reading')    return MODULE_TYPES.READING;
  if(apiType === 'video')      return MODULE_TYPES.VIDEO;
  return MODULE_TYPES.READING;
}

function validateJourney(data){
  if(!data || !Array.isArray(data.modules) || data.modules.length < 3) return null;
  const modules = data.modules;

  const last = modules[modules.length - 1];
  const penult = modules[modules.length - 2];

  if(!last || last.type !== 'assessment') return null;
  if(!penult || (penult.type !== 'flashcards' && penult.type !== 'practice')) return null;

  for(let i = 0; i < modules.length - 2; i++){
    const t = modules[i].type;
    if(t !== 'video' && t !== 'reading') return null;
  }

  return {
    title: data.title || '',
    summary: data.summary || '',
    modules: modules.map((m, i) => ({
      id: m.id || `modulo-${i+1}`,
      title: m.title || `Módulo ${i+1}`,
      type: m.type || 'reading',
      topics: Array.isArray(m.topics) ? m.topics.filter(Boolean) : [],
      learningObjective: m.learningObjective || '',
    })),
    generatedAt: Date.now(),
  };
}

function journeyToTopics(journey){
  if(!journey || !Array.isArray(journey.modules)) return [];
  return journey.modules.map(m => ({
    t: m.title,
    type: mapJourneyTypeToFrontend(m.type),
    done: false,
    objective: m.learningObjective || '',
    subtopics: m.topics || [],
  }));
}

async function fetchLearningJourney({ title, subject, level='iniciante', goal='Dominar o assunto', language='pt-BR' }){
  if(!LEARNING_JOURNEY_CONFIG.enabled || !LEARNING_JOURNEY_CONFIG.endpoint) return null;
  const q = String(title || '').trim();
  if(q.length < 2) return null;
  try{
    const data = await apiRequest(LEARNING_JOURNEY_CONFIG.endpoint, {
      method: 'POST', timeoutMs: API_TIMEOUT_MS.ai,
      body: { title: q, subject: subject || '', level, goal, language },
    });
    return validateJourney(data);
  }catch(error){
    console.warn('[Learning Journey] Erro ao gerar jornada:', error);
    return null;
  }
}

async function fetchQuiz({ contentId, title, subject, moduleTitle, learningObjective }){
  if(!GEMINI_PROXY_CONFIG.enabled || !GEMINI_PROXY_CONFIG.quizUrl) return null;
  try{
    const data = await apiRequest(GEMINI_PROXY_CONFIG.quizUrl, { timeoutMs: API_TIMEOUT_MS.ai, params: {
      contentId: contentId || '', title: title || '', subject: subject || '',
      module: moduleTitle || '', objective: learningObjective || '',
    }});
    const questions = Array.isArray(data && data.questions) ? data.questions : [];

    // Exige exatamente 10 questões para a nota bater certinho
    if(questions.length !== 10) return null;

    const valid = questions.every(q =>
      q && typeof q.q === 'string' &&
      Array.isArray(q.options) && q.options.length >= 2 &&
      q.options.every(o => o && typeof o.l === 'string') &&
      // Exige exatamente 1 alternativa correta por questão
      q.options.filter(o => o.correct === true).length === 1
    );
    if(!valid) return null;
    return questions;
  }catch(error){
    console.warn('[Quiz] Erro ao buscar questões:', error);
    return null;
  }
}

async function fetchFlashcards({ contentId, title, subject, moduleTitle }){
  if(!GEMINI_PROXY_CONFIG.enabled || !GEMINI_PROXY_CONFIG.flashcardsUrl) return null;

    const data = await apiRequest(GEMINI_PROXY_CONFIG.flashcardsUrl, { timeoutMs: API_TIMEOUT_MS.ai, params: {
      contentId: contentId || '', title: title || '', subject: subject || '', module: moduleTitle || '',
    }});

    if(cards.length === 0) return null;
    const valid = cards.every(c => c && typeof c.front === 'string' && typeof c.back === 'string');

  const endingRef = useRef(false);

  useEffect(()=> contentsRepo.save(contents), [contents]);
  useEffect(()=> saveLS('sf_live_sessions', liveSessions), [liveSessions]);
  useEffect(()=> saveLS('sf_active_session', session), [session]);
  useEffect(()=> saveLS('sf_last_watched_video', lastWatchedVideo), [lastWatchedVideo]);
  useEffect(()=> saveLS('sf_last_content', lastContentId), [lastContentId]);
  useEffect(()=> saveLS('sf_tasks', tasks), [tasks]);
  useEffect(()=> saveLS('sf_planner', planner), [planner]);
  useEffect(()=> saveLS('sf_timer_pos', timerPos), [timerPos]);
  useEffect(()=> saveLS('sf_subjects', subjectsStore), [subjectsStore]);
  useEffect(()=> saveLS('sf_learning_progress', learningProgress), [learningProgress]);
  useEffect(()=> saveLS('sf_settings', settings), [settings]);

  useEffect(()=>{
    if(!session || session.status !== 'running') return;
    let last = getElapsedSec(session);
    const id = setInterval(()=>{
      const cur = getElapsedSec(session);
      if(cur !== last){ last = cur; setTick(t=>t+1); }
    }, 250);
    return ()=> clearInterval(id);
  }, [session]);
  const elapsedSec = getElapsedSec(session);

  /* Ofensiva = dias consecutivos com ao menos uma sessão de estudo registrada (abrir o app não conta). */
  const studyDates = useMemo(()=>{
    const set = new Set();
    liveSessions.forEach(s => { const ts = s.startedAt || s.dateTs; if(ts) set.add(toDateStr(new Date(ts))); });
    return Array.from(set);
  }, [liveSessions]);
  const streak = useMemo(()=> computeStreak(studyDates), [studyDates]);

  const todayStats = useMemo(()=>{
    const start = startOfTodayTs();
    const todaySessions = liveSessions.filter(s => {
      const ts = s.startedAt || s.dateTs || 0;
      return ts >= start;
    });
    const min = todaySessions.reduce((a,s)=> a + (s.durationMin||0), 0);
    return {
      studiedLabel: minutesToLabel(min),
      studiedMin: min,
      sessionsCount: todaySessions.length,
      streak,
    };
  },[liveSessions, streak]);

  const globalStats = useMemo(()=>{
    const totalMin = liveSessions.reduce((a,s)=> a + (s.durationMin||0), 0);
    const weekStart = startOfWeekTs();
    const weekMin = liveSessions.filter(s => (s.startedAt || s.dateTs || 0) >= weekStart)
      .reduce((a,s)=> a + (s.durationMin||0), 0);
    return { totalMin, totalSessions: liveSessions.length, weekMin };
  },[liveSessions]);

  const generateJourneyFor = (contentId, source)=>{
    const c = source || contents.find(x => x.id === contentId);
    if(!c) return;
    setContents(prev => prev.map(x => x.id === contentId ? { ...x, journeyStatus: 'loading' } : x));
    fetchLearningJourney({
      title: c.title,
      subject: subjName(c.subjectId),
    }).then(journey => {
      setContents(prev => prev.map(x => {
        if(x.id !== contentId) return x;
        if(!journey){
          return { ...x, journeyStatus: 'error' };
        }
        return {
          ...x,
          journey,
          journeyStatus: 'ready',
          topics: journeyToTopics(journey),
          progressPct: 0,
        };
      }));
    });
  };

  const regenerateJourney = (contentId)=> generateJourneyFor(contentId);

  const addUserSubject = (source)=>{
    if(!source || !source.id) return null;
    if(contents.some(c => c.id === source.id)) return source.id;

    const newContent = createUserContent(source);
    newContent.journey = null;
    newContent.journeyStatus = 'loading';

    setContents(prev => prev.some(c => c.id === source.id) ? prev : [...prev, newContent]);

    fetchLearningJourney({
      title: source.title,
      subject: subjName(source.subjectId),
    }).then(journey => {
      setContents(prev => prev.map(x => {
        if(x.id !== source.id) return x;
        if(!journey){
          return { ...x, journeyStatus: 'error', journey: null };
        }
        return {
          ...x,
          journey,
          journeyStatus: 'ready',
          topics: journeyToTopics(journey),
          progressPct: 0,
        };
      }));
    });

    return source.id;
  };
  const isUserSubject = (id)=> contents.some(c => c.id === id);

  const openDetalhe = (contentId)=>{
    const c = contents.find(x=>x.id===contentId);
    setLastContentId(contentId);
    goToView({name:'detalhe', contentId});
    if(c && !c.journey && c.journeyStatus !== 'loading' && c.journeyStatus !== 'ready'){
      generateJourneyFor(contentId, c);
    }
  };
  const openPreSessao = (contentId)=> pushView({name:'presessao', contentId});
  const openYouTubeVideo = (video, _backTo, context)=>{
    if(!video || !isValidYouTubeId(video.id)) return;
    setLastWatchedVideo({
      id: video.id, title: video.title || '', channel: video.channel || '',
      thumbnail: safeImageUrl(video.thumbnail), description: video.description || '',
      subjectId: (context && context.subjectId) || null,
      topic: (context && context.topic) || null, watchedAt: Date.now(),
    });
    const v = {name:'youtube-video', video, context: context || null};
    // trocar de um vídeo para outro substitui a tela, em vez de empilhar vários players
    setNav(n => n.view && n.view.name === 'youtube-video'
      ? {...n, view: v}
      : {stack: n.view ? [...n.stack, n.view] : n.stack, view: v});
  };
  const openModule = (contentId, topicIndex)=>{
    const c = contents.find(x=>x.id===contentId);
    if(!c) return;
    setLastContentId(contentId);
    /* D2: abrir um módulo é só ACESSO ao conteúdo. O tempo de foco só começa em "Começar foco". */
    pushView({name:'module', contentId, topicIndex});
  };
  const openCalendario = (dateStr)=> pushView({name:'calendario', date: typeof dateStr === 'string' ? dateStr : null});

  const completeTopic = (contentId, topicIndex)=>{
    const c = contents.find(x=>x.id===contentId);
    const st = c ? getTopicStatus(c, topicIndex) : null;
    if(!st || st === TOPIC_STATUS.COMPLETED) return false;
    if(getTopicType(c, topicIndex) === MODULE_TYPES.QUIZ) return false;
    setContents(prev => applyTopicCompletion(prev, contentId, topicIndex));
    return true;
  };
  const completeModule = (contentId, topicIndex)=> completeTopic(contentId, topicIndex);

  const submitModuleQuiz = (contentId, topicIndex, score)=>{
    const passed = score >= MODULE_PASSING_SCORE;
    setLearningProgress(prev=>{
      const cid = prev[contentId] || {};
      const tp = cid[topicIndex] || { attempts:0, lastScore:null, bestScore:null, passed:false };
      return {
        ...prev,
        [contentId]: {
          ...cid,
          [topicIndex]: {
            ...tp,
            attempts: tp.attempts + 1,
            lastScore: score,
            bestScore: tp.bestScore == null ? score : Math.max(tp.bestScore, score),
            lastAt: Date.now(),
            passed: passed || tp.passed,
          },
        },
      };
    });
    if(passed){
      setContents(prev => applyTopicCompletion(prev, contentId, topicIndex));
    }
    return passed;
  };

  const getModuleProgress = (contentId, topicIndex)=>{
    const c = learningProgress[contentId];
    if(!c) return null;
    return c[topicIndex] || null;
  };

  const openJornada = (contentId)=> pushView({name:'jornada', contentId: typeof contentId === 'string' ? contentId : null});
  const openConfiguracoes = ()=> pushView({name:'configuracoes'});
  const openTarefas = ()=> pushView({name:'tarefas'});
  const openCriarConteudo = ()=> pushView({name:'criar-conteudo'});
  const openMaterias = ()=> pushView({name:'materias'});

  /* Meta única: a meta de toda sessão é settings.focusMin (Configurações). Ela é gravada na sessão ao começar,
     então mudar a configuração depois não altera uma sessão em andamento.
     opts.stay = começa onde a pessoa está (barra de sessão dentro do módulo), sem navegar. */
  const startSession = (contentId, opts)=>{
    if(session){ setTimerExpanded(true); return; }
    const c = contents.find(x=>x.id===contentId);
    setSession({contentId, subjectId: c ? c.subjectId : null, title: c ? c.title : '', plannerId:null,
      plannedMin: settings.focusMin, startTs:Date.now(), pausedAccumMs:0, pausedAt:null, status:'running'});
    if(!(opts && opts.stay)) goToView({name:'detalhe', contentId});
  };
  const startPlannerSession = (itemId)=>{
    if(session){ setTimerExpanded(true); return; }
    const it = planner.find(p=>p.id===itemId);
    if(!it) return;
    const related = contents.filter(c=>c.subjectId===it.subjectId);
    const content = related.find(c=>c.progressPct<100) || related[0] || null;
    setSession({contentId: content ? content.id : null, subjectId: it.subjectId, title: it.title, plannerId: it.id,
      plannedMin: settings.focusMin, startTs:Date.now(), pausedAccumMs:0, pausedAt:null, status:'running'});
    setTimerExpanded(true);
  };
  const pauseSession = (reason)=> setSession(s=> (s && s.status!=='paused') ? ({...s, status:'paused', pausedAt:Date.now(), pauseReason: reason === 'away' ? 'away' : 'manual'}) : s);
  const resumeSession = ()=> setSession(s=>{
    if(!s) return s;
    const extra = s.pausedAt ? Date.now()-s.pausedAt : 0;
    return {...s, status:'running', pausedAccumMs:s.pausedAccumMs+extra, pausedAt:null, pauseReason:null};
  });
  /* D2: o tempo registrado representa atividade real. Se o STUDY vai para segundo plano (outra aba, app minimizado,
     tela bloqueada), o foco pausa sozinho e espera a pessoa retomar. */
  useEffect(()=>{
    const onVis = ()=>{ if(document.visibilityState === 'hidden') pauseSession('away'); };
    /* ao fechar a aba, grava a pausa direto no armazenamento (o efeito do React pode não rodar a tempo) */
    const onHide = ()=>{
      try{
        const s = JSON.parse(localStorage.getItem('sf_active_session') || 'null');
        if(s && s.status === 'running') localStorage.setItem('sf_active_session', JSON.stringify({...s, status:'paused', pausedAt:Date.now(), pauseReason:'away'}));
      }catch(e){}
    };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('pagehide', onHide);
    return ()=>{ document.removeEventListener('visibilitychange', onVis); window.removeEventListener('pagehide', onHide); };
  }, []);

  /* Encerra a sessão e registra o tempo estudado.
     opts.auto = encerramento automático ao atingir o tempo planejado: o tempo registrado nunca passa do planejado
     (ex.: aba fechada durante horas) e, se a pessoa está num módulo ou vídeo, a navegação não é interrompida. */
  const confirmEndSession = (opts)=>{
    if(!session || endingRef.current) return;
    endingRef.current = true;
    const auto = !!(opts && opts.auto);
    const rawSec = getElapsedSec(session);
    const maxSec = session.plannedMin * 60;
    const capped = auto && rawSec > maxSec + 60;
    const realSec = auto ? Math.min(rawSec, maxSec) : rawSec;
    const durationMin = Math.max(1, Math.round(realSec/60));
    const endedAt = auto ? session.startTs + (session.pausedAccumMs || 0) + realSec * 1000 : Date.now();
    const content = contents.find(c=>c.id===session.contentId);
    const subjectId = session.subjectId || (content && content.subjectId) || null;
    const title = session.title || (content && content.title) || '';

    let plannerInfo = null;
    const item = session.plannerId ? planner.find(p=>p.id===session.plannerId) : null;
    if(item){
      const refMin = item.duration || session.plannedMin;
      const studiedMin = (item.studiedMin||0) + durationMin;
      const done = !!item.done || studiedMin >= refMin*0.8;
      plannerInfo = {id:item.id, plannedMin:refMin, studiedMin, done};
      setPlanner(ps=> ps.map(p=> p.id===item.id ? {...p, studiedMin, done} : p));
    }

    const todayCount = liveSessions.filter(x => (x.startedAt || x.dateTs || 0) >= startOfTodayTs()).length;
    setLiveSessions(ls => [...ls, {
      id: 'live-'+endedAt, contentId: session.contentId||null, subjectId, title,
      plannerId: session.plannerId||null, plannedMin: session.plannedMin, durationMin,
      startedAt: session.startTs, endedAt, when: 'hoje', dateTs: session.startTs,
    }]);

    setCompletedSession({
      contentId: session.contentId || null, contentTitle: title, subjectId,
      plannedMin: session.plannedMin, realSec, realMin: durationMin,
      streak: computeStreak([...studyDates, toDateStr(new Date(session.startTs))]),
      sessionsToday: todayCount + 1, plannerInfo, capped,
    });
    setSession(null); setConfirmEnd(false); setTimerExpanded(false); setFullScreenFocus(false);
    const inFlow = !!view && (view.name === 'module' || view.name === 'youtube-video');
    if(!(auto && inFlow)) setNav({stack: [], view: {name:'concluida'}});
  };

  useEffect(()=>{
    if(!session){ endingRef.current = false; return; }
    if(session.status !== 'running') return;
    if(elapsedSec >= session.plannedMin * 60) confirmEndSession({auto:true});
  }, [elapsedSec, session]);

  const showCompletedSummary = ()=> setNav({stack: [], view: {name:'concluida'}});
  const dismissCompletedSession = ()=>{ setCompletedSession(null); resetNav(); setTab('home'); };

  const toggleTask = (id)=> setTasks(ts=> ts.map(t=> t.id===id ? {...t, done:!t.done} : t));
  const addTask = (title, subjectId)=> setTasks(ts=> [...ts, {id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), title, subjectId, done:false}]);
  const deleteTask = (id)=> setTasks(ts=> ts.filter(t=> t.id!==id));

  const savePlannerItem = (data)=>{
    if(data.id){ setPlanner(ps=> ps.map(p=> p.id===data.id ? {...p, ...data} : p)); return data.id; }
    const id = 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    setPlanner(ps=> [...ps, {studiedMin:0, done:false, ...data, id}]);
    return id;
  };
  const deletePlannerItem = (id)=> setPlanner(ps=> ps.filter(p=>p.id!==id));
  const togglePlannerDone = (id)=> setPlanner(ps=> ps.map(p=> p.id===id ? {...p, done:!p.done} : p));

  const saveSubject = ({id, name, emoji})=>{
    const finalId = id || ('m'+Date.now().toString(36));
    const prev = subjectsStore;
    const next = {emojis:{...prev.emojis, [finalId]: emoji || DEFAULT_EMOJI}, custom:{...prev.custom}};
    if(!(finalId in BUILTIN_SUBJECTS)){
      const old = prev.custom[finalId];
      const accent = old ? old.accent : CUSTOM_COLORS[Object.keys(prev.custom).length % CUSTOM_COLORS.length];
      next.custom[finalId] = {name: (name||'').trim().slice(0,40) || (old ? old.name : 'Nova matéria'), accent};
    }
    applySubjectsStore(next);
    setSubjectsStore(next);
    return finalId;
  };
  const openSubjectSheet = (opts)=> setSubjectSheet(opts || {});
  const closeSubjectSheet = ()=> setSubjectSheet(null);

  const setFocusMin = (min)=> setSettings(s => ({...s, focusMin: Math.min(120, Math.max(5, Math.round(min / 5) * 5))}));

  const value = {user, authUser, handleAuth, signOut,
    contents, setContents, liveSessions, tab, setTab, goTab,
    todayStats, globalStats, streak,
    view, setView: replaceView, closeView,
    openDetalhe, openPreSessao, openCalendario, openJornada, openConfiguracoes, openTarefas, openCriarConteudo, openMaterias,
    session, elapsedSec, startSession, startPlannerSession, pauseSession, resumeSession,
    timerExpanded, setTimerExpanded, timerPos, setTimerPos, confirmEnd, setConfirmEnd, fullScreenFocus, setFullScreenFocus, confirmEndSession,
    completedSession, dismissCompletedSession, showCompletedSummary, setCompletedSession,
    lastWatchedVideo, openYouTubeVideo,
    tasks, toggleTask, addTask, deleteTask,
    planner, savePlannerItem, deletePlannerItem, togglePlannerDone,
    subjectsStore, saveSubject, subjectSheet, openSubjectSheet, closeSubjectSheet,
    addUserSubject, isUserSubject, discoverableSubjects: CATALOG,
    completeTopic, completeModule, submitModuleQuiz, getModuleProgress, openModule, lastContentId, goToView,
    learningProgress, regenerateJourney,
    settings, setFocusMin};
  return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
}

function minutesToLabel(total){ const h = Math.floor(total/60), m = total%60; return h>0 ? `${h}h ${m}m` : `${m}m`; }
function getElapsedSec(session){
  if(!session) return 0;
  const now = Date.now();
  const pausedMs = session.pausedAccumMs + (session.status==='paused' && session.pausedAt ? (now - session.pausedAt) : 0);
  return Math.max(0, Math.floor((now - session.startTs - pausedMs)/1000));
}
function fmtMMSS(totalSec){ const m = Math.floor(totalSec/60), s = totalSec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function fmtDuration(sec){ const m = Math.floor(sec/60), s = Math.floor(sec%60); return `${m}:${String(s).padStart(2,'0')}`; }

/* ============================================================
   PROGRESSÃO DOS TÓPICOS
   ============================================================ */
/* C1 (v2): nenhum módulo fica bloqueado. AVAILABLE = próximo sugerido; PENDING = ainda não feito, também pode ser aberto.
   LOCKED fica só por compatibilidade e não é mais retornado. */
const TOPIC_STATUS = {COMPLETED:'completed', AVAILABLE:'available', PENDING:'pending', LOCKED:'locked'};
const MODULE_TYPES = { VIDEO:'video', READING:'reading', FLASHCARDS:'flashcards', QUIZ:'quiz' };
const MODULE_PASSING_SCORE = 7;

const MODULE_META = {
  video:      { label:'Videoaula',  Icon: IconVideo,     color:'var(--mod-video)' },
  reading:    { label:'Leitura',    Icon: IconNote,      color:'var(--mod-reading)' },
  flashcards: { label:'Prática',    Icon: IconCards,     color:'var(--mod-practice)' },
  quiz:       { label:'Avaliação',  Icon: IconClipboard, color:'var(--mod-quiz)' },
};

function getTopicType(content, topicIndex){
  const topic = content && content.topics ? content.topics[topicIndex] : null;
  if(!topic) return MODULE_TYPES.READING;
  if(topic.type && MODULE_META[topic.type]) return topic.type;
  const total = (content.topics || []).length;
  if(total === 1) return MODULE_TYPES.VIDEO;
  if(topicIndex === total - 1) return MODULE_TYPES.QUIZ;
  return topicIndex % 2 === 0 ? MODULE_TYPES.VIDEO : MODULE_TYPES.READING;
}

function getNextPendingTopicIndex(content){
  if(!content || !Array.isArray(content.topics)) return -1;
  return content.topics.findIndex(t=> !t.done);
}
function getNextPendingTopic(content){
  const i = getNextPendingTopicIndex(content);
  return i >= 0 ? content.topics[i] : null;
}
function getTopicStatus(content, topicIndex){
  const topic = content && content.topics ? content.topics[topicIndex] : null;
  if(!topic) return null;
  if(topic.done) return TOPIC_STATUS.COMPLETED;
  return topicIndex === getNextPendingTopicIndex(content) ? TOPIC_STATUS.AVAILABLE : TOPIC_STATUS.PENDING;
}
function getTopicStates(content){
  return ((content && content.topics) || []).map((_, i) => getTopicStatus(content, i));
}
function isTopicUnlocked(content, topicIndex){
  return !!getTopicStatus(content, topicIndex);
}
/* Progresso = módulos concluídos / total de módulos. É a única fonte de verdade do percentual. */
function topicsProgressPct(topics){
  const list = Array.isArray(topics) ? topics : [];
  return list.length ? Math.round(list.filter(t => t && t.done).length / list.length * 100) : 0;
}
/* Regra única do agregado (Início e Progresso): média simples do percentual dos conteúdos INICIADOS
   (≥ 1 módulo concluído). Conteúdos não iniciados não puxam a média para baixo. Ex.: 14%, 40% e 75% → 43%. */
function isContentStarted(c){ return ((c && c.topics) || []).some(t => t && t.done); }
function averageStartedPct(contents){
  const started = (contents || []).filter(isContentStarted);
  if(!started.length) return {pct: 0, count: 0};
  const sum = started.reduce((a, c) => a + topicsProgressPct(c.topics), 0);
  return {pct: Math.round(sum / started.length), count: started.length};
}
/* Estado de cada segmento da trilha: 'done' | 'current' | 'pending'. `currentIdx` padrão = próximo módulo pendente. */
function trailStates(content, currentIdx){
  const topics = (content && content.topics) || [];
  const cur = currentIdx == null ? getNextPendingTopicIndex(content) : currentIdx;
  return topics.map((t, i) => t && t.done ? 'done' : (i === cur ? 'current' : 'pending'));
}
function modulesLabel(content){
  const {total, completed} = getContentProgress(content);
  if(!total) return content && content.journeyStatus === 'loading' ? 'Montando a trilha…' : 'Trilha não disponível';
  if(completed === 0) return `Novo, ${total} ${total === 1 ? 'módulo' : 'módulos'}`;
  return `${completed} de ${total} ${total === 1 ? 'módulo' : 'módulos'}`;
}
function getContentProgress(content){
  const topics = (content && content.topics) || [];
  const completed = topics.filter(t => t.done).length;
  return {
    total: topics.length, completed,
    pct: topicsProgressPct(topics),
    nextIndex: getNextPendingTopicIndex(content),
    states: getTopicStates(content),
  };
}
function applyTopicCompletion(contents, contentId, topicIndex){
  const c = contents.find(x => x.id === contentId);
  const st = c ? getTopicStatus(c, topicIndex) : null;
  if(!st || st === TOPIC_STATUS.COMPLETED) return contents;
  return contents.map(x=>{
    if(x.id !== contentId) return x;
    const topics = x.topics.map((t, i) => i === topicIndex ? {...t, done: true, completedAt: Date.now()} : t);
    const {pct} = getContentProgress({...x, topics});
    return {...x, topics, progressPct: pct};
  });
}
function createUserContent(source){
  return {
    id: source.id,
    title: source.title,
    subjectId: source.subjectId,
    unitLabel: source.unitLabel || '0 flashcards',
    estMinutes: source.estMinutes || 15,
    progressPct: 0,
    desc: source.desc || '',
    keywords: source.keywords || [],
    topics: (source.topics || []).map(t => ({t: t.t, done: false, type: t.type})),
    journey: null,
    journeyStatus: null,
    addedAt: Date.now(),
  };
}
function orderContentsByActivity(contents){
  const stateOf = (c)=> c.progressPct >= 100 ? 2 : (c.progressPct > 0 ? 0 : 1);
  return contents.slice().sort((a,b)=>{
    const sa = stateOf(a), sb = stateOf(b);
    if(sa !== sb) return sa - sb;
    return b.progressPct - a.progressPct;
  });
}
function pickPriorityContent(contents){
  const ordered = orderContentsByActivity(contents);
  return ordered.find(c => getNextPendingTopic(c)) || ordered[0] || null;
}

/* ============================================================
   COMPONENTES COMPARTILHADOS (Design System)
   ============================================================ */
const INPUT_CLS = "sf-input w-full h-11 px-3 text-[16px]";

function BackButton({onClick, label='Voltar', ariaLabel}){
  return (
    <button type="button" onClick={onClick} aria-label={ariaLabel}
      className="sf-btn sf-btn-ghost -ml-2 px-2 min-h-[44px] text-[14px] flex items-center gap-1.5">
      <IconArrowL size={14}/> {label}
    </button>
  );
}

function ProgressBar({value, height=5, width, color='var(--blue-500)', label, className=''}){
  const pct = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
  return (
    <div role="progressbar" aria-valuenow={pct} aria-valuemin={0} aria-valuemax={100} aria-label={label}
      className={`rounded-full bg-sf-overlay ${width ? '' : 'w-full'} ${className}`} style={{height, width}}>
      <div className="rounded-full" style={{width:`${pct}%`, height, background: color}}/>
    </div>
  );
}

/* ---------- Componentes v2 (DS · Componentes no Figma) ---------- */
function SegmentedTrail({states, size='md', label, className=''}){
  const list = Array.isArray(states) ? states : [];
  if(!list.length) return null;

/* Diálogo acessível: role=dialog, Esc fecha, foco preso e restaurado, rolagem da página travada. */
const __modalStack = [];
function ModalShell({onClose, labelledBy, variant='sheet', z=50, children}){
  const panelRef = useRef(null);
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(()=>{
    const token = {};
    __modalStack.push(token);
    const prevFocus = document.activeElement;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const panel = panelRef.current;
    if(panel) panel.focus({preventScroll:true});
    const onKey = (e)=>{
      if(__modalStack[__modalStack.length - 1] !== token) return;
      if(e.key === 'Escape'){ e.preventDefault(); if(closeRef.current) closeRef.current(); return; }
      if(e.key === 'Tab' && panel){
        const f = Array.from(panel.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])'))
          .filter(el => el.offsetParent !== null);
        if(f.length === 0){ e.preventDefault(); panel.focus(); return; }
        const first = f[0], last = f[f.length - 1];
        if(e.shiftKey && (document.activeElement === first || document.activeElement === panel)){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', onKey);
    return ()=>{
      document.removeEventListener('keydown', onKey);
      const i = __modalStack.indexOf(token); if(i >= 0) __modalStack.splice(i, 1);
      document.body.style.overflow = prevOverflow;
      try{ if(prevFocus && prevFocus.focus) prevFocus.focus({preventScroll:true}); }catch(e){}
    };
  }, []);

  const isSheet = variant === 'sheet';
  const isFull = variant === 'full';
  return (
    <div className={`fixed inset-0 flex justify-center ${isSheet ? 'items-end' : (isFull ? 'items-stretch' : 'items-center')}`} style={{zIndex:z}}>
      <div className="absolute inset-0 bg-sf-scrim sf-scrim" onClick={isFull ? undefined : onClose} aria-hidden="true"/>
      <div ref={panelRef} role="dialog" aria-modal="true" aria-labelledby={labelledBy} tabIndex={-1}
        className={isSheet
          ? 'relative z-10 w-full max-w-[402px] rounded-t-[24px] bg-sf-surface p-5 sf-sheet'
          : (isFull
            ? 'relative z-10 w-full max-w-[402px] bg-sf-base overflow-y-auto'
            : 'relative z-10 w-[87%] max-w-[350px] rounded-[20px] p-5 bg-sf-surface border border-sf-border sf-dialog')}
        style={isSheet
          ? {maxHeight:'90dvh', overflowY:'auto', paddingBottom:'calc(28px + env(safe-area-inset-bottom,0px))', outline:'none', boxShadow:'var(--shadow-modal)'}
          : {outline:'none', boxShadow: isFull ? 'none' : 'var(--shadow-modal)'}}>
        {isSheet && <div className="w-10 h-1 rounded-full bg-sf-handle mx-auto mb-4" aria-hidden="true"/>}
        {children}
      </div>
    </div>
  );
}

        <circle cx="63" cy="63" r={r} fill="none" strokeWidth="9" strokeLinecap="round" style={{stroke:'var(--ring-fill)'}}
          strokeDasharray={`${dash} ${c}`} transform="rotate(-90 63 63)"/>
        <circle cx={dot.x} cy={dot.y} r="5.5" style={{fill:'var(--ring-dot)'}}/>
      </svg>
      <div className="absolute inset-0 flex flex-col items-center justify-center" aria-hidden="true">

  );

/* ============================================================
   TELA DE LOGIN
   A marca STUDY é digitada letra a letra, com ritmo natural, e em seguida
   dá lugar às boas-vindas e ao formulário. Regras:
   - toca uma única vez por carregamento da página (re-render, troca de tema e
     remontagem mostram o estado final, sem reiniciar);
   - nunca bloqueia: o formulário está montado e utilizável desde o primeiro quadro;
     qualquer toque, clique ou tecla conclui a sequência na hora;
   - com prefers-reduced-motion a apresentação é estática;
   - leitores de tela recebem apenas o título "STUDY" (as letras são decorativas).
   ============================================================ */
let __brandPlayed = false;
const BRAND_WORD = 'STUDY';
const BRAND_DELAYS = [380, 165, 140, 190, 150];   // ms antes de cada letra (ritmo irregular, porém determinístico)
const BRAND_HOLD = 480;                            // ms com o cursor parado antes de revelar o restante

function useBrandSequence(){
  const [instant] = useState(()=> __brandPlayed || prefersReducedMotion());
  const [typed, setTyped] = useState(instant ? BRAND_WORD.length : 0);
  const [done, setDone] = useState(instant);
  const [fast, setFast] = useState(instant);
  const timers = useRef([]);
  const doneRef = useRef(instant);
  const clear = ()=>{ timers.current.forEach(clearTimeout); timers.current = []; };
  const finish = useCallback(()=>{
    if(doneRef.current) return;
    doneRef.current = true; __brandPlayed = true;
    timers.current.forEach(clearTimeout); timers.current = [];
    setFast(true); setTyped(BRAND_WORD.length); setDone(true);
  }, []);
  useEffect(()=>{
    if(instant){ __brandPlayed = true; return; }
    let t = 0;
    BRAND_DELAYS.forEach((delay, i)=>{ t += delay; timers.current.push(setTimeout(()=> setTyped(i + 1), t)); });
    timers.current.push(setTimeout(()=>{ doneRef.current = true; __brandPlayed = true; setDone(true); }, t + BRAND_HOLD));
    /* qualquer toque, clique, tecla ou foco, em qualquer lugar da página, conclui a sequência na hora */
    const skip = ()=> finish();
    const evs = ['pointerdown', 'keydown', 'focusin'];
    evs.forEach(e => document.addEventListener(e, skip, true));
    return ()=>{ clear(); evs.forEach(e => document.removeEventListener(e, skip, true)); };
  }, []);
  return {typed, done, fast, instant, finish};
}

function TypedBrand({typed, done, caret}){
  return (
    <h1 className="sf-brand">
      <span className="sr-only">{BRAND_WORD}</span>
      <span className="inline-flex" aria-hidden="true">
        {BRAND_WORD.split('').map((ch, i)=>{
          const cur = caret && i === typed - 1;
          return <span key={i} className={`sf-brand-letter${i < typed ? ' is-on' : ''}${cur ? ' is-cur' : ''}${cur && done ? ' is-fading' : ''}`}>{ch}</span>;
        })}

  );
}

function LoginScreen({ onAuth }){
  const btnRef = useRef(null);
  const drawRef = useRef(null);
  const [status, setStatus] = useState('idle');
  const [localError, setLocalError] = useState('');
  const [gisReady, setGisReady] = useState(false);
  const {resolved} = useTheme();
  const themeRef = useRef(resolved);
  themeRef.current = resolved;
  const {typed, done, fast, instant, finish} = useBrandSequence();

  useEffect(() => {
    if(!GOOGLE_CLIENT_ID) return;
    let cancelled = false;
    let attempts = 0;
    let attachTimer = null;

    /* (re)desenha o botão do Google; o tema do botão acompanha o tema do app */
    const draw = () => {
      if(!btnRef.current || !window.google?.accounts?.id) return;
      const w = Math.max(200, Math.min(320, Math.floor(btnRef.current.clientWidth || 320)));
      window.google.accounts.id.renderButton(btnRef.current, {
        theme: themeRef.current === 'light' ? 'outline' : 'filled_black',
        size: 'large',
        text: 'continue_with',
        shape: 'rectangular',
        logo_alignment: 'left',
        width: w,
      });
      clearTimeout(attachTimer);
      attachTimer = setTimeout(() => {
        if(cancelled || !btnRef.current) return;
        const inner = btnRef.current.querySelector('div[role="button"]')
          || btnRef.current.querySelector('button');
        if(inner) inner.addEventListener('click', () => setStatus('loading'));
      }, 100);
    };
    drawRef.current = draw;

    const check = setInterval(() => {
      attempts++;
      if(cancelled){ clearInterval(check); return; }

      if(window.google?.accounts?.id){
        clearInterval(check);
        try{
          window.google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: (response) => {
              const payload = decodeJwt(response.credential);
              if(!payload){
                setStatus('error');
                setLocalError('Não foi possível ler a credencial do Google.');
                return;
              }
              onAuth({
                id: payload.sub,
                name: payload.name || (payload.email || '').split('@')[0] || 'Usuário',
                email: payload.email || '',
                picture: payload.picture || '',
                credential: response.credential,
                exp: payload.exp || (Math.floor(Date.now()/1000) + 3600),
              });
            },
            auto_select: false,
            cancel_on_tap_outside: true,
          });
          if(btnRef.current){
            draw();
            setGisReady(true);
          }
        }catch(e){
          setLocalError('Falha ao inicializar o Google Sign-In.');
        }
      } else if(attempts > 50){
        clearInterval(check);
        setLocalError('Não foi possível carregar o Google Sign-In. Verifique sua conexão.');
      }
    }, 100);

    return () => { cancelled = true; clearInterval(check); clearTimeout(attachTimer); drawRef.current = null; };
  }, []);

  /* tema trocado com o botão já na tela: redesenha o botão do Google na variante certa (sem recarregar nada) */
  const firstTheme = useRef(true);
  useEffect(()=>{
    if(firstTheme.current){ firstTheme.current = false; return; }
    if(drawRef.current) drawRef.current();
  }, [resolved]);

  /* se o popup do Google for fechado sem concluir, o aviso "Conectando..." não fica preso (só visual) */
  useEffect(()=>{
    if(status !== 'loading') return;
    const t = setTimeout(()=> setStatus('idle'), 30000);
    return ()=> clearTimeout(t);
  }, [status]);

  const setupRequired = !GOOGLE_CLIENT_ID && !DEV_MODE;
  const devBypass = DEV_MODE && !GOOGLE_CLIENT_ID;
  const on = done ? ' is-on' : '';

  return (
    <div className="device-wrap">
      <div className={`device sf-login flex flex-col${fast ? ' is-instant' : ''}`} style={{paddingBottom:0}}>

        <main className="flex-1 flex flex-col items-center justify-center px-6 pt-10 pb-6">

          <TypedBrand typed={typed} done={done} caret={!instant}/>
          <div className={`sf-brand-rule${on}`} aria-hidden="true"/>

          <div className={`sf-reveal text-center mt-7${on}`} style={{'--d':'0ms'}}>
            <h2 className="sf-ed-title text-sf-text">Bem-vindo</h2>
            <p className="text-[14px] leading-[20px] text-sf-muted mt-2 max-w-[300px] mx-auto">Sua trilha de estudo começa aqui.</p>
          </div>

          <div className={`sf-reveal mt-9 w-full max-w-[340px]${on}`} style={{'--d':'140ms'}}>

            {setupRequired && (
              <div className="rounded-2xl p-4" style={{background:'var(--warning-tint)', border:'1px solid var(--warning-border)'}}>
                <p className="text-[12px] text-sf-warning font-semibold">Configuração necessária</p>
                <p className="text-[11px] text-sf-muted mt-1 leading-relaxed">
                  Defina <code>GOOGLE_CLIENT_ID</code> no início do script com o ID criado no Google Cloud Console.
                </p>
              </div>
            )}

            {!setupRequired && (
              <div className="sf-card rounded-2xl p-5" aria-busy={status === 'loading' ? 'true' : undefined}>
                {!devBypass && (
                  <div ref={btnRef} className="flex justify-center min-h-[44px]"/>
                )}

                {devBypass && (
                  <button type="button" onClick={()=>{
                    onAuth({
                      id:'dev-user', name:'Desenvolvedor', email:'dev@local',
                      picture:'', credential:'dev',
                      exp: Math.floor(Date.now()/1000) + 3600,
                    });
                  }}
                    className="sf-btn sf-btn-secondary w-full h-12 text-[14px] font-semibold"
                    style={{border:'1px dashed var(--warning-outline)'}}>
                    Entrar em modo dev (sem autenticação)
                  </button>
                )}

                {status === 'loading' && (
                  <p role="status" className="text-center text-[12px] text-sf-accent mt-3 flex items-center justify-center gap-2">
                    <span className="inline-block w-3 h-3 rounded-full border-2 border-sf-accent border-t-transparent sf-spinner"/>
                    Conectando...
                  </p>
                )}
              </div>
            )}

            {localError && (
              <InlineError title={localError} onRetry={()=>window.location.reload()} retryLabel="Recarregar página"/>
            )}

            <p className="text-[14px] leading-[20px] text-sf-muted text-center mt-5">
              Seus conteúdos e seu progresso ficam salvos neste aparelho. Entrar com o Google só identifica você; não sincroniza entre aparelhos.
            </p>
          </div>
        </main>

        <p className={`sf-reveal text-center text-[11px] font-semibold text-sf-faint pb-8${on}`} style={{'--d':'320ms', letterSpacing:'.28em'}}>STUDY</p>
      </div>
    </div>
  );
}

  if(!video) return null;

/* Prévia de conteúdo do catálogo (A26/A27). Depois de adicionar, a folha continua aberta e confirma a ação. */
function SubjectPreviewModal({ item, onClose }){
  const { isUserSubject, addUserSubject, openDetalhe, contents, openJornada } = useApp();
  const [summary, setSummary] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const [justAdded, setJustAdded] = useState(false);

  const alreadyAdded = isUserSubject(item.id);
  const userContent = contents.find(c => c.id === item.id);

  useEffect(()=>{
    let cancelled = false;
    setLoading(true); setError(false); setSummary(null);
    fetchSubjectSummary(item.title).then(res=>{
      if(cancelled) return;
      if(res) setSummary(res); else setError(true);
      setLoading(false);
    });
    return ()=>{ cancelled = true; };
  }, [item.id, reloadKey]);

  const handleAdd = ()=>{ if(alreadyAdded) return; addUserSubject(item); setJustAdded(true); };
  const handleOpen = ()=>{ onClose(); openDetalhe(item.id); };

  const topics = (summary && summary.whatYouLearn && summary.whatYouLearn.length > 0)
    ? summary.whatYouLearn : (item.topics || []).map(t => t.t);
  const nMod = (item.topics || []).length;
  const nCards = summary && summary.flashcards != null ? summary.flashcards : ((item.unitLabel||'').replace(/\D/g,'') || null);
  const est = (summary && summary.estMinutes) || item.estMinutes;
  const metaLine = [nMod ? `${nMod} ${plural(nMod,'módulo','módulos')}` : null, nCards ? `${nCards} flashcards` : null].filter(Boolean).join(' e ') + (est ? `, cerca de ${est} min` : '');

  return (
    <ModalShell onClose={onClose} labelledBy="preview-title">
      <div className="flex items-center gap-3"><SubjectTile subjectId={item.subjectId}/><span className="text-[14px] text-sf-muted">{subjName(item.subjectId)}</span></div>
      <h2 id="preview-title" className="sf-ed-title text-sf-text mt-4">{item.title}</h2>
      {metaLine && <p className="text-[14px] leading-[20px] text-sf-muted mt-1">{metaLine}</p>}

      {loading && <div className="mt-4 flex flex-col gap-2" role="status" aria-label="Carregando resumo">{[100,92,80].map((w,i)=><span key={i} className="sf-skel h-4" style={{width:w+'%'}}/>)}</div>}
      {error && !loading && (
        <div className="mt-4">
          <p className="text-[14px] leading-[20px] text-sf-muted">O resumo não carregou agora. Você ainda pode adicionar o conteúdo.</p>
          <button type="button" onClick={()=>setReloadKey(k=>k+1)} className="sf-btn sf-btn-ghost h-11 px-3 -ml-3 text-[14px] font-semibold">Tentar de novo</button>
        </div>
      )}
      {!loading && !error && summary && (
        <>
          <p className="sf-ed-lead text-sf-text mt-4" style={{fontStyle:'italic'}}>{summary.summary || item.desc || ''}</p>
          <h3 className="text-[16px] leading-[22px] font-semibold text-sf-text mt-5">O que você vai aprender</h3>
          <ul className="mt-2 flex flex-col gap-2 list-none p-0 m-0">
            {topics.slice(0, 8).map((t, i)=>(
              <li key={i} className="flex items-start gap-2.5 text-[14px] leading-[20px] text-sf-text">
                <span className="text-sf-muted inline-flex mt-0.5" aria-hidden="true"><IconCheck size={14}/></span><span>{t}</span>
              </li>
            ))}
          </ul>
        </>
      )}

      <div className="mt-6">
        {alreadyAdded ? (
          <>
            <p role="status" className="text-[14px] font-semibold text-sf-text flex items-center gap-2"><span className="text-sf-success inline-flex"><IconCheck size={16}/></span>{justAdded ? 'Adicionado a Meus conteúdos' : 'Já está em Meus conteúdos'}</p>
            <button type="button" onClick={handleOpen} disabled={!userContent} className="sf-btn sf-btn-primary w-full mt-3 h-12 text-[14px]">Abrir conteúdo</button>
            <button type="button" onClick={onClose} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Continuar explorando</button>
          </>
        ) : (
          <>
            <button type="button" onClick={handleAdd} className="sf-btn sf-btn-primary w-full h-12 text-[14px]">Adicionar a Meus conteúdos</button>
            <button type="button" onClick={onClose} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Fechar</button>
          </>
        )}
      </div>
    </ModalShell>
  );
}

function CollectionPreviewSheet({ content, onClose }){
  const { liveSessions, openDetalhe } = useApp();
  const mine = liveSessions.filter(s => s.contentId === content.id);
  const studiedMin = mine.reduce((a, s) => a + (s.durationMin || 0), 0);
  const prog = getContentProgress(content);
  return (
    <ModalShell onClose={onClose} labelledBy="collection-title" z={40}>
      <div className="flex items-center gap-3"><SubjectTile subjectId={content.subjectId}/><span className="text-[14px] text-sf-muted">{subjName(content.subjectId)}</span></div>
      <h2 id="collection-title" className="sf-ed-title text-sf-text mt-4">{content.title}</h2>
      <p className="text-[14px] leading-[20px] text-sf-muted mt-1">{modulesLabel(content)}{prog.total ? ` · ${prog.pct}%` : ''}{mine.length ? ` · ${fmtMin(studiedMin)} de foco` : ''}</p>
      {prog.total > 0 && <SegmentedTrail className="mt-4" states={trailStates(content)} label={`Trilha de ${content.title}`}/>}
      <button type="button" onClick={()=>{ onClose(); openDetalhe(content.id); }} className="sf-btn sf-btn-primary w-full mt-6 h-12 text-[14px]">
        {prog.completed > 0 ? 'Continuar estudando' : 'Abrir conteúdo'}
      </button>
      <button type="button" onClick={onClose} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Fechar</button>
    </ModalShell>
  );
}

function fmtMin(total){ const h = Math.floor(total/60), m = total%60; return h>0 ? (m ? `${h} h ${m} min` : `${h} h`) : `${m} min`; }
function plural(n, one, many){ return n === 1 ? one : many; }

/* Linha "Hoje" (A01): tempo, sessões e dias seguidos. Valores em Literata (Editorial/Stat). */
function TodayStats({todayStats}){
  const items = [
    {v: fmtMin(todayStats.studiedMin), l: 'estudados'},
    {v: todayStats.sessionsCount, l: plural(todayStats.sessionsCount, 'sessão', 'sessões')},
    {v: todayStats.streak, l: plural(todayStats.streak, 'dia seguido', 'dias seguidos'), flame: true},
  ];
  return (
    <dl className="grid grid-cols-3 gap-3 m-0">
      {items.map((it, i)=>(
        <div key={i} className="min-w-0 flex flex-col-reverse">
          <dt className="text-[14px] leading-[20px] text-sf-muted">{it.l}</dt>
          <dd className="m-0 sf-ed-stat text-sf-text flex items-center gap-1.5">
            {it.v}{it.flame && <span className="text-sf-muted inline-flex" aria-hidden="true"><IconFlame size={13}/></span>}
          </dd>
        </div>
      ))}
    </dl>
  );
}
