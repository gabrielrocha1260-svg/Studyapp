const TIMER_DEFAULT_POS = {r:16, t:10};
const TIMER_MARGIN = 6;
const TIMER_BOTTOM_RESERVED = 75 + 6;
const DRAG_THRESHOLD = 6;

function FloatingTimer(){
  const {session, elapsedSec, timerExpanded, setTimerExpanded, timerPos, setTimerPos,
    pauseSession, resumeSession, setConfirmEnd, setFullScreenFocus, contents} = useApp();
  const boxRef = useRef(null);
  const dragRef = useRef(null);
  const [live, setLive] = useState(null);
  const [dragging, setDragging] = useState(false);
  const [size, setSize] = useState({w:90, h:34});
  const [vp, setVp] = useState(()=>({w:window.innerWidth, h:window.innerHeight}));
  const [safeTop, setSafeTop] = useState(0);
  const has = !!session;

  useEffect(()=>{
    const onResize = ()=> setVp({w:window.innerWidth, h:window.innerHeight});
    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);
    const probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)';
    document.body.appendChild(probe);
    setSafeTop(parseFloat(getComputedStyle(probe).paddingTop) || 0);
    document.body.removeChild(probe);
    return ()=>{ window.removeEventListener('resize', onResize); window.removeEventListener('orientationchange', onResize); };
  }, []);

  useLayoutEffect(()=>{
    const el = boxRef.current;
    if(!el) return;
    const measure = ()=> setSize(sz=> (sz.w===el.offsetWidth && sz.h===el.offsetHeight) ? sz : {w:el.offsetWidth, h:el.offsetHeight});
    measure();
    if(typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(measure);
    ro.observe(el);
    return ()=> ro.disconnect();
  }, [has, timerExpanded]);

  if(!session) return null;

  const colW = Math.min(402, vp.w);
  const sideGap = (vp.w - colW)/2;
  const clampPos = (pos)=>{
    const minR = TIMER_MARGIN;
    const maxR = Math.max(minR, colW - size.w - TIMER_MARGIN);
    const minT = safeTop + TIMER_MARGIN;
    const maxT = Math.max(minT, vp.h - size.h - TIMER_BOTTOM_RESERVED);
    return {r: Math.min(maxR, Math.max(minR, pos.r)), t: Math.min(maxT, Math.max(minT, pos.t))};
  };

  const meta = sessionMeta(session, contents);
  const paused = session.status==='paused';
  const pos = live || clampPos(timerPos || TIMER_DEFAULT_POS);

  const onDown = (e)=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    if(e.target.closest && e.target.closest('button, a, input, textarea, select')) return;
    const start = live || clampPos(timerPos || TIMER_DEFAULT_POS);
    dragRef.current = {id:e.pointerId, sx:e.clientX, sy:e.clientY, r:start.r, t:start.t, moved:false, pos:start};
    try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
  };
  const onMove = (e)=>{
    const d = dragRef.current;
    if(!d || d.id!==e.pointerId) return;
    const dx = e.clientX - d.sx, dy = e.clientY - d.sy;
    if(!d.moved && Math.hypot(dx,dy) < DRAG_THRESHOLD) return;
    if(!d.moved){ d.moved = true; setDragging(true); }
    d.pos = clampPos({r: d.r - dx, t: d.t + dy});
    setLive(d.pos);
  };
  const finish = (e, cancelled)=>{
    const d = dragRef.current;
    if(!d || d.id!==e.pointerId) return;
    dragRef.current = null;
    try{ e.currentTarget.releasePointerCapture(e.pointerId); }catch(err){}
    if(d.moved){ setTimerPos(d.pos); setLive(null); setDragging(false); }
    else if(!cancelled && !timerExpanded){ setTimerExpanded(true); }
  };

  return (
    <div ref={boxRef}
      onPointerDown={onDown} onPointerMove={onMove}
      onPointerUp={(e)=>finish(e,false)} onPointerCancel={(e)=>finish(e,true)}
      style={{
        position:'fixed', top:pos.t, right: sideGap + pos.r,
        width: timerExpanded ? colW - 32 : 'auto',
        zIndex: timerExpanded ? 40 : 30,
        touchAction:'none', userSelect:'none', WebkitUserSelect:'none',
        cursor: dragging ? 'grabbing' : 'grab',
      }}>
      {!timerExpanded ? (
        <div role="button" tabIndex={0} aria-label="Expandir timer"
          onKeyDown={(e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); setTimerExpanded(true); } }}
          className="rounded-full px-4 py-3 text-[13px] font-semibold flex items-center gap-1.5 tnum"
          style={{background:'var(--bg-surface)', color: paused ? 'var(--warning)' : 'var(--blue-300)', border:'1px solid var(--border)', boxShadow:'var(--shadow-float)', whiteSpace:'nowrap'}}>
          <span className="w-1.5 h-1.5 rounded-full" style={{background:'currentColor'}}/>
          {fmtMMSS(elapsedSec)}
        </div>
      ) : (
        <div className="rounded-[20px] p-4" style={{background:'var(--timer-bg)', border:'1px solid var(--border)', boxShadow:'var(--shadow-modal)'}}>
          <div className="flex items-center justify-between">
            <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-semibold"
              style={{background: paused ? 'var(--warning-tint)' : 'var(--brand-tint-2)', color: paused ? 'var(--warning)' : 'var(--blue-300)'}}>
              <span className="w-1.5 h-1.5 rounded-full" style={{background:'currentColor'}}/>
              {paused ? 'PAUSADO' : 'FOCO'}
            </span>
            <button onClick={()=>setTimerExpanded(false)}
              className="sf-icon-btn -mr-1 -mt-1"
              aria-label="Recolher timer"><IconChevronUp size={14}/></button>
          </div>

          <p className="text-center text-[12px] text-sf-muted mt-2 truncate">
            {subjectEmoji(meta.subjectId)} {meta.title || subjName(meta.subjectId)}
          </p>
          <p className="text-center text-[40px] font-bold text-sf-text leading-tight mt-1 tnum">{fmtMMSS(elapsedSec)}</p>
          <p className="text-center text-[11px] text-sf-muted">Meta: {session.plannedMin} min</p>
          <ProgressBar value={(elapsedSec / (session.plannedMin * 60)) * 100} height={4} className="mt-3"
            color={paused ? 'var(--warning)' : 'var(--blue-400)'} label="Progresso da sessão de foco"/>

          <div className="flex gap-2 mt-4">
            {paused ? (
              <button onClick={resumeSession} className="sf-btn sf-btn-primary flex-[1.5] h-11 text-[13px] gap-1.5">
                <IconPlay size={12}/> Continuar
              </button>
            ) : (
              <button onClick={pauseSession} className="sf-btn sf-btn-tonal flex-[1.5] h-11 text-[13px] gap-1.5">
                <IconPause size={14}/> Pausar
              </button>
            )}
            <button onClick={()=>{setTimerExpanded(false); setFullScreenFocus(true);}}
              className="sf-btn sf-btn-secondary flex-1 h-11 text-[12px] gap-1.5">
              <IconMaximize size={13}/> Tela completa
            </button>
          </div>

          <button onClick={()=>{setTimerExpanded(false); setConfirmEnd(true);}}
            className="sf-btn sf-btn-outline-danger w-full mt-2 h-11 text-[13px]">
            Encerrar Sessão
          </button>
        </div>
      )}
    </div>
  );
}

function ConfirmEndModal(){
  const {session, elapsedSec, confirmEnd, setConfirmEnd, confirmEndSession} = useApp();
  if(!confirmEnd || !session) return null;
  return (
    <ModalShell variant="dialog" onClose={()=>setConfirmEnd(false)} labelledBy="confirm-end-title">
      <p id="confirm-end-title" className="text-[16px] font-bold text-sf-text text-center">Encerrar sessão de estudos?</p>
      <p className="text-[13px] text-sf-muted text-center mt-2.5 leading-relaxed">
        Você focou <span className="tnum">{fmtMMSS(elapsedSec)}</span> de {session.plannedMin} min planejados. O tempo estudado será registrado.
      </p>
      <button type="button" onClick={()=>confirmEndSession()} className="sf-btn sf-btn-primary w-full mt-4 h-12 text-[14px] font-semibold">Sim, encerrar sessão</button>
      <button type="button" onClick={()=>setConfirmEnd(false)} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px]">Continuar sessão</button>
    </ModalShell>
  );
}

function FullScreenFocus(){
  const {session, elapsedSec, fullScreenFocus, setFullScreenFocus, pauseSession, resumeSession, setConfirmEnd, contents} = useApp();
  if(!fullScreenFocus || !session) return null;
  const meta = sessionMeta(session, contents);
  const sec = elapsedSec;
  const paused = session.status==='paused';
  return (
    <ModalShell variant="full" z={50} onClose={()=>setFullScreenFocus(false)} labelledBy="fullscreen-title">
      <div className="pt-16 px-5 min-h-full flex flex-col items-center">
        <div className="w-full flex items-center justify-between">
          <button type="button" onClick={()=>setFullScreenFocus(false)} aria-label="Sair da tela cheia"
            className="sf-btn sf-btn-ghost justify-start -ml-2 px-2 min-h-[44px] w-24 text-[14px] flex items-center gap-1.5">
            <IconArrowL size={14}/> Voltar
          </button>
          <p id="fullscreen-title" className="text-[16px] font-bold text-sf-text truncate">
            {subjectEmoji(meta.subjectId)} {subjName(meta.subjectId)}
          </p>
          <span className="w-24" aria-hidden="true"/>
        </div>

        <span className="mt-6 inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[12px] font-semibold"
          style={{background: paused?'var(--warning-tint)':'var(--brand-tint)', color: paused?'var(--warning)':'var(--blue-300)'}}>
          <span className="w-1.5 h-1.5 rounded-full" style={{background:'currentColor'}}/>
          {paused?'Pausado':'Foco'}
        </span>

        <div className="mt-8">
          <FocusRing size={260} progress={Math.min(100, (sec/(session.plannedMin*60))*100)} time={fmtMMSS(sec)} label={paused?'PAUSADO':'FOCO'} paused={paused}/>
        </div>
        <p className="text-[12px] text-sf-muted mt-4">Meta: {session.plannedMin} min</p>

        <div className="flex-1"/>

        <div className="w-full pb-10 pt-6 flex flex-col gap-3">
          {paused
            ? <button type="button" onClick={resumeSession} className="sf-btn sf-btn-primary w-full h-[54px] text-[16px] font-semibold flex items-center justify-center gap-2"><IconPlay size={14}/> Continuar</button>
            : <button type="button" onClick={pauseSession} className="sf-btn sf-btn-tonal w-full h-[54px] text-[16px] gap-2"><IconPause size={18}/> Pausar sessão</button>}
          <button type="button" onClick={()=>{setFullScreenFocus(false); setConfirmEnd(true);}}
            className="sf-btn sf-btn-outline-danger w-full h-[54px] text-[16px] font-semibold">
            Encerrar sessão
          </button>
        </div>
      </div>
    </ModalShell>
  );
}

function ConcluidaScreen(){
  const {completedSession, dismissCompletedSession, openPreSessao, openCalendario, user, planner, togglePlannerDone} = useApp();
  if(!completedSession){
    return (
      <div className="pt-24 px-5">
        <EmptyState title="Nenhuma sessão para mostrar">
          <button type="button" onClick={dismissCompletedSession}
            className="sf-btn sf-btn-primary mt-4 h-11 px-5 text-[13px] font-semibold">Ir para o início</button>
        </EmptyState>
      </div>
    );
  }
  const cs = completedSession;
  const pi = cs.plannerInfo;
  const plannerItem = pi ? planner.find(p=>p.id===pi.id) : null;
  const plannerDone = plannerItem ? plannerItem.done : (pi ? pi.done : false);
  const firstName = user.name.split(' ')[0];
  return (
    <div className="pt-14 px-5 pb-8">
      <div className="flex flex-col items-center mt-4">
        <div className="w-16 h-16 rounded-full flex items-center justify-center"
          style={{background:'var(--brand-tint)', border:'1.5px solid var(--brand-border)', color:'var(--blue-300)'}}>
          <IconTrophy size={30}/>
        </div>
        <h1 className="text-[22px] font-bold text-sf-text mt-4">Sessão concluída!</h1>
        <p className="text-[13px] text-sf-muted mt-1.5">Bom trabalho, {firstName}.</p>
      </div>

      <div className="mt-6 rounded-2xl p-4 flex items-center" style={{background:'var(--card-bg)'}}>
        <Stat big value={fmtMMSS(cs.realSec)} label="Tempo focado"/>
        <div className="w-px h-10 bg-sf-overlay"/>
        <Stat big value={cs.sessionsToday} label={cs.sessionsToday === 1 ? 'Sessão hoje' : 'Sessões hoje'}/>
      </div>
      {cs.capped && (
        <p className="text-[12px] text-sf-muted mt-3 leading-snug">
          A sessão passou do tempo planejado enquanto o app estava fechado. Registramos {cs.realMin} min, o tempo planejado.
        </p>
      )}

      {pi && (
        <div className="mt-4 rounded-2xl p-4" style={{background:'var(--card-bg)', border:'1px solid var(--brand-border)'}}>
          <div className="flex items-center gap-3">
            <SubjectIcon subjectId={cs.subjectId} size={22}/>
            <div className="flex-1 min-w-0">
              <p className="text-[14px] font-semibold text-sf-text truncate">{subjName(cs.subjectId)}</p>
              <p className="text-[12px] text-sf-muted truncate">{cs.contentTitle}</p>
            </div>
          </div>
          <div className="flex items-center justify-between mt-3 gap-2">
            {plannerDone ? (
              <span className="inline-flex items-center gap-1.5 text-[13px] font-semibold text-sf-success"><IconCheck size={14}/> Concluído</span>
            ) : (
              <span className="text-[13px] font-semibold text-sf-warning">Ainda pendente no Planner</span>
            )}
            <button type="button" onClick={()=>togglePlannerDone(pi.id)}
              className="sf-btn sf-btn-secondary h-11 px-3 rounded-lg text-[12px] font-semibold">
              {plannerDone ? 'Reabrir' : 'Marcar como concluída'}
            </button>
          </div>
        </div>
      )}

      <div className="mt-4 rounded-2xl p-3.5 flex items-start gap-3"
        style={{background:'var(--warning-tint)', border:'1px solid var(--warning-border)'}}>
        <span style={{color:'var(--flame)', display:'inline-flex', marginTop:2}}><IconFlame size={18}/></span>
        <p className="text-[13px] text-sf-warning leading-snug">
          {cs.streak > 1
            ? <>Você está em uma <b>ofensiva de {cs.streak} dias</b>! Continue amanhã para mantê-la.</>
            : <>Você começou uma <b>ofensiva</b>! Estude amanhã para chegar a 2 dias seguidos.</>}
        </p>
      </div>

      {cs.contentId ? (
        <button type="button" onClick={()=>{ dismissCompletedSession(); openPreSessao(cs.contentId); }}
          className="sf-btn sf-btn-primary w-full mt-6 h-12 text-[14px] font-semibold flex items-center justify-center gap-2">
          <IconPlay size={13}/> Iniciar nova sessão
        </button>
      ) : (
        <button type="button" onClick={()=>{ dismissCompletedSession(); openCalendario(); }}
          className="sf-btn sf-btn-primary w-full mt-6 h-12 text-[14px] font-semibold flex items-center justify-center gap-2">
          <IconCalendar size={15}/> Voltar ao Planner
        </button>
      )}
      <button type="button" onClick={dismissCompletedSession}
        className="sf-btn sf-btn-secondary w-full mt-2.5 h-11 text-[14px] font-semibold">
        Ir para o início
      </button>
    </div>
  );
}

function ProgressoScreen(){
  const {contents, liveSessions, openCalendario, openJornada, planner, openDetalhe, goTab} = useApp();

  const stats = useMemo(()=>{
    const totalMin = liveSessions.reduce((a,s)=> a + (s.durationMin||0), 0);
    const generalPct = contents.length ? Math.round(contents.reduce((a,c)=>a+c.progressPct,0)/contents.length) : 0;
    const today = new Date(); today.setHours(0,0,0,0);
    const days = [];
    for(let i=6; i>=0; i--){
      const d = new Date(today); d.setDate(d.getDate()-i);
      const ts = d.getTime(); const nextTs = ts + 86400000;
      const min = liveSessions.filter(s => {
        const st = s.startedAt || s.dateTs || 0;
        return st >= ts && st < nextTs;
      }).reduce((a,s)=> a + (s.durationMin||0), 0);
      days.push({ts, min, label: WEEKDAYS_SHORT[d.getDay()]});   // rótulo = dia da semana real de cada barra
    }
    const maxMin = Math.max(...days.map(d=>d.min), 1);
    return { totalMin, generalPct, days, maxMin, weekMin: days.reduce((a,d)=>a+d.min,0), sessionsCount: liveSessions.length };
  },[contents, liveSessions]);

  const week = useMemo(()=>{
    const today = new Date(); today.setHours(0,0,0,0);
    const monday = new Date(today); monday.setDate(today.getDate() - ((today.getDay()+6)%7));
    const days = Array.from({length:7}).map((_,i)=>{
      const d = new Date(monday); d.setDate(monday.getDate()+i);
      const ds = toDateStr(d);
      const items = planner.filter(p=>p.date===ds);
      return { n: d.getDate(), ds, isToday: d.getTime()===today.getTime(), total: items.length, done: items.filter(p=>p.done).length };
    });
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const label = monday.getMonth()===sunday.getMonth()
      ? `${monday.getDate()} – ${sunday.getDate()} ${MONTHS_SHORT[sunday.getMonth()]}`
      : `${monday.getDate()} ${MONTHS_SHORT[monday.getMonth()]} – ${sunday.getDate()} ${MONTHS_SHORT[sunday.getMonth()]}`;
    return { days, label, total: days.reduce((a,d)=>a+d.total,0), done: days.reduce((a,d)=>a+d.done,0) };
  },[planner]);

  const upcoming = useMemo(()=>{
    const t = todayStr();
    const map = {};
    planner.filter(p=> p.date>=t && !p.done).forEach(p=>{ (map[p.date] = map[p.date] || []).push(p); });
    return Object.keys(map).sort().slice(0,2).map(ds=>({ds, items: map[ds]}));
  },[planner]);
  const todayLabel = fmtShortDay(todayStr());
  const chartSummary = stats.days.map(d => `${d.label}: ${d.min} min`).join(', ');

  return (
    <div className="pt-16 px-5 pb-8">
      <h1 className="text-[24px] font-bold text-sf-text">Progresso</h1>

      <div className="mt-4 rounded-2xl p-4" style={{background:'var(--card-bg)', border:'1px solid var(--brand-border)'}}>
        <p className="text-[36px] font-bold text-sf-text leading-none tnum">{stats.generalPct}%</p>
        <p className="text-[12px] text-sf-muted mt-1.5">progresso médio nas suas matérias</p>
        <ProgressBar value={stats.generalPct} height={6} className="mt-3" label="Progresso médio"/>
        <div className="flex mt-4 pt-4" style={{borderTop:'1px solid var(--border)'}}>
          <div className="flex-1">
            <p className="text-[18px] font-bold text-sf-text tnum">{minutesToLabel(stats.totalMin)}</p>
            <p className="text-[11px] text-sf-muted mt-1">Estudado no total</p>
          </div>
          <div className="flex-1">
            <p className="text-[18px] font-bold text-sf-text tnum">{stats.sessionsCount}</p>
            <p className="text-[11px] text-sf-muted mt-1">Sessões</p>
          </div>
        </div>
      </div>

      <div className="flex items-baseline justify-between mt-6 mb-2.5">
        <h2 className="text-[14px] font-bold text-sf-text">Últimos 7 dias</h2>
        <span className="text-[12px] text-sf-muted tnum">Total: {minutesToLabel(stats.weekMin)}</span>
      </div>
      <div className="rounded-2xl p-4" style={{background:'var(--card-bg)'}}>
        {stats.weekMin === 0 && (
          <p className="text-[12px] text-sf-muted mb-3">Nenhuma sessão nos últimos 7 dias. Cada sessão registrada aparece aqui.</p>
        )}
        <div className="flex items-end justify-between gap-1.5 h-[120px]" role="img" aria-label={`Minutos estudados por dia. ${chartSummary}`}>
          {stats.days.map((d,i)=>{
            const h = (d.min/stats.maxMin)*100;
            const isToday = i === stats.days.length-1;
            return (
              <div key={d.ts} className="flex-1 flex flex-col items-center justify-end h-full gap-1" aria-hidden="true">
                <span className="text-[11px] text-sf-muted tnum h-4 leading-4">{d.min>0 ? `${d.min}m` : ''}</span>
                <div className="w-full flex-1 flex items-end">
                  <div className="w-full rounded-sm" style={{height:`${Math.max(h, 4)}%`, minHeight:4,
                    background: d.min>0 ? (isToday ? 'var(--chart-bar-hl)' : 'var(--chart-bar)') : 'var(--chart-empty)'}}/>
                </div>
              </div>
            );
          })}
        </div>
        <div className="flex justify-between gap-1.5 mt-2" aria-hidden="true">
          {stats.days.map((d,i)=>(
            <span key={d.ts} className="flex-1 text-center text-[11px]"
              style={{color: i===stats.days.length-1 ? 'var(--blue-300)' : 'var(--text-secondary)', fontWeight: i===stats.days.length-1 ? 600 : 400}}>{d.label}</span>
          ))}
        </div>
      </div>

      <h2 className="text-[14px] font-bold text-sf-text mt-6 mb-2.5">Progresso por matéria</h2>
      {contents.length === 0 ? (
        <EmptyState Icon={IconProgress} title="Você ainda não adicionou nenhuma matéria."
          hint="Adicione um conteúdo em Explorar para acompanhar seu progresso aqui.">
          <button type="button" onClick={()=>goTab('estudar')}
            className="sf-btn sf-btn-primary mt-4 h-11 px-5 text-[13px] font-semibold">Explorar conteúdos</button>
        </EmptyState>
      ) : contents.map(c=>{
        const isDone = c.progressPct >= 100;
        return (
          <button type="button" key={c.id} onClick={()=>openDetalhe(c.id)}
            className="w-full text-left rounded-2xl p-3 mb-2 flex items-center gap-3 border-0"
            style={{background:'var(--card-bg)'}}>
            <SubjectIcon subjectId={c.subjectId} size={18}/>
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between gap-2">
                <p className="text-[13px] font-semibold text-sf-text truncate">{c.title}</p>
                <p className="text-[12px] font-bold text-sf-text shrink-0 tnum">{c.progressPct}%</p>
              </div>
              <ProgressBar value={c.progressPct} height={4} color={subjectAccent(c.subjectId)} className="mt-2" label={`Progresso em ${c.title}`}/>
              <p className="text-[11px] text-sf-muted mt-1.5 truncate">
                {c.unitLabel} · {c.estMinutes} min{isDone ? ' · Concluído' : ''}
              </p>
            </div>
          </button>
        );
      })}

      <h2 className="text-[14px] font-bold text-sf-text mt-6 mb-1">Planner</h2>
      <p className="text-[12px] text-sf-muted">Planeje, execute e acompanhe sua semana.</p>
      <div className="mt-3 rounded-2xl p-3.5" style={{background:'var(--card-bg)'}}>
        <div className="flex items-center justify-between">
          <p className="text-[13px] font-semibold text-sf-text">Semana de {week.label}</p>
          <span className="text-[11px] text-sf-muted">Hoje, {todayLabel}</span>
        </div>
        <div className="flex justify-between mt-3 gap-1.5">
          {week.days.map((w)=>(
            <button type="button" key={w.ds} onClick={()=>openCalendario(w.ds)}
              aria-label={`${fmtShortDay(w.ds)}${w.total>0 ? `, ${w.done} de ${w.total} atividades concluídas` : ', sem atividades'}`}
              aria-current={w.isToday ? 'date' : undefined}
              className="relative flex-1 aspect-square rounded-xl flex items-center justify-center text-[13px] font-semibold leading-none tnum"
              style={{
                background: w.isToday ? 'var(--blue-500)' : 'var(--bg-surface)',
                color: w.isToday ? '#fff' : 'var(--text-secondary)',
                border: w.isToday ? 'none' : '1px solid var(--border)'
              }}>
              {w.n}
              <span className="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full"
                style={{background: w.total>0 ? (w.isToday ? '#fff' : (w.done===w.total ? 'var(--success)' : 'var(--blue-300)')) : 'transparent'}}/>
            </button>
          ))}
        </div>
        <div className="flex items-center justify-between mt-3.5 gap-2">
          <span className="text-[12px] text-sf-muted">
            {week.total>0 ? `${week.done} de ${week.total} atividades concluídas` : 'Nenhuma atividade planejada nesta semana'}
          </span>
          <button type="button" onClick={()=>openCalendario()} className="bg-transparent border-0 text-[12px] text-sf-accent min-h-[44px] px-2 shrink-0">Abrir Planner</button>
        </div>
      </div>

      <h2 className="text-[14px] font-bold text-sf-text mt-6 mb-2.5">Próximos dias</h2>
      {upcoming.length===0 ? (
        <p className="text-[12px] text-sf-muted">Nada pendente nos próximos dias. Abra o Planner para planejar.</p>
      ) : upcoming.map(u=>(
        <button type="button" key={u.ds} onClick={()=>openCalendario(u.ds)}
          className="w-full text-left rounded-2xl p-3 mb-2 flex items-center gap-3 border-0" style={{background:'var(--card-bg)'}}>
          <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0"
            style={{background:'var(--brand-tint)', color:'var(--blue-300)'}}>
            <IconCalendar size={18}/>
          </div>
          <div className="flex-1 min-w-0">
            <p className="text-[13px] font-semibold text-sf-text">{fmtShortDay(u.ds)}</p>
            <p className="text-[11px] text-sf-muted mt-0.5 truncate">
              {u.items.length} {u.items.length===1 ? 'pendente' : 'pendentes'} · {u.items.slice(0,2).map(i=>i.title).join(', ')}
            </p>
          </div>
        </button>
      ))}

      <button type="button" onClick={()=>openJornada()}
        className="sf-btn sf-btn-secondary w-full mt-5 h-12 text-[14px] font-semibold flex items-center justify-center gap-2">
        <IconRocket size={15}/> Jornada de aprendizado
      </button>
    </div>
  );
}

function PlannerRow({it, isActive, otherActive, onOpen, onToggle, onStart, onOpenTimer}){
  const accent = subjectAccent(it.subjectId);
  const canStart = SESSION_TYPES.includes(it.type) && !it.done;
  const typeLabel = (PLANNER_TYPES.find(t=>t.k===it.type) || {}).l || 'Atividade';
  const meta = [plannerTimeLabel(it), it.duration ? `${it.duration} min` : null, typeLabel].filter(Boolean).join(' · ');
  return (
    <div className="sf-card rounded-2xl p-3.5 mb-2.5" style={{borderLeft:`3px solid ${accent}`}}>
      <div className="flex items-start gap-1">
        <button type="button" role="checkbox" aria-checked={!!it.done} aria-label={it.title} onClick={onToggle}
          className="w-11 h-11 -ml-[11px] -mt-[9px] shrink-0 flex items-center justify-center bg-transparent border-0">
          <span className="w-[22px] h-[22px] rounded-full flex items-center justify-center"
            style={{background: it.done ? accent : 'transparent', border: it.done ? 'none' : '1.5px solid var(--field-border)', color: inkOn(accent)}}>
            {it.done && <IconCheck size={12}/>}
          </span>
        </button>
        <button type="button" onClick={onOpen} aria-label={`Editar atividade: ${it.title}`}
          className="flex-1 min-w-0 text-left bg-transparent border-0 p-0">
          <span className="flex items-center gap-2">
            <span aria-hidden="true" style={{fontSize:16, lineHeight:1}}>{subjectEmoji(it.subjectId)}</span>
            <span className="text-[13px] font-semibold truncate"
              style={{color: it.done ? 'var(--text-secondary)' : 'var(--text-primary)', textDecoration: it.done ? 'line-through' : 'none'}}>{it.title}</span>
          </span>
          <span className="block text-[11px] text-sf-muted mt-1">{meta}</span>
          {it.studiedMin>0 && (
            <span className="block text-[11px] mt-1" style={{color:'var(--blue-300)'}}>
              {it.duration ? `Planejado: ${it.duration} min · ` : ''}Estudado: {it.studiedMin} min
            </span>
          )}
          {it.note && <span className="block text-[11px] text-sf-faint mt-1 truncate">{it.note}</span>}
        </button>
      </div>
      {isActive ? (
        <button type="button" onClick={onOpenTimer}
          className="w-full mt-3 h-11 rounded-xl border-0 text-[12px] font-semibold flex items-center justify-center gap-2"
          style={{background:'var(--brand-tint-2)', color:'var(--blue-300)'}}>
          <IconTimer size={14}/> Em andamento · abrir timer
        </button>
      ) : canStart && (
        <button type="button" onClick={onStart} disabled={otherActive}
          className="w-full mt-3 h-11 rounded-xl border-0 text-[12px] font-semibold flex items-center justify-center gap-2"
          style={{background: otherActive ? 'var(--bg-elevated)' : 'var(--blue-500)', color: otherActive ? 'var(--text-secondary)' : '#fff'}}>
          <IconPlay size={11}/> {otherActive ? 'Outra sessão em andamento' : 'Começar sessão'}
        </button>
      )}
    </div>
  );
}

function PlannerItemSheet({item, date, onClose, onSave, onDelete}){
  const {openSubjectSheet} = useApp();
  const [title, setTitle] = useState(item ? item.title : '');
  const [dateStr, setDateStr] = useState(item ? item.date : date);
  const [time, setTime] = useState(item ? (item.time || '') : '');
  const [subjectId, setSubjectId] = useState(item ? item.subjectId : Object.keys(SUBJECTS)[0]);
  const [type, setType] = useState(item ? item.type : 'estudo');
  const [duration, setDuration] = useState(item && item.duration ? String(item.duration) : '');
  const [note, setNote] = useState(item ? (item.note || '') : '');
  const [done, setDone] = useState(item ? !!item.done : false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [showErr, setShowErr] = useState(false);
  const titleRef = useRef(null);
  const valid = title.trim().length>0 && !!dateStr;

  const save = ()=>{
    if(!valid){ setShowErr(true); if(!title.trim() && titleRef.current) titleRef.current.focus(); return; }
    const dur = parseInt(duration, 10);
    onSave({id: item ? item.id : undefined, title: title.trim(), date: dateStr, time, subjectId, type,
      duration: dur>0 ? Math.min(dur, 600) : null, note: note.trim(), done});
  };


  return (
    <ModalShell onClose={onClose} labelledBy="planner-sheet-title">
      <h2 id="planner-sheet-title" className="text-[18px] font-bold text-sf-text">{item ? 'Editar atividade' : 'Nova atividade'}</h2>

      <input id="pl-title" ref={titleRef} value={title} onChange={e=>setTitle(e.target.value)} maxLength={80}

          <FieldLabel htmlFor="pl-date">Data</FieldLabel>

        <div className="min-w-0">
          <FieldLabel htmlFor="pl-time" optional>Horário</FieldLabel>

            return (
              <button type="button" key={k} onClick={()=>setSubjectId(k)} aria-pressed={on}
                className="px-3.5 h-11 rounded-full text-[12px] font-semibold flex items-center gap-1.5"
                style={{background: on ? SUBJECTS[k].accent : 'var(--bg-inset)', color: on ? inkOn(SUBJECTS[k].accent) : 'var(--text-secondary)', border:`1px solid ${SUBJECTS[k].accent}50`}}>
                <span aria-hidden="true">{SUBJECTS[k].emoji}</span>{subjName(k)}
              </button>
            );
          })}
          <button type="button" onClick={()=>openSubjectSheet({onSaved:(id)=>setSubjectId(id)})}
            className="px-3.5 h-11 rounded-full text-[12px] font-semibold bg-transparent text-sf-accent"
            style={{border:'1px dashed var(--border-strong)'}}>+ Nova matéria</button>
        </div>
      </div>

      <div role="group" aria-labelledby="pl-type-label">
        <p id="pl-type-label" className="text-[12px] font-semibold text-sf-muted mt-4 mb-2">Tipo de atividade</p>
        <div className="flex gap-2 flex-wrap">
          {PLANNER_TYPES.map(t=>{
            const on = type===t.k;
            return (
              <button type="button" key={t.k} onClick={()=>setType(t.k)} aria-pressed={on}
                className="sf-chip sf-chip-field px-3.5 h-11 rounded-full text-[12px] font-semibold">
                {t.l}
              </button>
            );
          })}
        </div>
      </div>

      <FieldLabel htmlFor="pl-duration" optional>Duração estimada (minutos)</FieldLabel>
      <div className="flex items-center gap-2 flex-wrap">
        <input id="pl-duration" type="number" inputMode="numeric" min="1" max="600" value={duration} onChange={e=>setDuration(e.target.value)}
          placeholder="min" className={INPUT_CLS} style={{width:90}}/>
        {[15,30,45,60,90].map(m=>(
          <button type="button" key={m} onClick={()=>setDuration(String(m))} aria-pressed={String(m)===duration}
            aria-label={`${m} minutos`}
            className="sf-chip sf-chip-field h-11 min-w-[44px] px-2.5 rounded-xl text-[12px] font-semibold">
            {m}
          </button>
        ))}
      </div>

      <FieldLabel htmlFor="pl-note" optional>Observação</FieldLabel>
      <textarea id="pl-note" value={note} onChange={e=>setNote(e.target.value)} maxLength={200} placeholder="Ex: capítulo 3, exercícios 1 a 10"
        className="sf-input w-full h-16 p-3 text-[16px] resize-none"/>

      {item && (
        <div role="group" aria-labelledby="pl-status-label">
          <p id="pl-status-label" className="text-[12px] font-semibold text-sf-muted mt-4 mb-2">Status</p>
          <div className="flex gap-2">
            {[{v:false,l:'Pendente'},{v:true,l:'Concluído'}].map(o=>(
              <button type="button" key={o.l} onClick={()=>setDone(o.v)} aria-pressed={done===o.v}
                className="flex-1 h-11 rounded-xl text-[12px] font-semibold flex items-center justify-center gap-1.5"
                style={{background: done===o.v ? (o.v ? 'var(--success-tint)' : 'var(--blue-500)') : 'var(--bg-inset)',
                        color: done===o.v ? (o.v ? 'var(--success)' : '#fff') : 'var(--text-secondary)',
                        border: done===o.v ? (o.v ? '1px solid var(--success-border)' : '1px solid var(--blue-500)') : '1px solid var(--border)'}}>
                {done===o.v && <IconCheck size={12}/>}{o.l}
              </button>
            ))}
          </div>
        </div>

      {showErr && !valid && (
        <p id="pl-err" role="alert" className="text-[12px] text-sf-error mt-4">Informe um título e uma data para salvar a atividade.</p>
      )}

      <button type="button" onClick={save}
        className="sf-btn sf-btn-primary w-full mt-6 h-12 text-[14px] font-semibold flex items-center justify-center gap-2">
        <IconCheck size={16}/> Salvar atividade
      </button>
      <button type="button" onClick={onClose} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[13px]">Cancelar</button>
      {item && (
        confirmDel ? (
          <div className="flex gap-2 mt-1" role="alert">
            <button type="button" onClick={onDelete} className="sf-btn sf-btn-danger flex-1 h-11 text-[13px] font-semibold">Confirmar exclusão</button>

          </div>
        ) : (
          <button type="button" onClick={()=>setConfirmDel(true)}
            className="sf-btn sf-btn-outline-danger w-full mt-1 h-11 text-[13px] font-semibold">Excluir atividade</button>
        )
      )}
    </ModalShell>
  );
}

function PlannerScreen({initialDate}){
  const {contents, liveSessions, planner, session, savePlannerItem, deletePlannerItem, togglePlannerDone,
    startPlannerSession, setTimerExpanded, closeView} = useApp();
  const [sel, setSel] = useState(()=> initialDate || todayStr());
  const [month, setMonth] = useState(()=>{ const d = parseDateStr(initialDate || todayStr()); return {y:d.getFullYear(), m:d.getMonth()}; });
  const [sheet, setSheet] = useState(null);

  const WEEKDAYS = ['D','S','T','Q','Q','S','S'];
  const selectDay = (ds)=>{ setSel(ds); const d = parseDateStr(ds); setMonth({y:d.getFullYear(), m:d.getMonth()}); };
  const prevMonth = ()=> setMonth(m=> m.m===0 ? {y:m.y-1, m:11} : {y:m.y, m:m.m-1});
  const nextMonth = ()=> setMonth(m=> m.m===11 ? {y:m.y+1, m:0} : {y:m.y, m:m.m+1});

  const firstDay = new Date(month.y, month.m, 1);
  const daysInMonth = new Date(month.y, month.m+1, 0).getDate();
  const cells = [];
  for(let i=0; i<firstDay.getDay(); i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const plannerDays = useMemo(()=>{
    const map = {};
    planner.forEach(p=>{ const e = map[p.date] || (map[p.date] = {total:0, pending:0}); e.total++; if(!p.done) e.pending++; });
    return map;
  },[planner]);
  const sessionDays = useMemo(()=>{
    const set = {};
    liveSessions.forEach(x=>{
      const ts = x.startedAt || x.dateTs;
      if(!ts) return;
      const k = toDateStr(new Date(ts));
      set[k] = (set[k]||0)+1;
    });
    return set;
  },[liveSessions]);

  const dayItems = useMemo(()=> planner.filter(p=>p.date===sel).sort((a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99')), [planner, sel]);
  const daySessions = liveSessions.filter(x=>{
    const ts = x.startedAt || x.dateTs;
    return ts && toDateStr(new Date(ts))===sel;
  });
  const doneCount = dayItems.filter(p=>p.done).length;
  const today = todayStr();

  const handleSave = (data)=>{ savePlannerItem(data); selectDay(data.date); setSheet(null); };

  return (
    <div className="pt-16 px-5 pb-8 relative">
      <BackButton onClick={closeView}/>
      <div className="flex items-start justify-between mt-1">
        <div>
          <h1 className="text-[24px] font-bold text-sf-text">Planner</h1>
          <p className="text-[12px] text-sf-muted mt-1">Planeje o dia, execute e conclua.</p>
        </div>
        {sel!==today && (
          <button type="button" onClick={()=>selectDay(today)}
            className="sf-btn sf-btn-secondary h-11 px-4 rounded-full text-[12px] font-semibold">Hoje</button>
        )}
      </div>

      <div className="mt-5 rounded-2xl p-4" style={{background:'var(--card-bg)'}}>
        <div className="flex items-center justify-between -mx-2 -mt-2">
          <PlannerNavBtn onClick={prevMonth} label="Mês anterior" flip/>
          <p aria-live="polite" className="text-[14px] font-semibold text-sf-text">{MONTHS_LONG[month.m]} {month.y}</p>
          <PlannerNavBtn onClick={nextMonth} label="Próximo mês"/>
        </div>
        <div className="grid grid-cols-7 gap-1 mt-2">
          {WEEKDAYS.map((w,i)=>(<span key={i} aria-hidden="true" className="text-center text-[11px] font-semibold text-sf-faint py-1">{w}</span>))}
          {cells.map((dn,i)=>{
            if(dn===null) return <span key={`e-${i}`}/>;
            const ds = `${month.y}-${pad2(month.m+1)}-${pad2(dn)}`;
            const isToday = ds===today;
            const isSelected = ds===sel;
            const pd = plannerDays[ds];
            let dot = null;
            if(pd) dot = isSelected ? '#fff' : (pd.pending>0 ? 'var(--blue-300)' : 'var(--success)');
            else if(sessionDays[ds]>0) dot = isSelected ? '#fff' : 'var(--text-tertiary)';
            const info = [];
            if(pd) info.push(pd.pending>0 ? `${pd.total} ${pd.total===1?'atividade':'atividades'}, ${pd.pending} pendente${pd.pending===1?'':'s'}` : `${pd.total} ${pd.total===1?'atividade concluída':'atividades concluídas'}`);
            if(sessionDays[ds]>0) info.push(`${sessionDays[ds]} ${sessionDays[ds]===1?'sessão':'sessões'} de estudo`);
            const label = parseDateStr(ds).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}) + (isToday ? ', hoje' : '') + (info.length ? ', ' + info.join(', ') : '');
            return (
              <button type="button" key={`d-${dn}`} onClick={()=>selectDay(ds)} aria-label={label} aria-pressed={isSelected}
                aria-current={isToday ? 'date' : undefined}
                className="relative min-h-[40px] aspect-square flex flex-col items-center justify-center rounded-lg border-0 bg-transparent">
                <span className="text-[12px] font-semibold tnum"
                  style={{
                    color: isSelected ? '#fff' : (isToday ? 'var(--blue-300)' : 'var(--text-primary)'),
                    width:28, height:28, borderRadius:'50%',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    background: isSelected ? 'var(--blue-500)' : 'transparent',
                    boxShadow: isToday && !isSelected ? 'inset 0 0 0 1px #60A5FA' : 'none',
                  }}>{dn}</span>
                {dot && <span className="block w-1 h-1 rounded-full mt-0.5" style={{background: dot}}/>}
              </button>
            );
          })}
        </div>
        <div className="flex items-center gap-4 mt-3 text-[11px] text-sf-muted flex-wrap">
          <span className="inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-sf-accent"/>Pendente</span>
          <span className="inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-sf-success"/>Concluído</span>
          <span className="inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-sf-faint"/>Só sessões</span>
        </div>
      </div>

      <div className="flex items-center justify-between mt-4 mb-2">
        <PlannerNavBtn onClick={()=>selectDay(addDaysStr(sel,-1))} label="Dia anterior" flip/>
        <div className="text-center" aria-live="polite">
          <h2 className="text-[13px] font-semibold text-sf-text">
            {capitalize(parseDateStr(sel).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}))}
          </h2>
          <p className="text-[11px] text-sf-muted mt-0.5">
            {dayItems.length ? `${doneCount} de ${dayItems.length} concluídas` : 'Sem atividades'}
          </p>
        </div>
        <PlannerNavBtn onClick={()=>selectDay(addDaysStr(sel,1))} label="Próximo dia"/>
      </div>

      {dayItems.length===0 ? (
        <button type="button" onClick={()=>setSheet({date:sel})}
          className="w-full rounded-2xl p-4 text-left bg-transparent"
          style={{border:'1px dashed var(--border-strong)'}}>
          <span className="block text-[13px] font-semibold text-sf-text">Nada planejado para este dia</span>
          <span className="block text-[12px] text-sf-muted mt-1">Toque para adicionar uma atividade.</span>
        </button>
      ) : dayItems.map(it=>(
        <PlannerRow key={it.id} it={it}
          isActive={!!session && session.plannerId===it.id}
          otherActive={!!session && session.plannerId!==it.id}
          onOpen={()=>setSheet({item:it, date:it.date})}
          onToggle={()=>togglePlannerDone(it.id)}
          onStart={()=>startPlannerSession(it.id)}
          onOpenTimer={()=>setTimerExpanded(true)}/>
      ))}

      {daySessions.length>0 && (
        <>
          <h2 className="text-[13px] font-semibold text-sf-text mt-5 mb-2.5">Sessões registradas</h2>
          {daySessions.map(x=>{
            const c = contents.find(k=>k.id===x.contentId);
            const subjectId = (c && c.subjectId) || x.subjectId;
            const title = (c && c.title) || x.title || 'Sessão de estudo';
            return (
              <div key={x.id} className="rounded-2xl p-3.5 mb-2.5 flex items-center gap-3" style={{background:'var(--card-bg)'}}>
                <SubjectIcon subjectId={subjectId} size={16}/>
                <div className="flex-1 min-w-0">
                  <p className="text-[13px] font-semibold text-sf-text truncate">{title}</p>
                  <p className="text-[11px] text-sf-muted mt-0.5">{(c && c.unitLabel) ? `${c.unitLabel} · ` : ''}{subjName(subjectId)}</p>
                </div>
                <span className="text-[12px] font-bold text-sf-accent shrink-0 tnum">{x.durationMin} min</span>
              </div>
            );
          })}
        </>
      )}

      <Fab onClick={()=>setSheet({date:sel})} label="Nova atividade"/>

      {sheet && (
        <PlannerItemSheet key={sheet.item ? sheet.item.id : 'nova'} item={sheet.item} date={sheet.date}
          onClose={()=>setSheet(null)}
          onSave={handleSave}
          onDelete={()=>{ deletePlannerItem(sheet.item.id); setSheet(null); }}/>
      )}
    </div>
  );
}

function SubjectSheetForm({sheet}){
  const {closeSubjectSheet, saveSubject, subjectsStore} = useApp();
  const editingId = sheet.id || null;
  const builtin = !!editingId && (editingId in BUILTIN_SUBJECTS);
  const [name, setName] = useState(()=>{
    if(!editingId) return '';
    const cust = subjectsStore.custom[editingId];
    return cust ? cust.name : subjName(editingId);
  });
  const [emoji, setEmoji] = useState(()=> editingId ? subjectEmoji(editingId) : DEFAULT_EMOJI);
  const [showErr, setShowErr] = useState(false);
  const nameRef = useRef(null);
  const valid = builtin || name.trim().length>0;

  const save = ()=>{
    if(!valid){ setShowErr(true); if(nameRef.current) nameRef.current.focus(); return; }
    const id = saveSubject({id: editingId || undefined, name, emoji});
    if(sheet.onSaved) sheet.onSaved(id);
    closeSubjectSheet();
  };

  return (
    <ModalShell onClose={closeSubjectSheet} labelledBy="subject-sheet-title" z={60}>
      <h2 id="subject-sheet-title" className="text-[18px] font-bold text-sf-text">{editingId ? 'Editar matéria' : 'Nova matéria'}</h2>

      <div className="flex items-end gap-3 mt-4">
        <div aria-hidden="true" className="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0"
          style={{background:'var(--brand-tint)', fontSize:30, lineHeight:1}}>{emoji}</div>
        <div className="flex-1 min-w-0">
          <label htmlFor="subject-name" className="block text-[12px] font-semibold text-sf-muted mb-2">Nome da matéria</label>
          <input id="subject-name" ref={nameRef} value={name} onChange={e=>setName(e.target.value)} readOnly={builtin} maxLength={40}
            placeholder="Ex: Biologia" className={INPUT_CLS} style={{color: builtin ? 'var(--text-secondary)' : 'var(--text-primary)'}}
            aria-invalid={showErr && !valid ? 'true' : undefined} aria-describedby={builtin ? 'subject-name-hint' : (showErr && !valid ? 'subject-name-err' : undefined)}/>
        </div>
      </div>
      {builtin && <p id="subject-name-hint" className="text-[12px] text-sf-muted mt-2">O nome das matérias padrão não pode ser alterado; você pode trocar o emoji.</p>}
      {showErr && !valid && <p id="subject-name-err" role="alert" className="text-[12px] text-sf-error mt-2">Dê um nome para a matéria.</p>}

      <p className="text-[12px] font-semibold text-sf-muted mt-5 mb-2">Emoji</p>
      <EmojiPicker value={emoji} onChange={setEmoji}/>

      <button type="button" onClick={save}
        className="sf-btn sf-btn-primary w-full mt-6 h-12 text-[14px] font-semibold flex items-center justify-center gap-2">
        <IconCheck size={16}/> {editingId ? 'Salvar' : 'Criar matéria'}
      </button>
      <button type="button" onClick={closeSubjectSheet} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[13px]">Cancelar</button>
    </ModalShell>
  );
}

        <h1 className="text-[22px] font-bold text-sf-text mt-1">Jornada de Aprendizado</h1>
        <div className="mt-6">
          <EmptyState Icon={IconRocket} title="Você ainda não começou nenhuma matéria.">
            <button type="button" onClick={()=>goTab('estudar')}
              className="sf-btn sf-btn-primary mt-3 h-11 px-4 text-[13px] font-semibold inline-flex items-center justify-center gap-1.5">
              <IconSearch size={13}/> Buscar matérias
            </button>
          </EmptyState>
        </div>
      </div>
    );
  }

  const topics = c.topics || [];
  const states = getTopicStates(c);
  const total = topics.length;
  const activeIdx = states.indexOf(TOPIC_STATUS.AVAILABLE);
  const page = activeIdx >= 0 ? activeIdx + 1 : total;

  return (
    <div className="pt-16 px-5 pb-8">
      <BackButton onClick={()=>openDetalhe(c.id)} label="Voltar ao conteúdo"/>
      <div className="mt-1"><SubjectTag subjectId={c.subjectId}/></div>
      <h1 className="text-[22px] font-bold text-sf-text mt-2">Jornada de Aprendizado</h1>
      <p className="text-[12px] text-sf-muted mt-1">{c.title} · siga as etapas para dominar este conteúdo</p>

      {total === 0 ? (
        <div className="mt-6">
          <EmptyState title="Este conteúdo ainda não tem etapas." hint="Abra o conteúdo para montar a trilha de estudos.">
            <button type="button" onClick={()=>openDetalhe(c.id)}
              className="sf-btn sf-btn-primary mt-3 h-11 px-4 text-[13px] font-semibold">Abrir conteúdo</button>
          </EmptyState>
        </div>
      ) : (
        <>
          <p className="text-[11px] text-sf-muted text-right mt-1 tnum">Etapa {page} de {total}</p>

          <ol className="mt-4 relative list-none p-0 m-0">
            <li aria-hidden="true" className="absolute left-[15px] top-3 bottom-3 w-[2px] bg-sf-overlay"/>
            {topics.map((topic,i)=>{
              const isActive = states[i] === TOPIC_STATUS.AVAILABLE;
              const isDone = states[i] === TOPIC_STATUS.COMPLETED;
              const isLocked = states[i] === TOPIC_STATUS.LOCKED;
              const ttype = getTopicType(c, i);
              const meta = MODULE_META[ttype];
              return (
                <li key={i} className="relative flex items-start gap-3.5 pb-4">
                  <span className="w-8 h-8 rounded-full flex items-center justify-center text-[12px] font-bold shrink-0 z-10 tnum"
                    style={{
                      background: isDone ? 'var(--success)' : (isActive ? 'var(--blue-500)' : 'var(--bg-overlay)'),
                      color: isDone ? 'var(--on-success)' : (isActive ? '#fff' : 'var(--text-secondary)'),
                      border: `2px solid ${isDone ? 'var(--success)' : (isActive ? 'var(--blue-500)' : 'var(--bg-overlay)')}`,
                    }}>
                    {isDone ? <IconCheck size={13}/> : (isLocked ? <IconLock size={12}/> : i+1)}
                  </span>
                  <div className="rounded-2xl p-3.5 flex-1 min-w-0"
                    style={{
                      background: isActive ? 'var(--brand-tint-soft)' : 'var(--card-bg)',
                      border: isActive ? '1px solid var(--brand-border-strong)' : '1px solid transparent'
                    }}>
                    <div className="flex items-start justify-between gap-2">
                      <p className="text-[14px] font-semibold text-sf-text">{topic.t}</p>
                      <span className="text-[11px] font-bold inline-flex items-center gap-1 shrink-0 pt-0.5" style={{color: meta.color}}>
                        <meta.Icon size={11}/> {meta.label}
                      </span>
                    </div>
                    <p className="text-[11px] text-sf-muted mt-1">
                      {isDone ? 'Concluído' : (isActive ? 'Etapa atual' : 'Bloqueado · conclua a etapa anterior')}
                    </p>
                    {topic.objective && <p className="text-[11px] text-sf-muted mt-1 italic">{topic.objective}</p>}
                    {isActive && (
                      <>
                        <button type="button" onClick={()=>openModule(c.id, i)}
                          className="sf-btn sf-btn-primary w-full mt-2.5 h-11 text-[12px] font-semibold flex items-center justify-center gap-1.5">
                          <IconPlay size={11}/> Abrir módulo
                        </button>
                        {ttype !== MODULE_TYPES.QUIZ && (
                          <button type="button" onClick={()=>completeTopic(c.id, i)}
                            className="sf-btn sf-btn-secondary w-full mt-2 h-11 text-[12px] font-semibold flex items-center justify-center gap-1.5">
                            <IconCheck size={12}/> Concluir etapa
                          </button>
                        )}
                      </>
                    )}
                  </div>
                </li>
              );
            })}
          </ol>

          {activeIdx >= 0 && (
            <button type="button" onClick={()=>openModule(c.id, activeIdx)}
              className="sf-btn sf-btn-primary w-full mt-4 h-12 text-[14px] font-semibold flex items-center justify-center gap-2">
              <IconPlay size={13}/> Continuar módulo atual
            </button>
          )}
        </>
      )}
    </div>
  );
}

          className="flex-1 min-w-0 min-h-[44px] -my-2 flex items-center gap-3 text-left bg-transparent border-0 p-0">
          <span className="w-[22px] h-[22px] rounded-full flex items-center justify-center shrink-0"

            {t.done && <IconCheck size={12}/>}
          </span>
          <span className="flex-1 min-w-0">
            <span className="block text-[13px] font-semibold truncate"

          <button type="button" onClick={()=>setConfirm(false)} className="sf-btn sf-btn-ghost h-11 px-3 text-[12px]">Cancelar</button>
        </div>

function TarefasScreen(){
  const {tasks, toggleTask, addTask, deleteTask, closeView} = useApp();
  const [adding, setAdding] = useState(false);
  const [title, setTitle] = useState('');
  const [subjectId, setSubjectId] = useState(()=> Object.keys(SUBJECTS)[0]);
  const [showErr, setShowErr] = useState(false);
  const inputRef = useRef(null);

  const pending = tasks.filter(t=>!t.done);
  const done = tasks.filter(t=>t.done);

  useEffect(()=>{ if(adding && inputRef.current) inputRef.current.focus(); }, [adding]);

  const handleAdd = ()=>{
    if(!title.trim()){ setShowErr(true); if(inputRef.current) inputRef.current.focus(); return; }
    addTask(title.trim(), subjectId);
    setTitle(''); setShowErr(false); setAdding(false);
  };
  const cancel = ()=>{ setAdding(false); setTitle(''); setShowErr(false); };

  return (
    <div className="pt-16 px-5 pb-8 relative">
      <BackButton onClick={closeView}/>
      <h1 className="text-[24px] font-bold text-sf-text mt-1">Lista de Tarefas</h1>
      <p className="text-[12px] text-sf-muted mt-1 tnum">{pending.length} {pending.length===1 ? 'pendente' : 'pendentes'} · {done.length} {done.length===1 ? 'concluída' : 'concluídas'}</p>

      {adding && (
        <form className="mt-4 rounded-2xl p-3.5" style={{background:'var(--card-bg)'}} onSubmit={(e)=>{ e.preventDefault(); handleAdd(); }}>
          <label htmlFor="task-title" className="block text-[12px] font-semibold text-sf-muted mb-2">Nova tarefa</label>
          <input id="task-title" ref={inputRef} value={title} onChange={e=>setTitle(e.target.value)} maxLength={120} placeholder="Ex: Resolver a lista de exercícios"
            className={INPUT_CLS} aria-invalid={showErr && !title.trim() ? 'true' : undefined} aria-describedby={showErr && !title.trim() ? 'task-err' : undefined}/>
          {showErr && !title.trim() && <p id="task-err" role="alert" className="text-[12px] text-sf-error mt-2">Escreva um título para a tarefa.</p>}
          <div role="group" aria-label="Matéria da tarefa" className="flex gap-2 mt-3 flex-wrap">
            {Object.keys(SUBJECTS).map(k=>(
              <button type="button" key={k} onClick={()=>setSubjectId(k)} aria-pressed={subjectId===k}
                className="px-3.5 h-11 rounded-full text-[12px] font-semibold flex items-center gap-1.5"
                style={{
                  background: subjectId===k ? SUBJECTS[k].accent : 'var(--bg-surface)',
                  color: subjectId===k ? inkOn(SUBJECTS[k].accent) : 'var(--text-secondary)',
                  border: `1px solid ${SUBJECTS[k].accent}50`,
                }}>
                <span aria-hidden="true">{SUBJECTS[k].emoji}</span>{subjName(k)}
              </button>
            ))}
          </div>
          <div className="flex gap-2 mt-3">
            <button type="submit" className="sf-btn sf-btn-primary flex-1 h-11 text-[13px] font-semibold">Salvar</button>
            <button type="button" onClick={cancel} className="sf-btn sf-btn-ghost h-11 px-4 text-[13px]">Cancelar</button>
          </div>
        </form>
      )}

      {tasks.length === 0 && !adding && (
        <div className="mt-6">
          <EmptyState Icon={IconClipboard} title="Nenhuma tarefa por aqui" hint="Anote o que você precisa estudar ou entregar.">
            <button type="button" onClick={()=>setAdding(true)}
              className="sf-btn sf-btn-primary mt-3 h-11 px-4 text-[13px] font-semibold inline-flex items-center gap-1.5">
              <IconPlus size={14}/> Nova tarefa
            </button>
          </EmptyState>
        </div>
      )}

      {pending.length > 0 && (
        <>
          <h2 className="text-[11px] font-bold text-sf-muted tracking-[1.5px] mt-6 mb-2.5 uppercase">Pendentes</h2>
          {pending.map(t=>(<TaskRow key={t.id} t={t} onToggle={()=>toggleTask(t.id)} onDelete={()=>deleteTask(t.id)}/>))}
        </>
      )}
      {done.length > 0 && (
        <>
          <h2 className="text-[11px] font-bold text-sf-muted tracking-[1.5px] mt-6 mb-2.5 uppercase">Concluídas</h2>
          {done.map(t=>(<TaskRow key={t.id} t={t} onToggle={()=>toggleTask(t.id)} onDelete={()=>deleteTask(t.id)}/>))}
        </>
      )}

      <Fab onClick={()=>setAdding(a=>!a)} label={adding ? 'Fechar formulário de tarefa' : 'Nova tarefa'}/>
    </div>
  );
}

function CriarConteudoScreen(){
  const {closeView, addUserSubject, openSubjectSheet, openDetalhe} = useApp();
  const [title, setTitle] = useState('');
  const [subjectId, setSubjectId] = useState(()=> Object.keys(SUBJECTS)[0]);
  const [desc, setDesc] = useState('');
  const [estMin, setEstMin] = useState('');
  const [type, setType] = useState('flashcards');
  const [showErr, setShowErr] = useState(false);
  const titleRef = useRef(null);

  const handleSave = ()=>{
    if(!title.trim()){ setShowErr(true); if(titleRef.current) titleRef.current.focus(); return; }
    const minutes = Math.min(600, Math.max(1, parseInt(String(estMin).replace(/\D/g,''), 10) || 15));

    const newContent = {
      id: 'user-' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      title: title.trim(),
      subjectId,
      unitLabel: ({flashcards:'Flashcards', resumo:'Resumo', lista:'Lista'})[type] || 'Conteúdo',
      estMinutes: minutes,
      desc: desc.trim(),
      topics: [],
    };

    const id = addUserSubject(newContent);
    closeView();
    if(id) openDetalhe(id);
  };

  return (
    <form className="pt-16 px-5 pb-8" onSubmit={(e)=>{ e.preventDefault(); handleSave(); }} noValidate>
      <BackButton onClick={closeView}/>
      <h1 className="text-[24px] font-bold text-sf-text mt-1">Criar Conteúdo</h1>
      <p className="text-[12px] text-sf-muted mt-1">Adicione um novo material de estudo</p>

      <FieldLabel htmlFor="cc-title">Título</FieldLabel>
      <input id="cc-title" ref={titleRef} value={title} onChange={e=>setTitle(e.target.value)} maxLength={80} placeholder="Ex: Cálculo — Derivadas"

function YouTubeVideoScreen({video, context}){
  const {closeView, openYouTubeVideo} = useApp();
  const [related, setRelated] = useState([]);
  const [relState, setRelState] = useState('idle'); // idle | loading | ok | empty | error
  const [relKey, setRelKey] = useState(0);
  const valid = !!video && isValidYouTubeId(video.id);

  useEffect(()=>{
    if(!valid) return;
    const contentTitle = (context && context.contentTitle) ? context.contentTitle : '';
    const subjectName = (context && context.subjectId) ? subjName(context.subjectId) : '';
    const topicName = (context && context.topic) ? context.topic : '';
    const q = (contentTitle && topicName)
      ? `${contentTitle} ${topicName} aula`
      : (subjectName && topicName)
        ? `${subjectName} ${topicName} aula`
        : (contentTitle || subjectName || video.title || '');
    if(q.trim().length < 3){ setRelated([]); setRelState('empty'); return; }
    let cancelled = false;
    setRelState('loading');
    searchYouTubeVideosDetailed(q).then(res=>{
      if(cancelled) return;
      const list = res.videos.filter(v => v.id !== video.id).slice(0, 4);
      setRelated(list);
      setRelState(res.status === 'error' ? 'error' : (list.length ? 'ok' : 'empty'));
    });
    return ()=>{ cancelled = true; };
  }, [valid && video.id, context && context.contentTitle, context && context.subjectId, context && context.topic, relKey]);

  if(!valid){
    return (
      <div className="pt-16 px-5 pb-8">
        <BackButton onClick={closeView}/>
        <div className="mt-6"><EmptyState title="Vídeo não encontrado" hint="O vídeo pode ter sido removido ou o link é inválido."/></div>
      </div>
    );
  }

  return (
    <div className="pt-16 px-5 pb-8">
      <BackButton onClick={closeView}/>

      <div className="mt-3">
        <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-[11px] text-[11px] font-semibold bg-sf-overlay text-sf-accent">
          <IconPlay size={9}/> YOUTUBE
        </span>
      </div>

      <h1 className="text-[20px] font-bold text-sf-text mt-2 break-words">{video.title}</h1>
      <p className="text-[12px] text-sf-muted mt-1">{video.channel}</p>

      <div className="mt-4 rounded-2xl overflow-hidden bg-black" style={{aspectRatio:'16 / 9'}}>
        <iframe width="100%" height="100%" style={{border:0}}
          src={youTubeEmbedUrl(video.id)}
          title={`Videoaula: ${video.title}`}
          referrerPolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowFullScreen/>
      </div>
      <a href={`https://www.youtube.com/watch?v=${video.id}`} target="_blank" rel="noopener noreferrer"
        className="mt-2 inline-flex items-center min-h-[44px] text-[12px] font-semibold text-sf-accent underline">
        Não carregou? Abrir no YouTube
      </a>

      <div className="mt-3 rounded-2xl p-4" style={{background:'var(--card-bg)'}}>
        <h2 className="text-[13px] font-bold text-sf-text">Sobre este vídeo</h2>
        <p className="text-[12px] text-sf-muted mt-2 leading-relaxed break-words">
          {video.description || 'Conteúdo encontrado pelo STUDY no YouTube.'}
        </p>
      </div>

      {(relState === 'loading' || relState === 'ok' || relState === 'error') && (
        <>
          <h2 className="text-[13px] font-bold text-sf-text mt-6 mb-2.5">Vídeos relacionados</h2>
          {relState === 'loading' && <p role="status" className="text-[12px] text-sf-muted">Carregando vídeos relacionados...</p>}
          {relState === 'error' && (
            <InlineError title="Não foi possível carregar os vídeos relacionados."
              hint="Confira sua conexão e se o servidor do STUDY está em execução." onRetry={()=>setRelKey(k=>k+1)}/>
          )}
          {relState === 'ok' && related.map(v=>(
            <button type="button" key={v.id} onClick={()=>openYouTubeVideo(v, null, context)}
              className="sf-card sf-press w-full text-left rounded-2xl p-3 mb-2 flex items-center gap-3">
              <span className="w-14 h-11 rounded-xl overflow-hidden flex items-center justify-center shrink-0"
                style={{background:'linear-gradient(135deg, var(--media-a), var(--media-b))', color:'#fff'}}>
                {v.thumbnail ? <img src={v.thumbnail} alt="" loading="lazy" referrerPolicy="no-referrer" className="w-full h-full object-cover"/> : <IconPlay size={14}/>}
              </span>
              <span className="flex-1 min-w-0">

                <span className="block text-[11px] text-sf-muted mt-0.5 truncate">{v.channel}</span>
              </span>
            </button>
          ))}

      )}

function fmtScore(n){
  const v = Number(n);
  return Number.isFinite(v) ? v.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) : '—';
}
