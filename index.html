/* Plano (D1, A19): reúne o Planner (itens com data, sf_planner) e as Tarefas (itens sem data, sf_tasks) sem migrar dados. */
/* Grade mensal (Figma: "Grade mensal" + "Dia do mês"). Semana começa na segunda; 6 linhas fixas.
   Hoje = contorno; selecionado = preenchido; ponto = há atividade no Plano. Setas movem o foco (tabindex itinerante); Enter seleciona. */
function MonthGrid({sel, onSelect, byDate}){
  const today = todayStr();
  const [month, setMonth] = useState(()=>{ const d = parseDateStr(sel); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [focusDs, setFocusDs] = useState(sel);
  const gridRef = useRef(null);
  useEffect(()=>{ const d = parseDateStr(sel); if(d.getMonth() !== month.getMonth() || d.getFullYear() !== month.getFullYear()) setMonth(new Date(d.getFullYear(), d.getMonth(), 1)); setFocusDs(sel); }, [sel]);
  const first = toDateStr(month);
  const offset = (month.getDay() + 6) % 7;
  const start = addDaysStr(first, -offset);
  const cells = Array.from({length:42}, (_, i)=> addDaysStr(start, i));
  const shift = (n)=> setMonth(m => new Date(m.getFullYear(), m.getMonth() + n, 1));
  const move = (ds)=>{ const d = parseDateStr(ds); if(d.getMonth() !== month.getMonth()) setMonth(new Date(d.getFullYear(), d.getMonth(), 1)); setFocusDs(ds);
    setTimeout(()=>{ const el = gridRef.current && gridRef.current.querySelector(`[data-ds="${ds}"]`); if(el) el.focus(); }, 0); };
  const onKey = (e, ds)=>{
    const m = {ArrowRight:1, ArrowLeft:-1, ArrowDown:7, ArrowUp:-7}[e.key];
    if(m){ e.preventDefault(); move(addDaysStr(ds, m)); }
  };
  const tabbable = cells.includes(focusDs) ? focusDs : (cells.includes(sel) ? sel : first);
  const label = `${MONTHS_LONG[month.getMonth()]} de ${month.getFullYear()}`;
  const WD = ['S','T','Q','Q','S','S','D'];
  return (
    <section aria-label={`Calendário de ${label}`}>
      <div className="flex items-center gap-2">
        <h2 className="flex-1 m-0 text-[17px] leading-[22px] font-semibold text-sf-text" aria-live="polite">{label}</h2>
        <button type="button" onClick={()=>shift(-1)} className="sf-icon-btn sf-tip" data-tip="Mês anterior" aria-label="Mês anterior"><span style={{transform:'rotate(180deg)', display:'inline-flex'}}><IconChevronR size={16}/></span></button>
        <button type="button" onClick={()=>shift(1)} className="sf-icon-btn sf-tip" data-tip="Próximo mês" aria-label="Próximo mês"><IconChevronR size={16}/></button>
      </div>
      <div className="grid grid-cols-7 mt-2" aria-hidden="true">{WD.map((w,i)=><span key={i} className="text-center text-[13px] leading-[16px] font-medium text-sf-muted py-1">{w}</span>)}</div>
      <div ref={gridRef} className="grid grid-cols-7 gap-y-0.5" role="grid" aria-label={label}>
        {cells.map(ds=>{
          const d = parseDateStr(ds); const out = d.getMonth() !== month.getMonth();
          const on = ds === sel, isToday = ds === today, n = (byDate[ds] || []).length;
          return (
            <button type="button" key={ds} data-ds={ds} tabIndex={ds === tabbable ? 0 : -1} onClick={()=>onSelect(ds)} onKeyDown={(e)=>onKey(e, ds)}
              aria-pressed={on} aria-current={isToday ? 'date' : undefined}
              aria-label={`${d.getDate()} de ${MONTHS_LONG[d.getMonth()]}${isToday ? ', hoje' : ''}${n ? `, ${n} ${plural(n,'atividade','atividades')}` : ''}`}
              className="h-12 flex flex-col items-center justify-center gap-0.5 bg-transparent border-0 cursor-pointer rounded-lg">
              <span className="w-[34px] h-[34px] rounded-full flex items-center justify-center text-[15px] font-semibold tnum" aria-hidden="true"
                style={{background: on ? 'var(--blue-500)' : 'transparent', color: on ? 'var(--on-brand)' : (out ? 'var(--text-disabled)' : (isToday ? 'var(--blue-300)' : 'var(--text-primary)')),
                        boxShadow: isToday && !on ? 'inset 0 0 0 1.5px var(--blue-300)' : 'none'}}>{d.getDate()}</span>
              <span className="w-1 h-1 rounded-full" aria-hidden="true" style={{background: n ? (out ? 'var(--text-disabled)' : 'var(--blue-300)') : 'transparent'}}/>
            </button>
          );
        })}
      </div>
    </section>
  );
}

  const [sel, setSel] = useState(()=> initialDate || todayStr());

  const [sheet, setSheet] = useState(null);

  const WEEKDAYS = ['D','S','T','Q','Q','S','S'];
  const selectDay = (ds)=>{ setSel(ds); const d = parseDateStr(ds); setMonth({y:d.getFullYear(), m:d.getMonth()}); };
  const prevMonth = ()=> setMonth(m=> m.m===0 ? {y:m.y-1, m:11} : {y:m.y, m:m.m-1});
  const nextMonth = ()=> setMonth(m=> m.m===11 ? {y:m.y+1, m:0} : {y:m.y, m:m.m+1});

  const firstDay = new Date(month.y, month.m, 1);
  const daysInMonth = new Date(month.y, month.m+1, 0).getDate();
  const cells = [];
  for(let i=0; i<firstDay.getDay(); i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const plannerDays = useMemo(()=>{
    const map = {};
    planner.forEach(p=>{ const e = map[p.date] || (map[p.date] = {total:0, pending:0}); e.total++; if(!p.done) e.pending++; });
    return map;
  },[planner]);
  const sessionDays = useMemo(()=>{
    const set = {};
    liveSessions.forEach(x=>{
      const ts = x.startedAt || x.dateTs;
      if(!ts) return;
      const k = toDateStr(new Date(ts));
      set[k] = (set[k]||0)+1;
    });
    return set;
  },[liveSessions]);

  const dayItems = useMemo(()=> planner.filter(p=>p.date===sel).sort((a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99')), [planner, sel]);
  const daySessions = liveSessions.filter(x=>{
    const ts = x.startedAt || x.dateTs;
    return ts && toDateStr(new Date(ts))===sel;
  });
  const doneCount = dayItems.filter(p=>p.done).length;
  const today = todayStr();

  const handleSave = (data)=>{ savePlannerItem(data); selectDay(data.date); setSheet(null); };

  return (
    <div className="pt-16 px-5 pb-8 relative">
      <BackButton onClick={closeView}/>
      <div className="flex items-start justify-between mt-1">
        <div>
          <SubTitle>Mês do Plano</SubTitle>
          <p className="text-[14px] text-sf-muted mt-1">Anote o que precisa fazer e marque quando terminar.</p>
        </div>
        {sel!==today && (
          <button type="button" onClick={()=>selectDay(today)}
            className="sf-btn sf-btn-secondary h-11 px-4 rounded-full text-[12px] font-semibold">Hoje</button>
        )}
      </div>

      <div className="mt-5 rounded-2xl p-4" style={{background:'var(--card-bg)'}}>
        <div className="flex items-center justify-between -mx-2 -mt-2">
          <PlannerNavBtn onClick={prevMonth} label="Mês anterior" flip/>
          <p aria-live="polite" className="text-[14px] font-semibold text-sf-text">{MONTHS_LONG[month.m]} {month.y}</p>
          <PlannerNavBtn onClick={nextMonth} label="Próximo mês"/>
        </div>
        <div className="grid grid-cols-7 gap-1 mt-2">
          {WEEKDAYS.map((w,i)=>(<span key={i} aria-hidden="true" className="text-center text-[11px] font-semibold text-sf-faint py-1">{w}</span>))}
          {cells.map((dn,i)=>{
            if(dn===null) return <span key={`e-${i}`}/>;
            const ds = `${month.y}-${pad2(month.m+1)}-${pad2(dn)}`;
            const isToday = ds===today;
            const isSelected = ds===sel;
            const pd = plannerDays[ds];
            let dot = null;
            if(pd) dot = isSelected ? '#fff' : (pd.pending>0 ? 'var(--blue-300)' : 'var(--success)');
            else if(sessionDays[ds]>0) dot = isSelected ? '#fff' : 'var(--text-tertiary)';
            const info = [];
            if(pd) info.push(pd.pending>0 ? `${pd.total} ${pd.total===1?'atividade':'atividades'}, ${pd.pending} pendente${pd.pending===1?'':'s'}` : `${pd.total} ${pd.total===1?'atividade concluída':'atividades concluídas'}`);
            if(sessionDays[ds]>0) info.push(`${sessionDays[ds]} ${sessionDays[ds]===1?'sessão':'sessões'} de estudo`);
            const label = parseDateStr(ds).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}) + (isToday ? ', hoje' : '') + (info.length ? ', ' + info.join(', ') : '');
            return (
              <button type="button" key={`d-${dn}`} onClick={()=>selectDay(ds)} aria-label={label} aria-pressed={isSelected}
                aria-current={isToday ? 'date' : undefined}
                className="relative min-h-[40px] aspect-square flex flex-col items-center justify-center rounded-lg border-0 bg-transparent">
                <span className="text-[12px] font-semibold tnum"
                  style={{
                    color: isSelected ? '#fff' : (isToday ? 'var(--blue-300)' : 'var(--text-primary)'),
                    width:28, height:28, borderRadius:'50%',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    background: isSelected ? 'var(--blue-500)' : 'transparent',
                    boxShadow: isToday && !isSelected ? 'inset 0 0 0 1px #60A5FA' : 'none',
                  }}>{dn}</span>
                {dot && <span className="block w-1 h-1 rounded-full mt-0.5" style={{background: dot}}/>}
              </button>
            );
          })}
        </div>
        <div className="flex items-center gap-4 mt-3 text-[11px] text-sf-muted flex-wrap">
          <span className="inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-sf-accent"/>Pendente</span>
          <span className="inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-sf-success"/>Concluído</span>
          <span className="inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-sf-faint"/>Só sessões</span>
        </div>
      </div>

      <div className="flex items-center justify-between mt-4 mb-2">
        <PlannerNavBtn onClick={()=>selectDay(addDaysStr(sel,-1))} label="Dia anterior" flip/>
        <div className="text-center" aria-live="polite">
          <h2 className="text-[13px] font-semibold text-sf-text">
            {capitalize(parseDateStr(sel).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}))}
          </h2>
          <p className="text-[11px] text-sf-muted mt-0.5">
            {dayItems.length ? `${doneCount} de ${dayItems.length} concluídas` : 'Sem atividades'}
          </p>
        </div>
        <PlannerNavBtn onClick={()=>selectDay(addDaysStr(sel,1))} label="Próximo dia"/>
      </div>

      {dayItems.length===0 ? (
        <button type="button" onClick={()=>setSheet({date:sel})}
          className="w-full rounded-2xl p-4 text-left bg-transparent"
          style={{border:'1px dashed var(--border-strong)'}}>
          <span className="block text-[13px] font-semibold text-sf-text">Nada planejado para este dia</span>
          <span className="block text-[12px] text-sf-muted mt-1">Toque para adicionar uma atividade.</span>
        </button>
      ) : dayItems.map(it=>(
        <PlannerRow key={it.id} it={it}
          isActive={!!session && session.plannerId===it.id}
          otherActive={!!session && session.plannerId!==it.id}
          onOpen={()=>setSheet({item:it, date:it.date})}
          onToggle={()=>togglePlannerDone(it.id)}
          onStart={()=>startPlannerSession(it.id)}
          onOpenTimer={()=>setTimerExpanded(true)}/>
      ))}

      {daySessions.length>0 && (
        <>
          <h2 className="text-[13px] font-semibold text-sf-text mt-5 mb-2.5">Sessões registradas</h2>
          {daySessions.map(x=>{
            const c = contents.find(k=>k.id===x.contentId);
            const subjectId = (c && c.subjectId) || x.subjectId;
            const title = (c && c.title) || x.title || 'Sessão de estudo';
            return (
              <div key={x.id} className="rounded-2xl p-3.5 mb-2.5 flex items-center gap-3" style={{background:'var(--card-bg)'}}>
                <SubjectIcon subjectId={subjectId} size={16}/>
                <div className="flex-1 min-w-0">
                  <p className="text-[13px] font-semibold text-sf-text truncate">{title}</p>
                  <p className="text-[11px] text-sf-muted mt-0.5">{subjName(subjectId)}</p>
                </div>
                <span className="text-[12px] font-bold text-sf-accent shrink-0 tnum">{x.durationMin} min</span>
              </div>
            );
          })}
        </>
      )}

      <Fab onClick={()=>setSheet({date:sel})} label="Nova atividade"/>

      {sheet && (
        <PlannerItemSheet key={sheet.item ? sheet.item.id : 'nova'} item={sheet.item} date={sheet.date}
          onClose={()=>setSheet(null)}
          onSave={handleSave}
          onDelete={()=>{ deletePlannerItem(sheet.item.id); setSheet(null); }}/>
      )}
    </div>
  );
}

/* Editar/Nova matéria (Figma: "Personalizar matéria"). Folha no celular, diálogo central a partir de 600 px.
   Ícone é o padrão; emoji é opcional e vem do teclado do sistema (o Study não mantém biblioteca de emojis). */
function SubjectSheetForm({sheet}){
  const {closeSubjectSheet, saveSubject, subjectsStore} = useApp();
  const band = useBand();
  const editingId = sheet.id || null;
  const builtin = !!editingId && (editingId in BUILTIN_SUBJECTS);
  const [name, setName] = useState(()=>{
    if(!editingId) return '';
    const cust = subjectsStore.custom[editingId];
    return cust ? cust.name : subjName(editingId);
  });
  const initIdent = editingId ? subjectIdent(editingId) : {type:'icon', icon:'geral'};
  const [kind, setKind] = useState(initIdent.type);
  const [icon, setIcon] = useState(initIdent.type === 'icon' ? initIdent.icon : 'geral');
  const [emoji, setEmoji] = useState(initIdent.type === 'emoji' ? initIdent.emoji : '');
  const [emojiRaw, setEmojiRaw] = useState('');
  const [accent, setAccent] = useState(()=>{
    if(editingId && SUBJECTS[editingId]) return SUBJECTS[editingId].accent;
    return CUSTOM_COLORS[Object.keys(subjectsStore.custom || {}).length % CUSTOM_COLORS.length];
  });
  const [showErr, setShowErr] = useState(false);
  const nameRef = useRef(null);
  const emojiRef = useRef(null);
  const valid = (builtin || name.trim().length>0) && (kind === 'icon' || !!emoji);
  const ident = kind === 'emoji' && emoji ? {type:'emoji', emoji} : {type:'icon', icon};
  const desk = band !== 'mobile';

  /* Fase 4: matérias são as pastas do Explorar; duas com o mesmo nome dividiriam os conteúdos em gavetas iguais. */
  const fold = (x)=> String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
  const dupId = !builtin && name.trim() ? Object.keys(SUBJECTS).find(k => k !== editingId && fold(subjName(k)) === fold(name)) : null;
  const save = ()=>{
    if(!(builtin || name.trim().length>0)){ setShowErr(true); if(nameRef.current) nameRef.current.focus(); return; }
    if(dupId){ setShowErr(true); if(nameRef.current) nameRef.current.focus(); return; }
    if(kind === 'emoji' && !emoji){ setShowErr(true); if(emojiRef.current) emojiRef.current.focus(); return; }
    const id = saveSubject({id: editingId || undefined, name, ident, accent});
    if(sheet.onSaved) sheet.onSaved(id);
    closeSubjectSheet();
  };
  const onEmoji = (raw)=>{ const g = firstEmoji(raw); if(g){ setEmoji(g); setEmojiRaw(''); } else setEmojiRaw(raw); };
  const shownName = (builtin ? subjName(editingId) : name.trim()) || 'Nova matéria';

  return (
    <ModalShell onClose={closeSubjectSheet} labelledBy="subject-sheet-title" z={60}>
      <h2 id="subject-sheet-title" className="text-[19px] leading-[24px] font-bold text-sf-text">{editingId ? 'Editar matéria' : 'Nova matéria'}</h2>

      <div className="mt-5 flex items-center gap-3 rounded-xl p-3" style={{background:'var(--bg-outer)'}}>
        <SubjectTile subjectId={editingId} ident={ident} accent={accent}/>
        <div className="min-w-0">
          <p className="text-[17px] leading-[22px] font-semibold text-sf-text truncate">{shownName}</p>
          <p className="text-[14px] leading-[18px] text-sf-muted">Prévia de como a matéria aparece no app</p>
        </div>
      </div>

      <label htmlFor="subject-name" className="block text-[15px] leading-[20px] font-semibold text-sf-muted mt-5 mb-2">Nome</label>
      <input id="subject-name" ref={nameRef} value={builtin ? subjName(editingId) : name} onChange={e=>setName(e.target.value)} readOnly={builtin} maxLength={40}
        placeholder="Ex.: Biologia" className={INPUT_CLS} style={{color: builtin ? 'var(--text-secondary)' : 'var(--text-primary)'}}
        aria-invalid={showErr && !builtin && !name.trim() ? 'true' : undefined} aria-describedby={builtin ? 'subject-name-hint' : ((showErr && !name.trim()) || dupId ? 'subject-name-err' : undefined)}/>
      {builtin && <p id="subject-name-hint" className="text-[13px] leading-[16px] text-sf-muted mt-2">Nas matérias que já vêm no Study, dá para trocar o ícone e a cor, mas não o nome.</p>}
      {showErr && !builtin && !name.trim() && <p id="subject-name-err" role="alert" className="text-[13px] text-sf-error mt-2">Dê um nome para a matéria.</p>}
      {dupId && <p id="subject-name-err" role="alert" className="text-[13px] text-sf-error mt-2">Já existe a matéria {subjName(dupId)}. Use outro nome ou escolha a matéria existente.</p>}

      <p id="subject-ident-label" className="text-[15px] leading-[20px] font-semibold text-sf-muted mt-5 mb-2">Identificação</p>
      <div className="sf-seg w-full" role="radiogroup" aria-labelledby="subject-ident-label">
        {[['icon','Ícone'],['emoji','Emoji']].map(([k,l])=>(
          <label key={k} className="sf-seg-item flex-1">
            <input type="radio" name="subject-ident" checked={kind===k} onChange={()=>{ setKind(k); if(k==='emoji') setTimeout(()=>{ if(emojiRef.current) emojiRef.current.focus(); }, 0); }}/>{l}
          </label>
        ))}
      </div>

      {kind === 'icon' ? (
        <div className="mt-3">
          <div className="grid grid-cols-8 gap-2" role="radiogroup" aria-label="Ícone da matéria">
            {Object.keys(SUBJECT_ICONS).map(k=>{
              const on = icon === k;
              return (
                <button key={k} type="button" role="radio" aria-checked={on} onClick={()=>setIcon(k)} aria-label={SUBJECT_ICONS[k].label} title={SUBJECT_ICONS[k].label}
                  className="aspect-square min-h-[36px] rounded-[10px] flex items-center justify-center cursor-pointer"
                  style={{background: on ? 'var(--brand-tint-2)' : 'transparent', border: on ? '2px solid var(--blue-400)' : '1px solid var(--border)'}}>
                  <SubjIconSvg name={k} size={desk ? 22 : 18} color={on ? readableOn(accent, tokenColor('--bg-surface','#101827'), 3) : 'var(--text-secondary)'}/>
                </button>
              );
            })}
          </div>
          <p className="text-[13px] leading-[16px] font-medium text-sf-faint mt-2" aria-live="polite">Ícone selecionado: {SUBJECT_ICONS[icon].label}</p>
        </div>
      ) : (
        <div className="mt-3 flex items-center gap-4">
          <input ref={emojiRef} aria-label="Emoji da matéria" value={emojiRaw || emoji} onChange={e=>onEmoji(e.target.value)}
            className="sf-input w-16 h-16 shrink-0 text-center text-[32px] p-0" inputMode="text" autoComplete="off"
            aria-invalid={showErr && !emoji ? 'true' : undefined} aria-describedby="subject-emoji-hint"/>
          <div className="min-w-0" id="subject-emoji-hint">
            <p className="text-[15px] leading-[20px] text-sf-text">{desk ? 'Clique no bloco e escolha no seletor de emojis do sistema.' : 'Toque no bloco para abrir os emojis do teclado.'}</p>
            <p className="text-[14px] leading-[18px] text-sf-muted mt-1">{desk ? 'Windows: tecla Windows + ponto. Mac: Control + Command + Espaço. Use um único emoji.' : 'Use um único emoji. Ele aparece no mesmo bloco, sobre a cor da matéria.'}</p>
            {showErr && !emoji && <p role="alert" className="text-[13px] text-sf-error mt-1">Escolha um emoji ou volte para Ícone.</p>}
          </div>
        </div>
      )}

      <p id="subject-color-label" className="text-[15px] leading-[20px] font-semibold text-sf-muted mt-5 mb-2">Cor</p>
      <div className="flex flex-wrap gap-1" role="radiogroup" aria-labelledby="subject-color-label">
        {SUBJECT_PALETTE.map((c,i)=>{
          const on = (accent||'').toLowerCase() === c.toLowerCase();
          return (
            <button key={c} type="button" role="radio" aria-checked={on} onClick={()=>setAccent(c)} aria-label={`Cor ${i+1}`}
              className="w-11 h-11 rounded-full flex items-center justify-center cursor-pointer bg-transparent"
              style={{border: on ? '2px solid var(--text-primary)' : '2px solid transparent'}}>
              <span className="w-6 h-6 rounded-full" style={{background:c}}/>
            </button>
          );
        })}
      </div>

      <div className={desk ? 'mt-6 flex justify-end gap-3' : 'mt-6'}>
        {desk && <button type="button" onClick={closeSubjectSheet} className="sf-btn sf-btn-ghost h-11 px-4 text-[15px] font-semibold">Cancelar</button>}
        <button type="button" onClick={save} className={`sf-btn sf-btn-primary h-12 text-[15px] font-semibold ${desk ? 'px-5 h-11' : 'w-full'}`}>
          {editingId ? 'Salvar' : 'Criar matéria'}
        </button>
        {!desk && <button type="button" onClick={closeSubjectSheet} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[15px]">Cancelar</button>}
      </div>
    </ModalShell>
  );
}

function JornadaScreen({contentId}){
  const {contents, closeView, openDetalhe, openModule, completeTopic, lastContentId, goTab} = useApp();
  const c = contents.find(x=>x.id===contentId) || contents.find(x=>x.id===lastContentId) || pickPriorityContent(contents);

  if(!c){
    return (
      <div className="pt-16 px-5 pb-8">
        <BackButton onClick={closeView}/>
        <h1 className="text-[22px] font-bold text-sf-text mt-1">Suas trilhas</h1>
        <div className="mt-6">
          <EmptyState Icon={IconRocket} title="Você ainda não começou nenhuma matéria.">
            <button type="button" onClick={()=>goTab('estudar')}
              className="sf-btn sf-btn-primary mt-3 h-11 px-4 text-[13px] font-semibold inline-flex items-center justify-center gap-1.5">
              <IconSearch size={13}/> Buscar matérias
            </button>
          </EmptyState>
        </div>
      </div>
    );
  }

  const topics = c.topics || [];
  const states = getTopicStates(c);
  const total = topics.length;
  const activeIdx = states.indexOf(TOPIC_STATUS.AVAILABLE);
  const page = activeIdx >= 0 ? activeIdx + 1 : total;

  return (
    <div className="pt-16 px-5 pb-8">
      <BackButton onClick={()=>openDetalhe(c.id)} label="Voltar ao conteúdo"/>
      <div className="mt-1"><SubjectTag subjectId={c.subjectId}/></div>
      <h1 className="text-[22px] font-bold text-sf-text mt-2">Suas trilhas</h1>
      <p className="text-[12px] text-sf-muted mt-1">{c.title} · siga as etapas para dominar este conteúdo</p>

      {total === 0 ? (
        <div className="mt-6">
          <EmptyState title="Este conteúdo ainda não tem etapas." hint="Abra o conteúdo para montar a trilha de estudos.">
            <button type="button" onClick={()=>openDetalhe(c.id)}
              className="sf-btn sf-btn-primary mt-3 h-11 px-4 text-[13px] font-semibold">Abrir conteúdo</button>
          </EmptyState>
        </div>
      ) : (
        <>
          <p className="text-[11px] text-sf-muted text-right mt-1 tnum">Etapa {page} de {total}</p>

          <ol className="mt-4 relative list-none p-0 m-0">
            <li aria-hidden="true" className="absolute left-[15px] top-3 bottom-3 w-[2px] bg-sf-overlay"/>
            {topics.map((topic,i)=>{
              const isActive = states[i] === TOPIC_STATUS.AVAILABLE;
              const isDone = states[i] === TOPIC_STATUS.COMPLETED;
              const isLocked = states[i] === TOPIC_STATUS.LOCKED;
              const ttype = getTopicType(c, i);
              const meta = MODULE_META[ttype];
              return (
                <li key={i} className="relative flex items-start gap-3.5 pb-4">
                  <span className="w-8 h-8 rounded-full flex items-center justify-center text-[12px] font-bold shrink-0 z-10 tnum"
                    style={{
                      background: isDone ? 'var(--success)' : (isActive ? 'var(--blue-500)' : 'var(--bg-overlay)'),
                      color: isDone ? 'var(--on-success)' : (isActive ? '#fff' : 'var(--text-secondary)'),
                      border: `2px solid ${isDone ? 'var(--success)' : (isActive ? 'var(--blue-500)' : 'var(--bg-overlay)')}`,
                    }}>
                    {isDone ? <IconCheck size={13}/> : (isLocked ? <IconLock size={12}/> : i+1)}
                  </span>
                  <div className="rounded-2xl p-3.5 flex-1 min-w-0"
                    style={{
                      background: isActive ? 'var(--brand-tint-soft)' : 'var(--card-bg)',
                      border: isActive ? '1px solid var(--brand-border-strong)' : '1px solid transparent'
                    }}>
                    <div className="flex items-start justify-between gap-2">
                      <p className="text-[14px] font-semibold text-sf-text">{topic.t}</p>
                      <span className="text-[11px] font-bold inline-flex items-center gap-1 shrink-0 pt-0.5" style={{color: meta.color}}>
                        <meta.Icon size={11}/> {meta.label}
                      </span>
                    </div>
                    <p className="text-[11px] text-sf-muted mt-1">
                      {isDone ? 'Concluído' : (isActive ? 'Etapa atual' : 'Bloqueado · conclua a etapa anterior')}
                    </p>
                    {topic.objective && <p className="text-[11px] text-sf-muted mt-1 italic">{topic.objective}</p>}
                    {isActive && (
                      <>
                        <button type="button" onClick={()=>openModule(c.id, i)}
                          className="sf-btn sf-btn-primary w-full mt-2.5 h-11 text-[12px] font-semibold flex items-center justify-center gap-1.5">
                          <IconPlay size={11}/> Abrir módulo
                        </button>
                        {/* Videoaula: a conclusão segue a regra dos 75% e é confirmada no próprio módulo. */}
                        {ttype !== MODULE_TYPES.QUIZ && (ttype !== MODULE_TYPES.VIDEO || videoTopicWatch(c, i).eligible) && (
                          <button type="button" onClick={()=>completeTopic(c.id, i)}
                            className="sf-btn sf-btn-secondary w-full mt-2 h-11 text-[12px] font-semibold flex items-center justify-center gap-1.5">
                            <IconCheck size={12}/> Concluir etapa
                          </button>
                        )}
                      </>
                    )}
                  </div>
                </li>
              );
            })}
          </ol>

          {activeIdx >= 0 && (
            <button type="button" onClick={()=>openModule(c.id, activeIdx)}
              className="sf-btn sf-btn-primary w-full mt-4 h-12 text-[14px] font-semibold flex items-center justify-center gap-2">
              <IconPlay size={13}/> Continuar módulo atual
            </button>
          )}
        </>
      )}
    </div>
  );
}

function ProfileAvatar({user, size=48}){
  const [broken, setBroken] = useState(false);
  const box = {width:size, height:size};
  if(user.picture && !broken){
    return <img src={user.picture} alt="" className="rounded-full object-cover shrink-0" style={box} referrerPolicy="no-referrer" onError={()=>setBroken(true)}/>;
  }
  return (
    <span aria-hidden="true" className="rounded-full flex items-center justify-center font-semibold shrink-0"
      style={{...box, fontSize: Math.round(size * .34), background: user.kind === 'local' ? 'var(--brand-tint-2)' : 'var(--bg-elevated)',
        color: user.visitor ? 'var(--text-secondary)' : (user.kind === 'local' ? 'var(--blue-300)' : 'var(--text-primary)')}}>
      {user.visitor ? <IconProfile size={Math.round(size * .46)}/> : user.initials}
    </span>
  );
}

/* Ajuda (A25) */
function AjudaScreen(){
  const {closeView} = useApp();

function TaskRow({t, onToggle, onDelete}){
  const [confirm, setConfirm] = useState(false);
  const accent = subjectAccent(t.subjectId);
  return (
    <div className="sf-card rounded-2xl p-3.5 mb-2.5" style={{borderLeft:`3px solid ${accent}`}}>
      <div className="flex items-center gap-1">
        <button type="button" role="checkbox" aria-checked={!!t.done} aria-label={t.title} onClick={onToggle}
          className="flex-1 min-w-0 min-h-[44px] -my-2 flex items-center gap-3 text-left bg-transparent border-0 p-0">
          <span className="w-[22px] h-[22px] rounded-full flex items-center justify-center shrink-0"
            style={{background: t.done ? accent : 'transparent', border: t.done ? 'none' : '1.5px solid var(--field-border)', color:inkOn(accent)}}>
            {t.done && <IconCheck size={12}/>}
          </span>
          <span className="flex-1 min-w-0">
            <span className="block text-[13px] font-semibold truncate"
              style={{color: t.done ? 'var(--text-secondary)' : 'var(--text-primary)', textDecoration: t.done ? 'line-through' : 'none'}}>{t.title}</span>
            <span className="block text-[11px] text-sf-faint mt-0.5 truncate">{t.meta || subjName(t.subjectId)}</span>
          </span>
        </button>
        {!confirm && (
          <button type="button" onClick={()=>setConfirm(true)} aria-label={`Excluir tarefa ${t.title}`}
            className="sf-btn sf-btn-ghost w-11 h-11 -my-2 -mr-2 shrink-0 flex items-center justify-center">
            <IconTrash size={16}/>
          </button>
        )}
      </div>
      {confirm && (
        <div className="flex items-center gap-2 mt-2" role="alert">
          <span className="text-[12px] text-sf-text flex-1">Excluir esta tarefa?</span>
          <button type="button" onClick={onDelete} className="sf-btn sf-btn-danger h-11 px-4 text-[12px] font-semibold">Excluir</button>
          <button type="button" onClick={()=>setConfirm(false)} className="sf-btn sf-btn-ghost h-11 px-3 text-[12px]">Cancelar</button>
        </div>
      )}
    </div>
  );
}

function TarefasScreen(){
  const {tasks, toggleTask, addTask, deleteTask, closeView} = useApp();
  const [adding, setAdding] = useState(false);
  const [title, setTitle] = useState('');
  const [subjectId, setSubjectId] = useState(()=> Object.keys(SUBJECTS)[0]);
  const [showErr, setShowErr] = useState(false);
  const inputRef = useRef(null);

  const pending = tasks.filter(t=>!t.done);
  const done = tasks.filter(t=>t.done);

  useEffect(()=>{ if(adding && inputRef.current) inputRef.current.focus(); }, [adding]);

  const handleAdd = ()=>{
    if(!title.trim()){ setShowErr(true); if(inputRef.current) inputRef.current.focus(); return; }
    addTask(title.trim(), subjectId);
    setTitle(''); setShowErr(false); setAdding(false);
  };
  const cancel = ()=>{ setAdding(false); setTitle(''); setShowErr(false); };

  return (
    <div className="pt-16 px-5 pb-8 relative">
      <BackButton onClick={closeView}/>
      <h1 className="text-[24px] font-bold text-sf-text mt-1">Tarefas</h1>
      <p className="text-[12px] text-sf-muted mt-1 tnum">{pending.length} {pending.length===1 ? 'pendente' : 'pendentes'} · {done.length} {done.length===1 ? 'concluída' : 'concluídas'}</p>

      {adding && (
        <form className="mt-4 rounded-2xl p-3.5" style={{background:'var(--card-bg)'}} onSubmit={(e)=>{ e.preventDefault(); handleAdd(); }}>
          <label htmlFor="task-title" className="block text-[12px] font-semibold text-sf-muted mb-2">Nova tarefa</label>
          <input id="task-title" ref={inputRef} value={title} onChange={e=>setTitle(e.target.value)} maxLength={120} placeholder="Ex: Resolver a lista de exercícios"
            className={INPUT_CLS} aria-invalid={showErr && !title.trim() ? 'true' : undefined} aria-describedby={showErr && !title.trim() ? 'task-err' : undefined}/>
          {showErr && !title.trim() && <p id="task-err" role="alert" className="text-[12px] text-sf-error mt-2">Escreva um título para a tarefa.</p>}
          <div role="group" aria-label="Matéria da tarefa" className="flex gap-2 mt-3 flex-wrap">
            {Object.keys(SUBJECTS).map(k=>(
              <button type="button" key={k} onClick={()=>setSubjectId(k)} aria-pressed={subjectId===k}
                className="px-3.5 h-11 rounded-full text-[12px] font-semibold flex items-center gap-1.5"
                style={{
                  background: subjectId===k ? SUBJECTS[k].accent : 'var(--bg-surface)',
                  color: subjectId===k ? inkOn(SUBJECTS[k].accent) : 'var(--text-secondary)',
                  border: `1px solid ${SUBJECTS[k].accent}50`,
                }}>
                <span className="inline-flex" aria-hidden="true"><SubjectGlyph subjectId={k} size={16}/></span>{subjName(k)}
              </button>
            ))}
          </div>
          <div className="flex gap-2 mt-3">
            <button type="submit" className="sf-btn sf-btn-primary flex-1 h-11 text-[13px] font-semibold">Salvar</button>
            <button type="button" onClick={cancel} className="sf-btn sf-btn-ghost h-11 px-4 text-[13px]">Cancelar</button>
          </div>
        </form>
      )}

      {tasks.length === 0 && !adding && (
        <div className="mt-6">
          <EmptyState Icon={IconClipboard} title="Nenhuma tarefa por aqui" hint="Anote o que você precisa estudar ou entregar.">
            <button type="button" onClick={()=>setAdding(true)}
              className="sf-btn sf-btn-primary mt-3 h-11 px-4 text-[13px] font-semibold inline-flex items-center gap-1.5">
              <IconPlus size={14}/> Nova tarefa
            </button>
          </EmptyState>
        </div>
      )}

      {pending.length > 0 && (
        <>
          <h2 className="text-[11px] font-bold text-sf-muted tracking-[1.5px] mt-6 mb-2.5 uppercase">Pendentes</h2>
          {pending.map(t=>(<TaskRow key={t.id} t={t} onToggle={()=>toggleTask(t.id)} onDelete={()=>deleteTask(t.id)}/>))}
        </>
      )}
      {done.length > 0 && (
        <>
          <h2 className="text-[11px] font-bold text-sf-muted tracking-[1.5px] mt-6 mb-2.5 uppercase">Concluídas</h2>
          {done.map(t=>(<TaskRow key={t.id} t={t} onToggle={()=>toggleTask(t.id)} onDelete={()=>deleteTask(t.id)}/>))}
        </>
      )}

      <Fab onClick={()=>setAdding(a=>!a)} label={adding ? 'Fechar formulário de tarefa' : 'Nova tarefa'}/>
    </div>
  );
}

/* Criar conteúdo (Fase 4): a matéria vem primeiro — é a pasta onde o conteúdo fica guardado.
   Depois, só o título. A descrição saiu do cadastro; conteúdos antigos que tinham descrição continuam com ela. */
function CriarConteudoScreen({initialSubjectId}){
  const {closeView, addUserSubject, openSubjectSheet, openDetalhe} = useApp();
  const [title, setTitle] = useState('');
  const [subjectId, setSubjectId] = useState(()=> initialSubjectId && SUBJECTS[initialSubjectId] ? initialSubjectId : null);
  const [showErr, setShowErr] = useState(false);
  const titleRef = useRef(null);
  const subjRef = useRef(null);
  const subjOk = !!(subjectId && SUBJECTS[subjectId]);
  const titleOk = !!title.trim();

  const handleSave = ()=>{
    if(!subjOk){ setShowErr(true); const b = subjRef.current && subjRef.current.querySelector('button'); if(b) b.focus(); return; }
    if(!titleOk){ setShowErr(true); if(titleRef.current) titleRef.current.focus(); return; }
    const newContent = {
      id: 'user-' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      title: title.trim(),
      subjectId,
      unitLabel: '',
      topics: [],
    };
    const id = addUserSubject(newContent);
    closeView();
    if(id) openDetalhe(id);
  };

  return (
    <form className="pt-12 px-5 pb-8" onSubmit={(e)=>{ e.preventDefault(); handleSave(); }} noValidate>
      <BackButton onClick={closeView}/>
      <SubTitle className="mt-4">Criar conteúdo</SubTitle>
      <p className="text-[14px] leading-[20px] text-sf-muted mt-1">Escolha a matéria e diga o que você quer aprender. O Study monta a trilha a partir disso.</p>

      <div role="group" aria-labelledby="cc-subject-label" ref={subjRef}>
        <p id="cc-subject-label" className="text-[14px] leading-[20px] font-semibold text-sf-text mt-5 mb-2">1. Matéria</p>
        <div className="flex gap-2 flex-wrap">
          {Object.keys(SUBJECTS).map(k=>(
            <button type="button" key={k} onClick={()=>setSubjectId(k)} aria-pressed={subjectId===k}
              className="sf-chip sf-chip-check px-3.5 h-11 rounded-xl text-[14px]">
              <span className="inline-flex" aria-hidden="true"><SubjectGlyph subjectId={k} size={16}/></span>{subjName(k)}
            </button>
          ))}
          <button type="button" onClick={()=>openSubjectSheet({onSaved:(id)=>setSubjectId(id)})}
            className="sf-chip px-3.5 h-11 rounded-xl text-[14px]" style={{borderStyle:'dashed'}}>+ Nova matéria</button>
        </div>
        {showErr && !subjOk && <p id="cc-subj-err" role="alert" className="text-[12px] text-sf-error mt-2">Escolha a matéria onde o conteúdo vai ficar.</p>}
      </div>

      <FieldLabel htmlFor="cc-title">2. Título do conteúdo</FieldLabel>
      <input id="cc-title" ref={titleRef} value={title} onChange={e=>setTitle(e.target.value)} maxLength={80}
        placeholder={subjOk && subjectId === 'historia' ? 'Ex.: Ditadura Militar no Brasil' : 'Ex.: Cálculo — Limites'}

/* Player integrado (Fase 4) — YouTube IFrame Player API.
   O iframe é criado pela API dentro de um nó que o React não controla (o React só vê o contêiner).
   Com `trackKey`, mede os trechos assistidos (ver "Tempo assistido das videoaulas") e salva em sf_watch_progress:
   a cada 4 s durante a reprodução, e sempre que pausa, termina, troca de vídeo ou sai da tela. */
function YouTubePlayer({video, trackKey, onWatch, onPlay}){
  const boxRef = useRef(null);
  const [status, setStatus] = useState('loading');   // loading | ready | error
  const [errCode, setErrCode] = useState(null);
  const watchRef = useRef(onWatch); watchRef.current = onWatch;
  const playRef = useRef(onPlay); playRef.current = onPlay;

  useEffect(()=>{
    if(!video || !isValidYouTubeId(video.id)) return;
    let cancelled = false, timer = null, player = null;
    setStatus('loading'); setErrCode(null);
    const tr = {
      playing:false, last:null, lastWall:0, dirty:false, lastSave:0, started:false,
      entry: trackKey ? (watchRepo.get(trackKey) || {videoId: video.id, dur: Number(video.durationSec) || 0, segs: []}) : null,
    };
    const emit = ()=>{ if(tr.entry && watchRef.current) watchRef.current({...tr.entry, segs: tr.entry.segs.map(x => [...x])}); };
    const save = (force)=>{
      if(!tr.entry || !tr.dirty) return;
      if(!force && Date.now() - tr.lastSave < 4000) return;
      tr.entry.updatedAt = Date.now();
      watchRepo.put(trackKey, tr.entry);
      tr.dirty = false; tr.lastSave = Date.now();
    };
    const sample = ()=>{
      if(!player || !tr.entry) return;
      let t = 0, d = 0, rate = 1;
      try{ t = Number(player.getCurrentTime()) || 0; d = Number(player.getDuration()) || 0; rate = Number(player.getPlaybackRate()) || 1; }catch(e){ return; }
      if(d > 0 && Math.abs(d - (tr.entry.dur || 0)) > 1){ tr.entry.dur = d; tr.dirty = true; }
      const wall = performance.now();
      if(tr.playing && tr.last != null){
        const dt = t - tr.last, dw = (wall - tr.lastWall) / 1000;
        /* Avanço compatível com reprodução contínua: conta. Salto (busca na barra) ou volta: não conta. */
        if(dt > 0 && dt <= dw * rate + 0.6){ tr.entry.segs = addWatchSeg(tr.entry.segs, tr.last, t); tr.dirty = true; }
      }
      tr.last = t; tr.lastWall = wall;
      emit(); save(false);
    };
    const host = document.createElement('div');
    host.style.width = '100%'; host.style.height = '100%';
    if(boxRef.current){ boxRef.current.innerHTML = ''; boxRef.current.appendChild(host); }

    loadYouTubeApi().then(YT => {
      if(cancelled) return;
      player = new YT.Player(host, {
        videoId: video.id, width: '100%', height: '100%',
        playerVars: { rel: 0, playsinline: 1, modestbranding: 1, origin: window.location.origin },
        events: {
          onReady: ()=>{
            if(cancelled) return;
            setStatus('ready');
            try{ const iframe = player.getIframe(); iframe.setAttribute('title', `Videoaula: ${video.title || 'vídeo do YouTube'}`); }catch(e){}
            if(tr.entry){ try{ const d = Number(player.getDuration()) || 0; if(d > 0 && Math.abs(d - (tr.entry.dur||0)) > 1){ tr.entry.dur = d; tr.dirty = true; } }catch(e){} emit(); }
          },
          onStateChange: (e)=>{
            if(cancelled) return;
            const S = YT.PlayerState;
            if(e.data === S.PLAYING){
              tr.playing = true;
              try{ tr.last = Number(player.getCurrentTime()) || 0; }catch(err){ tr.last = null; }
              tr.lastWall = performance.now();
              if(!tr.started){ tr.started = true; if(playRef.current) playRef.current(); }
              if(!timer) timer = setInterval(sample, 500);
            } else {
              if(tr.playing) sample();
              tr.playing = false; tr.last = null;
              if(timer){ clearInterval(timer); timer = null; }
              save(true);
            }
          },
          onError: (e)=>{ if(cancelled) return; setErrCode(e && e.data); setStatus('error'); },
        },
      });
    }).catch(()=>{ if(!cancelled) setStatus('error'); });

    return ()=>{
      cancelled = true;
      if(timer) clearInterval(timer);
      try{ if(tr.playing) sample(); }catch(e){}
      save(true);
      try{ if(player && player.destroy) player.destroy(); }catch(e){}
    };
  }, [video && video.id, trackKey]);

  const notEmbeddable = errCode === 101 || errCode === 150;
  return (
    <div>
      <div className="relative w-full aspect-video rounded-2xl overflow-hidden bg-black">
        <div ref={boxRef} className="absolute inset-0"/>
        {status === 'loading' && (
          <div className="absolute inset-0 flex items-center justify-center" role="status" aria-label="Carregando o player">
            {video.thumbnail && <img src={video.thumbnail} alt="" referrerPolicy="no-referrer" className="absolute inset-0 w-full h-full object-cover opacity-60"/>}
            <span className="relative w-14 h-14 rounded-full flex items-center justify-center text-white" style={{background:'rgba(0,0,0,.45)'}}><IconPlay size={18}/></span>
          </div>
        )}
        {status === 'error' && (
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-6" style={{background:'var(--bg-elevated)'}} role="alert">
            <p className="text-[15px] leading-[20px] font-semibold text-sf-text">{notEmbeddable ? 'O canal não permite exibir este vídeo fora do YouTube' : 'O player não carregou'}</p>
            <p className="text-[14px] leading-[20px] text-sf-muted mt-1">{notEmbeddable ? 'Escolha outra aula da lista.' : 'Confira sua conexão ou escolha outra aula da lista.'}</p>
          </div>
        )}
      </div>
    </div>
  );
}

function VideoModule({content, topic, topicIndex, onComplete}){
  const {setTopicVideo, noteWatchedVideo} = useApp();
  const [state, setState] = useState('loading'); // loading | ok | empty | error
  const [results, setResults] = useState([]);
  const [reloadKey, setReloadKey] = useState(0);
  const saved = cleanTopicVideo(topic.video);
  const [watch, setWatch] = useState(null);
  const playerTopRef = useRef(null);

  const query = `${content.title} ${topic.t} aula`;

  useEffect(()=>{
    let cancelled = false;
    setState(saved ? 'ok' : 'loading'); setResults([]);
    searchYouTubeVideosDetailed(query).then(res=>{
      if(cancelled) return;
      if(res.status === 'ok'){
        setResults(res.videos);
        if(!saved) setTopicVideo(content.id, topicIndex, res.videos[0]);
        setState('ok');
      } else if(!saved){
        setState(res.status === 'empty' ? 'empty' : 'error');
      }
    });
    return ()=>{ cancelled = true; };
  }, [query, reloadKey]);

  const current = saved || (state === 'ok' && results[0] ? cleanTopicVideo(results[0]) : null);
  const recommended = current ? results.filter(v => v.id !== current.id) : results;
  const tKey = current ? watchKey(content.id, topicIndex, current.id) : null;
  useEffect(()=>{ setWatch(tKey ? watchRepo.get(tKey) : null); }, [tKey]);

  const {band, top} = useModuleLayout();
  const desk = isDeskBand(band);
  const done = !!(content.topics[topicIndex] && content.topics[topicIndex].done);
  const ratio = watchRatio(watch);
  const eligible = ratio >= WATCH_THRESHOLD;
  const unknownDur = !(watch && watch.dur > 0);

  const chooseVideo = (v)=>{
    setTopicVideo(content.id, topicIndex, v);
    if(playerTopRef.current) playerTopRef.current.scrollIntoView({block:'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  };

  const loadingEl = state === 'loading' && <div className="mt-4" role="status" aria-label="Buscando videoaulas"><span className="sf-skel w-full aspect-video rounded-2xl"/><span className="sf-skel h-5 w-3/4 mt-4"/><span className="sf-skel h-4 w-1/3 mt-2"/></div>;
  const errorEl = state === 'error' && <ModuleLoadError title="As videoaulas não carregaram" onRetry={()=>setReloadKey(k=>k+1)}/>;
  const emptyEl = state === 'empty' && (
    <div className="mt-6">
      <p className="text-[16px] leading-[22px] font-semibold text-sf-text">Nenhuma videoaula encontrada para este tema</p>
      <p className="text-[14px] leading-[20px] text-sf-muted mt-1">Tente buscar de novo. Se continuar sem aulas, você pode concluir o módulo para seguir na trilha.</p>
      <button type="button" onClick={()=>setReloadKey(k=>k+1)} className="sf-btn sf-btn-secondary w-full mt-4 h-12 text-[14px]">Buscar de novo</button>
      {!done && <button type="button" onClick={()=>onComplete({noVideo:true})} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Concluir sem vídeo</button>}
    </div>
  );
  const playerEl = current && (
    <div ref={playerTopRef} className="mt-4" style={{scrollMarginTop:16}}>
      <YouTubePlayer key={current.id} video={current} trackKey={tKey} onWatch={setWatch}
        onPlay={()=> noteWatchedVideo(current, {subjectId: content.subjectId, topic: topic.t, contentTitle: content.title, contentId: content.id, topicIndex})}/>
      <h2 className="sf-ed-content text-sf-text mt-4 break-words">{current.title}</h2>
      {current.channel && <p className="text-[14px] leading-[20px] text-sf-muted mt-0.5">{current.channel}</p>}
      <WatchRuleNote ratio={ratio} done={done} unknownDuration={unknownDur}/>
    </div>
  );
