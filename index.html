function itemMatchesQuery(haystack, words){
  if(!words.length) return true;
  return words.every(w => haystack.includes(w));
}
function contentMatchesQuery(c, words){ return itemMatchesQuery(contentHaystack(c), words); }

/* ============================================================
   API — backend local (busca de vídeos e conteúdo gerado por IA)
   ============================================================ */
const API_BASE_URL = (typeof window !== 'undefined' && (window.STUDY_API_URL || window.STUDYFLOW_API_URL)) || 'https://studyapp-kyi5.onrender.com';
const API_TIMEOUT_MS = { search: 12000, ai: 45000 };

class ApiError extends Error{
  constructor(kind, message){ super(message); this.name = 'ApiError'; this.kind = kind; } // network | timeout | http | parse
}

/* Requisição JSON com tempo limite: nenhuma tela fica "carregando" para sempre se o servidor travar. */
async function apiRequest(url, { method='GET', params, body, timeoutMs=API_TIMEOUT_MS.search } = {}){
  const qs = params ? '?' + new URLSearchParams(params).toString() : '';
  const ctrl = new AbortController();
  let timedOut = false;
  const timer = setTimeout(()=>{ timedOut = true; ctrl.abort(); }, timeoutMs);
  try{
    const init = { method, signal: ctrl.signal, headers: { 'Accept': 'application/json' } };
    if(body !== undefined){ init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
    let res;
    try{ res = await fetch(url + qs, init); }
    catch(e){ throw new ApiError(timedOut ? 'timeout' : 'network', timedOut ? 'Tempo esgotado' : 'Sem conexão com o servidor'); }
    if(!res.ok) throw new ApiError('http', `HTTP ${res.status}`);
    try{ return await res.json(); }
    catch(e){ throw new ApiError(timedOut ? 'timeout' : 'parse', 'O servidor respondeu de um jeito inesperado.'); }
  } finally { clearTimeout(timer); }
}

/* ---------- YouTube ---------- */
const YOUTUBE_CONFIG = {
  enabled: true,
  proxyUrl: API_BASE_URL + '/api/videos',
  minQueryLength: 3,
};
const YOUTUBE_ID_RE = /^[\w-]{11}$/;
function isValidYouTubeId(id){ return typeof id === 'string' && YOUTUBE_ID_RE.test(id); }
/* A URL do player é sempre montada a partir do ID validado (nunca confiamos em URL vinda do servidor ou do armazenamento). */
function youTubeEmbedUrl(id){ return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`; }
function safeImageUrl(u){ return typeof u === 'string' && /^https:\/\//i.test(u) ? u : ''; }

function normalizeYouTubeItem(item){
  if(!item || !isValidYouTubeId(item.id)) return null;
  return {
    id: item.id,
    youtubeId: item.id,
    title: String(item.title || ''),
    description: String(item.description || ''),
    channel: String(item.channel || ''),
    thumbnail: safeImageUrl(item.thumbnail),
    source: 'youtube',
    durationSec: Number(item.durationSec) || 0,
    score: Number(item.score) || 0,
  };
}

/* status: ok | empty (busca válida sem resultados) | error (falha de conexão/servidor) */
async function searchYouTubeVideosDetailed(query){
  if(!YOUTUBE_CONFIG.enabled || !YOUTUBE_CONFIG.proxyUrl) return { status:'error', videos:[], reason:'disabled' };
  const q = String(query || '').trim();
  if(q.length < YOUTUBE_CONFIG.minQueryLength) return { status:'empty', videos:[] };
  try{
    const data = await apiRequest(YOUTUBE_CONFIG.proxyUrl, { params: { q } });
    const items = Array.isArray(data && data.videos) ? data.videos : [];
    const videos = items.map(normalizeYouTubeItem).filter(Boolean);
    return { status: videos.length ? 'ok' : 'empty', videos };
  }catch(error){
    console.warn('[YouTube] Erro ao buscar vídeos:', error);
    return { status:'error', videos:[], reason: error.kind || 'network' };
  }
}
async function searchYouTubeVideos(query){ return (await searchYouTubeVideosDetailed(query)).videos; }

/* ---------- Player do YouTube (IFrame Player API) ----------
   Carregado uma única vez, sob demanda. Se o script não carregar (rede, bloqueador), a promessa falha e o player mostra o erro. */
let __ytApiPromise = null;
function loadYouTubeApi(){
  if(window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if(__ytApiPromise) return __ytApiPromise;
  __ytApiPromise = new Promise((resolve, reject)=>{
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = ()=>{ try{ if(typeof prev === 'function') prev(); }catch(e){} resolve(window.YT); };
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api'; s.async = true;
    s.onerror = ()=>{ __ytApiPromise = null; reject(new Error('yt-api')); };
    document.head.appendChild(s);
    setTimeout(()=>{ if(!(window.YT && window.YT.Player)){ __ytApiPromise = null; reject(new Error('yt-timeout')); } }, 20000);
  });
  return __ytApiPromise;
}

/* ---------- Tempo assistido das videoaulas (regra dos 75%) ----------
   Guardamos os TRECHOS do vídeo que tocaram de fato, como intervalos [início, fim] em segundos, unidos entre si:
   - só conta enquanto o player está em "reproduzindo" (pausa, carregamento e fim não contam);
   - entre duas amostras, o avanço do vídeo precisa ser compatível com o tempo real decorrido × velocidade;
     um salto na barra de reprodução não é compatível, então o trecho pulado não entra;
   - a união dos intervalos impede contar duas vezes o mesmo trecho; trechos vistos em dias diferentes somam.
   A API não informa "o que foi visto": ela só permite ler o tempo atual. Por isso a medição é por amostragem (a cada 0,5 s)
   e tem margem de erro de cerca de 1 segundo por trecho. */
const WATCH_STORAGE_KEY = 'sf_watch_progress';
const WATCH_THRESHOLD = 0.75;
function watchKey(contentId, topicIndex, videoId){ return `${contentId}|${topicIndex}|${videoId}`; }
function addWatchSeg(segs, a, b){
  if(!(b > a)) return segs || [];
  const all = [...(segs || []), [a, b]].sort((x, y)=> x[0] - y[0]);
  const out = [];
  all.forEach(([s, e])=>{
    const last = out[out.length - 1];
    if(last && s <= last[1] + 0.25) last[1] = Math.max(last[1], e);
    else out.push([s, e]);
  });
  return out.map(([s, e])=> [Math.round(s * 100) / 100, Math.round(e * 100) / 100]);
}
function watchSecs(segs){ return (segs || []).reduce((a, [s, e])=> a + Math.max(0, e - s), 0); }
function watchRatio(entry){
  if(!entry || !(entry.dur > 0)) return 0;
  return Math.min(1, watchSecs(entry.segs) / entry.dur);
}
function cleanWatchEntry(e){
  if(!e || typeof e !== 'object' || !isValidYouTubeId(e.videoId)) return null;
  const dur = Number(e.dur) > 0 ? Number(e.dur) : 0;
  const segs = Array.isArray(e.segs) ? e.segs.filter(x => Array.isArray(x) && x.length === 2 && Number.isFinite(x[0]) && Number.isFinite(x[1]) && x[1] > x[0] && x[0] >= 0) : [];
  return {videoId: e.videoId, dur, segs: segs.reduce((acc, [s, t])=> addWatchSeg(acc, s, t), []), updatedAt: Number(e.updatedAt) || 0};
}
const watchRepo = {
  _cache: null,
  all(){
    if(this._cache) return this._cache;
    const raw = loadLS(WATCH_STORAGE_KEY, {});
    const out = {};
    if(raw && typeof raw === 'object') Object.keys(raw).forEach(k => { const e = cleanWatchEntry(raw[k]); if(e) out[k] = e; });
    this._cache = out;
    return out;
  },
  get(key){ const e = this.all()[key]; return e ? {...e, segs: e.segs.map(s => [...s])} : null; },
  put(key, entry){ const e = cleanWatchEntry(entry); if(!e) return; this.all()[key] = e; saveLS(WATCH_STORAGE_KEY, this.all()); },
};

/* Troca o espaço ativo (antes de montar o estado do app). */
function setDataSpace(space){
  if(DATA_SPACE === space) return;
  DATA_SPACE = space;
  watchRepo._cache = null;
}
/* Dados gravados antes dos espaços existirem (chaves sf_* globais) pertencem a uma conta Google:
   vão para a primeira conta que entrar depois da atualização. Nunca para o visitante. */
const LEGACY_DATA_KEYS = ['sf_contents','sf_live_sessions','sf_active_session','sf_last_watched_video','sf_last_content','sf_tasks','sf_planner',
  'sf_timer_pos','sf_learning_progress','sf_subjects','sf_settings','sf_mascot','sf_module_notes','sf_watch_progress','sf_last_subject','sf_last_video','sf_video_progress'];
function claimLegacyData(space){
  try{
    if(!space || !space.startsWith('u:') || localStorage.getItem('sf_legacy_owner')) return;
    LEGACY_DATA_KEYS.forEach(k=>{
      const raw = localStorage.getItem(k);
      if(raw == null) return;
      const target = lsKey(k, space);
      if(localStorage.getItem(target) == null) localStorage.setItem(target, raw);
      localStorage.removeItem(k);
    });
    localStorage.setItem('sf_legacy_owner', space);
  }catch(e){}
}
function clearSpace(space){ spaceKeys(space).forEach(k => removeLS(k, space)); }

/* Visitante → conta: o que o visitante FEZ vai para a conta, somado ao que ela já tem (nunca substitui).
   Conteúdo de exemplo não é dado do usuário: as trilhas de exemplo vivem no código; aqui só viaja o progresso nelas. */
function mergeVisitorInto(space){
  const V = 'v';
  const arr = (k, sp)=>{ const x = loadLS(k, [], sp); return Array.isArray(x) ? x : []; };
  const obj = (k, sp)=>{ const x = loadLS(k, {}, sp); return x && typeof x === 'object' && !Array.isArray(x) ? x : {}; };
  const byId = (a, b)=>{ const seen = new Set(a.map(x => x && x.id)); return [...a, ...b.filter(x => x && !seen.has(x.id))]; };

  const vSessions = arr('sf_live_sessions', V);
  /* trilhas de exemplo só viajam se o visitante mexeu nelas */
  const vLast = loadLS('sf_last_content', null, V);
  const vContents = arr('sf_contents', V).filter(c => c && (!c.demo || c.id === vLast
    || (c.topics || []).some(t => t && t.done) || vSessions.some(s => s.contentId === c.id)));
  const modulesDone = vContents.reduce((n, c)=> n + ((c && c.topics) || []).filter(t => t && t.done).length, 0);
  const minutes = vSessions.reduce((n, s)=> n + (s.durationMin || 0), 0);
  if(!spaceKeys(V).length) return null;

  /* conteúdos: mesmo id → módulos concluídos somam (OU); id novo → entra como está */
  const uContents = arr('sf_contents', space);
  const merged = uContents.map(c=>{
    const v = vContents.find(x => x && x.id === c.id);
    if(!v) return c;
    const topics = (c.topics || []).map((t, i)=> (v.topics && v.topics[i] && v.topics[i].done && v.topics[i].t === t.t) ? {...t, done:true} : t);
    return {...c, topics, progressPct: topicsProgressPct(topics)};
  });
  vContents.forEach(v=>{ if(v && !merged.some(c => c.id === v.id)) merged.push(v); });
  saveLS('sf_contents', merged, space);

  saveLS('sf_live_sessions', byId(arr('sf_live_sessions', space), vSessions), space);
  saveLS('sf_tasks', byId(arr('sf_tasks', space), arr('sf_tasks', V)), space);
  saveLS('sf_planner', byId(arr('sf_planner', space), arr('sf_planner', V)), space);

  /* avaliações: por conteúdo e módulo, fica o melhor resultado e a soma das tentativas */
  const lp = obj('sf_learning_progress', space), vlp = obj('sf_learning_progress', V);
  Object.keys(vlp).forEach(cid=>{
    const a = lp[cid] || {}, b = vlp[cid] || {};
    const out = {...a};
    Object.keys(b).forEach(ti=>{
      const x = a[ti], y = b[ti];
      if(!x){ out[ti] = y; return; }
      out[ti] = {...x, attempts:(x.attempts||0) + (y.attempts||0),
        bestScore: Math.max(x.bestScore ?? 0, y.bestScore ?? 0), passed: !!(x.passed || y.passed),
        lastScore: (y.lastAt||0) > (x.lastAt||0) ? y.lastScore : x.lastScore, lastAt: Math.max(x.lastAt||0, y.lastAt||0)};
    });
    lp[cid] = out;
  });
  saveLS('sf_learning_progress', lp, space);

  /* anotações e tempo assistido: completa o que a conta não tem */
  ['sf_module_notes', WATCH_STORAGE_KEY].forEach(k=>{
    const u = obj(k, space), v = obj(k, V);
    Object.keys(v).forEach(x=>{ if(!(x in u) || (k === 'sf_module_notes' && !String(u[x] || '').trim())) u[x] = v[x]; });
    saveLS(k, u, space);
  });

  /* a atividade mais recente é a do visitante: a home retoma de onde ele parou */
  ['sf_last_content','sf_last_watched_video'].forEach(k=>{ const v = loadLS(k, null, V); if(v != null) saveLS(k, v, space); });
  const vActive = loadLS('sf_active_session', null, V);
  if(vActive && !loadLS('sf_active_session', null, space)) saveLS('sf_active_session', vActive, space);

  clearSpace(V);
  return {modulesDone, minutes};
}
/* Um módulo de videoaula pode ser concluído quando o vídeo escolhido para ele foi assistido em pelo menos 75%. */
function videoTopicWatch(content, topicIndex){
  const topic = content && content.topics ? content.topics[topicIndex] : null;
  const vid = topic && topic.video && topic.video.id;
  if(!isValidYouTubeId(vid)) return {videoId:null, ratio:0, eligible:false};
  const entry = watchRepo.get(watchKey(content.id, topicIndex, vid));
  const ratio = watchRatio(entry);
  return {videoId: vid, ratio, eligible: ratio >= WATCH_THRESHOLD};
}
function cleanTopicVideo(v){

  return {id: v.id, title: String(v.title || '').slice(0, 200), channel: String(v.channel || '').slice(0, 120),

   ============================================================ */
const LEARNING_JOURNEY_CONFIG = {
  enabled: true,
  endpoint: API_BASE_URL + '/api/learning-journey',
};

function mapJourneyTypeToFrontend(apiType){
  if(apiType === 'assessment') return MODULE_TYPES.QUIZ;
  if(apiType === 'practice')   return MODULE_TYPES.FLASHCARDS;
  if(apiType === 'flashcards') return MODULE_TYPES.FLASHCARDS;
  if(apiType === 'reading')    return MODULE_TYPES.READING;
  if(apiType === 'video')      return MODULE_TYPES.VIDEO;
  return MODULE_TYPES.READING;
}

function validateJourney(data){
  if(!data || !Array.isArray(data.modules) || data.modules.length < 3) return null;
  const modules = data.modules;

  const last = modules[modules.length - 1];
  const penult = modules[modules.length - 2];

  if(!last || last.type !== 'assessment') return null;
  if(!penult || (penult.type !== 'flashcards' && penult.type !== 'practice')) return null;

  for(let i = 0; i < modules.length - 2; i++){
    const t = modules[i].type;
    if(t !== 'video' && t !== 'reading') return null;
  }

  return {
    title: data.title || '',
    summary: data.summary || '',
    modules: modules.map((m, i) => ({
      id: m.id || `modulo-${i+1}`,
      title: m.title || `Módulo ${i+1}`,
      type: m.type || 'reading',
      topics: Array.isArray(m.topics) ? m.topics.filter(Boolean) : [],
      learningObjective: m.learningObjective || '',
    })),
    generatedAt: Date.now(),
  };
}

function journeyToTopics(journey){
  if(!journey || !Array.isArray(journey.modules)) return [];
  return journey.modules.map(m => ({
    t: m.title,
    type: mapJourneyTypeToFrontend(m.type),
    done: false,
    objective: m.learningObjective || '',
    subtopics: m.topics || [],
  }));
}

async function fetchLearningJourney({ title, subject, level='iniciante', goal='Dominar o assunto', language='pt-BR' }){
  if(!LEARNING_JOURNEY_CONFIG.enabled || !LEARNING_JOURNEY_CONFIG.endpoint) return null;
  const q = String(title || '').trim();
  if(q.length < 2) return null;
  try{
    const data = await apiRequest(LEARNING_JOURNEY_CONFIG.endpoint, {
      method: 'POST', timeoutMs: API_TIMEOUT_MS.ai,
      body: { title: q, subject: subject || '', level, goal, language },
    });
    return validateJourney(data);
  }catch(error){
    console.warn('[Learning Journey] Erro ao gerar jornada:', error);
    return null;
  }
}

const GEMINI_PROXY_CONFIG = {
  enabled: true,
  quizUrl: API_BASE_URL + '/api/quiz',
  flashcardsUrl: API_BASE_URL + '/api/flashcards',
  readingUrl: API_BASE_URL + '/api/reading',
};

async function fetchQuiz({ contentId, title, subject, moduleTitle, learningObjective }){
  { const d = demoModule(contentId, moduleTitle); if(d && d.quiz) return d.quiz; }
  if(!GEMINI_PROXY_CONFIG.enabled || !GEMINI_PROXY_CONFIG.quizUrl) return null;
  try{
    const data = await apiRequest(GEMINI_PROXY_CONFIG.quizUrl, { timeoutMs: API_TIMEOUT_MS.ai, params: {
      contentId: contentId || '', title: title || '', subject: subject || '',
      module: moduleTitle || '', objective: learningObjective || '',
    }});
    const questions = Array.isArray(data && data.questions) ? data.questions : [];

    // Exige exatamente 10 questões para a nota bater certinho
    if(questions.length !== 10) return null;

    const valid = questions.every(q =>
      q && typeof q.q === 'string' &&
      Array.isArray(q.options) && q.options.length >= 2 &&
      q.options.every(o => o && typeof o.l === 'string') &&
      // Exige exatamente 1 alternativa correta por questão
      q.options.filter(o => o.correct === true).length === 1
    );
    if(!valid) return null;
    return questions;
  }catch(error){
    console.warn('[Quiz] Erro ao buscar questões:', error);
    return null;
  }
}

async function fetchFlashcards({ contentId, title, subject, moduleTitle }){
  { const d = demoModule(contentId, moduleTitle); if(d && d.cards) return d.cards; }
  if(!GEMINI_PROXY_CONFIG.enabled || !GEMINI_PROXY_CONFIG.flashcardsUrl) return null;
  try{
    const data = await apiRequest(GEMINI_PROXY_CONFIG.flashcardsUrl, { timeoutMs: API_TIMEOUT_MS.ai, params: {
      contentId: contentId || '', title: title || '', subject: subject || '', module: moduleTitle || '',
    }});
    const cards = Array.isArray(data && data.cards) ? data.cards : [];
    if(cards.length === 0) return null;
    const valid = cards.every(c => c && typeof c.front === 'string' && typeof c.back === 'string');
    if(!valid) return null;
    return cards;
  }catch(error){
    console.warn('[Flashcards] Erro ao buscar flashcards:', error);
    return null;
  }
}

async function fetchReading({ contentId, title, subject, moduleTitle, learningObjective, topics }){
  { const d = demoModule(contentId, moduleTitle); if(d && d.reading) return { text: d.reading, sources: null }; }
  if(!GEMINI_PROXY_CONFIG.enabled || !GEMINI_PROXY_CONFIG.readingUrl) return null;
  try{
    const data = await apiRequest(GEMINI_PROXY_CONFIG.readingUrl, { timeoutMs: API_TIMEOUT_MS.ai, params: {
      contentId: contentId || '', title: title || '', subject: subject || '',
      module: moduleTitle || '', objective: learningObjective || '',
      topics: Array.isArray(topics) ? topics.join('|') : '',
    }});
    if(!data || typeof data.content !== 'string' || data.content.trim().length < 50) return null;
    /* Fontes: só o que o servidor recebeu do Grounding com Google Search. Sem fontes, o app diz isso (nunca inventa). */
    const src = data.sources && typeof data.sources === 'object' ? data.sources : null;
    const items = src && Array.isArray(src.items) ? src.items.filter(x => x && typeof x.uri === 'string' && /^https:\/\//i.test(x.uri)).slice(0, 12) : [];
    return { text: data.content, sources: src ? {status: src.status || (items.length ? 'grounded' : 'none'), items, queries: Array.isArray(src.queries) ? src.queries.slice(0,6) : [], searchEntryPoint: typeof src.searchEntryPoint === 'string' ? src.searchEntryPoint : ''} : {status:'unknown', items:[], queries:[]} };
  }catch(error){
    console.warn('[Reading] Erro ao buscar conteúdo:', error);
    return null;
  }
}

const AppCtx = createContext(null);

/* ============================================================
   IDENTIDADE — conta Google, perfil local ou visitante
   Fica fora do AppProvider: trocar de pessoa troca o espaço de dados e remonta o app inteiro com o estado certo.
   ============================================================ */
const IdentityCtx = createContext(null);
function useIdentity(){ return useContext(IdentityCtx); }
const VISITOR_TTL_DAYS = 30;
const spaceOf = (a)=> a ? (a.kind === 'local' ? 'p:' : 'u:') + a.id : null;
function loadStoredAuth(){
  const stored = loadLS(AUTH_STORAGE_KEY, null);
  /* perfil local apagado em outra aba: a sessão deixa de valer */
  if(stored && stored.kind === 'local' && !loadProfiles().some(p => p.id === stored.id)){ removeLS(AUTH_STORAGE_KEY); return null; }
  if(stored && stored.exp && stored.exp * 1000 > Date.now()){
    if('credential' in stored){
      // versões anteriores guardavam o token do Google; ele não é usado por nenhum serviço, então deixa de ser persistido
      const {credential, ...profile} = stored;
      saveLS(AUTH_STORAGE_KEY, profile);
      return profile;
    }
    return stored;
  }
  removeLS(AUTH_STORAGE_KEY);
  return null;
}
function IdentityProvider({children}){
  const [authUser, setAuthUser] = useState(()=>{
    const a = loadStoredAuth();
    if(a) claimLegacyData(spaceOf(a));
    /* dados de visitante sem uso há mais de 30 dias são descartados */
    const seen = Number(loadLS('sf_last_seen', 0, 'v')) || 0;
    if(seen && Date.now() - seen > VISITOR_TTL_DAYS * 86400000) clearSpace('v');
    return a;
  });
  const [visitor, setVisitor] = useState(()=>{ try{ return localStorage.getItem('sf_space') === 'v'; }catch(e){ return false; } });
  const [notice, setNotice] = useState(null);
  const resumeRef = useRef(null);     /* tela (e ação) para onde voltar depois de entrar com o Google */
  const snapshotRef = useRef(null);   /* o AppProvider registra aqui como ler a tela atual */

  const isVisitor = !authUser && visitor;
  const space = authUser ? spaceOf(authUser) : (isVisitor ? 'v' : null);
  setDataSpace(space);   /* síncrono: o estado do app é lido do espaço certo já na montagem */

  /* Entrada comum a conta Google e perfil local: o visitante ativo leva o que fez para o espaço de quem entra. */
  const handleAuth = (authData)=>{
    const kind = authData.kind === 'local' ? 'local' : 'google';
    const profile = {
      kind, id: authData.id, name: authData.name, email: kind === 'google' ? (authData.email || '') : '',
      picture: kind === 'google' ? (authData.picture || '') : '', username: kind === 'local' ? authData.username : undefined,
      exp: Math.floor(Date.now()/1000) + AUTH_SESSION_DAYS * 86400,
    };
    const target = spaceOf(profile);
    claimLegacyData(target);
    const moved = isVisitor ? mergeVisitorInto(target) : null;
    if(!isVisitor) resumeRef.current = null;
    saveLS(AUTH_STORAGE_KEY, profile);
    try{ localStorage.setItem('sf_space', 'u'); }catch(e){}
    setNotice(moved && (moved.modulesDone > 0 || moved.minutes > 0) ? {kind:'migrated', ...moved} : null);
    setVisitor(false);
    setAuthUser(profile);
  };
  const enterVisitor = ()=>{
    resumeRef.current = null;
    try{ localStorage.setItem('sf_space', 'v'); }catch(e){}
    if(!loadLS('sf_seeded', false, 'v')){
      saveLS('sf_contents', DEMO_CONTENTS.map(createDemoContent), 'v');
      saveLS('sf_seeded', true, 'v');
    }
    setVisitor(true);
  };
  /* Volta para o login sem apagar nada (visitante ou conta). */
  const signOut = ()=>{
    try{ if(window.google?.accounts?.id) window.google.accounts.id.disableAutoSelect(); }catch(e){}
    removeLS(AUTH_STORAGE_KEY);
    try{ localStorage.removeItem('sf_space'); }catch(e){}
    resumeRef.current = null;
    setNotice(null);
    setAuthUser(null);
    setVisitor(false);
  };
  const clearVisitorData = ()=>{ clearSpace('v'); signOut(); };
  /* Perfil local: cria (nome de usuário único neste aparelho) e entra. Devolve a mensagem de erro, se houver. */
  const createLocalProfile = ({username, name})=>{
    const list = loadProfiles();
    const u = normalizeUsername(username);
    const err = usernameError(u, list);
    if(err) return err;
    const display = String(name || '').trim().slice(0, 40) || u;
    const p = {id: newProfileId(), username: u, name: display, createdAt: Date.now()};
    saveProfiles([...list, p]);
    handleAuth({kind:'local', id:p.id, name:p.name, username:p.username});
    return '';
  };
  const enterLocalProfile = (id)=>{
    const list = loadProfiles();
    const p = list.find(x => x.id === id);
    if(p) saveProfiles(list.map(x => x.id === id ? {...x, lastUsedAt: Date.now()} : x));
    if(p) handleAuth({kind:'local', id:p.id, name:p.name, username:p.username});
  };
  const renameLocalProfile = (name)=>{
    if(!authUser || authUser.kind !== 'local') return;
    const display = String(name || '').trim().slice(0, 40) || authUser.username;
    saveProfiles(loadProfiles().map(p => p.id === authUser.id ? {...p, name: display} : p));
    const next = {...authUser, name: display};
    saveLS(AUTH_STORAGE_KEY, next);
    setAuthUser(next);
  };
  /* Apaga o perfil local e todos os dados dele neste navegador. */
  const deleteLocalProfile = ()=>{
    if(!authUser || authUser.kind !== 'local') return;
    clearSpace(spaceOf(authUser));
    saveProfiles(loadProfiles().filter(p => p.id !== authUser.id));
    signOut();
  };
  /* Prepara a volta: ao entrar com o Google a partir de uma tela, o app reabre nela (e faz a ação pedida). */
  const prepareResume = (action)=>{
    const snap = snapshotRef.current ? snapshotRef.current() : null;
    resumeRef.current = snap ? {...snap, action: action || null} : (action ? {action} : null);
  };
  const cancelResume = ()=>{ resumeRef.current = null; };
  const takeResume = ()=>{ const r = resumeRef.current; resumeRef.current = null; return r; };

  const value = {authUser, isVisitor, space, handleAuth, enterVisitor, signOut, clearVisitorData,
    createLocalProfile, enterLocalProfile, renameLocalProfile, deleteLocalProfile,
    prepareResume, cancelResume, takeResume, snapshotRef, notice, dismissNotice: ()=> setNotice(null)};
  return <IdentityCtx.Provider value={value}>{children}</IdentityCtx.Provider>;
}

function AppProvider({children}){
  const identity = useIdentity();
  const {authUser, isVisitor} = identity;
  const resume = useMemo(()=> identity.takeResume(), []);
  useEffect(()=>{ if(isVisitor) saveLS('sf_last_seen', Date.now()); }, [isVisitor]);

  const user = useMemo(() => {
    if(isVisitor) return {id:'visitante', name:'Visitante', email:'', initials:'', picture:'', visitor:true, kind:'visitor', kindLabel:'Sem perfil'};
    if(!authUser) return null;
    const local = authUser.kind === 'local';
    const name = authUser.name || (authUser.email || '').split('@')[0] || authUser.username || 'Usuário';
    return {
      id: authUser.id,
      name,
      email: local ? '' : (authUser.email || ''),
      username: local ? authUser.username : '',
      initials: initialsOf(name),
      picture: local ? '' : (authUser.picture || ''),
      kind: local ? 'local' : 'google',
      kindLabel: local ? 'Perfil neste aparelho' : 'Conta Google',
    };
  }, [authUser, isVisitor]);

  const signOut = ()=> identity.signOut();

  /* ---------- NAVEGAÇÃO ----------
     `tab` é a raiz; `nav.stack` guarda as telas empilhadas por cima dela, então "Voltar" retorna
     sempre à tela anterior (e não à raiz). */
  const [tab, setTab] = useState(()=> (resume && resume.tab) || 'home');
  /* Fase 4: cada tela empilhada guarda a posição de rolagem (_y) de quando foi deixada; a raiz (aba) guarda rootY.
     Ao voltar, o AppShell restaura essa posição em vez de ir ao topo. */
  const [nav, setNav] = useState(()=> (resume && resume.nav) || {stack: [], view: null, rootY: 0});
  identity.snapshotRef.current = ()=> ({tab, nav});
  const view = nav.view;
  const sameView = (a, b)=> !!a && !!b && a.name === b.name && (a.contentId || null) === (b.contentId || null);
  const snapY = ()=> { try{ return window.scrollY || 0; }catch(e){ return 0; } };
  const leaving = (n)=> n.view ? {stack: [...n.stack, {...n.view, _y: snapY()}], rootY: n.rootY} : {stack: n.stack, rootY: snapY()};
  const pushView = (v)=> setNav(n => ({...leaving(n), view: v}));
  const replaceView = (v)=> setNav(n => ({...n, view: v}));
  const closeView = ()=> setNav(n => n.stack.length
    ? {stack: n.stack.slice(0, -1), view: n.stack[n.stack.length - 1], rootY: n.rootY}
    : {stack: [], view: null, rootY: n.rootY});
  const resetNav = ()=> setNav({stack: [], view: null, rootY: 0});
  /* Vai para uma tela; se ela já está na pilha, volta até ela (evita ciclos Detalhe → Módulo → Detalhe). */
  const goToView = (v)=> setNav(n => {
    for(let i = n.stack.length - 1; i >= 0; i--){
      if(sameView(n.stack[i], v)) return {stack: n.stack.slice(0, i), view: {...v, _y: n.stack[i]._y}, rootY: n.rootY};
    }
    if(sameView(n.view, v)) return {...n, view: v};
    return {...leaving(n), view: v};
  });
  const restoreY = view ? (view._y || 0) : (nav.rootY || 0);
  const goTab = (key)=>{ resetNav(); setTab(key); };

  /* ---------- ESTADO DO APP ---------- */
  const [contents, setContents] = useState(()=> contentsRepo.load());
  const [liveSessions, setLiveSessions] = useState(()=>{ const v = loadLS('sf_live_sessions', []); return Array.isArray(v) ? v : []; });
  const [session, setSession] = useState(()=> loadLS('sf_active_session', null));
  const [timerExpanded, setTimerExpanded] = useState(false);
  const [confirmEnd, setConfirmEnd] = useState(false);
  const [fullScreenFocus, setFullScreenFocus] = useState(false);
  const [completedSession, setCompletedSession] = useState(null);
  const [lastWatchedVideo, setLastWatchedVideo] = useState(()=> loadLS('sf_last_watched_video', null));
  const [lastContentId, setLastContentId] = useState(()=> loadLS('sf_last_content', null));
  const [tasks, setTasks] = useState(()=>{ const v = loadLS('sf_tasks', []); return Array.isArray(v) ? v : []; });
  const [planner, setPlanner] = useState(()=>{ const v = loadLS('sf_planner', []); return Array.isArray(v) ? v : []; });
  const [timerPos, setTimerPos] = useState(()=> loadLS('sf_timer_pos', null));
  const [learningProgress, setLearningProgress] = useState(()=> loadLS('sf_learning_progress', {}));
  const [subjectsStore, setSubjectsStore] = useState(()=>{
    const st = migrateSubjectsStore(loadLS('sf_subjects', {emojis:{}, custom:{}}) || {});
    applySubjectsStore(st);
    return st;
  });
  const [subjectSheet, setSubjectSheet] = useState(null);
  const [settings, setSettings] = useState(()=>{
    const st = loadLS('sf_settings', {}) || {};
    const f = Number(st.focusMin);
    return { focusMin: f >= 5 && f <= 120 ? Math.round(f / 5) * 5 : 25 };
  });
  const [, setTick] = useState(0);
  const endingRef = useRef(false);

  useEffect(()=> contentsRepo.save(contents), [contents]);
  useEffect(()=> saveLS('sf_live_sessions', liveSessions), [liveSessions]);
  useEffect(()=> saveLS('sf_active_session', session), [session]);
  useEffect(()=> saveLS('sf_last_watched_video', lastWatchedVideo), [lastWatchedVideo]);
  useEffect(()=> saveLS('sf_last_content', lastContentId), [lastContentId]);
  useEffect(()=> saveLS('sf_tasks', tasks), [tasks]);
  useEffect(()=> saveLS('sf_planner', planner), [planner]);
  useEffect(()=> saveLS('sf_timer_pos', timerPos), [timerPos]);
  useEffect(()=> saveLS('sf_subjects', subjectsStore), [subjectsStore]);
  useEffect(()=> saveLS('sf_learning_progress', learningProgress), [learningProgress]);
  useEffect(()=> saveLS('sf_settings', settings), [settings]);

  useEffect(()=>{
    if(!session || session.status !== 'running') return;
    let last = getElapsedSec(session);
    const id = setInterval(()=>{
      const cur = getElapsedSec(session);
      if(cur !== last){ last = cur; setTick(t=>t+1); }
    }, 250);
    return ()=> clearInterval(id);
  }, [session]);
  const elapsedSec = getElapsedSec(session);

  /* Ofensiva = dias consecutivos com ao menos uma sessão de estudo registrada (abrir o app não conta). */
  const studyDates = useMemo(()=>{
    const set = new Set();
    liveSessions.forEach(s => { const ts = s.startedAt || s.dateTs; if(ts) set.add(toDateStr(new Date(ts))); });
    return Array.from(set);
  }, [liveSessions]);
  const streak = useMemo(()=> computeStreak(studyDates), [studyDates]);

  const todayStats = useMemo(()=>{
    const start = startOfTodayTs();
    const todaySessions = liveSessions.filter(s => {
      const ts = s.startedAt || s.dateTs || 0;
      return ts >= start;
    });
    const min = todaySessions.reduce((a,s)=> a + (s.durationMin||0), 0);
    return {
      studiedLabel: minutesToLabel(min),
      studiedMin: min,
      sessionsCount: todaySessions.length,
      streak,
    };
  },[liveSessions, streak]);

  const globalStats = useMemo(()=>{
    const totalMin = liveSessions.reduce((a,s)=> a + (s.durationMin||0), 0);
    const weekStart = startOfWeekTs();
    const weekMin = liveSessions.filter(s => (s.startedAt || s.dateTs || 0) >= weekStart)
      .reduce((a,s)=> a + (s.durationMin||0), 0);
    return { totalMin, totalSessions: liveSessions.length, weekMin };
  },[liveSessions]);

  const generateJourneyFor = (contentId, source)=>{
    const c = source || contents.find(x => x.id === contentId);
    if(!c) return;
    setContents(prev => prev.map(x => x.id === contentId ? { ...x, journeyStatus: 'loading' } : x));
    fetchLearningJourney({
      title: c.title,
      subject: subjName(c.subjectId),
      ...(c.desc ? {goal: String(c.desc).slice(0, 200)} : {}),
    }).then(journey => {
      setContents(prev => prev.map(x => {
        if(x.id !== contentId) return x;
        if(!journey){
          return { ...x, journeyStatus: 'error' };
        }
        return {
          ...x,
          journey,
          journeyStatus: 'ready',
          topics: journeyToTopics(journey),
          progressPct: 0,
        };
      }));
    });
  };

  const regenerateJourney = (contentId)=> generateJourneyFor(contentId);

  const addUserSubject = (source)=>{
    if(!source || !source.id) return null;
    if(contents.some(c => c.id === source.id)) return source.id;

    const newContent = createUserContent(source);
    newContent.journey = null;
    newContent.journeyStatus = 'loading';

    setContents(prev => prev.some(c => c.id === source.id) ? prev : [...prev, newContent]);

    fetchLearningJourney({
      title: source.title,
      subject: subjName(source.subjectId),
      ...(source.desc ? {goal: String(source.desc).slice(0, 200)} : {}),
    }).then(journey => {
      setContents(prev => prev.map(x => {
        if(x.id !== source.id) return x;
        if(!journey){
          return { ...x, journeyStatus: 'error', journey: null };
        }
        return {
          ...x,
          journey,
          journeyStatus: 'ready',
          topics: journeyToTopics(journey),
          progressPct: 0,
        };
      }));
    });

    return source.id;
  };
  const isUserSubject = (id)=> contents.some(c => c.id === id);

  const openDetalhe = (contentId)=>{
    const c = contents.find(x=>x.id===contentId);
    setLastContentId(contentId);
    goToView({name:'detalhe', contentId});
    if(c && !c.journey && c.journeyStatus !== 'loading' && c.journeyStatus !== 'ready'){
      generateJourneyFor(contentId, c);
    }
  };
  const openPreSessao = (contentId)=> pushView({name:'presessao', contentId});
  const openMascote = ()=> pushView({name:'mascote'});
  const openYouTubeVideo = (video, _backTo, context)=>{
    if(!video || !isValidYouTubeId(video.id)) return;
    setLastWatchedVideo({
      id: video.id, title: video.title || '', channel: video.channel || '',
      thumbnail: safeImageUrl(video.thumbnail), description: video.description || '',
      subjectId: (context && context.subjectId) || null,
      topic: (context && context.topic) || null, watchedAt: Date.now(),
    });
    const v = {name:'youtube-video', video, context: context || null};
    // trocar de um vídeo para outro substitui a tela, em vez de empilhar vários players
    setNav(n => n.view && n.view.name === 'youtube-video'
      ? {...n, view: v}
      : {stack: n.view ? [...n.stack, n.view] : n.stack, view: v});
  };
  const openModule = (contentId, topicIndex)=>{
    const c = contents.find(x=>x.id===contentId);
    if(!c) return;
    setLastContentId(contentId);
    /* D2: abrir um módulo é só ACESSO ao conteúdo. O tempo de foco só começa em "Começar foco".
       Fase 4: de um módulo para outro do mesmo conteúdo, a tela é substituída (não empilha), então "Voltar"
       leva sempre à lista de módulos. Se a lista de módulos já está na pilha, volta até ela antes de abrir. */
    const v = {name:'module', contentId, topicIndex};
    setNav(n => {
      if(n.view && n.view.name === 'module' && n.view.contentId === contentId) return {...n, view: v};
      return {...leaving(n), view: v};
    });
  };
  /* Vídeo escolhido para um módulo de videoaula: fica salvo no próprio módulo (sf_contents), para o progresso
     assistido continuar valendo para o mesmo vídeo depois de atualizar a página. */
  const setTopicVideo = (contentId, topicIndex, video)=>{
    const v = cleanTopicVideo(video);
    if(!v) return;
    setContents(prev => prev.map(x => {
      if(x.id !== contentId || !x.topics || !x.topics[topicIndex]) return x;
      const cur = x.topics[topicIndex].video;
      if(cur && cur.id === v.id && cur.title === v.title && cur.durationSec === v.durationSec) return x;
      return {...x, topics: x.topics.map((t, i) => i === topicIndex ? {...t, video: v} : t)};
    }));
  };
  const noteWatchedVideo = (video, context)=>{
    if(!video || !isValidYouTubeId(video.id)) return;
    setLastWatchedVideo(prev => {
      if(prev && prev.id === video.id && prev.contentId === ((context && context.contentId) || null) && Date.now() - (prev.watchedAt || 0) < 60000) return prev;
      return {
        id: video.id, title: video.title || '', channel: video.channel || '',
        thumbnail: safeImageUrl(video.thumbnail), description: video.description || '',
        subjectId: (context && context.subjectId) || null, topic: (context && context.topic) || null,
        contentId: (context && context.contentId) || null,
        topicIndex: context && Number.isInteger(context.topicIndex) ? context.topicIndex : null,
        watchedAt: Date.now(),
      };
    });
  };
  const openCalendario = (dateStr)=> pushView({name:'calendario', date: typeof dateStr === 'string' ? dateStr : null});

  const completeTopic = (contentId, topicIndex, opts)=>{
    const c = contents.find(x=>x.id===contentId);
    const st = c ? getTopicStatus(c, topicIndex) : null;
    if(!st || st === TOPIC_STATUS.COMPLETED) return false;
    const ttype = getTopicType(c, topicIndex);
    if(ttype === MODULE_TYPES.QUIZ) return false;
    /* Regra da videoaula: só conclui com ≥ 75% do vídeo assistido. Exceção: quando nenhuma videoaula foi encontrada
       para o tema (opts.noVideo), o módulo pode ser concluído para a trilha não travar. */
    if(ttype === MODULE_TYPES.VIDEO && !(opts && opts.noVideo) && !videoTopicWatch(c, topicIndex).eligible) return false;
    setContents(prev => applyTopicCompletion(prev, contentId, topicIndex));
    return true;
  };
  const completeModule = (contentId, topicIndex, opts)=> completeTopic(contentId, topicIndex, opts);

  const submitModuleQuiz = (contentId, topicIndex, score)=>{
    const passed = score >= MODULE_PASSING_SCORE;
    setLearningProgress(prev=>{
      const cid = prev[contentId] || {};
      const tp = cid[topicIndex] || { attempts:0, lastScore:null, bestScore:null, passed:false };
      return {
        ...prev,
        [contentId]: {
          ...cid,
          [topicIndex]: {
            ...tp,
            attempts: tp.attempts + 1,
            lastScore: score,
            bestScore: tp.bestScore == null ? score : Math.max(tp.bestScore, score),
            lastAt: Date.now(),
            passed: passed || tp.passed,
          },
        },
      };
    });
    if(passed){
      setContents(prev => applyTopicCompletion(prev, contentId, topicIndex));
    }
    return passed;
  };

  const getModuleProgress = (contentId, topicIndex)=>{
    const c = learningProgress[contentId];
    if(!c) return null;
    return c[topicIndex] || null;
  };

  const openJornada = (contentId)=> pushView({name:'jornada', contentId: typeof contentId === 'string' ? contentId : null});
  const openConfiguracoes = ()=> pushView({name:'configuracoes'});
  const openTarefas = ()=> pushView({name:'tarefas'});
  const openCriarConteudo = (subjectId)=> pushView({name:'criar-conteudo', subjectId: typeof subjectId === 'string' && SUBJECTS[subjectId] ? subjectId : null});
  const openMaterias = ()=> pushView({name:'materias'});

  /* Meta única: a meta de toda sessão é settings.focusMin (Configurações). Ela é gravada na sessão ao começar,
     então mudar a configuração depois não altera uma sessão em andamento.
     opts.stay = começa onde a pessoa está (barra de sessão dentro do módulo), sem navegar. */
  const startSession = (contentId, opts)=>{
    if(session){ setTimerExpanded(true); return; }
    const c = contents.find(x=>x.id===contentId);
    setSession({contentId, subjectId: c ? c.subjectId : null, title: c ? c.title : '', plannerId:null,
      plannedMin: settings.focusMin, startTs:Date.now(), pausedAccumMs:0, pausedAt:null, status:'running'});
    if(!(opts && opts.stay)) goToView({name:'detalhe', contentId});
  };
  const startPlannerSession = (itemId)=>{
    if(session){ setTimerExpanded(true); return; }
    const it = planner.find(p=>p.id===itemId);
    if(!it) return;
    const related = contents.filter(c=>c.subjectId===it.subjectId);
    const content = related.find(c=>c.progressPct<100) || related[0] || null;
    setSession({contentId: content ? content.id : null, subjectId: it.subjectId, title: it.title, plannerId: it.id,
      plannedMin: settings.focusMin, startTs:Date.now(), pausedAccumMs:0, pausedAt:null, status:'running'});
    setTimerExpanded(true);
  };
  const pauseSession = (reason)=> setSession(s=> (s && s.status!=='paused') ? ({...s, status:'paused', pausedAt:Date.now(), pauseReason: reason === 'away' ? 'away' : 'manual'}) : s);
  const resumeSession = ()=> setSession(s=>{
    if(!s) return s;
    const extra = s.pausedAt ? Date.now()-s.pausedAt : 0;
    return {...s, status:'running', pausedAccumMs:s.pausedAccumMs+extra, pausedAt:null, pauseReason:null};
  });
  /* D2: o tempo registrado representa atividade real. Se o Study vai para segundo plano (outra aba, app minimizado,
     tela bloqueada), o foco pausa sozinho e espera a pessoa retomar. */
  useEffect(()=>{
    const onVis = ()=>{ if(document.visibilityState === 'hidden') pauseSession('away'); };
    /* ao fechar a aba, grava a pausa direto no armazenamento (o efeito do React pode não rodar a tempo) */
    const onHide = ()=>{
      try{
        const s = loadLS('sf_active_session', null);
        if(s && s.status === 'running') saveLS('sf_active_session', {...s, status:'paused', pausedAt:Date.now(), pauseReason:'away'});
      }catch(e){}
    };
    document.addEventListener('visibilitychange', onVis);
    window.addEventListener('pagehide', onHide);
    return ()=>{ document.removeEventListener('visibilitychange', onVis); window.removeEventListener('pagehide', onHide); };
  }, []);

  /* Encerra a sessão e registra o tempo estudado.
     opts.auto = encerramento automático ao atingir o tempo planejado: o tempo registrado nunca passa do planejado
     (ex.: aba fechada durante horas) e, se a pessoa está num módulo ou vídeo, a navegação não é interrompida. */
  const confirmEndSession = (opts)=>{
    if(!session || endingRef.current) return;
    endingRef.current = true;
    const auto = !!(opts && opts.auto);
    const rawSec = getElapsedSec(session);
    const maxSec = session.plannedMin * 60;
    const capped = auto && rawSec > maxSec + 60;
    const realSec = auto ? Math.min(rawSec, maxSec) : rawSec;
    const durationMin = Math.max(1, Math.round(realSec/60));
    const endedAt = auto ? session.startTs + (session.pausedAccumMs || 0) + realSec * 1000 : Date.now();
    const content = contents.find(c=>c.id===session.contentId);
    const subjectId = session.subjectId || (content && content.subjectId) || null;
    const title = session.title || (content && content.title) || '';

    let plannerInfo = null;
    const item = session.plannerId ? planner.find(p=>p.id===session.plannerId) : null;
    if(item){
      const refMin = item.duration || session.plannedMin;
      const studiedMin = (item.studiedMin||0) + durationMin;
      const done = !!item.done || studiedMin >= refMin*0.8;
      plannerInfo = {id:item.id, plannedMin:refMin, studiedMin, done};
      setPlanner(ps=> ps.map(p=> p.id===item.id ? {...p, studiedMin, done} : p));
    }

    const todayCount = liveSessions.filter(x => (x.startedAt || x.dateTs || 0) >= startOfTodayTs()).length;
    setLiveSessions(ls => [...ls, {
      id: 'live-'+endedAt, contentId: session.contentId||null, subjectId, title,
      plannerId: session.plannerId||null, plannedMin: session.plannedMin, durationMin,
      startedAt: session.startTs, endedAt, when: 'hoje', dateTs: session.startTs,
    }]);

    setCompletedSession({
      contentId: session.contentId || null, contentTitle: title, subjectId,
      plannedMin: session.plannedMin, realSec, realMin: durationMin,
      streak: computeStreak([...studyDates, toDateStr(new Date(session.startTs))]),
      sessionsToday: todayCount + 1, plannerInfo, capped,
    });
    setSession(null); setConfirmEnd(false); setTimerExpanded(false); setFullScreenFocus(false);
    const inFlow = !!view && (view.name === 'module' || view.name === 'youtube-video');
    if(!(auto && inFlow)) setNav({stack: [], view: {name:'concluida'}});
  };

  useEffect(()=>{
    if(!session){ endingRef.current = false; return; }
    if(session.status !== 'running') return;
    if(elapsedSec >= session.plannedMin * 60) confirmEndSession({auto:true});
  }, [elapsedSec, session]);

  const showCompletedSummary = ()=> setNav({stack: [], view: {name:'concluida'}});
  const dismissCompletedSession = ()=>{ setCompletedSession(null); resetNav(); setTab('home'); };

  const toggleTask = (id)=> setTasks(ts=> ts.map(t=> t.id===id ? {...t, done:!t.done} : t));
  const addTask = (title, subjectId)=> setTasks(ts=> [...ts, {id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), title, subjectId, done:false}]);
  const deleteTask = (id)=> setTasks(ts=> ts.filter(t=> t.id!==id));

  const savePlannerItem = (data)=>{
    if(data.id){ setPlanner(ps=> ps.map(p=> p.id===data.id ? {...p, ...data} : p)); return data.id; }
    const id = 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    setPlanner(ps=> [...ps, {studiedMin:0, done:false, ...data, id}]);
    return id;
  };
  const deletePlannerItem = (id)=> setPlanner(ps=> ps.filter(p=>p.id!==id));
  const togglePlannerDone = (id)=> setPlanner(ps=> ps.map(p=> p.id===id ? {...p, done:!p.done} : p));

  const saveSubject = ({id, name, ident, accent})=>{
    const finalId = id || ('m'+Date.now().toString(36));
    const prev = migrateSubjectsStore(subjectsStore);
    const id2 = ident && ident.type === 'emoji' && ident.emoji ? {type:'emoji', emoji:ident.emoji} : {type:'icon', icon:(ident && SUBJECT_ICONS[ident.icon]) ? ident.icon : 'geral'};
    const next = {...prev, idents:{...prev.idents, [finalId]: id2}, accents:{...prev.accents}, custom:{...prev.custom}, emojis:{...prev.emojis}};
    if(id2.type === 'emoji') next.emojis[finalId] = id2.emoji;
    if(!(finalId in BUILTIN_SUBJECTS)){
      const old = prev.custom[finalId];
      const acc = accent || (old ? old.accent : CUSTOM_COLORS[Object.keys(prev.custom).length % CUSTOM_COLORS.length]);
      next.custom[finalId] = {name: (name||'').trim().slice(0,40) || (old ? old.name : 'Nova matéria'), accent: acc};
      next.accents[finalId] = acc;
    } else if(accent){ next.accents[finalId] = accent; }
    applySubjectsStore(next);
    setSubjectsStore(next);
    return finalId;
  };
  const openSubjectSheet = (opts)=> setSubjectSheet(opts || {});
  const closeSubjectSheet = ()=> setSubjectSheet(null);

  const setFocusMin = (min)=> setSettings(s => ({...s, focusMin: Math.min(120, Math.max(5, Math.round(min / 5) * 5))}));

  /* ---------- MODO VISITANTE: o que cria conteúdo pela IA pede conta ----------
     A navegação nunca é bloqueada: a ação abre uma folha que explica o porquê e oferece entrar com o Google.
     Ao entrar, o app volta para esta tela e faz a ação pedida. */
  const [accountAsk, setAccountAsk] = useState(null);
  const askAccount = (feature, action)=>{ identity.prepareResume(action || null); setAccountAsk({feature}); };
  const closeAccountAsk = ()=>{ identity.cancelResume(); setAccountAsk(null); };
  const openCriarConteudoGated = (subjectId)=> isVisitor
    ? askAccount('criar', {type:'criar-conteudo', subjectId: typeof subjectId === 'string' ? subjectId : null})
    : openCriarConteudo(subjectId);
  const addUserSubjectGated = (source)=>{
    if(isVisitor){ askAccount('adicionar', source && source.id ? {type:'add-catalog', id: source.id} : null); return null; }
    return addUserSubject(source);
  };
  const openSubjectSheetGated = (opts)=> (isVisitor && !(opts && opts.id))
    ? askAccount('materia', {type:'nova-materia'})
    : openSubjectSheet(opts);
  /* Retomada depois do login: a ação que o visitante pediu é feita assim que o app abre na conta. */
  useEffect(()=>{
    const a = resume && resume.action;
    if(!a || isVisitor) return;
    if(a.type === 'criar-conteudo') openCriarConteudo(a.subjectId);
    else if(a.type === 'nova-materia') openSubjectSheet({});
    else if(a.type === 'add-catalog'){
      const item = CATALOG.find(x => x.id === a.id);
      if(item){ addUserSubject(item); goToView({name:'detalhe', contentId: item.id}); }
    }
  }, []);

  const value = {user, authUser, isVisitor, signOut, accountAsk, askAccount, closeAccountAsk,
    notice: identity.notice, dismissNotice: identity.dismissNotice,
    contents, setContents, liveSessions, tab, setTab, goTab,
    todayStats, globalStats, streak, studyDates,
    view, setView: replaceView, closeView,
    openDetalhe, openPreSessao, openMascote, openCalendario, openJornada, openConfiguracoes, openTarefas, openCriarConteudo: openCriarConteudoGated, openMaterias,
    session, elapsedSec, startSession, startPlannerSession, pauseSession, resumeSession,
    timerExpanded, setTimerExpanded, timerPos, setTimerPos, confirmEnd, setConfirmEnd, fullScreenFocus, setFullScreenFocus, confirmEndSession,
    completedSession, dismissCompletedSession, showCompletedSummary, setCompletedSession,
    lastWatchedVideo, openYouTubeVideo, setTopicVideo, noteWatchedVideo, restoreY,
    tasks, toggleTask, addTask, deleteTask,
    planner, savePlannerItem, deletePlannerItem, togglePlannerDone,
    subjectsStore, saveSubject, subjectSheet, openSubjectSheet: openSubjectSheetGated, closeSubjectSheet,
    addUserSubject: addUserSubjectGated, isUserSubject, discoverableSubjects: CATALOG,
    completeTopic, completeModule, submitModuleQuiz, getModuleProgress, openModule, lastContentId, goToView,
    learningProgress, regenerateJourney,
    settings, setFocusMin};
  return <AppCtx.Provider value={value}>{children}</AppCtx.Provider>;
}

function minutesToLabel(total){ const h = Math.floor(total/60), m = total%60; return h>0 ? `${h}h ${m}m` : `${m}m`; }
function getElapsedSec(session){
  if(!session) return 0;
  const now = Date.now();
  const pausedMs = session.pausedAccumMs + (session.status==='paused' && session.pausedAt ? (now - session.pausedAt) : 0);
  return Math.max(0, Math.floor((now - session.startTs - pausedMs)/1000));
}
function fmtMMSS(totalSec){ const m = Math.floor(totalSec/60), s = totalSec%60; return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`; }
function fmtDuration(sec){ const m = Math.floor(sec/60), s = Math.floor(sec%60); return `${m}:${String(s).padStart(2,'0')}`; }

/* ============================================================
   PROGRESSÃO DOS TÓPICOS
   ============================================================ */
/* C1 (v2): nenhum módulo fica bloqueado. AVAILABLE = próximo sugerido; PENDING = ainda não feito, também pode ser aberto.
   LOCKED fica só por compatibilidade e não é mais retornado. */
const TOPIC_STATUS = {COMPLETED:'completed', AVAILABLE:'available', PENDING:'pending', LOCKED:'locked'};
const MODULE_TYPES = { VIDEO:'video', READING:'reading', FLASHCARDS:'flashcards', QUIZ:'quiz' };
const MODULE_PASSING_SCORE = 7;

const MODULE_META = {
  video:      { label:'Videoaula',  Icon: IconVideo,     color:'var(--mod-video)' },
  reading:    { label:'Leitura',    Icon: IconNote,      color:'var(--mod-reading)' },
  flashcards: { label:'Prática',    Icon: IconCards,     color:'var(--mod-practice)' },
  quiz:       { label:'Avaliação',  Icon: IconClipboard, color:'var(--mod-quiz)' },
};

function getTopicType(content, topicIndex){
  const topic = content && content.topics ? content.topics[topicIndex] : null;
  if(!topic) return MODULE_TYPES.READING;
  if(topic.type && MODULE_META[topic.type]) return topic.type;
  const total = (content.topics || []).length;
  if(total === 1) return MODULE_TYPES.VIDEO;
  if(topicIndex === total - 1) return MODULE_TYPES.QUIZ;
  return topicIndex % 2 === 0 ? MODULE_TYPES.VIDEO : MODULE_TYPES.READING;
}

function getNextPendingTopicIndex(content){
  if(!content || !Array.isArray(content.topics)) return -1;
  return content.topics.findIndex(t=> !t.done);
}
function getNextPendingTopic(content){
  const i = getNextPendingTopicIndex(content);
  return i >= 0 ? content.topics[i] : null;
}
function getTopicStatus(content, topicIndex){
  const topic = content && content.topics ? content.topics[topicIndex] : null;
  if(!topic) return null;
  if(topic.done) return TOPIC_STATUS.COMPLETED;
  return topicIndex === getNextPendingTopicIndex(content) ? TOPIC_STATUS.AVAILABLE : TOPIC_STATUS.PENDING;
}
function getTopicStates(content){
  return ((content && content.topics) || []).map((_, i) => getTopicStatus(content, i));
}
function isTopicUnlocked(content, topicIndex){
  return !!getTopicStatus(content, topicIndex);
}
/* Progresso = módulos concluídos / total de módulos. É a única fonte de verdade do percentual. */
function topicsProgressPct(topics){
  const list = Array.isArray(topics) ? topics : [];
  return list.length ? Math.round(list.filter(t => t && t.done).length / list.length * 100) : 0;
}
/* Regra única do agregado (Início e Progresso): média simples do percentual dos conteúdos INICIADOS
   (≥ 1 módulo concluído). Conteúdos não iniciados não puxam a média para baixo. Ex.: 14%, 40% e 75% → 43%. */
function isContentStarted(c){ return ((c && c.topics) || []).some(t => t && t.done); }
function averageStartedPct(contents){
  const started = (contents || []).filter(isContentStarted);
  if(!started.length) return {pct: 0, count: 0};
  const sum = started.reduce((a, c) => a + topicsProgressPct(c.topics), 0);
  return {pct: Math.round(sum / started.length), count: started.length};
}
/* Estado de cada segmento da trilha: 'done' | 'current' | 'pending'. `currentIdx` padrão = próximo módulo pendente. */
function trailStates(content, currentIdx){
  const topics = (content && content.topics) || [];
  const cur = currentIdx == null ? getNextPendingTopicIndex(content) : currentIdx;
  return topics.map((t, i) => t && t.done ? 'done' : (i === cur ? 'current' : 'pending'));
}
function modulesLabel(content){
  const base = modulesLabelBase(content);
  return isDemoContent(content) ? `Exemplo · ${base}` : base;
}
function modulesLabelBase(content){
  const {total, completed} = getContentProgress(content);
  if(!total) return content && content.journeyStatus === 'loading' ? 'Montando a trilha…' : 'Trilha não disponível';
  if(completed === 0) return `Novo, ${total} ${total === 1 ? 'módulo' : 'módulos'}`;
  return `${completed} de ${total} ${total === 1 ? 'módulo' : 'módulos'}`;
}
function getContentProgress(content){
  const topics = (content && content.topics) || [];
  const completed = topics.filter(t => t.done).length;
  return {
    total: topics.length, completed,
    pct: topicsProgressPct(topics),
    nextIndex: getNextPendingTopicIndex(content),
    states: getTopicStates(content),
  };
}
function applyTopicCompletion(contents, contentId, topicIndex){
  const c = contents.find(x => x.id === contentId);
  const st = c ? getTopicStatus(c, topicIndex) : null;
  if(!st || st === TOPIC_STATUS.COMPLETED) return contents;
  return contents.map(x=>{
    if(x.id !== contentId) return x;
    const topics = x.topics.map((t, i) => i === topicIndex ? {...t, done: true, completedAt: Date.now()} : t);
    const {pct} = getContentProgress({...x, topics});
    return {...x, topics, progressPct: pct};
  });
}
function createUserContent(source){
  return {
    id: source.id,
    title: source.title,
    subjectId: source.subjectId,
    unitLabel: source.unitLabel || '',
    estMinutes: source.estMinutes || 15,
    progressPct: 0,
    desc: source.desc || '',
    keywords: source.keywords || [],
    topics: (source.topics || []).map(t => ({t: t.t, done: false, type: t.type})),
    journey: null,
    journeyStatus: null,
    addedAt: Date.now(),
  };
}
function orderContentsByActivity(contents){
  const stateOf = (c)=> c.progressPct >= 100 ? 2 : (c.progressPct > 0 ? 0 : 1);
  return contents.slice().sort((a,b)=>{
    const sa = stateOf(a), sb = stateOf(b);
    if(sa !== sb) return sa - sb;
    return b.progressPct - a.progressPct;
  });
}
function pickPriorityContent(contents){
  const ordered = orderContentsByActivity(contents);
  return ordered.find(c => getNextPendingTopic(c)) || ordered[0] || null;
}

/* ============================================================
   COMPONENTES COMPARTILHADOS (Design System)
   ============================================================ */
const INPUT_CLS = "sf-input w-full h-11 px-3 text-[16px]";

function BackButton({onClick, label='Voltar', ariaLabel}){
  return (
    <button type="button" onClick={onClick} aria-label={ariaLabel}
      className="sf-btn sf-btn-ghost -ml-2 px-2 min-h-[44px] text-[14px] flex items-center gap-1.5">
      <IconArrowL size={14}/> {label}
    </button>
  );
}

function ProgressBar({value, height=5, width, color='var(--blue-500)', label, className=''}){
  const pct = Math.max(0, Math.min(100, Math.round(Number(value) || 0)));
  return (

/* Diálogo acessível: role=dialog, Esc fecha, foco preso e restaurado, rolagem da página travada. */
const __modalStack = [];
function ModalShell({onClose, labelledBy, variant='sheet', z=50, children}){
  const panelRef = useRef(null);
  const closeRef = useRef(onClose);
  closeRef.current = onClose;
  useEffect(()=>{
    const token = {};
    __modalStack.push(token);
    const prevFocus = document.activeElement;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const panel = panelRef.current;
    if(panel) panel.focus({preventScroll:true});
    const onKey = (e)=>{
      if(__modalStack[__modalStack.length - 1] !== token) return;
      if(e.key === 'Escape'){ e.preventDefault(); if(closeRef.current) closeRef.current(); return; }
      if(e.key === 'Tab' && panel){
        const f = Array.from(panel.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])'))
          .filter(el => el.offsetParent !== null);
        if(f.length === 0){ e.preventDefault(); panel.focus(); return; }
        const first = f[0], last = f[f.length - 1];
        if(e.shiftKey && (document.activeElement === first || document.activeElement === panel)){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
      }
    };
    document.addEventListener('keydown', onKey);
    return ()=>{
      document.removeEventListener('keydown', onKey);
      const i = __modalStack.indexOf(token); if(i >= 0) __modalStack.splice(i, 1);
      document.body.style.overflow = prevOverflow;
      try{ if(prevFocus && prevFocus.focus) prevFocus.focus({preventScroll:true}); }catch(e){}
    };
  }, []);

  const isSheet = variant === 'sheet';
  const isFull = variant === 'full';
  return (
    <div data-variant={variant} className={`sf-modal-wrap fixed inset-0 flex justify-center ${isSheet ? 'items-end' : (isFull ? 'items-stretch' : 'items-center')}`} style={{zIndex:z}}>
      <div className="absolute inset-0 bg-sf-scrim sf-scrim" onClick={isFull ? undefined : onClose} aria-hidden="true"/>
      <div ref={panelRef} role="dialog" aria-modal="true" aria-labelledby={labelledBy} tabIndex={-1}
        className={isSheet
          ? 'relative z-10 w-full max-w-[402px] rounded-t-[24px] bg-sf-surface p-5 sf-sheet'
          : (isFull
            ? 'relative z-10 w-full max-w-[402px] bg-sf-base overflow-y-auto'
            : 'relative z-10 w-[87%] max-w-[350px] rounded-[20px] p-5 bg-sf-surface border border-sf-border sf-dialog')}
        style={isSheet
          ? {maxHeight:'90dvh', overflowY:'auto', paddingBottom:'calc(28px + env(safe-area-inset-bottom,0px))', outline:'none', boxShadow:'var(--shadow-modal)'}
          : {outline:'none', boxShadow: isFull ? 'none' : 'var(--shadow-modal)'}}>
        {isSheet && <div className="sf-sheet-handle w-10 h-1 rounded-full bg-sf-handle mx-auto mb-4" aria-hidden="true"/>}
        {children}
      </div>
    </div>
  );
}

/* ============================================================
   ENTRADA
   Três modalidades, com comportamentos diferentes:
   - Conta Google: identifica a pessoa pelo Google; dados neste aparelho no espaço 'u:<id>'.
   - Perfil local: nome de usuário escolhido aqui, sem e-mail; dados neste aparelho no espaço 'p:<id>'.

   - Visitante: sem cadastro; trilhas de exemplo; progresso descartado após 30 dias sem uso;
     ao criar um perfil ou entrar com o Google, o que o visitante fez vai junto.
   ============================================================ */
const GOOGLE_G = (
  <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false">
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
  </svg>
);

/* Botão "Continuar com o Google" com desenho próprio (o botão pronto do Google é um iframe que não aceita estilo).
   Fluxo: Google Identity Services, cliente de token OAuth (janela do Google) → /userinfo → mesmo `sub` de antes,
   então os dados já salvos por conta continuam no mesmo espaço. O token não é guardado. */
function GoogleSignInButton({ onAuth, onUnavailable, onLoading, label='Continuar com o Google' }){
  const [state, setState] = useState(GOOGLE_CLIENT_ID ? 'init' : 'setup');   // init | ready | loading | error | unavailable | setup
  const clientRef = useRef(null);
  const authRef = useRef(onAuth); authRef.current = onAuth;
  const timeoutRef = useRef(null);

  useEffect(()=>{
    if(!GOOGLE_CLIENT_ID) return;
    let n = 0;
    const onToken = async (resp)=>{
      clearTimeout(timeoutRef.current);
      if(!resp || resp.error || !resp.access_token){ setState(resp && resp.error === 'access_denied' ? 'ready' : 'error'); return; }
      try{
        const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer ' + resp.access_token}});
        if(!r.ok) throw new Error('userinfo ' + r.status);
        const p = await r.json();
        if(!p || !p.sub) throw new Error('sem sub');
        authRef.current({kind:'google', id:p.sub, name:p.name || (p.email || '').split('@')[0] || 'Usuário', email:p.email || '', picture:p.picture || ''});
      }catch(e){ setState('error'); }
    };
    const t = setInterval(()=>{
      n++;
      if(window.google?.accounts?.oauth2){
        clearInterval(t);
        try{
          clientRef.current = window.google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID, scope: 'openid email profile', callback: onToken,
            error_callback: (err)=>{ clearTimeout(timeoutRef.current); setState(err && (err.type === 'popup_closed' || err.type === 'popup_failed_to_open') ? (err.type === 'popup_closed' ? 'ready' : 'error') : 'error'); },
          });
          setState('ready');
        }catch(e){ setState('unavailable'); if(onUnavailable) onUnavailable(); }
      }else if(n > 50){
        clearInterval(t); setState('unavailable'); if(onUnavailable) onUnavailable();
      }
    }, 100);
    return ()=>{ clearInterval(t); clearTimeout(timeoutRef.current); };
  }, []);

  const start = ()=>{
    if(!clientRef.current) return;
    setState('loading'); if(onLoading) onLoading();
    /* se a janela do Google for fechada sem resposta, o botão não fica preso em "Conectando" */
    clearTimeout(timeoutRef.current);
    timeoutRef.current = setTimeout(()=> setState(s => s === 'loading' ? 'ready' : s), 60000);
    try{ clientRef.current.requestAccessToken({prompt:''}); }catch(e){ setState('error'); }
  };

  if(state === 'setup'){
    return (
      <div className="rounded-2xl p-4" style={{background:'var(--warning-tint)', border:'1px solid var(--warning-border)'}}>
        <p className="text-[13px] text-sf-warning font-semibold m-0">Configuração necessária</p>
        <p className="text-[13px] text-sf-muted mt-1 mb-0 leading-relaxed">Defina <code>GOOGLE_CLIENT_ID</code> no início do script com o ID criado no Google Cloud Console.</p>
      </div>
    );
  }
  const loading = state === 'loading';
  return (
    <div>
      <button type="button" className="sf-gbtn" onClick={start} disabled={state === 'init' || loading || state === 'unavailable'}
        aria-busy={loading ? 'true' : undefined}>
        {GOOGLE_G}<span>{loading ? 'Conectando…' : label}</span>
      </button>
      {state === 'unavailable' && <p role="alert" className="text-[13px] leading-[18px] text-sf-muted mt-2 mb-0 text-center">O login do Google não carregou. Pode ser a conexão ou um bloqueador de conteúdo. <button type="button" className="sf-link-btn" onClick={()=>window.location.reload()}>Recarregar</button></p>}
      {state === 'error' && <p role="alert" className="text-[13px] leading-[18px] text-sf-error mt-2 mb-0 text-center">Não foi possível entrar com o Google. Tente de novo.</p>}
    </div>
  );
}

function suggestUsername(name){
  return String(name || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()

/* Perfil neste aparelho: primeiro o nome (como a pessoa quer ser chamada), depois o nome de usuário,
   que já vem sugerido a partir do nome e pode ser trocado. Sem e-mail e sem senha. */
function LocalProfileForm({onCreate, onCancel, submitLabel='Criar perfil e começar'}){
  const [name, setName] = useState('');
  const [username, setUsername] = useState('');
  const [userEdited, setUserEdited] = useState(false);
  const [error, setError] = useState('');
  const [touched, setTouched] = useState(false);
  const nameRef = useRef(null), userRef = useRef(null);
  useEffect(()=>{ if(nameRef.current) nameRef.current.focus({preventScroll:true}); }, []);
  /* a sugestão nunca nasce repetida: se "ana.souza" já existe aqui, sugere "ana.souza2" */
  const effectiveUser = useMemo(()=>{
    if(userEdited) return username;
    const base = suggestUsername(name); if(!base) return '';
    const taken = new Set(loadProfiles().map(p => p.username));
    if(!taken.has(base)) return base;
    for(let n = 2; n < 100; n++){ const c = base.slice(0, 20 - String(n).length) + n; if(!taken.has(c)) return c; }
    return base;
  }, [userEdited, username, name]);
  const live = touched ? usernameError(normalizeUsername(effectiveUser)) : '';
  const shown = error || live;
  const submit = (e)=>{
    e.preventDefault();
    setTouched(true);
    const err = onCreate({username: effectiveUser, name});
    if(err){ setError(err); if(userRef.current) userRef.current.focus(); }
  };
  return (
    <form onSubmit={submit} noValidate className="flex flex-col">
      <FieldLabel htmlFor="lp-name" optional>Como quer ser chamado?</FieldLabel>
      <input id="lp-name" ref={nameRef} value={name} maxLength={40} autoComplete="nickname" placeholder="Seu nome ou apelido"
        onChange={e=>{ setName(e.target.value); setError(''); }}
        className="sf-fieldbox h-12 rounded-xl px-3.5 text-[16px] text-sf-text outline-none" style={{fontFamily:'inherit'}}/>

      <FieldLabel htmlFor="lp-user">Nome de usuário</FieldLabel>
      <label className="sf-fieldbox sf-at h-12 rounded-xl cursor-text">
        <span aria-hidden="true">@</span>
        <input id="lp-user" ref={userRef} value={effectiveUser} placeholder="ana.souza"
          onChange={e=>{ setUsername(e.target.value.replace(/\s/g, '')); setUserEdited(true); setError(''); }}
          onBlur={()=> effectiveUser && setTouched(true)} autoComplete="username" autoCapitalize="none" autoCorrect="off" spellCheck="false" maxLength={24}
          aria-invalid={shown ? 'true' : undefined} aria-describedby={shown ? 'lp-user-err' : 'lp-user-hint'}
          className="bg-transparent border-0 outline-none text-[16px] text-sf-text flex-1 min-w-0 h-11 pl-1 pr-3.5" style={{fontFamily:'inherit'}}/>
      </label>
      {shown
        ? <p id="lp-user-err" role="alert" className="text-[13px] leading-[18px] text-sf-error mt-1.5 mb-0">{shown}</p>
        : <p id="lp-user-hint" className="text-[13px] leading-[18px] text-sf-faint mt-1.5 mb-0">É com ele que você acha seu perfil depois. Letras, números, ponto ou sublinhado.</p>}

      <p className="text-[13px] leading-[18px] text-sf-muted mt-5 mb-0">O perfil fica salvo só neste navegador. Quem usar este navegador também consegue abri-lo.</p>
      <button type="submit" className="sf-btn sf-btn-primary w-full h-12 mt-5 text-[15px]">{submitLabel}</button>
      {onCancel && <button type="button" onClick={onCancel} className="sf-btn sf-btn-ghost w-full h-11 mt-2 text-[15px] font-semibold">Voltar</button>}
    </form>
  );
}

function ProfileChip({p, size=40}){
  return <span aria-hidden="true" className="rounded-full flex items-center justify-center font-semibold shrink-0" style={{width:size, height:size, fontSize:Math.round(size*.35), background:'var(--brand-tint-2)', color:'var(--blue-300)'}}>{initialsOf(p.name)}</span>;
}

/* Linha de escolha da entrada: ícone, o que é e o que acontece. */
function ChoiceRow({Icon, title, desc, onClick, lead}){
  return (
    <button type="button" className="sf-choice" onClick={onClick}>
      {lead || <span className="sf-choice-icon" aria-hidden="true"><Icon size={20}/></span>}

        <span className="block text-[13px] leading-[18px] text-sf-muted mt-0.5">{desc}</span>
      </span>

    </button>
  );
}

function LoginScreen(){
  const {handleAuth, enterVisitor, createLocalProfile, enterLocalProfile} = useIdentity();
  const [mode, setMode] = useState('start');   // start | create | pick
  const [ready, setReady] = useState(()=> !window.__sfIntroActive);
  useEffect(()=>{
    if(ready) return;
    const on = ()=> setReady(true);
    window.addEventListener('sf-intro-done', on);
    return ()=> window.removeEventListener('sf-intro-done', on);
  }, [ready]);
  const profiles = useMemo(()=> loadProfiles().sort((a,b)=> (b.lastUsedAt||b.createdAt||0) - (a.lastUsedAt||a.createdAt||0)), [mode]);
  const recent = profiles[0];
  const titleRef = useRef(null);
  useEffect(()=>{ if(mode !== 'start' && titleRef.current) titleRef.current.focus({preventScroll:true}); }, [mode]);
  const back = <button type="button" onClick={()=>setMode('start')} className="sf-btn sf-btn-ghost sf-auth-back h-11 px-3 text-[15px] font-semibold"><IconArrowL size={18}/> Voltar</button>;

  return (
    <div className={`sf-auth${ready ? ' is-ready' : ''}`}>
      <main className="sf-auth-card" aria-labelledby="auth-title" key={mode}>
        <BrandLockup size={40} className="sf-auth-logo" role="img" aria-label={BRAND_NAME}/>

        {mode === 'start' && (
          <>
            <h1 id="auth-title" className="sf-auth-title">{recent ? `Que bom te ver, ${recent.name.split(' ')[0]}` : 'Vamos estudar?'}</h1>
            <p className="sf-auth-sub">Siga trilhas de estudo e veja quanto você já avançou.</p>
            <div className="sf-auth-actions">
              {recent && (
                <>
                  <ChoiceRow lead={<ProfileChip p={recent}/>} title={`Continuar como ${recent.name}`} desc={`@${recent.username} · perfil neste aparelho`} onClick={()=>enterLocalProfile(recent.id)}/>
                  {profiles.length > 1 && <button type="button" onClick={()=>setMode('pick')} className="sf-btn sf-btn-ghost w-full h-11 mt-1 text-[14px] font-semibold">Entrar com outro perfil</button>}
                  <div className="sf-auth-sep" role="separator" aria-label="ou"><span aria-hidden="true">ou</span></div>
                </>
              )}
              <GoogleSignInButton onAuth={handleAuth}/>
              {!recent && <div className="sf-auth-sep" role="separator" aria-label="ou"><span aria-hidden="true">ou</span></div>}
              <div className={`flex flex-col gap-2${recent ? ' mt-3' : ''}`}>
                <ChoiceRow Icon={IconUserPlus} title={recent ? 'Criar outro perfil' : 'Criar um perfil'} desc="Sem e-mail. Seu progresso fica salvo neste aparelho." onClick={()=>setMode('create')}/>
                <ChoiceRow Icon={IconCompass} title="Só dar uma olhada" desc="Sem cadastro. O progresso some após 30 dias sem uso." onClick={enterVisitor}/>
              </div>
            </div>
          </>
        )}

        {mode === 'create' && (
          <>
            {back}
            <h1 id="auth-title" ref={titleRef} tabIndex={-1} className="sf-auth-title" style={{textAlign:'left'}}>Criar seu perfil</h1>
            <p className="sf-auth-sub" style={{textAlign:'left'}}>Sem e-mail e sem senha. Leva menos de um minuto.</p>
            <LocalProfileForm onCreate={createLocalProfile}/>
          </>
        )}

        {mode === 'pick' && (
          <>
            {back}
            <h1 id="auth-title" ref={titleRef} tabIndex={-1} className="sf-auth-title" style={{textAlign:'left'}}>Quem vai estudar?</h1>
            <ul className="list-none p-0 m-0 mt-6 flex flex-col gap-2">
              {profiles.map(p => (
                <li key={p.id}><ChoiceRow lead={<ProfileChip p={p}/>} title={p.name} desc={`@${p.username}`} onClick={()=>enterLocalProfile(p.id)}/></li>
              ))}
            </ul>
            <button type="button" onClick={()=>setMode('create')} className="sf-btn sf-btn-ghost w-full h-11 mt-3 text-[15px] font-semibold"><IconPlus size={16}/> Criar outro perfil</button>
          </>
        )}
      </main>
      <p className="sf-auth-note">Tudo fica salvo neste navegador. O Study não sincroniza entre aparelhos.</p>
    </div>
  );
}

/* Folha "precisa de um perfil": o quê, por quê e como continuar. Nunca bloqueia a navegação. */
const ACCOUNT_FEATURES = {
  criar: {title:'Criar seu próprio conteúdo', why:'O Study monta a trilha com IA e guarda no seu perfil. Para continuar, crie um perfil ou entre com o Google.'},
  adicionar: {title:'Adicionar este conteúdo', why:'O Study monta a trilha com IA e guarda no seu perfil. Para continuar, crie um perfil ou entre com o Google.'},
  materia: {title:'Criar uma matéria', why:'Suas matérias ficam guardadas no seu perfil. Para continuar, crie um perfil ou entre com o Google.'},
  entrar: {title:'Guardar seu progresso', why:'Crie um perfil ou entre com o Google. Você continua de onde parou.'},
};
function AccountSheet(){
  const {accountAsk, closeAccountAsk} = useApp();
  const {handleAuth, createLocalProfile} = useIdentity();
  const [creating, setCreating] = useState(false);
  useEffect(()=>{ if(!accountAsk) setCreating(false); }, [accountAsk]);
  if(!accountAsk) return null;
  const f = ACCOUNT_FEATURES[accountAsk.feature] || ACCOUNT_FEATURES.entrar;
  const isEntrar = accountAsk.feature === 'entrar';
  return (
    <ModalShell onClose={closeAccountAsk} labelledBy="acc-title" z={70}>
      <h2 id="acc-title" className="text-[20px] leading-[26px] font-bold text-sf-text mt-1 mb-0">{creating ? 'Criar seu perfil' : f.title}</h2>
      {creating ? (
        <>
          <p className="text-[15px] leading-[21px] text-sf-muted mt-2 mb-0">O que você fez até agora vai junto, e você volta para esta tela.</p>
          <LocalProfileForm onCreate={createLocalProfile} onCancel={()=>setCreating(false)} submitLabel="Criar perfil e continuar"/>

      ) : (
        <>
          <p className="text-[15px] leading-[21px] text-sf-muted mt-2 mb-0">{f.why}</p>
          {!isEntrar && <p className="text-[15px] leading-[21px] text-sf-muted mt-2 mb-0">Você não perde nada: o que fez até agora vai junto.</p>}
          <div className="mt-5"><GoogleSignInButton onAuth={handleAuth}/></div>
          <div className="mt-3"><ChoiceRow Icon={IconUserPlus} title="Criar um perfil" desc="Sem e-mail. Fica salvo neste aparelho." onClick={()=>setCreating(true)}/></div>
          <button type="button" onClick={closeAccountAsk} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[15px] font-semibold">Agora não</button>
        </>
      )}

  );
}

/* Aviso depois de entrar: o progresso de visitante foi levado para a conta. */
function NoticeBanner(){
  const {notice, dismissNotice} = useApp();
  useEffect(()=>{ if(notice){ const t = setTimeout(dismissNotice, 9000); return ()=> clearTimeout(t); } }, [notice]);
  if(!notice || notice.kind !== 'migrated') return null;
  const parts = [];
  if(notice.modulesDone) parts.push(`${notice.modulesDone} ${plural(notice.modulesDone, 'módulo concluído', 'módulos concluídos')}`);
  if(notice.minutes) parts.push(`${fmtMin(notice.minutes)} de foco`);
  return (
    <div role="status" className="fixed left-1/2 -translate-x-1/2 top-3 w-[calc(100%-24px)] max-w-[420px] z-40 rounded-2xl p-3 flex items-center gap-3 bg-sf-surface"
      style={{border:'1px solid var(--success-border)', boxShadow:'var(--shadow-modal)', marginTop:'env(safe-area-inset-top,0px)'}}>
      <span className="text-sf-success shrink-0"><IconCheck size={18}/></span>
      <p className="flex-1 min-w-0 text-[14px] text-sf-text leading-snug m-0">
        <span className="font-semibold">Seu progresso de visitante veio junto.</span> {parts.join(' e ')}.
      </p>
      <button type="button" onClick={dismissNotice} aria-label="Dispensar aviso" className="sf-btn sf-btn-ghost w-11 h-11 -mr-1 flex items-center justify-center shrink-0"><IconClose size={16}/></button>
    </div>
  );
}
