/* Explorar (A03): busca, filtro por matéria, Meus conteúdos com trilha e catálogo agrupado por matéria (sem tempos). */
function ExplorarScreen(){
  const {contents, openCriarConteudo, openJornada, isUserSubject, discoverableSubjects} = useApp();
  const [query,setQuery] = useState('');
  const [activeSubject, setActiveSubject] = useState(null);
  const [preview,setPreview] = useState(null);
  const [previewItem, setPreviewItem] = useState(null);

  const words = useMemo(()=> queryWords(query), [query]);
  const matches = (subjectId)=> !activeSubject || subjectId === activeSubject;
  const myCollection = useMemo(()=> contents.filter(c => matches(c.subjectId) && contentMatchesQuery(c, words)), [contents, words, activeSubject]);
  const discoverableNotAdded = useMemo(()=> discoverableSubjects.filter(d => !isUserSubject(d.id)), [discoverableSubjects, contents]);
  const discoverableFiltered = useMemo(()=> discoverableNotAdded.filter(d => matches(d.subjectId) && contentMatchesQuery(d, words)), [discoverableNotAdded, words, activeSubject]);
  const subjectsAvail = useMemo(()=>{
    const ids = []; [...contents, ...discoverableSubjects].forEach(c => { if(c.subjectId && SUBJECTS[c.subjectId] && !ids.includes(c.subjectId)) ids.push(c.subjectId); });
    return ids;
  }, [contents, discoverableSubjects]);
  const groups = useMemo(()=>{
    const order = []; const map = {};
    discoverableFiltered.forEach(d => { if(!map[d.subjectId]){ map[d.subjectId] = []; order.push(d.subjectId); } map[d.subjectId].push(d); });
    return order.map(id => ({id, items: map[id]}));
  }, [discoverableFiltered]);
  const previewContent = contents.find(c=>c.id===preview);
  const openPreviewItem = (item)=> setPreviewItem({
    id: item.id, title: item.title, subjectId: item.subjectId, unitLabel: item.unitLabel, estMinutes: item.estMinutes, desc: item.desc,
    topics: (item.topics || []).map(t => ({ t: t.t || t, done: false })),
  });
  const nothing = myCollection.length === 0 && discoverableFiltered.length === 0 && (query.trim() || activeSubject);

  return (
    <div className="pt-16 px-5 pb-8">
      <div className="flex items-start justify-between gap-3">
        <ScreenTitle>Explorar</ScreenTitle>
        <button type="button" onClick={openCriarConteudo} className="sf-btn sf-btn-secondary h-11 px-4 text-[14px] shrink-0">Criar conteúdo</button>
      </div>

      <label className="sf-fieldbox mt-5 h-12 rounded-xl flex items-center px-3.5 gap-2.5 cursor-text">
        <span className="text-sf-muted inline-flex" aria-hidden="true"><IconSearch size={20}/></span>
        <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Buscar temas ou matérias"
          aria-label="Buscar temas ou matérias" enterKeyHint="search" autoComplete="off"
          className="bg-transparent border-0 outline-none text-[16px] text-sf-text flex-1 min-w-0" style={{fontFamily:'inherit'}}/>
        {query && <button type="button" onClick={()=>setQuery('')} aria-label="Limpar busca" className="sf-btn sf-btn-ghost h-11 px-3 -mr-2 text-[14px]">Limpar</button>}
      </label>

      <div className="carousel-x flex gap-2 mt-3 -mx-5 px-5 overflow-x-auto" role="group" aria-label="Filtrar por matéria">
        <button type="button" onClick={()=>setActiveSubject(null)} aria-pressed={!activeSubject} className="sf-chip sf-chip-check h-11 px-3.5 rounded-xl text-[14px] shrink-0">Todas</button>
        {subjectsAvail.map(id => (
          <button type="button" key={id} onClick={()=>setActiveSubject(a => a === id ? null : id)} aria-pressed={activeSubject===id}
            className="sf-chip sf-chip-check h-11 px-3.5 rounded-xl text-[14px] shrink-0 whitespace-nowrap">{subjName(id)}</button>
        ))}
      </div>

      {nothing ? (
        <div className="mt-8" role="status">
          <p className="text-[16px] leading-[22px] font-semibold text-sf-text">{query.trim() ? `Nada encontrado para “${query.trim()}”` : 'Nada encontrado nesta matéria'}</p>
          <p className="text-[14px] leading-[20px] text-sf-muted mt-1">A busca ignora acentos. Tente outro termo ou crie um conteúdo com esse tema.</p>
          <button type="button" onClick={openCriarConteudo} className="sf-btn sf-btn-secondary w-full mt-4 h-12 text-[14px]">Criar conteúdo</button>
        </div>
      ) : (
        <>
          {(myCollection.length > 0 || contents.length > 0) && (
            <section className="mt-6" aria-labelledby="h-meus">
              <div className="flex items-center justify-between">
                <SectionTitle id="h-meus">Meus conteúdos</SectionTitle>
                <button type="button" onClick={()=>openJornada()} className="sf-btn sf-btn-ghost h-11 px-3 -mr-3 text-[14px] font-semibold">Ver trilhas</button>
              </div>
              {myCollection.length === 0
                ? <p className="text-[14px] leading-[20px] text-sf-muted mt-2">Nenhum dos seus conteúdos corresponde ao filtro.</p>
                : myCollection.map(c => <ContentRow key={c.id} c={c} showPct={false} trail onClick={()=>setPreview(c.id)}/>)}
            </section>
          )}

          {groups.map(g => (
            <section key={g.id} className="mt-8" aria-labelledby={`h-subj-${g.id}`}>
              <div className="flex items-center gap-2.5">
                <SubjectTile subjectId={g.id} size="sm"/>
                <h2 id={`h-subj-${g.id}`} className="flex-1 text-[18px] leading-[24px] font-bold text-sf-text">{subjName(g.id)}</h2>
                <span className="text-[14px] text-sf-muted">{g.items.length} {plural(g.items.length, 'conteúdo', 'conteúdos')}</span>
              </div>
              <div className="mt-1 pl-[38px]">
                {g.items.map(d => (
                  <button type="button" key={d.id} onClick={()=>openPreviewItem(d)} className="sf-row-div w-full text-left py-3 flex items-center gap-3 bg-transparent border-0 cursor-pointer" aria-label={`Ver prévia de ${d.title}`}>
                    <span className="flex-1 min-w-0 sf-ed-content text-sf-text truncate">{d.title}</span>
                    <span className="text-sf-muted shrink-0"><IconChevronR/></span>
                  </button>
                ))}
              </div>
            </section>
          ))}
          {discoverableNotAdded.length === 0 && <p className="text-[14px] leading-[20px] text-sf-muted mt-8">Você já adicionou todos os conteúdos do catálogo. Crie um conteúdo próprio quando quiser.</p>}
        </>
      )}

      {previewContent && <CollectionPreviewSheet content={previewContent} onClose={()=>setPreview(null)}/>}
      {previewItem && <SubjectPreviewModal item={previewItem} onClose={()=>setPreviewItem(null)}/>}
    </div>
  );
}

  const header = (
    <>
      <BackButton onClick={closeView}/>
      <div className="mt-4 flex items-center gap-3">
        <SubjectTile subjectId={c.subjectId}/>

      <SubTitle className="mt-4">{c.title}</SubTitle>

  if(c.journeyStatus === 'loading'){
    return (

        {header}
        <div className="mt-8" role="status" aria-live="polite">
          <SectionTitle>Montando a trilha</SectionTitle>
          <p className="text-[14px] leading-[20px] text-sf-muted mt-1.5">Na primeira vez pode levar até 30 segundos. Você pode sair desta tela; a trilha continua sendo montada.</p>

                  <span className="sf-ed-content text-sf-text block">{t.t}</span>
                  <span className="text-[14px] leading-[20px] text-sf-muted flex items-center gap-1.5 mt-0.5">
                    <meta.Icon size={16}/> {meta.label}{isDone ? ' · concluído' : (isNext ? ' · próximo' : '')}
                  </span>

            {prog.completed > 0 ? `Continuar módulo ${nextTopicIdx + 1}` : 'Começar módulo 1'}

/* Começar foco (A17). Meta única: o ajuste aqui altera a própria meta de Configurações (settings.focusMin). */

  const {contents, closeView, startSession, settings, setFocusMin, session} = useApp();
  const c = contents.find(x=>x.id===contentId);
  if(!c) return <MissingContent onBack={closeView}/>;
  const dur = settings.focusMin;
  const nextIdx = getNextPendingTopicIndex(c);
  const nextTopic = nextIdx >= 0 ? c.topics[nextIdx] : null;
  const isQuiz = nextTopic && getTopicType(c, nextIdx) === MODULE_TYPES.QUIZ;
  const plan = [
    nextTopic ? (isQuiz ? 'Fazer a avaliação final' : `Estudar o módulo "${nextTopic.t}"`) : `Revisar ${c.title}`,
    'Revisar o que ficou com dúvida',
    'Anotar dúvidas para a próxima sessão',
  ];
  return (
    <div className="pt-12 px-5 pb-8 flex flex-col min-h-[calc(100dvh-var(--tabbar-h))]">
      <BackButton onClick={closeView}/>
      <SubTitle className="mt-4">Começar foco</SubTitle>
      <p className="text-[14px] leading-[20px] text-sf-muted mt-1.5">O tempo só conta depois que você começar. Se o STUDY ficar em segundo plano, o foco pausa sozinho.</p>

      <div className="mt-5 flex items-center gap-3 pb-5" style={{borderBottom:'1px solid var(--border)'}}>
        <SubjectTile subjectId={c.subjectId}/>
        <div className="flex-1 min-w-0">
          <p className="sf-ed-content text-sf-text truncate">{c.title}</p>
          <p className="text-[14px] leading-[20px] text-sf-muted truncate">{nextTopic ? `Próximo: ${nextTopic.t}` : 'Todos os módulos concluídos'}</p>
        </div>
      </div>

      <div className="py-4 flex items-center justify-between" style={{borderBottom:'1px solid var(--border)'}}>
        <div>
          <p className="text-[14px] leading-[20px] text-sf-muted">Meta da sessão</p>
          <p className="text-[18px] leading-[24px] font-bold text-sf-text tnum" aria-live="polite">{dur} minutos</p>
        </div>
        <div className="flex items-center gap-3" role="group" aria-label="Ajustar meta da sessão">
          <button type="button" className="sf-roundbtn" onClick={()=>setFocusMin(dur-5)} disabled={dur<=5} aria-label="Diminuir 5 minutos"><IconMinus size={18}/></button>
          <button type="button" className="sf-roundbtn" onClick={()=>setFocusMin(dur+5)} disabled={dur>=120} aria-label="Aumentar 5 minutos"><IconPlus size={18}/></button>

const TIMER_DEFAULT_POS = {r:16, t:10};
const TIMER_MARGIN = 6;
const TIMER_BOTTOM_RESERVED = 75 + 6;
const DRAG_THRESHOLD = 6;

function fmtMinSec(sec){ const m = Math.floor(sec/60), s = Math.floor(sec%60); return m ? `${m} min${s ? ` ${s} s` : ''}` : `${s} s`; }
/* Contexto de módulo da sessão: o módulo aberto (se for do mesmo conteúdo) ou o próximo pendente. */
function useSessionContext(){
  const {session, contents, view} = useApp();
  const contentId = session ? session.contentId : (view && view.name === 'module' ? view.contentId : null);
  const c = contentId ? contents.find(x => x.id === contentId) : null;
  const inModule = !!(view && view.name === 'module' && c && view.contentId === c.id);
  const topicIdx = c ? (inModule ? view.topicIndex : getNextPendingTopicIndex(c)) : -1;
  const topic = c && topicIdx >= 0 ? c.topics[topicIdx] : null;
  const typeLabel = topic ? MODULE_META[getTopicType(c, topicIdx)].label : null;
  return {c, topicIdx, topic, typeLabel, inModule};
}

/* Barra de sessão (DS v2, A05–A09, A18). Sem sessão, aparece só dentro de um módulo, no estado "Pronta":
   abrir conteúdo não conta tempo (D2). Com sessão: Rodando → Meta próxima (último minuto, só texto, D3) → Pausada. */
function SessionBar(){
  const {session, elapsedSec, startSession, pauseSession, resumeSession, setTimerExpanded, timerExpanded, fullScreenFocus, settings, view} = useApp();
  const {c} = useSessionContext();
  const visible = !(timerExpanded || fullScreenFocus) && !!(session || (view && view.name === 'module' && c));
  useEffect(()=>{ document.documentElement.style.setProperty('--sessionbar-h', visible ? (session ? '73px' : '65px') : '0px'); }, [visible, !!session]);
  if(timerExpanded || fullScreenFocus) return null;
  if(!session && !(view && view.name === 'module' && c)) return null;

  const subjectId = session ? (session.subjectId || (c && c.subjectId)) : c.subjectId;
  const title = session ? (session.title || (c && c.title) || subjName(subjectId)) : c.title;
  let state = 'ready', ctx = 'Foco não iniciado', time = `Meta de ${settings.focusMin} min`;
  if(session){
    const remain = Math.max(0, session.plannedMin*60 - elapsedSec);
    const remainMin = Math.max(1, Math.ceil(remain/60));
    time = `${remainMin} min para a meta`;
    if(session.status === 'paused'){
      state = 'paused';
      ctx = session.pauseReason === 'away' ? 'Pausada enquanto você estava fora' : `Pausada · ${title}`;
    } else if(remain <= 60){
      state = 'near'; ctx = 'A sessão encerra ao atingir a meta';
    } else { state = 'running'; ctx = `Foco · ${title}`; }
  }
  const open = ()=> session && setTimerExpanded(true);
  return (
    <>
      <div aria-hidden="true" style={{height: session ? 73 : 65}}/>
      <section className="sf-sessionbar" aria-label="Sessão de foco"
        style={{bottom: view && view.name === 'concluida' ? 0 : 'calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px))'}}>
        <div className="flex items-center gap-3 pl-4 pr-3 py-2.5">
          <div role={session ? 'button' : undefined} tabIndex={session ? 0 : undefined} onClick={open}
            onKeyDown={(e)=>{ if(session && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); open(); } }}
            aria-label={session ? `Abrir modo foco. ${ctx}. ${time}` : undefined}
            className={`flex-1 min-w-0 flex items-center gap-3 ${session ? 'cursor-pointer' : ''}`}>
            <SubjectTile subjectId={subjectId} size="sm"/>
            <div className="flex-1 min-w-0">
              <p key={ctx} className="sf-swap text-[13px] leading-[18px] text-sf-muted truncate" aria-live="polite">{ctx}</p>
              <p className="text-[14px] leading-[20px] font-semibold text-sf-text tnum truncate">{time}</p>
              {session && c && (c.topics || []).length > 0 && <SegmentedTrail size="sm" className="mt-1" states={trailStates(c)} label={`Trilha de ${c.title}`}/>}
            </div>
          </div>
          {!session && (
            <button type="button" className="sf-pillbtn" onClick={()=>startSession(c.id, {stay:true})}>
              <IconPlay size={12}/> Começar foco
            </button>
          )}
          {session && session.status === 'paused' && (
            <button type="button" className="sf-roundbtn" onClick={resumeSession} aria-label="Retomar foco"><IconPlay size={14}/></button>
          )}
          {session && session.status !== 'paused' && (
            <button type="button" className="sf-roundbtn" onClick={()=>pauseSession()} aria-label="Pausar foco"><IconPause size={18}/></button>
          )}
        </div>
      </section>
    </>
  );
}

/* Modo foco (A13/A14): cronômetro em Inter (E2), contagem regressiva até a meta. */
function FocusScreen(){
  const {session, elapsedSec, timerExpanded, setTimerExpanded, fullScreenFocus, setFullScreenFocus, pauseSession, resumeSession, setConfirmEnd} = useApp();

  const close = ()=>{ setTimerExpanded(false); setFullScreenFocus(false); };
  const paused = session.status === 'paused';
  const remain = Math.max(0, session.plannedMin*60 - elapsedSec);
  const remainMin = Math.max(1, Math.ceil(remain/60));
  const subjectId = session.subjectId || (c && c.subjectId);
  const prog = c ? getContentProgress(c) : null;
  return (
    <ModalShell variant="full" z={50} onClose={close} labelledBy="focus-title">
      <div className="pt-6 px-5 pb-8 min-h-[100dvh] flex flex-col">

          <button type="button" onClick={close} aria-label="Recolher modo foco" className="sf-roundbtn absolute left-0"><span className="inline-flex" style={{transform:'rotate(180deg)'}}><IconChevronUp size={18}/></span></button>
          <p key={paused ? 'p' : 'r'} className="sf-swap text-[14px] font-semibold text-sf-muted">{paused ? 'Sessão pausada' : 'Sessão de foco'}</p>

        <div className="flex-1 flex flex-col justify-center py-8">
          <p className="flex items-center gap-2">
            <SubjectTile subjectId={subjectId} size="sm"/>

          </p>
          <h2 id="focus-title" className="sf-ed-title text-sf-text mt-3">{topic ? topic.t : (session.title || 'Sessão de foco')}</h2>
          <p className="text-[64px] leading-[72px] font-bold text-sf-text tnum mt-6" style={{letterSpacing:'-.02em'}} role="timer" aria-label={`${remainMin} minutos para a meta`}>{fmtMMSS(remain)}</p>
          <p key={paused ? 'p' : 'r'} className="sf-swap text-[14px] leading-[20px] text-sf-muted mt-1">
            {paused ? `Pausado. Faltam ${remainMin} min para a meta de ${session.plannedMin} min.` : `para a meta de ${session.plannedMin} min`}
          </p>
          <p className="text-[14px] leading-[20px] text-sf-muted mt-1 tnum">{fmtMMSS(elapsedSec)} de foco nesta sessão</p>

            <>
              <SegmentedTrail className="mt-10" states={trailStates(c)} label={`Trilha de ${c.title}`}/>
              <p className="text-[14px] leading-[20px] text-sf-muted mt-2">Trilha: {prog.completed} de {prog.total} módulos concluídos</p>
            </>
          )}
        </div>
        <div className="flex flex-col gap-2">
          {paused
            ? <button type="button" onClick={resumeSession} className="sf-btn sf-btn-primary w-full h-12 text-[14px]">Retomar</button>
            : <button type="button" onClick={()=>pauseSession()} className="sf-btn sf-btn-secondary w-full h-12 text-[14px]">Pausar</button>}
          <button type="button" onClick={()=>setConfirmEnd(true)} className="sf-btn sf-btn-ghost w-full h-11 text-[14px] font-semibold">Encerrar sessão</button>
        </div>
      </div>
    </ModalShell>
  );
}

/* Progresso (A21). Semana de segunda a domingo, a mesma do Plano. Média = averageStartedPct (regra única, também usada no Início). */
function ProgressoScreen(){
  const {contents, liveSessions, openDetalhe, goTab} = useApp();
  const WEEK_LABELS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const WEEK_LONG = ['segunda','terça','quarta','quinta','sexta','sábado','domingo'];
  const stats = useMemo(()=>{
    const today = todayStr();
    const offset = (parseDateStr(today).getDay() + 6) % 7;
    const start = addDaysStr(today, -offset);
    const days = Array.from({length:7}, (_, i) => {
      const ds = addDaysStr(start, i);
      const min = liveSessions.filter(x => { const ts = x.startedAt || x.dateTs; return ts && toDateStr(new Date(ts)) === ds; })
        .reduce((a, x) => a + (x.durationMin || 0), 0);
      return {ds, min, label: WEEK_LABELS[i], isToday: ds === today};
    });
    const totalMin = liveSessions.reduce((a,x)=> a + (x.durationMin||0), 0);
    return {days, todayIdx: offset, weekMin: days.reduce((a,d)=>a+d.min,0), maxMin: Math.max(1, ...days.map(d=>d.min)), totalMin, sessionsCount: liveSessions.length};
  }, [liveSessions]);
  const avg = averageStartedPct(contents);
  const started = orderContentsByActivity(contents).filter(isContentStarted);
  const chartSummary = stats.days.map(d => `${d.label}: ${d.min} min`).join(', ');

  return (
    <div className="pt-16 px-5 pb-8">
      <ScreenTitle>Progresso</ScreenTitle>

      <section className="mt-6" aria-labelledby="h-semana-prog">
        <SectionTitle id="h-semana-prog">Esta semana</SectionTitle>
        <p className="mt-2 flex items-baseline gap-2 flex-wrap">
          <span className="sf-ed-number text-sf-text">{fmtMin(stats.weekMin)}</span>
          <span className="text-[14px] text-sf-muted">de foco nesta semana</span>
        </p>
        <div className="mt-6 flex items-end gap-2 h-[120px]" role="img" aria-label={`Minutos de foco por dia nesta semana. ${chartSummary}`}>
          {stats.days.map(d => (
            <div key={d.ds} className="flex-1 h-full flex flex-col items-center justify-end gap-1" aria-hidden="true">
              <span className="text-[12px] font-medium text-sf-text tnum whitespace-nowrap">{d.min > 0 ? `${d.min} min` : ''}</span>
              <span className="w-full rounded-[4px]" style={{height: d.min > 0 ? `${Math.max(6, (d.min / stats.maxMin) * 82)}%` : 2, background: d.min > 0 ? 'var(--chart-bar)' : 'var(--chart-empty)'}}/>
            </div>
          ))}
        </div>
        <div className="flex gap-2 mt-2 pt-2" style={{borderTop:'1px solid var(--border)'}} aria-hidden="true">
          {stats.days.map(d => <span key={d.ds} className="flex-1 text-center text-[12px] font-medium" style={{color: d.isToday ? 'var(--text-primary)' : 'var(--text-secondary)'}}>{d.label}</span>)}
        </div>
        <p className="text-[14px] leading-[20px] text-sf-muted mt-3">Mesmos dias da semana do Plano. Hoje é {WEEK_LONG[stats.todayIdx]}.</p>
        {stats.sessionsCount > 0 && <p className="text-[14px] leading-[20px] text-sf-muted mt-1 tnum">No total: {fmtMin(stats.totalMin)} em {stats.sessionsCount} {plural(stats.sessionsCount, 'sessão', 'sessões')}.</p>}
      </section>

      <section className="mt-10" aria-labelledby="h-conteudos-prog">
        <div className="flex items-baseline gap-x-2 flex-wrap">
          <SectionTitle id="h-conteudos-prog">Conteúdos</SectionTitle>
          {avg.count > 0 && <span className="text-[14px] text-sf-muted tnum">média de {avg.pct}% {avg.count === 1 ? 'no conteúdo iniciado' : `nos ${avg.count} conteúdos iniciados`}</span>}
        </div>
        {contents.length === 0 ? (
          <div className="mt-3">
            <p className="text-[14px] leading-[20px] text-sf-muted">Adicione um conteúdo em Explorar para acompanhar o progresso aqui.</p>
            <button type="button" onClick={()=>goTab('estudar')} className="sf-btn sf-btn-primary w-full mt-4 h-12 text-[14px]">Explorar conteúdos</button>
          </div>
        ) : started.length === 0 ? (
          <p className="text-[14px] leading-[20px] text-sf-muted mt-2">Conclua o primeiro módulo de um conteúdo para ele aparecer aqui.</p>
        ) : (
          <div className="mt-2">
            {started.map(c => {
              const {pct} = getContentProgress(c);
              return (
                <button type="button" key={c.id} onClick={()=>openDetalhe(c.id)} className="sf-row-div w-full text-left py-3 flex items-center gap-3 bg-transparent border-0 cursor-pointer">
                  <SubjectTile subjectId={c.subjectId}/>
                  <span className="flex-1 min-w-0">
                    <span className="flex items-baseline justify-between gap-2">
                      <span className="sf-ed-content text-sf-text truncate">{c.title}</span>
                      <span className="text-[14px] font-semibold text-sf-text tnum shrink-0">{pct}%</span>
                    </span>
                    <SegmentedTrail size="sm" className="mt-2" states={trailStates(c)} label={`Trilha de ${c.title}`}/>
                  </span>
                </button>
              );
            })}
          </div>
        )}
      </section>
    </div>
  );
}

function PlannerRow({it, isActive, otherActive, onOpen, onToggle, onStart, onOpenTimer}){
  const accent = subjectAccent(it.subjectId);
  const canStart = SESSION_TYPES.includes(it.type) && !it.done;
  const typeLabel = (PLANNER_TYPES.find(t=>t.k===it.type) || {}).l || 'Atividade';
  const meta = [plannerTimeLabel(it), it.duration ? `${it.duration} min` : null, typeLabel].filter(Boolean).join(' · ');
  return (
    <div className="sf-card rounded-2xl p-3.5 mb-2.5" style={{borderLeft:`3px solid ${accent}`}}>
      <div className="flex items-start gap-1">
        <button type="button" role="checkbox" aria-checked={!!it.done} aria-label={it.title} onClick={onToggle}
          className="w-11 h-11 -ml-[11px] -mt-[9px] shrink-0 flex items-center justify-center bg-transparent border-0">
          <span className="w-[22px] h-[22px] rounded-full flex items-center justify-center"
            style={{background: it.done ? accent : 'transparent', border: it.done ? 'none' : '1.5px solid var(--field-border)', color: inkOn(accent)}}>
            {it.done && <IconCheck size={12}/>}
          </span>
        </button>
        <button type="button" onClick={onOpen} aria-label={`Editar atividade: ${it.title}`}
          className="flex-1 min-w-0 text-left bg-transparent border-0 p-0">
          <span className="flex items-center gap-2">
            <span aria-hidden="true" style={{fontSize:16, lineHeight:1}}>{subjectEmoji(it.subjectId)}</span>
            <span className="text-[13px] font-semibold truncate"
              style={{color: it.done ? 'var(--text-secondary)' : 'var(--text-primary)', textDecoration: it.done ? 'line-through' : 'none'}}>{it.title}</span>
          </span>
          <span className="block text-[11px] text-sf-muted mt-1">{meta}</span>
          {it.studiedMin>0 && (
            <span className="block text-[11px] mt-1" style={{color:'var(--blue-300)'}}>
              {it.duration ? `Planejado: ${it.duration} min · ` : ''}Estudado: {it.studiedMin} min
            </span>
          )}
          {it.note && <span className="block text-[11px] text-sf-faint mt-1 truncate">{it.note}</span>}
        </button>
      </div>
      {isActive ? (
        <button type="button" onClick={onOpenTimer}
          className="w-full mt-3 h-11 rounded-xl border-0 text-[12px] font-semibold flex items-center justify-center gap-2"
          style={{background:'var(--brand-tint-2)', color:'var(--blue-300)'}}>
          <IconTimer size={14}/> Em andamento · abrir timer
        </button>
      ) : canStart && (
        <button type="button" onClick={onStart} disabled={otherActive}
          className="w-full mt-3 h-11 rounded-xl border-0 text-[12px] font-semibold flex items-center justify-center gap-2"
          style={{background: otherActive ? 'var(--bg-elevated)' : 'var(--blue-500)', color: otherActive ? 'var(--text-secondary)' : '#fff'}}>
          <IconPlay size={11}/> {otherActive ? 'Outra sessão em andamento' : 'Começar sessão'}
        </button>
      )}
    </div>
  );
}

/* Nova atividade (A20). "Quando": Hoje, Amanhã, Escolher data ou Sem data.
   Sem data = item da lista "Sem data" (os mesmos dados de sf_tasks: título e matéria). Com data = item do Plano (sf_planner). */
function Group({id, label, children}){
  return (
    <div role="group" aria-labelledby={id} className="mt-5">
      <p id={id} className="text-[14px] leading-[20px] font-semibold text-sf-text mb-2">{label}</p>
      {children}
    </div>
  );
}
function PlannerItemSheet({item, date, onClose, onSave, onSaveTask, onDelete, allowNoDate}){
  const {openSubjectSheet} = useApp();
  const today = todayStr(), tomorrow = addDaysStr(todayStr(), 1);
  const [title, setTitle] = useState(item ? item.title : '');
  const [dateStr, setDateStr] = useState(item ? item.date : (date || today));
  const [when, setWhen] = useState(()=>{ const d = item ? item.date : (date || today); return d === today ? 'hoje' : (d === tomorrow ? 'amanha' : 'data'); });
  const [time, setTime] = useState(item ? (item.time || '') : '');
  const [subjectId, setSubjectId] = useState(item ? item.subjectId : Object.keys(SUBJECTS)[0]);
  const [type, setType] = useState(item ? item.type : 'estudo');
  const [duration, setDuration] = useState(item && item.duration ? String(item.duration) : '');
  const [note, setNote] = useState(item ? (item.note || '') : '');
  const [done, setDone] = useState(item ? !!item.done : false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [showErr, setShowErr] = useState(false);
  const titleRef = useRef(null);
  const noDate = when === 'sem';
  const effDate = when === 'hoje' ? today : (when === 'amanha' ? tomorrow : dateStr);
  const valid = title.trim().length>0 && (noDate || !!effDate);

  const save = ()=>{
    if(!valid){ setShowErr(true); if(!title.trim() && titleRef.current) titleRef.current.focus(); return; }
    if(noDate){ onSaveTask(title.trim(), subjectId); return; }
    const dur = parseInt(duration, 10);
    onSave({id: item ? item.id : undefined, title: title.trim(), date: effDate, time, subjectId, type,
      duration: dur>0 ? Math.min(dur, 600) : null, note: note.trim(), done});
  };
  const WHEN = [{k:'hoje', l:'Hoje'}, {k:'amanha', l:'Amanhã'}, {k:'data', l:'Escolher data'}].concat(allowNoDate && !item ? [{k:'sem', l:'Sem data'}] : []);

  return (
    <ModalShell onClose={onClose} labelledBy="planner-sheet-title">
      <h2 id="planner-sheet-title" className="sf-ed-title text-sf-text">{item ? 'Editar atividade' : 'Nova atividade'}</h2>

      <label htmlFor="pl-title" className="block text-[14px] leading-[20px] font-semibold text-sf-text mt-5 mb-2">O que fazer</label>
      <input id="pl-title" ref={titleRef} value={title} onChange={e=>setTitle(e.target.value)} maxLength={80}
        placeholder="Ex.: Revisar derivadas" className={INPUT_CLS}
        aria-invalid={showErr && !title.trim() ? 'true' : undefined} aria-describedby={showErr && !valid ? 'pl-err' : undefined}/>

      <Group id="pl-when-label" label="Quando">
        <div className="flex gap-2 flex-wrap">
          {WHEN.map(w => (
            <button type="button" key={w.k} onClick={()=>setWhen(w.k)} aria-pressed={when===w.k}
              className="sf-chip sf-chip-check px-3.5 h-11 rounded-xl text-[14px]">{w.l}</button>
          ))}
        </div>
        {noDate && <p className="text-[14px] leading-[20px] text-sf-muted mt-2">Sem data, a atividade vai para a lista "Sem data" do Plano. Tipo, horário e duração aparecem quando você escolhe uma data.</p>}
        {!noDate && (
          <div className="grid grid-cols-2 gap-3 mt-3">
            {when === 'data' ? (
              <div className="min-w-0">
                <FieldLabel htmlFor="pl-date">Data</FieldLabel>
                <input id="pl-date" type="date" value={dateStr} onChange={e=>setDateStr(e.target.value)} className={INPUT_CLS}/>
              </div>
            ) : <span/>}
            <div className="min-w-0">
              <FieldLabel htmlFor="pl-time" optional>Horário</FieldLabel>
              <input id="pl-time" type="time" value={time} onChange={e=>setTime(e.target.value)} className={INPUT_CLS}/>
            </div>
          </div>
        )}
      </Group>

      <Group id="pl-subject-label" label="Matéria">
        <div className="flex gap-2 flex-wrap">
          {Object.keys(SUBJECTS).map(k=>(
            <button type="button" key={k} onClick={()=>setSubjectId(k)} aria-pressed={subjectId===k}
              className="sf-chip sf-chip-check px-3.5 h-11 rounded-xl text-[14px]">
              <span aria-hidden="true">{SUBJECTS[k].emoji}</span>{subjName(k)}
            </button>
          ))}
          <button type="button" onClick={()=>openSubjectSheet({onSaved:(id)=>setSubjectId(id)})}
            className="sf-chip px-3.5 h-11 rounded-xl text-[14px]" style={{borderStyle:'dashed'}}>+ Nova matéria</button>
        </div>
      </Group>

      {!noDate && (
        <>
          <Group id="pl-type-label" label="Tipo de atividade">
            <div className="flex gap-2 flex-wrap">
              {PLANNER_TYPES.map(t=>(
                <button type="button" key={t.k} onClick={()=>setType(t.k)} aria-pressed={type===t.k}
                  className="sf-chip sf-chip-check px-3.5 h-11 rounded-xl text-[14px]">{t.l}</button>
              ))}
            </div>
          </Group>

          <FieldLabel htmlFor="pl-duration" optional>Duração estimada (minutos)</FieldLabel>
          <div className="flex items-center gap-2 flex-wrap">
            <input id="pl-duration" type="number" inputMode="numeric" min="1" max="600" value={duration} onChange={e=>setDuration(e.target.value)}
              placeholder="min" className={INPUT_CLS} style={{width:90}}/>
            {[15,30,45,60,90].map(m=>(
              <button type="button" key={m} onClick={()=>setDuration(String(m))} aria-pressed={String(m)===duration}
                aria-label={`${m} minutos`} className="sf-chip h-11 min-w-[44px] px-2.5 rounded-xl text-[14px] tnum">{m}</button>
            ))}
          </div>

          <FieldLabel htmlFor="pl-note" optional>Observação</FieldLabel>
          <textarea id="pl-note" value={note} onChange={e=>setNote(e.target.value)} maxLength={200} placeholder="Ex.: capítulo 3, exercícios 1 a 10"
            className="sf-input w-full h-16 p-3 text-[16px] resize-none"/>

          {item && (
            <Group id="pl-status-label" label="Status">
              <div className="flex gap-2">
                {[{v:false,l:'Pendente'},{v:true,l:'Feita'}].map(o=>(
                  <button type="button" key={o.l} onClick={()=>setDone(o.v)} aria-pressed={done===o.v}
                    className="sf-chip sf-chip-check flex-1 h-11 rounded-xl text-[14px]">{o.l}</button>
                ))}
              </div>
            </Group>
          )}
        </>
      )}

      {showErr && !valid && (
        <p id="pl-err" role="alert" className="text-[14px] text-sf-error mt-4">Escreva o que fazer{noDate ? '' : ' e escolha uma data'} para salvar.</p>
      )}

      <button type="button" onClick={save} className="sf-btn sf-btn-primary w-full mt-6 h-12 text-[14px]">Salvar atividade</button>
      <button type="button" onClick={onClose} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Cancelar</button>
      {item && (
        confirmDel ? (
          <div className="flex gap-2 mt-1" role="alert">
            <button type="button" onClick={onDelete} className="sf-btn sf-btn-danger flex-1 h-11 text-[14px]">Confirmar exclusão</button>
            <button type="button" onClick={()=>setConfirmDel(false)} className="sf-btn sf-btn-ghost h-11 px-4 text-[14px]">Voltar</button>
          </div>
        ) : (
          <button type="button" onClick={()=>setConfirmDel(true)} className="sf-btn sf-btn-outline-danger w-full mt-1 h-11 text-[14px]">Excluir atividade</button>
        )
      )}
    </ModalShell>
  );
}

/* Linha de item do Plano (A19): marcar como feito · título · matéria + quando · "Começar foco" */
function PlanItemRow({it, whenLabel, isActive, otherActive, onOpen, onToggle, onStart, onOpenTimer}){
  const canStart = SESSION_TYPES.includes(it.type) && !it.done;
  const meta = whenLabel || [it.time || null, it.duration ? `${it.duration} min` : null].filter(Boolean).join(', ') || ((PLANNER_TYPES.find(t=>t.k===it.type) || {}).l || 'Atividade');
  return (
    <div className="sf-row-div py-2.5 flex items-center gap-2">
      <button type="button" role="checkbox" aria-checked={!!it.done} aria-label={`${it.title}: marcar como ${it.done ? 'pendente' : 'feita'}`} onClick={onToggle}
        className="w-11 h-11 -ml-2.5 shrink-0 flex items-center justify-center bg-transparent border-0 cursor-pointer">
        <span className="w-5 h-5 rounded-full flex items-center justify-center"
          style={{border: `1.5px solid ${it.done ? 'var(--success)' : 'var(--field-border)'}`, color:'var(--success)'}}>{it.done && <IconCheck size={11}/>}</span>
      </button>
      <button type="button" onClick={onOpen} aria-label={`Editar atividade: ${it.title}`} className="flex-1 min-w-0 text-left bg-transparent border-0 p-0 cursor-pointer">
        <span className={`block text-[14px] leading-[20px] truncate ${it.done ? 'text-sf-muted' : 'text-sf-text'}`}>{it.title}</span>
        <span className="mt-1 flex items-center gap-2 text-[14px] leading-[20px] text-sf-muted min-w-0">
          <SubjectTile subjectId={it.subjectId} size="sm"/>
          <span className="truncate">{it.done ? 'Feita' : meta}</span>
        </span>
        {it.studiedMin>0 && <span className="block text-[12px] text-sf-muted mt-1 tnum">Estudado: {it.studiedMin} min{it.duration ? ` de ${it.duration}` : ''}</span>}
      </button>
      {isActive ? (
        <button type="button" onClick={onOpenTimer} className="sf-btn sf-btn-ghost h-11 px-3 -mr-3 text-[14px] font-semibold shrink-0">Em andamento</button>
      ) : canStart && !otherActive && (
        <button type="button" onClick={onStart} className="sf-btn sf-btn-ghost h-11 px-3 -mr-3 text-[14px] font-semibold shrink-0">Começar foco</button>
      )}
    </div>
  );
}
function TaskItemRow({t, onToggle, onDelete}){

          className="w-11 h-11 -ml-2.5 shrink-0 flex items-center justify-center bg-transparent border-0 cursor-pointer">
          <span className="w-5 h-5 rounded-full flex items-center justify-center"
            style={{border: `1.5px solid ${t.done ? 'var(--success)' : 'var(--field-border)'}`, color:'var(--success)'}}>{t.done && <IconCheck size={11}/>}</span>

        <div className="flex-1 min-w-0">

        </div>
        {!confirm && (

/* Plano (D1, A19): reúne o Planner (itens com data, sf_planner) e as Tarefas (itens sem data, sf_tasks) sem migrar dados. */
function PlanoScreen(){
  const {planner, tasks, session, savePlannerItem, deletePlannerItem, togglePlannerDone, startPlannerSession, setTimerExpanded,
    addTask, toggleTask, deleteTask, openCalendario} = useApp();
  const today = todayStr();
  const [sel, setSel] = useState(today);
  const [sheet, setSheet] = useState(null);
  const selD = parseDateStr(sel);
  const mondayOffset = (selD.getDay() + 6) % 7;
  const weekStart = addDaysStr(sel, -mondayOffset);
  const week = Array.from({length:7}, (_, i) => addDaysStr(weekStart, i));
  const LETTERS = ['S','T','Q','Q','S','S','D'];
  const byDate = useMemo(()=>{ const m = {}; planner.forEach(p => { (m[p.date] = m[p.date] || []).push(p); }); return m; }, [planner]);
  const sortT = (a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99');
  const dayItems = (byDate[sel] || []).slice().sort(sortT);
  const weekItems = week.filter(d => d !== sel).flatMap(d => (byDate[d] || []).slice().sort(sortT));
  const pendingTasks = tasks.filter(t => !t.done).length;
  const longDay = (ds)=> capitalize(parseDateStr(ds).toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'}).replace('-feira',''));
  const rowProps = (it)=>({
    isActive: !!session && session.plannerId===it.id,
    otherActive: !!session && session.plannerId!==it.id,
    onOpen: ()=>setSheet({item:it, date:it.date}),
    onToggle: ()=>togglePlannerDone(it.id),
    onStart: ()=>startPlannerSession(it.id),
    onOpenTimer: ()=>setTimerExpanded(true),
  });

  return (
    <div className="pt-16 px-5 pb-8">
      <div className="flex items-start justify-between gap-3">
        <ScreenTitle>Plano</ScreenTitle>
        <button type="button" onClick={()=>setSheet({date:sel})} className="sf-btn sf-btn-secondary h-11 px-4 text-[14px] shrink-0">Nova atividade</button>
      </div>

      <div className="mt-6 flex items-center justify-between">
        <p className="text-[14px] font-semibold text-sf-muted" aria-live="polite">{MONTHS_LONG[selD.getMonth()]} de {selD.getFullYear()}</p>
        <button type="button" onClick={()=>openCalendario(sel)} className="sf-btn sf-btn-ghost h-11 px-3 -mr-3 text-[14px] font-semibold">Ver mês</button>
      </div>
      <div className="grid grid-cols-7 mt-1" role="group" aria-label="Dias da semana">
        {week.map((ds, i) => {
          const d = parseDateStr(ds); const on = ds === sel; const isToday = ds === today; const has = (byDate[ds] || []).length > 0;
          return (
            <button type="button" key={ds} onClick={()=>setSel(ds)} aria-pressed={on} aria-current={isToday ? 'date' : undefined}
              aria-label={`${longDay(ds)}${isToday ? ', hoje' : ''}${has ? `, ${(byDate[ds]||[]).length} no Plano` : ''}`}
              className="flex flex-col items-center gap-1 py-1 bg-transparent border-0 cursor-pointer">
              <span className="text-[12px] font-medium text-sf-muted" aria-hidden="true">{LETTERS[i]}</span>
              <span className="w-9 h-9 rounded-full flex items-center justify-center text-[14px] font-semibold tnum"
                style={{background: on ? 'var(--blue-500)' : 'transparent', color: on ? 'var(--on-brand)' : (isToday ? 'var(--blue-300)' : 'var(--text-primary)'),
                        boxShadow: isToday && !on ? 'inset 0 0 0 1px var(--blue-300)' : 'none'}} aria-hidden="true">{d.getDate()}</span>
              <span className="w-1 h-1 rounded-full" style={{background: has ? 'var(--text-secondary)' : 'transparent'}} aria-hidden="true"/>
            </button>
          );
        })}
      </div>

      <h2 className="sf-ed-title text-sf-text mt-6">{longDay(sel)}</h2>
      <div className="mt-2">
        {dayItems.length === 0
          ? <p className="text-[14px] leading-[20px] text-sf-muted py-2">{sel === today ? 'Nada no Plano para hoje.' : 'Nada no Plano para este dia.'}</p>
          : dayItems.map(it => <PlanItemRow key={it.id} it={it} {...rowProps(it)}/>)}
      </div>

      {weekItems.length > 0 && (
        <section className="mt-8" aria-labelledby="h-semana">
          <SectionTitle id="h-semana">Esta semana</SectionTitle>
          <div className="mt-1">
            {weekItems.map(it => <PlanItemRow key={it.id} it={it} whenLabel={`${longDay(it.date)}${it.time ? `, ${it.time}` : ''}`} {...rowProps(it)}/>)}
          </div>
        </section>
      )}

      <section className="mt-8" aria-labelledby="h-semdata">
        <div className="flex items-baseline gap-2">
          <SectionTitle id="h-semdata">Sem data</SectionTitle>
          {tasks.length > 0 && <span className="text-[14px] text-sf-muted">{pendingTasks} {plural(pendingTasks, 'pendente', 'pendentes')}</span>}
        </div>
        <div className="mt-1">
          {tasks.length === 0
            ? <p className="text-[14px] leading-[20px] text-sf-muted py-2">Atividades sem data aparecem aqui.</p>
            : tasks.slice().sort((a,b)=> Number(a.done) - Number(b.done)).map(t => <TaskItemRow key={t.id} t={t} onToggle={()=>toggleTask(t.id)} onDelete={()=>deleteTask(t.id)}/>)}
        </div>
      </section>

      {sheet && (
        <PlannerItemSheet key={sheet.item ? sheet.item.id : 'nova'} item={sheet.item} date={sheet.date} allowNoDate
          onClose={()=>setSheet(null)}
          onSave={(data)=>{ savePlannerItem(data); setSel(data.date); setSheet(null); }}
          onSaveTask={(title, subjectId)=>{ addTask(title, subjectId); setSheet(null); }}
          onDelete={()=>{ deletePlannerItem(sheet.item.id); setSheet(null); }}/>
      )}
    </div>
  );
}

function PlannerScreen({initialDate}){
  const {contents, liveSessions, planner, session, savePlannerItem, deletePlannerItem, togglePlannerDone,
    startPlannerSession, setTimerExpanded, closeView} = useApp();
  const [sel, setSel] = useState(()=> initialDate || todayStr());
  const [month, setMonth] = useState(()=>{ const d = parseDateStr(initialDate || todayStr()); return {y:d.getFullYear(), m:d.getMonth()}; });
  const [sheet, setSheet] = useState(null);

  const WEEKDAYS = ['D','S','T','Q','Q','S','S'];
  const selectDay = (ds)=>{ setSel(ds); const d = parseDateStr(ds); setMonth({y:d.getFullYear(), m:d.getMonth()}); };
  const prevMonth = ()=> setMonth(m=> m.m===0 ? {y:m.y-1, m:11} : {y:m.y, m:m.m-1});
  const nextMonth = ()=> setMonth(m=> m.m===11 ? {y:m.y+1, m:0} : {y:m.y, m:m.m+1});

  const firstDay = new Date(month.y, month.m, 1);
  const daysInMonth = new Date(month.y, month.m+1, 0).getDate();
  const cells = [];
  for(let i=0; i<firstDay.getDay(); i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(d);

  const plannerDays = useMemo(()=>{
    const map = {};
    planner.forEach(p=>{ const e = map[p.date] || (map[p.date] = {total:0, pending:0}); e.total++; if(!p.done) e.pending++; });
    return map;
  },[planner]);
  const sessionDays = useMemo(()=>{
    const set = {};
    liveSessions.forEach(x=>{
      const ts = x.startedAt || x.dateTs;
      if(!ts) return;
      const k = toDateStr(new Date(ts));
      set[k] = (set[k]||0)+1;
    });
    return set;
  },[liveSessions]);

  const dayItems = useMemo(()=> planner.filter(p=>p.date===sel).sort((a,b)=> (a.time||'99:99').localeCompare(b.time||'99:99')), [planner, sel]);
  const daySessions = liveSessions.filter(x=>{
    const ts = x.startedAt || x.dateTs;
    return ts && toDateStr(new Date(ts))===sel;
  });
  const doneCount = dayItems.filter(p=>p.done).length;
  const today = todayStr();

  const handleSave = (data)=>{ savePlannerItem(data); selectDay(data.date); setSheet(null); };

  return (
    <div className="pt-16 px-5 pb-8 relative">
      <BackButton onClick={closeView}/>
      <div className="flex items-start justify-between mt-1">
        <div>
          <SubTitle>Mês do Plano</SubTitle>
          <p className="text-[14px] text-sf-muted mt-1">Planeje o dia, execute e conclua.</p>
        </div>
        {sel!==today && (
          <button type="button" onClick={()=>selectDay(today)}
            className="sf-btn sf-btn-secondary h-11 px-4 rounded-full text-[12px] font-semibold">Hoje</button>
        )}
      </div>

      <div className="mt-5 rounded-2xl p-4" style={{background:'var(--card-bg)'}}>
        <div className="flex items-center justify-between -mx-2 -mt-2">
          <PlannerNavBtn onClick={prevMonth} label="Mês anterior" flip/>
          <p aria-live="polite" className="text-[14px] font-semibold text-sf-text">{MONTHS_LONG[month.m]} {month.y}</p>
          <PlannerNavBtn onClick={nextMonth} label="Próximo mês"/>
        </div>
        <div className="grid grid-cols-7 gap-1 mt-2">
          {WEEKDAYS.map((w,i)=>(<span key={i} aria-hidden="true" className="text-center text-[11px] font-semibold text-sf-faint py-1">{w}</span>))}
          {cells.map((dn,i)=>{
            if(dn===null) return <span key={`e-${i}`}/>;
            const ds = `${month.y}-${pad2(month.m+1)}-${pad2(dn)}`;
            const isToday = ds===today;
            const isSelected = ds===sel;
            const pd = plannerDays[ds];
            let dot = null;
            if(pd) dot = isSelected ? '#fff' : (pd.pending>0 ? 'var(--blue-300)' : 'var(--success)');
            else if(sessionDays[ds]>0) dot = isSelected ? '#fff' : 'var(--text-tertiary)';
            const info = [];
            if(pd) info.push(pd.pending>0 ? `${pd.total} ${pd.total===1?'atividade':'atividades'}, ${pd.pending} pendente${pd.pending===1?'':'s'}` : `${pd.total} ${pd.total===1?'atividade concluída':'atividades concluídas'}`);
            if(sessionDays[ds]>0) info.push(`${sessionDays[ds]} ${sessionDays[ds]===1?'sessão':'sessões'} de estudo`);
            const label = parseDateStr(ds).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}) + (isToday ? ', hoje' : '') + (info.length ? ', ' + info.join(', ') : '');
            return (
              <button type="button" key={`d-${dn}`} onClick={()=>selectDay(ds)} aria-label={label} aria-pressed={isSelected}
                aria-current={isToday ? 'date' : undefined}
                className="relative min-h-[40px] aspect-square flex flex-col items-center justify-center rounded-lg border-0 bg-transparent">
                <span className="text-[12px] font-semibold tnum"
                  style={{
                    color: isSelected ? '#fff' : (isToday ? 'var(--blue-300)' : 'var(--text-primary)'),
                    width:28, height:28, borderRadius:'50%',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    background: isSelected ? 'var(--blue-500)' : 'transparent',
                    boxShadow: isToday && !isSelected ? 'inset 0 0 0 1px #60A5FA' : 'none',
                  }}>{dn}</span>
                {dot && <span className="block w-1 h-1 rounded-full mt-0.5" style={{background: dot}}/>}
              </button>
            );
          })}
        </div>
        <div className="flex items-center gap-4 mt-3 text-[11px] text-sf-muted flex-wrap">
          <span className="inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-sf-accent"/>Pendente</span>
          <span className="inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-sf-success"/>Concluído</span>
          <span className="inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-sf-faint"/>Só sessões</span>
        </div>
      </div>

      <div className="flex items-center justify-between mt-4 mb-2">
        <PlannerNavBtn onClick={()=>selectDay(addDaysStr(sel,-1))} label="Dia anterior" flip/>
        <div className="text-center" aria-live="polite">
          <h2 className="text-[13px] font-semibold text-sf-text">
            {capitalize(parseDateStr(sel).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}))}
          </h2>
          <p className="text-[11px] text-sf-muted mt-0.5">
            {dayItems.length ? `${doneCount} de ${dayItems.length} concluídas` : 'Sem atividades'}
          </p>
        </div>
        <PlannerNavBtn onClick={()=>selectDay(addDaysStr(sel,1))} label="Próximo dia"/>
      </div>

      {dayItems.length===0 ? (
        <button type="button" onClick={()=>setSheet({date:sel})}
          className="w-full rounded-2xl p-4 text-left bg-transparent"
          style={{border:'1px dashed var(--border-strong)'}}>
          <span className="block text-[13px] font-semibold text-sf-text">Nada planejado para este dia</span>
          <span className="block text-[12px] text-sf-muted mt-1">Toque para adicionar uma atividade.</span>
        </button>
      ) : dayItems.map(it=>(
        <PlannerRow key={it.id} it={it}
          isActive={!!session && session.plannerId===it.id}
          otherActive={!!session && session.plannerId!==it.id}
          onOpen={()=>setSheet({item:it, date:it.date})}
          onToggle={()=>togglePlannerDone(it.id)}
          onStart={()=>startPlannerSession(it.id)}
          onOpenTimer={()=>setTimerExpanded(true)}/>
      ))}

      {daySessions.length>0 && (
        <>
          <h2 className="text-[13px] font-semibold text-sf-text mt-5 mb-2.5">Sessões registradas</h2>
          {daySessions.map(x=>{
            const c = contents.find(k=>k.id===x.contentId);
            const subjectId = (c && c.subjectId) || x.subjectId;
            const title = (c && c.title) || x.title || 'Sessão de estudo';
            return (
              <div key={x.id} className="rounded-2xl p-3.5 mb-2.5 flex items-center gap-3" style={{background:'var(--card-bg)'}}>
                <SubjectIcon subjectId={subjectId} size={16}/>
                <div className="flex-1 min-w-0">
                  <p className="text-[13px] font-semibold text-sf-text truncate">{title}</p>
                  <p className="text-[11px] text-sf-muted mt-0.5">{(c && c.unitLabel) ? `${c.unitLabel} · ` : ''}{subjName(subjectId)}</p>
                </div>
                <span className="text-[12px] font-bold text-sf-accent shrink-0 tnum">{x.durationMin} min</span>
              </div>
            );
          })}
        </>
      )}

      <Fab onClick={()=>setSheet({date:sel})} label="Nova atividade"/>

      {sheet && (
        <PlannerItemSheet key={sheet.item ? sheet.item.id : 'nova'} item={sheet.item} date={sheet.date}
          onClose={()=>setSheet(null)}
          onSave={handleSave}
          onDelete={()=>{ deletePlannerItem(sheet.item.id); setSheet(null); }}/>
      )}
    </div>
  );
}

function SubjectSheetForm({sheet}){
  const {closeSubjectSheet, saveSubject, subjectsStore} = useApp();
  const editingId = sheet.id || null;
  const builtin = !!editingId && (editingId in BUILTIN_SUBJECTS);
  const [name, setName] = useState(()=>{
    if(!editingId) return '';
    const cust = subjectsStore.custom[editingId];
    return cust ? cust.name : subjName(editingId);
  });
  const [emoji, setEmoji] = useState(()=> editingId ? subjectEmoji(editingId) : DEFAULT_EMOJI);
  const [showErr, setShowErr] = useState(false);
  const nameRef = useRef(null);
  const valid = builtin || name.trim().length>0;

  const save = ()=>{
    if(!valid){ setShowErr(true); if(nameRef.current) nameRef.current.focus(); return; }
    const id = saveSubject({id: editingId || undefined, name, emoji});
    if(sheet.onSaved) sheet.onSaved(id);
    closeSubjectSheet();
  };

  return (
    <ModalShell onClose={closeSubjectSheet} labelledBy="subject-sheet-title" z={60}>
      <h2 id="subject-sheet-title" className="text-[18px] font-bold text-sf-text">{editingId ? 'Editar matéria' : 'Nova matéria'}</h2>

      <div className="flex items-end gap-3 mt-4">
        <div aria-hidden="true" className="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0"
          style={{background:'var(--brand-tint)', fontSize:30, lineHeight:1}}>{emoji}</div>
        <div className="flex-1 min-w-0">
          <label htmlFor="subject-name" className="block text-[12px] font-semibold text-sf-muted mb-2">Nome da matéria</label>
          <input id="subject-name" ref={nameRef} value={name} onChange={e=>setName(e.target.value)} readOnly={builtin} maxLength={40}
            placeholder="Ex: Biologia" className={INPUT_CLS} style={{color: builtin ? 'var(--text-secondary)' : 'var(--text-primary)'}}
            aria-invalid={showErr && !valid ? 'true' : undefined} aria-describedby={builtin ? 'subject-name-hint' : (showErr && !valid ? 'subject-name-err' : undefined)}/>
        </div>
      </div>
      {builtin && <p id="subject-name-hint" className="text-[12px] text-sf-muted mt-2">O nome das matérias padrão não pode ser alterado; você pode trocar o emoji.</p>}
      {showErr && !valid && <p id="subject-name-err" role="alert" className="text-[12px] text-sf-error mt-2">Dê um nome para a matéria.</p>}

      <p className="text-[12px] font-semibold text-sf-muted mt-5 mb-2">Emoji</p>
      <EmojiPicker value={emoji} onChange={setEmoji}/>

      <button type="button" onClick={save}
        className="sf-btn sf-btn-primary w-full mt-6 h-12 text-[14px] font-semibold flex items-center justify-center gap-2">
        <IconCheck size={16}/> {editingId ? 'Salvar' : 'Criar matéria'}
      </button>
      <button type="button" onClick={closeSubjectSheet} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[13px]">Cancelar</button>
    </ModalShell>
  );
}

function JornadaScreen({contentId}){
  const {contents, closeView, openDetalhe, openModule, completeTopic, lastContentId, goTab} = useApp();
  const c = contents.find(x=>x.id===contentId) || contents.find(x=>x.id===lastContentId) || pickPriorityContent(contents);

  if(!c){
    return (
      <div className="pt-16 px-5 pb-8">
        <BackButton onClick={closeView}/>
        <h1 className="text-[22px] font-bold text-sf-text mt-1">Jornada de Aprendizado</h1>
        <div className="mt-6">
          <EmptyState Icon={IconRocket} title="Você ainda não começou nenhuma matéria.">
            <button type="button" onClick={()=>goTab('estudar')}
              className="sf-btn sf-btn-primary mt-3 h-11 px-4 text-[13px] font-semibold inline-flex items-center justify-center gap-1.5">
              <IconSearch size={13}/> Buscar matérias
            </button>
          </EmptyState>
        </div>
      </div>
    );
  }

  const topics = c.topics || [];
  const states = getTopicStates(c);
  const total = topics.length;
  const activeIdx = states.indexOf(TOPIC_STATUS.AVAILABLE);
  const page = activeIdx >= 0 ? activeIdx + 1 : total;

  return (
    <div className="pt-16 px-5 pb-8">
      <BackButton onClick={()=>openDetalhe(c.id)} label="Voltar ao conteúdo"/>
      <div className="mt-1"><SubjectTag subjectId={c.subjectId}/></div>
      <h1 className="text-[22px] font-bold text-sf-text mt-2">Jornada de Aprendizado</h1>
      <p className="text-[12px] text-sf-muted mt-1">{c.title} · siga as etapas para dominar este conteúdo</p>

      {total === 0 ? (
        <div className="mt-6">
          <EmptyState title="Este conteúdo ainda não tem etapas." hint="Abra o conteúdo para montar a trilha de estudos.">
            <button type="button" onClick={()=>openDetalhe(c.id)}
              className="sf-btn sf-btn-primary mt-3 h-11 px-4 text-[13px] font-semibold">Abrir conteúdo</button>
          </EmptyState>
        </div>
      ) : (
        <>
          <p className="text-[11px] text-sf-muted text-right mt-1 tnum">Etapa {page} de {total}</p>

          <ol className="mt-4 relative list-none p-0 m-0">
            <li aria-hidden="true" className="absolute left-[15px] top-3 bottom-3 w-[2px] bg-sf-overlay"/>
            {topics.map((topic,i)=>{
              const isActive = states[i] === TOPIC_STATUS.AVAILABLE;
              const isDone = states[i] === TOPIC_STATUS.COMPLETED;
              const isLocked = states[i] === TOPIC_STATUS.LOCKED;
              const ttype = getTopicType(c, i);
              const meta = MODULE_META[ttype];
              return (
                <li key={i} className="relative flex items-start gap-3.5 pb-4">
                  <span className="w-8 h-8 rounded-full flex items-center justify-center text-[12px] font-bold shrink-0 z-10 tnum"
                    style={{
                      background: isDone ? 'var(--success)' : (isActive ? 'var(--blue-500)' : 'var(--bg-overlay)'),
                      color: isDone ? 'var(--on-success)' : (isActive ? '#fff' : 'var(--text-secondary)'),
                      border: `2px solid ${isDone ? 'var(--success)' : (isActive ? 'var(--blue-500)' : 'var(--bg-overlay)')}`,
                    }}>
                    {isDone ? <IconCheck size={13}/> : (isLocked ? <IconLock size={12}/> : i+1)}
                  </span>
                  <div className="rounded-2xl p-3.5 flex-1 min-w-0"
                    style={{
                      background: isActive ? 'var(--brand-tint-soft)' : 'var(--card-bg)',
                      border: isActive ? '1px solid var(--brand-border-strong)' : '1px solid transparent'
                    }}>
                    <div className="flex items-start justify-between gap-2">
                      <p className="text-[14px] font-semibold text-sf-text">{topic.t}</p>
                      <span className="text-[11px] font-bold inline-flex items-center gap-1 shrink-0 pt-0.5" style={{color: meta.color}}>
                        <meta.Icon size={11}/> {meta.label}
                      </span>
                    </div>
                    <p className="text-[11px] text-sf-muted mt-1">
                      {isDone ? 'Concluído' : (isActive ? 'Etapa atual' : 'Bloqueado · conclua a etapa anterior')}
                    </p>
                    {topic.objective && <p className="text-[11px] text-sf-muted mt-1 italic">{topic.objective}</p>}
                    {isActive && (
                      <>
                        <button type="button" onClick={()=>openModule(c.id, i)}
                          className="sf-btn sf-btn-primary w-full mt-2.5 h-11 text-[12px] font-semibold flex items-center justify-center gap-1.5">
                          <IconPlay size={11}/> Abrir módulo
                        </button>
                        {ttype !== MODULE_TYPES.QUIZ && (
                          <button type="button" onClick={()=>completeTopic(c.id, i)}
                            className="sf-btn sf-btn-secondary w-full mt-2 h-11 text-[12px] font-semibold flex items-center justify-center gap-1.5">
                            <IconCheck size={12}/> Concluir etapa
                          </button>
                        )}
                      </>
                    )}
                  </div>
                </li>
              );
            })}
          </ol>

          {activeIdx >= 0 && (
            <button type="button" onClick={()=>openModule(c.id, activeIdx)}
              className="sf-btn sf-btn-primary w-full mt-4 h-12 text-[14px] font-semibold flex items-center justify-center gap-2">
              <IconPlay size={13}/> Continuar módulo atual
            </button>
          )}
        </>
      )}
    </div>
  );
}

function TaskRow({t, onToggle, onDelete}){
  const [confirm, setConfirm] = useState(false);
  const accent = subjectAccent(t.subjectId);
  return (
    <div className="sf-card rounded-2xl p-3.5 mb-2.5" style={{borderLeft:`3px solid ${accent}`}}>
      <div className="flex items-center gap-1">
        <button type="button" role="checkbox" aria-checked={!!t.done} aria-label={t.title} onClick={onToggle}
          className="flex-1 min-w-0 min-h-[44px] -my-2 flex items-center gap-3 text-left bg-transparent border-0 p-0">
          <span className="w-[22px] h-[22px] rounded-full flex items-center justify-center shrink-0"
            style={{background: t.done ? accent : 'transparent', border: t.done ? 'none' : '1.5px solid var(--field-border)', color:inkOn(accent)}}>
            {t.done && <IconCheck size={12}/>}
          </span>
          <span className="flex-1 min-w-0">
            <span className="block text-[13px] font-semibold truncate"
              style={{color: t.done ? 'var(--text-secondary)' : 'var(--text-primary)', textDecoration: t.done ? 'line-through' : 'none'}}>{t.title}</span>
            <span className="block text-[11px] text-sf-faint mt-0.5 truncate">{t.meta || subjName(t.subjectId)}</span>
          </span>
        </button>
        {!confirm && (
          <button type="button" onClick={()=>setConfirm(true)} aria-label={`Excluir tarefa ${t.title}`}
            className="sf-btn sf-btn-ghost w-11 h-11 -my-2 -mr-2 shrink-0 flex items-center justify-center">
            <IconTrash size={16}/>
          </button>
        )}

      {confirm && (
        <div className="flex items-center gap-2 mt-2" role="alert">
          <span className="text-[12px] text-sf-text flex-1">Excluir esta tarefa?</span>
          <button type="button" onClick={onDelete} className="sf-btn sf-btn-danger h-11 px-4 text-[12px] font-semibold">Excluir</button>
          <button type="button" onClick={()=>setConfirm(false)} className="sf-btn sf-btn-ghost h-11 px-3 text-[12px]">Cancelar</button>
        </div>
      )}
    </div>
  );
}

function TarefasScreen(){
  const {tasks, toggleTask, addTask, deleteTask, closeView} = useApp();
  const [adding, setAdding] = useState(false);
  const [title, setTitle] = useState('');
  const [subjectId, setSubjectId] = useState(()=> Object.keys(SUBJECTS)[0]);
  const [showErr, setShowErr] = useState(false);
  const inputRef = useRef(null);

  const pending = tasks.filter(t=>!t.done);
  const done = tasks.filter(t=>t.done);

  useEffect(()=>{ if(adding && inputRef.current) inputRef.current.focus(); }, [adding]);

  const handleAdd = ()=>{
    if(!title.trim()){ setShowErr(true); if(inputRef.current) inputRef.current.focus(); return; }
    addTask(title.trim(), subjectId);
    setTitle(''); setShowErr(false); setAdding(false);
  };
  const cancel = ()=>{ setAdding(false); setTitle(''); setShowErr(false); };

  return (
    <div className="pt-16 px-5 pb-8 relative">
      <BackButton onClick={closeView}/>
      <h1 className="text-[24px] font-bold text-sf-text mt-1">Lista de Tarefas</h1>
      <p className="text-[12px] text-sf-muted mt-1 tnum">{pending.length} {pending.length===1 ? 'pendente' : 'pendentes'} · {done.length} {done.length===1 ? 'concluída' : 'concluídas'}</p>

      {adding && (
        <form className="mt-4 rounded-2xl p-3.5" style={{background:'var(--card-bg)'}} onSubmit={(e)=>{ e.preventDefault(); handleAdd(); }}>
          <label htmlFor="task-title" className="block text-[12px] font-semibold text-sf-muted mb-2">Nova tarefa</label>
          <input id="task-title" ref={inputRef} value={title} onChange={e=>setTitle(e.target.value)} maxLength={120} placeholder="Ex: Resolver a lista de exercícios"
            className={INPUT_CLS} aria-invalid={showErr && !title.trim() ? 'true' : undefined} aria-describedby={showErr && !title.trim() ? 'task-err' : undefined}/>
          {showErr && !title.trim() && <p id="task-err" role="alert" className="text-[12px] text-sf-error mt-2">Escreva um título para a tarefa.</p>}
          <div role="group" aria-label="Matéria da tarefa" className="flex gap-2 mt-3 flex-wrap">
            {Object.keys(SUBJECTS).map(k=>(
              <button type="button" key={k} onClick={()=>setSubjectId(k)} aria-pressed={subjectId===k}
                className="px-3.5 h-11 rounded-full text-[12px] font-semibold flex items-center gap-1.5"
                style={{
                  background: subjectId===k ? SUBJECTS[k].accent : 'var(--bg-surface)',
                  color: subjectId===k ? inkOn(SUBJECTS[k].accent) : 'var(--text-secondary)',
                  border: `1px solid ${SUBJECTS[k].accent}50`,
                }}>
                <span aria-hidden="true">{SUBJECTS[k].emoji}</span>{subjName(k)}
              </button>
            ))}
          </div>
          <div className="flex gap-2 mt-3">
            <button type="submit" className="sf-btn sf-btn-primary flex-1 h-11 text-[13px] font-semibold">Salvar</button>
            <button type="button" onClick={cancel} className="sf-btn sf-btn-ghost h-11 px-4 text-[13px]">Cancelar</button>
          </div>
        </form>
      )}

      {tasks.length === 0 && !adding && (
        <div className="mt-6">
          <EmptyState Icon={IconClipboard} title="Nenhuma tarefa por aqui" hint="Anote o que você precisa estudar ou entregar.">
            <button type="button" onClick={()=>setAdding(true)}
              className="sf-btn sf-btn-primary mt-3 h-11 px-4 text-[13px] font-semibold inline-flex items-center gap-1.5">
              <IconPlus size={14}/> Nova tarefa
            </button>
          </EmptyState>
        </div>
      )}

      {pending.length > 0 && (
        <>
          <h2 className="text-[11px] font-bold text-sf-muted tracking-[1.5px] mt-6 mb-2.5 uppercase">Pendentes</h2>
          {pending.map(t=>(<TaskRow key={t.id} t={t} onToggle={()=>toggleTask(t.id)} onDelete={()=>deleteTask(t.id)}/>))}
        </>
      )}
      {done.length > 0 && (
        <>
          <h2 className="text-[11px] font-bold text-sf-muted tracking-[1.5px] mt-6 mb-2.5 uppercase">Concluídas</h2>
          {done.map(t=>(<TaskRow key={t.id} t={t} onToggle={()=>toggleTask(t.id)} onDelete={()=>deleteTask(t.id)}/>))}
        </>
      )}

      <Fab onClick={()=>setAdding(a=>!a)} label={adding ? 'Fechar formulário de tarefa' : 'Nova tarefa'}/>
    </div>
  );
}

function CriarConteudoScreen(){
  const {closeView, addUserSubject, openSubjectSheet, openDetalhe} = useApp();
  const [title, setTitle] = useState('');
  const [subjectId, setSubjectId] = useState(()=> Object.keys(SUBJECTS)[0]);
  const [desc, setDesc] = useState('');
  const [estMin, setEstMin] = useState('');
  const [type, setType] = useState('flashcards');
  const [showErr, setShowErr] = useState(false);
  const titleRef = useRef(null);

  const handleSave = ()=>{
    if(!title.trim()){ setShowErr(true); if(titleRef.current) titleRef.current.focus(); return; }
    const minutes = Math.min(600, Math.max(1, parseInt(String(estMin).replace(/\D/g,''), 10) || 15));

    const newContent = {
      id: 'user-' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      title: title.trim(),
      subjectId,
      unitLabel: ({flashcards:'Flashcards', resumo:'Resumo', lista:'Lista'})[type] || 'Conteúdo',
      estMinutes: minutes,
      desc: desc.trim(),
      topics: [],
    };

    const id = addUserSubject(newContent);
    closeView();
    if(id) openDetalhe(id);
  };

  return (
    <form className="pt-12 px-5 pb-8" onSubmit={(e)=>{ e.preventDefault(); handleSave(); }} noValidate>
      <BackButton onClick={closeView}/>
      <SubTitle className="mt-4">Criar conteúdo</SubTitle>
      <p className="text-[14px] leading-[20px] text-sf-muted mt-1">O STUDY monta a trilha a partir do título e da matéria.</p>

      <FieldLabel htmlFor="cc-title">Título <span className="font-normal text-sf-muted">(obrigatório)</span></FieldLabel>
      <input id="cc-title" ref={titleRef} value={title} onChange={e=>setTitle(e.target.value)} maxLength={80} placeholder="Ex.: Cálculo — Derivadas"
        className={INPUT_CLS} aria-invalid={showErr && !title.trim() ? 'true' : undefined} aria-describedby={showErr && !title.trim() ? 'cc-err' : undefined}/>
      {showErr && !title.trim() && <p id="cc-err" role="alert" className="text-[12px] text-sf-error mt-2">Dê um título ao conteúdo para continuar.</p>}

      <div role="group" aria-labelledby="cc-subject-label">
        <p id="cc-subject-label" className="text-[14px] leading-[20px] font-semibold text-sf-text mt-5 mb-2">Matéria</p>
        <div className="flex gap-2 flex-wrap">
          {Object.keys(SUBJECTS).map(k=>(
            <button type="button" key={k} onClick={()=>setSubjectId(k)} aria-pressed={subjectId===k}
              className="sf-chip sf-chip-check px-3.5 h-11 rounded-xl text-[14px]">
              <span aria-hidden="true">{SUBJECTS[k].emoji}</span>{subjName(k)}
            </button>
          ))}
          <button type="button" onClick={()=>openSubjectSheet({onSaved:(id)=>setSubjectId(id)})}
            className="sf-chip px-3.5 h-11 rounded-xl text-[14px]" style={{borderStyle:'dashed'}}>+ Nova matéria</button>
        </div>
      </div>

      <FieldLabel htmlFor="cc-desc" optional>Descrição</FieldLabel>
      <textarea id="cc-desc" value={desc} onChange={e=>setDesc(e.target.value)} maxLength={300} placeholder="O que você quer aprender sobre o tema"
        className="sf-input w-full h-20 p-3 text-[16px] resize-none"/>

      <FieldLabel htmlFor="cc-min" optional>Tempo estimado em minutos</FieldLabel>
      <input id="cc-min" value={estMin} onChange={e=>setEstMin(e.target.value)} placeholder="Ex.: 25" inputMode="numeric" maxLength={3}
        className={INPUT_CLS}/>

      <div role="radiogroup" aria-labelledby="cc-type-label">
        <p id="cc-type-label" className="text-[14px] leading-[20px] font-semibold text-sf-text mt-5 mb-2">Tipo de conteúdo</p>
        <div className="flex gap-2">
          {[
            {k:'flashcards', l:'Flashcards'},
            {k:'resumo', l:'Resumo'},
            {k:'lista', l:'Lista'},
          ].map(t=>(
            <button type="button" role="radio" aria-checked={type===t.k} key={t.k} onClick={()=>setType(t.k)}
              className="sf-chip sf-chip-check flex-1 h-11 rounded-xl text-[14px]">{t.l}</button>
          ))}
        </div>
      </div>

      {!title.trim() && <p className="text-[14px] leading-[20px] text-sf-muted mt-6">Preencha o título e escolha uma matéria para criar.</p>}
      <button type="submit" aria-disabled={!title.trim() ? 'true' : undefined}
        className={`sf-btn sf-btn-primary w-full ${title.trim() ? 'mt-7' : 'mt-3'} h-12 text-[14px]`}>Criar conteúdo</button>
      <button type="button" onClick={closeView} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Cancelar</button>
    </form>
  );
}

function YouTubeVideoScreen({video, context}){
  const {closeView, openYouTubeVideo} = useApp();
  const [related, setRelated] = useState([]);
  const [relState, setRelState] = useState('idle'); // idle | loading | ok | empty | error
  const [relKey, setRelKey] = useState(0);
  const valid = !!video && isValidYouTubeId(video.id);

  useEffect(()=>{
    if(!valid) return;
    const contentTitle = (context && context.contentTitle) ? context.contentTitle : '';
    const subjectName = (context && context.subjectId) ? subjName(context.subjectId) : '';
    const topicName = (context && context.topic) ? context.topic : '';
    const q = (contentTitle && topicName)
      ? `${contentTitle} ${topicName} aula`
      : (subjectName && topicName)
        ? `${subjectName} ${topicName} aula`
        : (contentTitle || subjectName || video.title || '');
    if(q.trim().length < 3){ setRelated([]); setRelState('empty'); return; }
    let cancelled = false;
    setRelState('loading');
    searchYouTubeVideosDetailed(q).then(res=>{
      if(cancelled) return;
      const list = res.videos.filter(v => v.id !== video.id).slice(0, 4);
      setRelated(list);
      setRelState(res.status === 'error' ? 'error' : (list.length ? 'ok' : 'empty'));
    });
    return ()=>{ cancelled = true; };
  }, [valid && video.id, context && context.contentTitle, context && context.subjectId, context && context.topic, relKey]);

  if(!valid){
    return (
      <div className="pt-16 px-5 pb-8">
        <BackButton onClick={closeView}/>
        <div className="mt-6"><EmptyState title="Vídeo não encontrado" hint="O vídeo pode ter sido removido ou o link é inválido."/></div>
      </div>
    );
  }

  return (
    <div className="pt-16 px-5 pb-8">
      <BackButton onClick={closeView}/>

      <div className="mt-3">
        <span className="inline-flex items-center gap-1 px-2.5 py-1 rounded-[11px] text-[11px] font-semibold bg-sf-overlay text-sf-accent">
          <IconPlay size={9}/> YOUTUBE
        </span>
      </div>

      <h1 className="text-[20px] font-bold text-sf-text mt-2 break-words">{video.title}</h1>
      <p className="text-[12px] text-sf-muted mt-1">{video.channel}</p>

      <div className="mt-4 rounded-2xl overflow-hidden bg-black" style={{aspectRatio:'16 / 9'}}>
        <iframe width="100%" height="100%" style={{border:0}}
          src={youTubeEmbedUrl(video.id)}
          title={`Videoaula: ${video.title}`}
          referrerPolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowFullScreen/>
      </div>
      <a href={`https://www.youtube.com/watch?v=${video.id}`} target="_blank" rel="noopener noreferrer"
        className="mt-2 inline-flex items-center min-h-[44px] text-[12px] font-semibold text-sf-accent underline">
        Não carregou? Abrir no YouTube
      </a>

      <div className="mt-3 rounded-2xl p-4" style={{background:'var(--card-bg)'}}>
        <h2 className="text-[13px] font-bold text-sf-text">Sobre este vídeo</h2>
        <p className="text-[12px] text-sf-muted mt-2 leading-relaxed break-words">
          {video.description || 'Conteúdo encontrado pelo STUDY no YouTube.'}
        </p>
      </div>

      {(relState === 'loading' || relState === 'ok' || relState === 'error') && (
        <>
          <h2 className="text-[13px] font-bold text-sf-text mt-6 mb-2.5">Vídeos relacionados</h2>
          {relState === 'loading' && <p role="status" className="text-[12px] text-sf-muted">Carregando vídeos relacionados...</p>}
          {relState === 'error' && (
            <InlineError title="Não foi possível carregar os vídeos relacionados."
              hint="Confira sua conexão e se o servidor do STUDY está em execução." onRetry={()=>setRelKey(k=>k+1)}/>
          )}
          {relState === 'ok' && related.map(v=>(
            <button type="button" key={v.id} onClick={()=>openYouTubeVideo(v, null, context)}
              className="sf-card sf-press w-full text-left rounded-2xl p-3 mb-2 flex items-center gap-3">
              <span className="w-14 h-11 rounded-xl overflow-hidden flex items-center justify-center shrink-0"
                style={{background:'linear-gradient(135deg, var(--media-a), var(--media-b))', color:'#fff'}}>
                {v.thumbnail ? <img src={v.thumbnail} alt="" loading="lazy" referrerPolicy="no-referrer" className="w-full h-full object-cover"/> : <IconPlay size={14}/>}
              </span>
              <span className="flex-1 min-w-0">
                <span className="block text-[12px] font-semibold text-sf-text line-clamp-2">{v.title}</span>
                <span className="block text-[11px] text-sf-muted mt-0.5 truncate">{v.channel}</span>
              </span>
            </button>
          ))}
        </>
      )}
    </div>
  );
}

function CompleteButton({onClick, children, secondary=true}){
  return (
    <button type="button" onClick={onClick}
      className={`sf-btn ${secondary ? 'sf-btn-secondary' : 'sf-btn-primary'} w-full mt-6 h-12 text-[14px]`}>
      {children}
    </button>
  );
}

/* Fechamento do módulo (E3): a trilha fica acima de "Concluir módulo", mostrando onde o módulo entra. */
function ModuleClosing({content, topicIndex, onComplete}){
  const done = !!(content.topics[topicIndex] && content.topics[topicIndex].done);
  return (
    <div className="mt-8 pt-6" style={{borderTop:'1px solid var(--border)'}}>
      <p className="text-[14px] leading-[20px] text-sf-muted">
        {done ? `O módulo ${topicIndex+1} de ${content.topics.length} já está na sua trilha.` : `Ao concluir, o módulo ${topicIndex+1} de ${content.topics.length} entra na sua trilha.`}
      </p>
      <SegmentedTrail size="sm" className="mt-2" states={trailStates(content, topicIndex)} label={`Trilha de ${content.title}`}/>
      <CompleteButton onClick={onComplete}>{done ? 'Ver todos os módulos' : 'Concluir módulo'}</CompleteButton>
    </div>
  );
}

function ModuleLoadError({title, onRetry}){
  const {session} = useApp();
  return (
    <div className="mt-6">
      <p className="text-[16px] leading-[22px] font-semibold text-sf-text">{title}</p>
      <p className="text-[14px] leading-[20px] text-sf-muted mt-1">Tente de novo ou volte para a trilha.{session ? '' : ' Nenhum tempo de foco foi contado.'}</p>
      <button type="button" onClick={onRetry} className="sf-btn sf-btn-secondary w-full mt-4 h-12 text-[14px]">Tentar de novo</button>
    </div>
  );
}

function fmtScore(n){
  const v = Number(n);
  return Number.isFinite(v) ? v.toLocaleString('pt-BR', {minimumFractionDigits:1, maximumFractionDigits:1}) : '—';
}

  const [state, setState] = useState('loading'); // loading | ok | empty | error
  const [mainVideo, setMainVideo] = useState(null);
  const [recommended, setRecommended] = useState([]);
  const [reloadKey, setReloadKey] = useState(0);

  const query = `${content.title} ${topic.t} aula`;

  useEffect(()=>{
    let cancelled = false;
    setState('loading'); setMainVideo(null); setRecommended([]);
    searchYouTubeVideosDetailed(query).then(res=>{
      if(cancelled) return;
      if(res.status === 'ok'){
        setMainVideo(res.videos[0]);
        setRecommended(res.videos.slice(1));
        setState('ok');
      } else {
        setState(res.status === 'empty' ? 'empty' : 'error');
      }

    return ()=>{ cancelled = true; };

  return (
    <div>
      <ModuleHeader topic={topic}/>

      {state === 'error' && <ModuleLoadError title="As videoaulas não carregaram" onRetry={()=>setReloadKey(k=>k+1)}/>}

          <button type="button" onClick={()=>setReloadKey(k=>k+1)} className="sf-btn sf-btn-secondary w-full mt-4 h-12 text-[14px]">Buscar de novo</button>
        </div>
      )}

      {state === 'ok' && mainVideo && (
        <>

            </span>
            <span className="block sf-ed-content text-sf-text mt-4">{mainVideo.title}</span>
            <span className="block text-[14px] leading-[20px] text-sf-muted mt-0.5">{mainVideo.channel}</span>

            <>
              <h2 className="text-[16px] leading-[22px] font-semibold text-sf-text mt-8">Mais aulas sobre este assunto</h2>
              <div className="mt-1">
                {recommended.map(v=>(
                  <button type="button" key={v.id} onClick={()=>onOpenVideo(v)}
                    className="sf-row-div w-full text-left py-3 flex items-center gap-3 bg-transparent border-0 cursor-pointer">
                    <span className="w-24 h-[54px] rounded-xl overflow-hidden flex items-center justify-center shrink-0 text-sf-muted" style={{background:'var(--bg-elevated)'}}>
                      {v.thumbnail ? <img src={v.thumbnail} alt="" loading="lazy" referrerPolicy="no-referrer" className="w-full h-full object-cover"/> : <IconPlay size={12}/>}
                    </span>

                      <span className="block text-[14px] leading-[20px] font-semibold text-sf-text line-clamp-2">{v.title}</span>
