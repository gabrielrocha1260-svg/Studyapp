function ReadingModule({content, topic, topicIndex, onComplete}){
  const [readingContent, setReadingContent] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);

  useEffect(()=>{
    let cancelled = false;
    setLoading(true); setError(false); setReadingContent(null);
    fetchReading({
      contentId: content.id,
      title: content.title,
      subject: subjName(content.subjectId),
      moduleTitle: topic.t,
      learningObjective: topic.objective || '',
      topics: topic.subtopics || [],
    }).then(res=>{
      if(cancelled) return;
      if(!res){ setError(true); setLoading(false); return; }
      setReadingContent(res);
      setLoading(false);
    });
    return ()=>{ cancelled = true; };
  }, [content.id, topic.t, reloadKey]);

  if(loading){
    return (
      <div>
        <ModuleHeader topic={topic} showObjective/>
        <div className="mt-6 flex flex-col gap-3" role="status" aria-label="Preparando a leitura">
          {[100,96,88,100,70].map((w,i)=><span key={i} className="sf-skel h-4" style={{width:w+'%'}}/>)}
        </div>
      </div>
    );
  }

  if(error || !readingContent){
    return (
      <div>
        <ModuleHeader topic={topic}/>
        <ModuleLoadError title="O texto deste módulo não carregou" onRetry={()=>setReloadKey(k=>k+1)}/>
      </div>
    );
  }

  const paragraphs = readingContent.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);

  return (
    <article>
      <ModuleHeader topic={topic} showObjective/>
      <div className="mt-5">
        {paragraphs.map((p, i) => {
          const isHeading = p.length < 60 && !/[.!?:;]$/.test(p) && !p.includes('\n');
          if(isHeading){
            return <h2 key={i} className="text-[16px] leading-[22px] font-semibold text-sf-text mt-6 first:mt-0 mb-1">{p}</h2>;
          }
          return <p key={i} className="sf-ed-reading text-sf-text mt-4 first:mt-0 break-words">{p}</p>;
        })}
      </div>
      <ModuleClosing content={content} topicIndex={topicIndex} onComplete={onComplete}/>

}

function FlashcardsModule({content, topic, topicIndex, onComplete}){
  const [cards, setCards] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const [current, setCurrent] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [seenLast, setSeenLast] = useState(false);

  useEffect(()=>{
    let cancelled = false;
    setLoading(true); setError(false); setCards(null);
    fetchFlashcards({
      contentId: content.id,
      title: content.title,
      subject: subjName(content.subjectId),
      moduleTitle: topic.t,
    }).then(res=>{
      if(cancelled) return;
      if(!res){ setError(true); setLoading(false); return; }
      setCards(res);
      setCurrent(0); setFlipped(false); setSeenLast(false);
      setLoading(false);
    });
    return ()=>{ cancelled = true; };
  }, [content.id, topic.t, reloadKey]);

  const next = ()=>{
    if(!cards) return;
    if(current < cards.length - 1){ setCurrent(c => c + 1); setFlipped(false); }
    else { setSeenLast(true); }
  };
  const prev = ()=>{
    if(!cards || current === 0) return;
    setCurrent(c => c - 1); setFlipped(false);
  };

  if(loading){
    return (
      <div>
        <ModuleHeader topic={topic}/>
        <div className="mt-6" role="status" aria-label="Gerando flashcards"><span className="sf-skel h-[200px] w-full rounded-2xl"/></div>
      </div>
    );
  }

  if(error || !cards){
    return (
      <div>
        <ModuleHeader topic={topic}/>
        <ModuleLoadError title="Os flashcards não carregaram" onRetry={()=>setReloadKey(k=>k+1)}/>
      </div>
    );
  }

  const card = cards[current];
  const faceText = flipped ? card.back : card.front;

  return (
    <div>
      <ModuleHeader topic={topic}/>

      <p className="text-[14px] leading-[20px] text-sf-muted mt-4 tnum">Cartão {current + 1} de {cards.length}</p>
      <ProgressBar value={((current + 1) / cards.length) * 100} height={4} className="mt-2" color="var(--progress-fill)" label={`Cartão ${current + 1} de ${cards.length}`}/>

      <button type="button" onClick={()=>setFlipped(f=>!f)} aria-label={`${flipped ? 'Resposta' : 'Pergunta'}: ${faceText}. Toque para virar`}
        className="w-full mt-4 rounded-2xl p-6 flex items-center justify-center text-center cursor-pointer"
        style={{minHeight: 200, background:'var(--bg-surface)', border:'1px solid var(--border)'}}>
        <span key={`${current}-${flipped}`} className="block sf-swap">
          <span className="block text-[14px] leading-[20px] font-semibold text-sf-muted mb-3">{flipped ? 'Resposta' : 'Pergunta'}</span>
          <span className="block sf-ed-question text-sf-text break-words">{faceText}</span>
          <span className="block text-[12px] text-sf-muted mt-4">Toque para virar</span>
        </span>
      </button>
      <p role="status" className="sr-only-live">{`Cartão ${current + 1} de ${cards.length}, ${flipped ? 'resposta' : 'pergunta'}: ${faceText}`}</p>

      <div className="flex gap-3 mt-4">
        <button type="button" onClick={prev} disabled={current === 0} className="sf-btn sf-btn-ghost flex-1 h-12 text-[14px] font-semibold">Anterior</button>
        <button type="button" onClick={next} className="sf-btn sf-btn-primary flex-1 h-12 text-[14px]">{current < cards.length - 1 ? 'Próximo' : 'Finalizar'}</button>
      </div>

      {seenLast && <ModuleClosing content={content} topicIndex={topicIndex} onComplete={onComplete}/>}
    </div>
  );
}

function QuizModule({content, topic, topicIndex, onSubmit, existingProgress, onFinish}){
  const {goTab} = useApp();
  const [questions, setQuestions] = useState(null);
  const [answers, setAnswers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const [submitted, setSubmitted] = useState(false);
  const [score, setScore] = useState(0);
  const [passed, setPassed] = useState(false);
  const [reloadKey, setReloadKey] = useState(0);
  const resultRef = useRef(null);

  useEffect(()=>{
    let cancelled = false;
    setLoading(true); setLoadError(false); setQuestions(null);
    fetchQuiz({
      contentId: content.id,
      title: content.title,
      subject: subjName(content.subjectId),
      moduleTitle: topic.t,
      learningObjective: topic.objective || '',
    }).then(res=>{
      if(cancelled) return;
      if(!res){ setLoadError(true); setLoading(false); return; }
      setQuestions(res);
      setAnswers(Array(res.length).fill(null));
      setLoading(false);
    });
    return ()=>{ cancelled = true; };
  }, [content.id, topic.t, reloadKey]);

  useEffect(()=>{
    if(submitted){
      window.scrollTo(0, 0);
      if(resultRef.current) resultRef.current.focus({preventScroll:true});
    }
  }, [submitted]);

  const answeredCount = answers.filter(a => a !== null).length;
  const answered = questions ? answeredCount === questions.length : false;

  const submit = ()=>{
    if(!answered || !questions) return;
    const correct = questions.reduce((acc, q, i)=> acc + (q.options[answers[i]]?.correct ? 1 : 0), 0);
    const s = Math.round((correct / questions.length) * 10);
    const ok = onSubmit(s);
    setScore(s); setPassed(ok); setSubmitted(true);
  };

  const retry = ()=>{
    if(!questions) return;
    setAnswers(Array(questions.length).fill(null));
    setSubmitted(false); setScore(0); setPassed(false);
    window.scrollTo(0, 0);
  };

  if(loading){
    return (
      <div>
        <ModuleHeader topic={topic}/>
        <div className="mt-6 flex flex-col gap-3" role="status" aria-label="Gerando questões da avaliação">
          {[0,1,2,3].map(i=><span key={i} className="sf-skel h-12 w-full rounded-xl"/>)}
        </div>
      </div>
    );
  }

  if(loadError || !questions){
    return (
      <div>
        <ModuleHeader topic={topic}/>
        <ModuleLoadError title="A avaliação não carregou" onRetry={()=>setReloadKey(k=>k+1)}/>
      </div>
    );
  }

  if(submitted){
    const wrong = questions.map((q, i) => ({q, i, a: answers[i]})).filter(x => !(x.q.options[x.a] && x.q.options[x.a].correct));
    const total = (content.topics || []).length;
    const allDone = (content.topics || []).every((t, i) => t.done || (i === topicIndex && passed));
    const attempts = existingProgress ? existingProgress.attempts : 1;
    const best = existingProgress && existingProgress.bestScore != null ? existingProgress.bestScore : score;
    return (
      <div>
        <div ref={resultRef} tabIndex={-1} role="status" style={{outline:'none'}}>
          <SubTitle>Resultado da avaliação</SubTitle>
          <p className="mt-4 flex items-baseline gap-2">
            <span className="sf-ed-number text-sf-text">{fmtScore(score)}</span>
            <span className="text-[18px] leading-[24px] font-bold text-sf-muted">de 10</span>
          </p>
          <p className="text-[14px] leading-[20px] text-sf-muted mt-1">Mínimo para avançar: {fmtScore(MODULE_PASSING_SCORE)}</p>
          <p className="text-[14px] leading-[20px] text-sf-text mt-4 flex items-start gap-2">
            <span className={`inline-flex mt-0.5 ${passed ? 'text-sf-success' : 'text-sf-muted'}`} aria-hidden="true">{passed ? <IconCheck size={16}/> : <IconAlert size={16}/>}</span>
            <span>{passed
              ? (allDone ? `Você concluiu ${content.title}: os ${total} módulos estão feitos.` : 'Avaliação aprovada. O módulo entrou na sua trilha.')
              : `Ainda não foi desta vez. Revise ${wrong.length === 1 ? 'a questão que errou' : `as ${wrong.length} questões que errou`} e tente de novo.`}</span>
          </p>
          <p className="text-[14px] leading-[20px] text-sf-muted mt-1 tnum">Tentativa {attempts}. Melhor nota: {fmtScore(best)}.</p>
        </div>

        {wrong.length > 0 && (
          <section className="mt-8" aria-labelledby="h-revisar">
            <SectionTitle id="h-revisar">Para revisar</SectionTitle>
            <ol className="list-none p-0 m-0 mt-2">
              {wrong.map(({q, i, a}) => {
                const right = q.options.find(o => o.correct);
                return (
                  <li key={i} className="sf-row-div py-3 flex gap-2.5 text-[14px] leading-[20px]">
                    <span className="text-sf-muted tnum shrink-0">{i+1}.</span>
                    <div className="min-w-0">
                      <p className="text-sf-text">{q.q}</p>
                      <p className="text-sf-muted mt-1.5 flex gap-2"><span aria-hidden="true" className="inline-flex mt-0.5"><IconClose size={14}/></span><span>Sua resposta: {q.options[a] ? q.options[a].l : '—'}</span></p>
                      {right && <p className="text-sf-text mt-1 flex gap-2"><span aria-hidden="true" className="inline-flex mt-0.5 text-sf-success"><IconCheck size={14}/></span><span>Certa: {right.l}</span></p>}
                    </div>
                  </li>
                );
              })}
            </ol>
          </section>
        )}

        <div className="mt-8">
          {passed ? (
            allDone ? (
              <>
                <button type="button" onClick={()=>goTab('progresso')} className="sf-btn sf-btn-primary w-full h-12 text-[14px]">Ver progresso</button>
                <button type="button" onClick={()=>goTab('estudar')} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Explorar outro conteúdo</button>
              </>
            ) : (
              <>
                <button type="button" onClick={onFinish} className="sf-btn sf-btn-primary w-full h-12 text-[14px]">Voltar à trilha</button>
                <button type="button" onClick={retry} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Refazer avaliação</button>
              </>
            )
          ) : (
            <>
              <button type="button" onClick={retry} className="sf-btn sf-btn-primary w-full h-12 text-[14px]">Tentar de novo</button>
              <button type="button" onClick={onFinish} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Voltar à trilha</button>
            </>
          )}
        </div>
      </div>
    );
  }

  return (
    <div>
      <ModuleHeader topic={topic}/>
      <p className="text-[14px] leading-[20px] text-sf-muted mt-1">{questions.length} questões, nota de 0 a 10. Para avançar, {fmtScore(MODULE_PASSING_SCORE)}.</p>

      {questions.map((q, qi)=>(
        <fieldset key={qi} className="mt-6 border-0 p-0 m-0 min-w-0">
          <legend className="sf-ed-question text-sf-text float-left w-full mb-3 p-0">{qi+1}. {q.q}</legend>
          <div className="flex flex-col gap-2 clear-both">
            {q.options.map((o, oi)=>{
              const on = answers[qi] === oi;
              return (
                <label key={oi} className="sf-radio sf-alt relative w-full cursor-pointer rounded-xl px-3 py-3 min-h-[44px] text-[14px] leading-[20px] flex items-center gap-2.5" data-on={on ? 'true' : 'false'}>
                  <input type="radio" name={`quiz-q${qi}`} checked={on}
                    onChange={()=>setAnswers(prev => prev.map((v, i)=> i===qi ? oi : v))}/>
                  <span aria-hidden="true" className="sf-alt-radio">{on && <IconCheck size={11}/>}</span>
                  <span className="flex-1 min-w-0 break-words">{o.l}</span>
                </label>
              );
            })}
          </div>
        </fieldset>
      ))}

      <div className="sf-quizbar mt-8 -mx-5 px-5 py-3 flex items-center justify-between gap-3">
        <p role="status" className="text-[14px] leading-[20px] font-semibold text-sf-text tnum">{answeredCount} de {questions.length} respondidas</p>
        {answered
          ? <button type="button" onClick={submit} className="sf-btn sf-btn-primary h-11 px-4 text-[14px]">Enviar respostas</button>
          : <span className="text-[14px] leading-[20px] text-sf-muted">Enviar no fim da lista</span>}
      </div>
    </div>
  );
}

function ModuleScreen({contentId, topicIndex}){
  const {contents, closeView, openDetalhe, openModule, completeModule, submitModuleQuiz, getModuleProgress, openYouTubeVideo} = useApp();
  const [justDone, setJustDone] = useState(false);
  const c = contents.find(x=>x.id===contentId);
  const topic = c && c.topics ? c.topics[topicIndex] : null;
  if(!c || !topic) return <MissingContent onBack={closeView}/>;
  const ttype = getTopicType(c, topicIndex);
  const meta = MODULE_META[ttype];
  const progress = getModuleProgress(contentId, topicIndex);
  const isDone = !!topic.done;
  const total = c.topics.length;

  const handleComplete = ()=>{
    if(isDone){ openDetalhe(contentId); return; }
    if(completeModule(contentId, topicIndex)){ setJustDone(true); window.scrollTo(0,0); }
  };
  const handleQuizSubmit = (score)=> submitModuleQuiz(contentId, topicIndex, score);
  const handleOpenVideo = (v)=> openYouTubeVideo(v, null, { subjectId: c.subjectId, topic: topic.t, contentTitle: c.title });

  const top = (
    <div className="flex items-center gap-2 -ml-3">
      <button type="button" onClick={closeView} aria-label="Voltar" className="sf-btn sf-btn-ghost w-11 h-11 p-0 shrink-0"><IconArrowL size={20}/></button>
      <p className="flex-1 min-w-0 text-[14px] leading-[20px] font-semibold text-sf-text truncate">{c.title}</p>
      <p className="text-[14px] leading-[20px] text-sf-muted tnum shrink-0" aria-label={`Módulo ${topicIndex+1} de ${total}`}>{topicIndex+1}/{total}</p>
    </div>
  );

  /* A10: módulo concluído — fica no fluxo, mostra a trilha atualizada e o próximo passo. */
  if(justDone){
    const prog = getContentProgress(c);
    const nextIdx = prog.nextIndex;
    const next = nextIdx >= 0 ? c.topics[nextIdx] : null;
    const NextIcon = next ? MODULE_META[getTopicType(c, nextIdx)].Icon : null;
    const doneTitle = {video:'Videoaula concluída', reading:'Leitura concluída', flashcards:'Prática concluída', quiz:'Avaliação concluída'}[ttype] || 'Módulo concluído';
    return (
      <div className="pt-12 px-5 pb-8 flex flex-col min-h-[calc(100dvh-var(--tabbar-h)-80px)]">
        {top}
        <h1 className="sf-ed-title text-sf-text mt-4 flex items-center gap-2.5" tabIndex={-1}>
          <span className="text-sf-success inline-flex" aria-hidden="true"><IconCheck size={22}/></span>{doneTitle}
        </h1>
        <SegmentedTrail className="mt-4" states={trailStates(c)} label={`Trilha de ${c.title}`}/>
        <p className="text-[14px] leading-[20px] text-sf-muted mt-2">{prog.completed} de {prog.total} módulos</p>
        {next && (
          <div className="mt-8">
            <p className="text-[14px] leading-[20px] text-sf-muted">Próximo módulo</p>
            <p className="mt-1 flex items-start gap-2">
              <span className="text-sf-muted inline-flex mt-1" aria-hidden="true"><NextIcon size={16}/></span>
              <span className="sf-ed-content text-sf-text">{next.t}</span>
            </p>
          </div>
        )}
        <div className="flex-1 min-h-8"/>
        {next
          ? <button type="button" onClick={()=>{ closeView(); openModule(c.id, nextIdx); }} className="sf-btn sf-btn-primary w-full h-12 text-[14px]">Continuar módulo {nextIdx+1}</button>
          : <button type="button" onClick={()=>openDetalhe(c.id)} className="sf-btn sf-btn-primary w-full h-12 text-[14px]">Ver a trilha completa</button>}
        <button type="button" onClick={()=>openDetalhe(c.id)} className="sf-btn sf-btn-ghost w-full mt-2 h-11 text-[14px] font-semibold">Ver todos os módulos</button>
      </div>
    );
  }

  return (
    <div className="pt-12 px-5 pb-8">
      {top}
      <div className="mt-4" aria-label={`${meta.label}${isDone ? ', concluído' : ''}`}>
        {ttype === MODULE_TYPES.VIDEO && <VideoModule content={c} topic={topic} topicIndex={topicIndex} onComplete={handleComplete} onOpenVideo={handleOpenVideo}/>}
        {ttype === MODULE_TYPES.READING && <ReadingModule content={c} topic={topic} topicIndex={topicIndex} onComplete={handleComplete}/>}
        {ttype === MODULE_TYPES.FLASHCARDS && <FlashcardsModule content={c} topic={topic} topicIndex={topicIndex} onComplete={handleComplete}/>}
        {ttype === MODULE_TYPES.QUIZ && (
          <QuizModule content={c} topic={topic} topicIndex={topicIndex}
            onSubmit={handleQuizSubmit} existingProgress={progress}
            onFinish={()=>openDetalhe(contentId)}/>
        )}
      </div>
    </div>
  );
}

function Screen(){
  const {tab, view} = useApp();
  if(view){
    switch(view.name){
      case 'detalhe': return <DetalheScreen key={view.contentId} contentId={view.contentId}/>;
      case 'presessao': return <PreSessaoScreen contentId={view.contentId}/>;
      case 'concluida': return <ConcluidaScreen/>;
      case 'youtube-video': return <YouTubeVideoScreen key={view.video && view.video.id} video={view.video} context={view.context}/>;
      case 'module': return <ModuleScreen key={`${view.contentId}:${view.topicIndex}`} contentId={view.contentId} topicIndex={view.topicIndex}/>;
      case 'calendario': return <PlannerScreen key={view.date||'hoje'} initialDate={view.date||undefined}/>;
      case 'materias': return <MateriasScreen/>;
      case 'jornada': return <JornadaScreen key={view.contentId || 'atual'} contentId={view.contentId}/>;
      case 'configuracoes': return <ConfiguracoesScreen/>;
      case 'tarefas': return <TarefasScreen/>;
      case 'ajuda': return <AjudaScreen/>;
      case 'criar-conteudo': return <CriarConteudoScreen/>;
    }
  }
  if(tab==='home') return <HomeScreen/>;
  if(tab==='estudar') return <ExplorarScreen/>;
  if(tab==='plano') return <PlanoScreen/>;
  if(tab==='progresso') return <ProgressoScreen/>;
  if(tab==='perfil') return <PerfilScreen/>;
  return null;
}
function showsTabBar(view){
  if(!view) return true;
  if(view.name === 'concluida') return false;   /* v2: a barra de abas fica visível no fluxo de estudo (A04–A18) */
  return true;
}

function SessionDoneBanner(){
  const {completedSession, setCompletedSession, showCompletedSummary, view} = useApp();
  if(!completedSession || (view && view.name === 'concluida')) return null;
  return (
    <div role="status" className="fixed left-1/2 -translate-x-1/2 top-3 w-[calc(100%-24px)] max-w-[378px] z-40 rounded-2xl p-3 flex items-center gap-3 bg-sf-surface"
      style={{border:'1px solid var(--success-border)', boxShadow:'var(--shadow-modal)', marginTop:'env(safe-area-inset-top,0px)'}}>
      <span className="text-sf-success shrink-0"><IconCheck size={18}/></span>
      <p className="flex-1 min-w-0 text-[12px] text-sf-text leading-snug">
        <span className="font-semibold">Sessão concluída.</span> {completedSession.realMin} min registrados.
      </p>
      <button type="button" onClick={showCompletedSummary} className="sf-btn sf-btn-primary h-11 px-3 text-[12px] font-semibold shrink-0">Ver resumo</button>
      <button type="button" onClick={()=>setCompletedSession(null)} aria-label="Dispensar aviso"
        className="sf-btn sf-btn-ghost w-11 h-11 -mr-1 flex items-center justify-center shrink-0"><IconClose size={16}/></button>
    </div>
  );
}

function AppShell(){
  const { view, tab, user, handleAuth, goTab } = useApp();
  useTheme();   // assina o tema: a troca re-renderiza a árvore para recalcular cores derivadas em JS (sem remontar nada)
  const mainRef = useRef(null);
  const firstNav = useRef(true);
  const navKey = `${tab}|${view ? view.name + ':' + (view.contentId || '') + ':' + (view.topicIndex != null ? view.topicIndex : '') + ':' + (view.video ? view.video.id : '') : ''}`;

  // Ao trocar de tela: volta ao topo e move o foco para a área principal (leitores de tela anunciam a nova tela).
  useEffect(()=>{
    if(firstNav.current){ firstNav.current = false; return; }
    window.scrollTo(0, 0);
    if(mainRef.current) mainRef.current.focus({preventScroll:true});
  }, [navKey]);

  if(!user){
    return <LoginScreen onAuth={handleAuth}/>;
  }
  return (
    <div className="device-wrap">
      <div className="device">
        <a href="#main-content" className="sf-skip" onClick={(e)=>{ e.preventDefault(); if(mainRef.current) mainRef.current.focus(); }}>Pular para o conteúdo</a>
        <main id="main-content" ref={mainRef} tabIndex={-1}>
          <ErrorBoundary key={navKey} onReset={()=>goTab('home')}>
            <div className="sf-screen-in"><Screen/></div>
          </ErrorBoundary>
        </main>
        {showsTabBar(view) && <TabBar/>}
        <SessionDoneBanner/>
        <SessionBar/>
        <ConfirmEndModal/>
        <FocusScreen/>
        <SubjectSheet/>
      </div>
    </div>
  );
}
function App(){ return <ThemeProvider><AppProvider><AppShell/></AppProvider></ThemeProvider>; }

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
